schema_version: 1
name: grahama-memory-card-v1
provenance:
  repository: grahama1970/agent-skills
  commit: local-generated
  license: all-rights-reserved
canvas:
  width: 1920
  height: 1080
  view_box: [0, 0, 1920, 1080]
  background: "#0a0705"
  radius: 20
fonts:
  display: [Georgia, Times New Roman, serif]
  mono: [ui-monospace, SFMono-Regular, Menlo, Consolas, monospace]
palette:
  cyan: "#93A289"
  green: "#A7B89D"
  amber: "#E0A84E"
  red: "#D1703C"
  orange: "#C8844F"
  white: "#EEE6D8"
  dark_text: "#0A0705"
  deep_panel: "#11100D"
opacity:
  panel_fill: 0.84
  soft_panel_accent: 0.12
  secondary_text: 1.0
  secondary_border: 0.48
  halo_peak: 0.28
strokes:
  thin: 2.5
  normal: 3.5
  emphasis: 4.5
  icon: 5
  linecap: round
  linejoin: round
shadows:
  text: "drop-shadow(2px 3px 4px rgba(0,0,0,.75))"
  strong: "drop-shadow(0 18px 30px rgba(0,0,0,.55))"
radii:
  canvas: 20
  outer_card: 18
  card: 14
  chip: 10
  small: 8
  pill: 24
typography:
  title_size: 48
  heading_size: 36
  body_size: 30
  supporting_size: 24
  caption_size: 25
  title_tracking: 1
  heading_tracking: 1
  caption_tracking: 3
animation:
  ambient_cycle_ms: 5200
  narrative_cycle_ms: 10500
  hero_cycle_ms: 12000
  enter_easing: "cubic-bezier(.33,1,.68,1)"
  morph_easing: "cubic-bezier(.65,0,.35,1)"
  pulse_easing: ease-in-out
