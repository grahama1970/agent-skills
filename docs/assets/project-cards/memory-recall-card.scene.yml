metadata:
  title: Graph Memory intent pipeline
  description: >
    A query enters hybrid recall and intent classification, then exits through
    exactly one bounded route - answer, clarify, draft, or deflect.
source:
  title: QUERY -> INTENT
  subtitle: hybrid recall + intent classifier
targets:
  - number: 1
    heading: ANSWER
    detail: evidence holds, respond
    accent: green
  - number: 2
    heading: CLARIFY
    detail: ambiguity remains, ask
    accent: cyan
  - number: 3
    heading: DRAFT
    detail: generate, human signoff
    accent: amber
  - number: 4
    heading: DEFLECT
    detail: off-topic or unsafe
    accent: red
caption: EVERY QUERY EXITS THROUGH ONE BOUNDED ROUTE
