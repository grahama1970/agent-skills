<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PersonaPlex E2E Live Voice UI</title>
  <style>
    :root { --bg:#f6f7f9; --panel:#fff; --ink:#111827; --muted:#5b6472; --line:#d9dde5; --good:#17613a; --good-bg:#eefbf3; --bad:#9b1c1c; --bad-bg:#fff2f2; }
    body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width:1180px; margin:0 auto; padding:28px; }
    header { display:flex; justify-content:space-between; gap:18px; align-items:flex-start; margin-bottom:18px; }
    h1 { margin:0 0 8px; letter-spacing:-.03em; }
    p { color:var(--muted); }
    .banner { border-radius:999px; padding:10px 14px; font-weight:800; font-size:12px; letter-spacing:.05em; border:1px solid var(--line); white-space:nowrap; }
    .ok { color:var(--good); background:var(--good-bg); } .warn { color:var(--bad); background:var(--bad-bg); }
    .grid { display:grid; grid-template-columns:.9fr 1.1fr; gap:18px; align-items:start; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:18px; margin-bottom:18px; }
    h2 { margin:0 0 12px; font-size:13px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
    .message, .row, .recall { border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; background:#fbfcfe; }
    .speaker { font-weight:800; color:#243447; margin-bottom:6px; }
    .row.true { border-color:#b7dec4; background:var(--good-bg); } .row.false { border-color:#f0b2b2; background:var(--bad-bg); }
    .row-head { display:flex; justify-content:space-between; gap:12px; }
    .row h3 { margin:0 0 4px; font-size:16px; }
    code { border:1px solid var(--line); border-radius:999px; padding:7px 9px; background:#fff; white-space:nowrap; }
    .chip { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:8px 12px; background:#fff; font-weight:700; margin:0 8px 12px 0; }
    .details { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:10px; font-size:12px; }
    .details div { border-top:1px solid rgba(17,24,39,.08); padding-top:8px; overflow-wrap:anywhere; }
    @media (max-width:900px) { .grid { grid-template-columns:1fr; } header { display:block; } .banner { display:inline-flex; } }
  </style>
</head>
<body>
  <main data-testid="personaplex-e2e-ui">
    <header>
      <div>
        <h1>PersonaPlex E2E live voice verification</h1>
        <p>Open this through <code>python -m http.server</code> and pass <code>?receipt=e2e-live-voice-receipt.json</code>, or open the static HTML generated by <code>personaplex_e2e_live_voice_session.py</code>.</p>
      </div>
      <div id="banner" class="banner warn">NO RECEIPT LOADED</div>
    </header>
    <div id="status"></div>
    <section class="grid">
      <div>
        <section class="panel"><h2>Chat messages</h2><div id="messages"></div></section>
        <section class="panel"><h2>Intent / evidence summary</h2><div id="summary"></div></section>
      </div>
      <div>
        <section class="panel"><h2>Tool trace per turn</h2><div id="trace"></div></section>
        <section class="panel"><h2>Recall items</h2><div id="recall"></div></section>
      </div>
    </section>
  </main>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const params = new URLSearchParams(location.search);
    const receiptUrl = params.get('receipt') || 'e2e-live-voice-receipt.json';
    function toolRows(r) { return Array.isArray(r.tool_trace) ? r.tool_trace : []; }
    function render(r) {
      const rows = toolRows(r);
      const allReal = rows.length > 0 && rows.every(row => row.real_flag_value === true) && r.fixture_only !== true;
      banner.className = 'banner ' + (allReal ? 'ok' : 'warn');
      banner.textContent = allReal ? 'ALL LIVE TOOL ROWS REAL=TRUE' : 'NOT FULL LIVE PROOF';
      status.innerHTML = `<span class="chip" data-testid="gate-state">gate: ${esc(r.gate_state?.state)} | queue: ${esc(r.gate_state?.queue_depth)} | turn: ${esc(r.turn_id)}</span><span class="chip">session: ${esc(r.session_id)}</span>`;
      messages.innerHTML = (r.conversation || []).map(m => `<article class="message" data-testid="chat-message-${esc(m.role)}"><div class="speaker">${esc(m.speaker || m.role)}</div><div>${esc(m.text)}</div></article>`).join('');
      summary.innerHTML = `<div class="message" data-testid="intent-summary">intent → ${esc(r.intent?.route)} (${esc(r.intent?.confidence)})</div><div class="message" data-testid="evidence-summary">evidence-case → can_answer=${esc(r.evidence_summary?.can_answer)}, route=${esc(r.evidence_summary?.route)}</div><div class="message" data-testid="upsert-summary">${esc(r.upsert_summary)}</div>`;
      trace.innerHTML = rows.map((row, i) => `<section class="row ${row.real_flag_value === true}" data-testid="tool-row" data-step="${esc(row.step)}" data-real-flag-name="${esc(row.real_flag_name)}" data-real-flag-value="${row.real_flag_value === true}"><div class="row-head"><div><h3>${String(i+1).padStart(2,'0')} · ${esc(row.label)}</h3><p>${esc(row.summary)}</p></div><code>${esc(row.real_flag_name)}=${row.real_flag_value === true}</code></div>${row.details ? `<div class="details">${Object.entries(row.details).map(([k,v]) => `<div><strong>${esc(k)}</strong><br>${esc(JSON.stringify(v))}</div>`).join('')}</div>` : ''}</section>`).join('');
      recall.innerHTML = (r.recall_items || []).map(item => `<article class="recall" data-testid="recall-item"><strong>${esc(item.title || item.key)}</strong><p>${esc(item.snippet)}</p><code>BM25 ${esc(item.bm25_score)} · dense ${esc(item.dense_score)} · score ${esc(item.score)}</code></article>`).join('') || '<p>No recall items in receipt.</p>';
    }
    fetch(receiptUrl).then(r => r.json()).then(render).catch(err => {
      summary.innerHTML = `<div class="message"><strong>Receipt not loaded.</strong><p>Run the E2E probe, then serve its output directory: <code>python3 -m http.server 8765 --directory /tmp/personaplex-e2e-live-voice-ui</code>. Error: ${esc(err.message)}</p></div>`;
    });
  </script>
</body>
</html>
