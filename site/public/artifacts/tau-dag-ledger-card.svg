<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="tau-card-title tau-card-desc" tabindex="0">
  <title id="tau-card-title">Tau zero-trust DAG</title>
  <desc id="tau-card-desc">A clean DAG chart shows ask entering a Tau trust boundary. Three DAG nodes and a Tau-owned scillm adapter emit animated receipt tokens through a receipt gate into an inspectable ledger, while a direct shortcut is blocked outside the boundary.</desc>
  <defs>
    <radialGradient id="bg" cx="52%" cy="54%" r="70%">
      <stop offset="0" stop-color="#211a15" stop-opacity="0.66" />
      <stop offset="0.58" stop-color="#14110f" stop-opacity="0.45" />
      <stop offset="1" stop-color="#090807" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c574" />
      <stop offset="1" stop-color="#b77535" />
    </linearGradient>
    <linearGradient id="ledger-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93a289" stop-opacity="0.18" />
      <stop offset="1" stop-color="#e2ac62" stop-opacity="0.06" />
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.5 7 5 0 8.5z" fill="rgba(236,226,211,0.50)" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0 1.5 7 5 0 8.5z" fill="#e2ac62" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.5 7 5 0 8.5z" fill="#d1703c" />
    </marker>
    <style>
      #tau .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #tau .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
      #tau .eyebrow{fill:#e2ac62;font-size:31px;font-weight:780;letter-spacing:10px}
      #tau .rule{fill:#f5efe4;font-size:58px;font-weight:760;letter-spacing:-.4px}
      #tau .label{fill:#ece2d3;font-size:44px;font-weight:760;letter-spacing:.4px}
      #tau .small{fill:#8f8174;font-size:30px;font-weight:760;letter-spacing:5px}
      #tau .panel{fill:rgba(18,17,15,.78);stroke:rgba(236,226,211,.14);stroke-width:2}
      #tau .grid{stroke:rgba(236,226,211,.04);stroke-width:1}
      #tau .boundary{fill:rgba(226,172,98,.032);stroke:url(#gold);stroke-width:4}
      #tau .node{fill:#12110f;stroke:#c99149;stroke-width:4}
      #tau .node-ok{fill:#12110f;stroke:#93a289;stroke-width:4}
      #tau .edge{fill:none;stroke:rgba(236,226,211,.24);stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
      #tau .edge-live{fill:none;stroke:#e2ac62;stroke-width:5;stroke-linecap:round;marker-end:url(#arrow-gold);opacity:.24}
      #tau .receipt-edge{fill:none;stroke:#93a289;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 14;marker-end:url(#arrow);opacity:.62}
      #tau .receipt-token{fill:#93a289;opacity:.9;filter:url(#glow)}
      #tau .blocked{fill:none;stroke:#d1703c;stroke-width:5;stroke-linecap:round;stroke-dasharray:12 16;marker-end:url(#arrow-red)}
      #tau .ledger-card{fill:url(#ledger-fill);stroke:rgba(147,162,137,.72);stroke-width:4}
      #tau .check{fill:none;stroke:#93a289;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      #tau .x{stroke:#d1703c;stroke-width:8;stroke-linecap:round}
      @media (prefers-reduced-motion: no-preference){
        @keyframes draw{0%,12%{stroke-dashoffset:820;opacity:0}26%,72%{stroke-dashoffset:0;opacity:.88}100%{stroke-dashoffset:0;opacity:.20}}
        @keyframes tokenA{0%,26%{transform:translate(0,0) scale(.7);opacity:0}42%{opacity:1}72%,84%{transform:translate(700px,-230px) scale(1);opacity:1}100%{transform:translate(780px,-250px) scale(.45);opacity:0}}
        @keyframes tokenB{0%,34%{transform:translate(0,0) scale(.7);opacity:0}48%{opacity:1}74%,86%{transform:translate(650px,0) scale(1);opacity:1}100%{transform:translate(730px,0) scale(.45);opacity:0}}
        @keyframes tokenC{0%,42%{transform:translate(0,0) scale(.7);opacity:0}54%{opacity:1}78%,90%{transform:translate(700px,230px) scale(1);opacity:1}100%{transform:translate(780px,250px) scale(.45);opacity:0}}
        @keyframes pulse{0%,55%,100%{opacity:.78}66%,82%{opacity:1;filter:url(#glow)}}
        @keyframes reject{0%,26%,100%{opacity:.22}38%,56%{opacity:.92}}
        #tau .edge-live{stroke-dasharray:820;stroke-dashoffset:820;animation:draw 7s ease-in-out infinite}
        #tau .token-a{animation:tokenA 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
        #tau .token-b{animation:tokenB 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
        #tau .token-c{animation:tokenC 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
        #tau .admit{animation:pulse 7s ease-in-out infinite}
        #tau .reject{animation:reject 7s ease-in-out infinite}
      }
      @media (prefers-reduced-motion: reduce){
        #tau *{animation:none!important;transition:none!important}
        #tau .edge-live{opacity:.56;stroke-dasharray:none;stroke-dashoffset:0}
        #tau .receipt-token{opacity:.9}
      }
    </style>
  </defs>

  <g id="tau" data-component="tau-card">
    <rect width="1920" height="1200" fill="#0c0908" />
    <rect x="64" y="64" width="1792" height="1072" rx="56" class="panel" />
    <rect x="96" y="96" width="1728" height="1008" rx="48" fill="url(#bg)" />
    <g data-component="grid" opacity=".8">
      <path d="M230 190v820M510 190v820M790 190v820M1070 190v820M1350 190v820M1630 190v820" class="grid" />
      <path d="M150 280h1620M150 520h1620M150 760h1620M150 1000h1620" class="grid" />
    </g>

    <g data-component="rule-text">
      <text x="156" y="178" class="sans eyebrow">TAU / ZERO TRUST</text>
      <text x="156" y="246" class="sans rule">No receipt, no proof.</text>
      <path d="M160 286h145M160 310h80" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" />
    </g>

    <g data-component="ask-entry">
      <rect x="160" y="515" width="220" height="250" rx="46" class="node" />
      <path d="M220 596l58 58-58 58" fill="none" stroke="#e2ac62" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M302 712h62" stroke="#e2ac62" stroke-width="10" stroke-linecap="round" />
      <circle cx="335" cy="574" r="10" fill="#93a289" />
      <text x="218" y="842" class="mono label">$ask</text>
    </g>

    <g data-component="tau-boundary">
      <rect x="470" y="300" width="790" height="680" rx="96" class="boundary" />
      <rect x="504" y="334" width="722" height="612" rx="74" fill="rgba(12,9,8,.31)" stroke="rgba(226,172,98,.18)" stroke-width="2" />
      <text x="722" y="906" class="sans label">Tau DAG</text>
    </g>

    <g data-component="dag-graph">
      <circle cx="660" cy="640" r="64" class="node" />
      <circle cx="865" cy="482" r="70" class="node" />
      <circle cx="1070" cy="640" r="64" class="node" />
      <circle cx="865" cy="805" r="70" class="node-ok" />
      <path d="M714 600l94-72M922 528l94 72M865 552v182M714 680l98 80M1016 680l-98 80" fill="none" stroke="rgba(226,172,98,.62)" stroke-width="5" stroke-linecap="round" />
      <path d="M830 802l30 30 64-84" class="check" />
    </g>

    <g data-component="tau-owned-scillm">
      <rect x="1330" y="542" width="190" height="170" rx="40" class="node-ok" />
      <path d="M1308 582h34M1308 630h34M1308 678h34M1508 582h34M1508 630h34M1508 678h34M1370 520v34M1425 520v34M1480 520v34M1370 700v34M1425 700v34M1480 700v34" stroke="rgba(236,226,211,.42)" stroke-width="5" stroke-linecap="round" />
      <rect x="1375" y="594" width="100" height="78" rx="18" fill="rgba(12,9,8,.52)" stroke="#93a289" stroke-width="4" />
      <path d="M1400 594v-22c0-24 16-39 35-39s35 15 35 39v22" fill="none" stroke="#93a289" stroke-width="6" stroke-linecap="round" />
    </g>

    <g data-component="receipt-gate" class="admit">
      <path d="M1585 430h118v420h-118l-42-42V472z" fill="rgba(226,172,98,.10)" stroke="#e2ac62" stroke-width="6" />
      <path d="M1665 430v82h76" fill="none" stroke="rgba(236,226,211,.66)" stroke-width="5" />
      <path d="M1608 570h52M1608 660h72M1608 750h56" stroke="rgba(236,226,211,.70)" stroke-width="9" stroke-linecap="round" />
      <circle cx="1695" cy="818" r="42" fill="#12110f" stroke="#93a289" stroke-width="7" />
      <path d="M1674 816l18 18 41-56" class="check" />
    </g>

    <g data-component="ledger">
      <rect x="1748" y="386" width="110" height="438" rx="34" class="ledger-card" opacity=".42" transform="rotate(5 1803 605)" />
      <rect x="1704" y="356" width="110" height="438" rx="34" class="ledger-card" />
      <path d="M1732 462h48M1732 560h58M1732 658h48" stroke="rgba(236,226,211,.76)" stroke-width="10" stroke-linecap="round" />
      <circle cx="1796" cy="462" r="17" fill="none" stroke="#e2ac62" stroke-width="6" />
      <circle cx="1796" cy="640" r="17" fill="none" stroke="#93a289" stroke-width="6" />
      <path d="M1728 818a42 42 0 1 0 84 0a42 42 0 1 0-84 0M1798 848l32 32" fill="none" stroke="#e2ac62" stroke-width="9" stroke-linecap="round" />
    </g>

    <g data-component="flow">
      <path d="M380 640C418 640 440 640 470 640" class="edge" />
      <path d="M380 640C418 640 440 640 470 640" class="edge-live" />
      <path d="M1134 640C1210 640 1260 626 1330 626" class="edge" />
      <path d="M1134 640C1210 640 1260 626 1330 626" class="edge-live" style="animation-delay:.8s" />
      <path d="M1520 626C1548 626 1560 626 1585 626" class="edge" />
      <path d="M1520 626C1548 626 1560 626 1585 626" class="edge-live" style="animation-delay:1.5s" />
      <path d="M865 482C1168 342 1406 404 1594 540" class="receipt-edge" />
      <path d="M1070 640C1262 662 1432 650 1588 650" class="receipt-edge" />
      <path d="M865 805C1156 986 1428 932 1708 744" class="receipt-edge" />
      <circle cx="865" cy="482" r="14" class="receipt-token token-a" />
      <circle cx="1070" cy="640" r="14" class="receipt-token token-b" />
      <circle cx="865" cy="805" r="14" class="receipt-token token-c" />
    </g>

    <g data-component="blocked-shortcut" class="reject">
      <circle cx="530" cy="770" r="42" fill="#12110f" stroke="#d1703c" stroke-width="6" />
      <path d="M511 751l38 38M549 751l-38 38" class="x" />
      <path d="M250 944C365 930 440 842 530 770" class="blocked" />
      <rect x="198" y="902" width="86" height="86" rx="8" fill="rgba(18,17,15,.55)" stroke="rgba(236,226,211,.32)" stroke-width="4" />
      <path d="M218 930h46M218 956h30" stroke="rgba(236,226,211,.48)" stroke-width="5" stroke-linecap="round" />
      <text x="150" y="1050" class="sans small">SHORTCUT BLOCKED</text>
    </g>
  </g>
</svg>
