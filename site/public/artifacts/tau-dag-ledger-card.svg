<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-labelledby="tau-title tau-desc" preserveAspectRatio="xMidYMid meet">
  <title id="tau-title">Tau zero-trust DAG execution harness</title>
  <desc id="tau-desc">A compact Tau project card showing a locked goal hash, policy and data gate, two accepted receipt-backed agent lanes, a blocked substitute lane, a join gate, a reviewer gate, and fail-closed outcome.</desc>

  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="60%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#14110d"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f2b75f" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#71d7a4" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goalBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1b1712"/>
      <stop offset="50%" stop-color="#141916"/>
      <stop offset="100%" stop-color="#10181b"/>
    </linearGradient>

    <linearGradient id="gateBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221c13"/>
      <stop offset="100%" stop-color="#12171b"/>
    </linearGradient>

    <linearGradient id="reviewBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13241c"/>
      <stop offset="100%" stop-color="#0f1915"/>
    </linearGradient>

    <pattern id="dotPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#d8e0e8" fill-opacity="0.04"/>
    </pattern>

    <!-- Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowGood" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0L6 3 0 6Z" fill="#71d7a4"/>
    </marker>
    <marker id="arrowBad" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0L6 3 0 6Z" fill="#f17869"/>
    </marker>

    <style>
      text {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .mono {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }

      @media (prefers-reduced-motion: no-preference) {
        .flow-good {
          animation: flowGlow 6s ease-in-out infinite;
        }
        .pulse-gate {
          animation: gatePulse 6s ease-in-out infinite;
          transform-origin: center;
          transform-box: fill-box;
        }
        .block-anim {
          animation: blockPulse 6s ease-in-out infinite;
          transform-origin: center;
          transform-box: fill-box;
        }
      }

      @keyframes flowGlow {
        0%, 24%, 100% { stroke-opacity: 0.30; stroke-width: 2; }
        42%, 74% { stroke-opacity: 1; stroke-width: 3; }
      }
      @keyframes gatePulse {
        0%, 46%, 100% { filter: drop-shadow(0 0 2px rgba(242, 183, 95, 0.18)); }
        64% { filter: drop-shadow(0 0 10px rgba(242, 183, 95, 0.62)); }
      }
      @keyframes blockPulse {
        0%, 28%, 46%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(241, 120, 105, 0.24)); }
        36% { transform: scale(1.08); filter: drop-shadow(0 0 8px rgba(241, 120, 105, 0.70)); }
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <g id="card-shell">
    <rect x="1" y="1" width="398" height="258" rx="16" fill="url(#bg)"/>
    <rect x="1" y="1" width="398" height="258" rx="16" fill="url(#glow)"/>
    <rect x="1" y="1" width="398" height="258" rx="16" fill="none" stroke="#f0bc68" stroke-opacity="0.22" stroke-width="1"/>
  </g>

  <!-- Header Section -->
  <g id="header">
    <text x="18" y="31" fill="#f6eee1" font-size="20" font-weight="850" letter-spacing="-0.5">TAU</text>
    <rect x="74" y="15" width="118" height="15" rx="7.5" fill="#e7b45f" fill-opacity="0.12"/>
    <text x="133" y="25.5" text-anchor="middle" fill="#e7b45f" font-size="7.5" font-weight="800" letter-spacing="1.2">ZERO-TRUST DAG</text>
  </g>

  <!-- Goal & Policy Header Bar -->
  <g id="goal-and-policy">
    <rect x="18" y="50" width="364" height="32" rx="10" fill="url(#goalBg)" stroke="#e6b25c" stroke-opacity="0.38" stroke-width="1"/>

    <!-- Lucide Lock Icon -->
    <g transform="translate(28 58) scale(0.65)" stroke="#f1c575" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </g>

    <text x="48" y="70" fill="#f3e8d5" font-size="10" font-weight="750" letter-spacing="0.4">GOAL HASH</text>

    <!-- Lucide ShieldCheck Icon -->
    <g transform="translate(262 57) scale(0.65)" stroke="#71d7a4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.8 17 5 19 5a1 1 0 0 1 1 1z"/>
      <path d="m9 12 2 2 4-4"/>
    </g>

    <text x="282" y="70" fill="#71d7a4" font-size="9" font-weight="800" letter-spacing="0.45">POLICY + DATA</text>

    <path d="M200 82 V94" stroke="#e7b45e" stroke-width="1.8" stroke-dasharray="2 2" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>

  <!-- Live DAG Canvas -->
  <g id="dag" transform="translate(12 94)">
    <rect width="376" height="112" rx="14" fill="url(#dotPattern)" stroke="#ffffff" stroke-opacity="0.06"/>

    <!-- Agent Nodes -->
    <g id="agents" filter="url(#shadow)">
      <!-- Agent A -->
      <g transform="translate(18 12)">
        <rect width="68" height="26" rx="8" fill="#17202a" stroke="#6f8094" stroke-opacity="0.75" stroke-width="1.2"/>
        <!-- Lucide Cpu Icon -->
        <g transform="translate(6 5) scale(0.65)" stroke="#93c5fd" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
          <rect x="9" y="9" width="6" height="6"/>
          <path d="M15 2v2M9 2v2M15 20v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"/>
        </g>
        <text x="44" y="17" text-anchor="middle" fill="#e7edf5" font-size="7.5" font-weight="800" letter-spacing="0.3">AGENT N</text>
      </g>

      <!-- Agent B -->
      <g transform="translate(18 48)">
        <rect width="68" height="26" rx="8" fill="#17202a" stroke="#6f8094" stroke-opacity="0.75" stroke-width="1.2"/>
        <!-- Lucide Cpu Icon -->
        <g transform="translate(6 5) scale(0.65)" stroke="#93c5fd" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
          <rect x="9" y="9" width="6" height="6"/>
          <path d="M15 2v2M9 2v2M15 20v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"/>
        </g>
        <text x="44" y="17" text-anchor="middle" fill="#e7edf5" font-size="7.5" font-weight="800" letter-spacing="0.3">AGENT N+1</text>
      </g>

      <!-- No Substitute Badge -->
      <g transform="translate(18 84)">
        <rect width="86" height="18" rx="7" fill="#2a1515" stroke="#f17869" stroke-opacity="0.8" stroke-width="1"/>
        <!-- Lucide AlertTriangle Icon -->
        <g transform="translate(6 2.5) scale(0.55)" stroke="#f17869" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </g>
        <text x="50" y="12.5" text-anchor="middle" fill="#ffc3ba" font-size="7.5" font-weight="800" letter-spacing="0.3">NO SUBSTITUTE</text>
      </g>
    </g>

    <!-- Connectors -->
    <path class="flow-good" d="M 86 25 H 134" stroke="#71d7a4" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowGood)"/>
    <path class="flow-good" d="M 86 61 H 134" stroke="#71d7a4" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowGood)"/>
    <path class="flow-bad" d="M 104 93 H 134" stroke="#f17869" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowBad)"/>

    <!-- Join Gate Node -->
    <g id="join" class="pulse-gate" transform="translate(136 24)" filter="url(#shadow)">
      <rect width="84" height="64" rx="14" fill="url(#gateBg)" stroke="#f2b75f" stroke-width="1.5"/>
      <!-- Lucide ShieldCheck Icon -->
      <g transform="translate(30 8)" stroke="#f2bd66" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.8 17 5 19 5a1 1 0 0 1 1 1z" fill="#f0b65b" fill-opacity="0.15"/>
        <path d="m9 12 2 2 4-4" stroke="#71d7a4" stroke-width="2.2"/>
      </g>
      <text x="42" y="55" text-anchor="middle" fill="#f8ebd5" font-size="9" font-weight="850" letter-spacing="0.5">JOIN GATE</text>
    </g>

    <!-- Join to Reviewer Path -->
    <path class="flow-good" d="M 220 56 H 268" stroke="#71d7a4" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrowGood)"/>

    <!-- Reviewer Node -->
    <g id="review" transform="translate(270 24)" filter="url(#shadow)">
      <rect width="88" height="64" rx="14" fill="url(#reviewBg)" stroke="#71d7a4" stroke-opacity="0.75" stroke-width="1.4"/>
      <!-- Lucide UserCheck Icon -->
      <g transform="translate(32 8)" stroke="#71d7a4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <polyline points="16 11 18 13 22 9" stroke="#71d7a4" stroke-width="2"/>
      </g>
      <text x="44" y="55" text-anchor="middle" fill="#e7fff2" font-size="9" font-weight="850" letter-spacing="0.5">REVIEWER</text>
    </g>

    <!-- Blocked Circle Mark -->
    <g id="blocked" transform="translate(134 93)">
      <g class="block-anim">
        <circle r="10" fill="#2a1515" stroke="#f17869" stroke-width="1.5"/>
        <path d="M -3.5 -3.5 L 3.5 3.5 M 3.5 -3.5 L -3.5 3.5" stroke="#ff9e91" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Bottom Ledger Footer -->
  <g id="ledger" transform="translate(18 214)">
    <rect width="364" height="28" rx="9" fill="#0d1117" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Ledger Item 1 -->
    <g transform="translate(14 7)">
      <circle cx="6" cy="7" r="2.5" fill="#f1c575"/>
      <text x="14" y="10" fill="#f1c575" font-size="7.5" font-weight="820" letter-spacing="0.45">APPEND-ONLY LEDGER</text>
    </g>

    <!-- Ledger Item 2 -->
    <g transform="translate(145 7)">
      <circle cx="6" cy="7" r="2.5" fill="#71d7a4"/>
      <text x="14" y="10" fill="#71d7a4" font-size="7.5" font-weight="820" letter-spacing="0.45">HASHED EVIDENCE</text>
    </g>

    <!-- Ledger Item 3 -->
    <g transform="translate(268 7)">
      <circle cx="6" cy="7" r="2.5" fill="#f17869"/>
      <text x="14" y="10" fill="#f17869" font-size="7.5" font-weight="820" letter-spacing="0.45">FAIL CLOSED</text>
    </g>
  </g>
</svg>
