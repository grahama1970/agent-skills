<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Territory board A mobile, logo-off grayscale</title>
  <desc id="desc">A grayscale mobile composition showing the same claim, evidence, rule, judgment, boundary, and locator content as the other territory boards.</desc>
  <rect width="390" height="844" fill="#f2f2f2"/>
  <rect x="20" y="20" width="350" height="804" fill="#fbfbfb" stroke="#202020" stroke-width="2"/>
  <text x="36" y="58" font-family="Arial, sans-serif" font-size="11" fill="#606060" letter-spacing="1.4">BOARD A / LOGO-OFF</text>
  <text x="36" y="104" font-family="Georgia, serif" font-size="30" fill="#111111">claim -></text>
  <text x="36" y="140" font-family="Georgia, serif" font-size="30" fill="#111111">evidence -></text>
  <text x="36" y="176" font-family="Georgia, serif" font-size="30" fill="#111111">bounded judgment</text>
  <line x1="54" y1="218" x2="54" y2="710" stroke="#111111" stroke-width="3"/>
  <circle cx="54" cy="244" r="18" fill="#fbfbfb" stroke="#111111" stroke-width="3"/>
  <rect x="36" y="434" width="36" height="48" fill="#111111"/>
  <circle cx="54" cy="714" r="18" fill="#fbfbfb" stroke="#111111" stroke-width="3"/>
  <g font-family="Arial, sans-serif" fill="#111111">
    <text x="90" y="238" font-size="13" font-weight="700">CLAIM</text>
    <text x="90" y="262" font-size="15">A claim is permissible only when</text>
    <text x="90" y="283" font-size="15">traceable to evidence and boundary.</text>
    <text x="90" y="354" font-size="13" font-weight="700">EVIDENCE</text>
    <text x="90" y="378" font-size="14">artifact: proof-workshop-pilot</text>
    <text x="90" y="399" font-size="14">sha256: 2d9957d2f715...</text>
    <text x="90" y="468" font-size="13" font-weight="700">RULE</text>
    <text x="90" y="492" font-size="15">Claim, evidence, gap, and judgment</text>
    <text x="90" y="513" font-size="15">use different structural roles.</text>
    <text x="90" y="598" font-size="13" font-weight="700">JUDGMENT</text>
    <text x="90" y="624" font-size="18">PILOT_EVIDENCE_ONLY</text>
    <text x="90" y="694" font-size="13" font-weight="700">DOES NOT PROVE</text>
    <text x="90" y="718" font-size="14">whole-site compliance, blind tests,</text>
    <text x="90" y="738" font-size="14">a11y, perf, or G16-G18.</text>
  </g>
</svg>
