<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Territory board B mobile, logo-off grayscale</title>
  <desc id="desc">A grayscale ledger mobile composition showing the same claim, evidence, rule, judgment, boundary, and locator content as the other territory boards.</desc>
  <rect width="390" height="844" fill="#f1f1f1"/>
  <rect x="18" y="20" width="354" height="804" fill="#ffffff" stroke="#202020" stroke-width="2"/>
  <text x="34" y="56" font-family="Arial, sans-serif" font-size="11" fill="#606060" letter-spacing="1.4">BOARD B / LOGO-OFF</text>
  <line x1="34" y1="96" x2="356" y2="96" stroke="#111111" stroke-width="2"/>
  <line x1="34" y1="302" x2="356" y2="302" stroke="#111111" stroke-width="2"/>
  <line x1="34" y1="522" x2="356" y2="522" stroke="#111111" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#111111">
    <text x="34" y="132" font-size="13" font-weight="700">CLAIM</text>
    <text x="34" y="172" font-family="Georgia, serif" font-size="28">A claim is permissible</text>
    <text x="34" y="206" font-family="Georgia, serif" font-size="28">only when traceable</text>
    <text x="34" y="240" font-family="Georgia, serif" font-size="28">to evidence and boundary.</text>
    <text x="34" y="340" font-size="13" font-weight="700">EVIDENCE / LOCATOR</text>
    <text x="34" y="372" font-size="15">artifact: proof-workshop-pilot</text>
    <text x="34" y="396" font-size="15">sha256: 2d9957d2f715...</text>
    <text x="34" y="456" font-size="13" font-weight="700">RULE</text>
    <text x="34" y="484" font-size="15">claim / evidence / gap / judgment</text>
    <text x="34" y="560" font-size="13" font-weight="700">JUDGMENT</text>
    <text x="34" y="592" font-size="20">PILOT_EVIDENCE_ONLY</text>
    <text x="34" y="668" font-size="13" font-weight="700">DOES NOT PROVE</text>
    <text x="34" y="696" font-size="15">whole-site compliance, blind tests,</text>
    <text x="34" y="720" font-size="15">a11y, perf, or G16-G18 review.</text>
  </g>
</svg>
