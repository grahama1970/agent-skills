<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proof Workshop territory review</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #e8e8e8;
        color: #111;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      h1 {
        margin: 0 0 18px;
        font-family: Georgia, serif;
        font-size: 28px;
        font-weight: 500;
      }
      figure {
        margin: 0 0 24px;
        padding: 12px;
        background: #fff;
        border: 1px solid #444;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #aaa;
      }
      .mobile {
        max-width: 430px;
      }
      figcaption {
        margin-top: 8px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Selected territory: Proof Workshop</h1>
    <figure>
      <img src="proof-workshop.desktop.svg" alt="Selected Proof Workshop desktop board" />
      <figcaption>Desktop board / logo-off grayscale</figcaption>
    </figure>
    <figure class="mobile">
      <img src="proof-workshop.mobile.svg" alt="Selected Proof Workshop mobile board" />
      <figcaption>Mobile board / logo-off grayscale</figcaption>
    </figure>
  </body>
</html>
