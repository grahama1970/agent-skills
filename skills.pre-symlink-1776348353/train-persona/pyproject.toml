[project]
name = "train-persona"
version = "0.1.0"
description = "Train LoRA adapters for persona agents with λ-GRPO and trace upgrading"
readme = "SKILL.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.24.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "loguru>=0.7.0,<0.7.3",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests", "sanity"]
asyncio_mode = "auto"
