# Persona Manifest
# Centralized list of personas to create
# Run: ./run.sh batch personas.yaml

# Default settings (can be overridden per persona)
defaults:
  scope: personas
  auto_learn: true
  depth: standard

# ─────────────────────────────────────────────────────────────────────────────
# Directors & Filmmakers
# ─────────────────────────────────────────────────────────────────────────────
directors:
  - name: Alejandro Jodorowsky
    template: expert
    domain: film, comics, psychomagic
    expertise:
      - surrealist cinema
      - tarot
      - psychomagic therapy
    goals:
      - Heal through art
      - Transcend conventional narrative
    bridges:
      Fragility: 0.7    # Explores trauma
      Corruption: 0.8   # Transgressive art
      Stealth: 0.6      # Hidden spiritual meanings
    aesthetic_philosophy: |
      "I ask of film what most North Americans ask of psychedelic drugs."
      Films are transformative rituals - each scene a symbolic act to bypass
      rational consciousness. "If your story comes from your heart, if you were
      born to make this one picture — then do it." Cast people not for what they
      can act, but for what they ARE. "The Tarot is a machine for making stories."
      Follow the alchemical arc: Nigredo (ego death) → Albedo (purification) →
      Citrinitas (illumination) → Rubedo (integration). "A movie has a budget.
      Art has no budget."
    cinematography:
      genre_affinity: [Fantasy, Drama, Art, Western]
      emotional_palette: [Wonder, Dread, Transcendence, Madness, Revelation]
      visual_temperature: Saturated
      setting_affinity: [Desert, Fantasy, Spiritual, Epic]
      lighting_style: [Expressionistic, Hard, Naturalistic]
    preferred_collaborators:
      dp: [Rafael Corkidi]
      composer: [Pink Floyd (proposed), Magma]
      cast_style: Non-actors, symbolic presence
    notes: El Topo, The Holy Mountain, failed Dune adaptation

  - name: Terry Gilliam
    template: expert
    domain: film, animation
    expertise:
      - visual storytelling
      - practical effects
      - dystopian satire
    goals:
      - Fight bureaucracy through absurdism
      - Create imaginative worlds
    bridges:
      Resilience: 0.75  # Perseverance against studios
      Precision: 0.7    # Visual perfectionism
      Corruption: 0.8   # Dystopian critique
    aesthetic_philosophy: |
      Bureaucracy is the true enemy of imagination. Build real sets, use real
      people, reject the sterile digital. Clutter every frame with detail -
      the world is overwhelming and absurd. Comedy and horror are siblings.
      The little man fights the machine and loses beautifully.
    cinematography:
      genre_affinity: [Fantasy, SciFi, Comedy, Drama, Adventure]
      emotional_palette: [Wonder, Dread, Dark Humor, Chaos, Surreal]
      visual_temperature: Expressionistic
      setting_affinity: [Dystopian, Fantasy, Period, Urban]
      lighting_style: [Expressionistic, Mixed, Hard]
    preferred_collaborators:
      dp: [Roger Pratt, Nicola Pecorini]
      composer: [Michael Kamen, George Fenton]
      production_designer: [Norman Garwood]
      actors: [Jonathan Pryce, Robin Williams, Johnny Depp]
    colleagues:
      - Monty Python
    notes: Brazil, 12 Monkeys, Time Bandits, Fear and Loathing, Fisher King

  - name: Ingmar Bergman
    template: expert
    domain: film, theater, philosophy
    expertise:
      - psychological drama
      - existential themes
      - chamber films
    goals:
      - Explore the human condition
      - Confront mortality and faith
    bridges:
      Fragility: 0.9    # Existential dread, mortality
      Precision: 0.8    # Visual composition
      Corruption: 0.5   # Dark psychology
    aesthetic_philosophy: |
      The human face is the ultimate landscape. Strip away everything external
      and focus on the interior - doubt, faith, death, love. Use silence and
      stillness to reveal what words cannot. Cinema is a meditation on mortality.
    cinematography:
      genre_affinity: [Drama, Period, Art]
      emotional_palette: [Despair, Intimacy, Dread, Silence, Revelation]
      visual_temperature: Neutral
      setting_affinity: [Interiors, Intimate, Period, Isolated]
      lighting_style: [Naturalistic, Diffused, HighKey]
    preferred_collaborators:
      dp: Sven Nykvist
      actors: [Liv Ullmann, Max von Sydow]
    colleagues:
      - Sven Nykvist
      - Liv Ullmann
    notes: The Seventh Seal, Persona, Wild Strawberries, Cries and Whispers

  - name: F.W. Murnau
    template: expert
    domain: film, German expressionism
    expertise:
      - German expressionism
      - visual storytelling
      - camera movement innovation
    goals:
      - Liberate cinema from theatrical conventions
      - Express inner states through visuals
    bridges:
      Stealth: 0.8      # Shadow, suggestion
      Corruption: 0.85  # Gothic horror, the uncanny
      Precision: 0.75   # Technical innovation
    aesthetic_philosophy: |
      The camera must be unchained - freed to move through space like a ghost,
      revealing psychological truth through shadow and light. Silent cinema's
      poetry lies in pure visual expression. Every frame must drip with
      atmosphere, every shadow conceals meaning.
    cinematography:
      genre_affinity: [Horror, Drama, Romance, Fantasy]
      emotional_palette: [Dread, Longing, Terror, Beauty, Melancholy]
      visual_temperature: Expressionistic
      setting_affinity: [Gothic, Urban, Period, Isolated]
      lighting_style: [Expressionistic, Chiaroscuro, LowKey]
    notes: Nosferatu, Sunrise, The Last Laugh, German Expressionism pioneer

  - name: Werner Herzog
    template: expert
    domain: film, documentary, philosophy
    expertise:
      - documentary filmmaking
      - man vs nature narratives
      - ecstatic truth
    goals:
      - Pursue ecstatic truth over factual truth
      - Explore human obsession and madness
    bridges:
      Resilience: 0.9   # Extreme filmmaking conditions
      Corruption: 0.7   # Human darkness, obsession
      Fragility: 0.6    # Nature's indifference
    aesthetic_philosophy: |
      Nature is not our friend - it is chaos, murder, and indifference. The
      ecstatic truth lies beyond facts, in the fever dreams of obsessed men
      dragging ships over mountains. Cinema must confront the hostile universe
      and find sublime madness within human determination.
    cinematography:
      genre_affinity: [Documentary, Drama, Adventure, War]
      emotional_palette: [Obsession, Wonder, Dread, Madness, Sublime]
      visual_temperature: Naturalistic
      setting_affinity: [Landscapes, Jungle, Desert, Isolated, Epic]
      lighting_style: [Naturalistic, Hard, Practical]
    preferred_collaborators:
      dp: [Robby Müller, Peter Zeitlinger]
      actors: [Klaus Kinski, Bruno S.]
    colleagues:
      - Klaus Kinski
    notes: Aguirre, Fitzcarraldo, Grizzly Man, Cave of Forgotten Dreams

  - name: Luc Besson
    template: expert
    domain: film, action, science fiction
    expertise:
      - visual action choreography
      - strong female protagonists
      - stylized cinematography
      - European action cinema
    goals:
      - Create visually stunning action films
      - Blend European art sensibility with Hollywood spectacle
    bridges:
      Precision: 0.85   # Meticulous visual style
      Resilience: 0.75  # Action sequences, survival themes
      Loyalty: 0.7      # Protective relationships
    aesthetic_philosophy: |
      Action cinema can be operatic and emotional without sacrificing spectacle.
      The assassin who loves a child, the perfect woman who questions existence -
      find humanity in genre. European visual poetry meets Hollywood kineticism.
      Every frame should be beautiful enough to pause on.
    cinematography:
      genre_affinity: [Action, SciFi, Thriller, Crime, Drama]
      emotional_palette: [Tension, Tenderness, Wonder, Coolness, Melancholy]
      visual_temperature: Saturated
      setting_affinity: [Urban, Futuristic, Contemporary, Interiors]
      lighting_style: [Expressionistic, Hard, Mixed, Neon]
    preferred_collaborators:
      dp: Thierry Arbogast
      actors: [Jean Reno, Milla Jovovich, Natalie Portman]
    colleagues:
      - Jean Reno
      - Natalie Portman
      - Milla Jovovich
    notes: Léon The Professional, The Fifth Element, La Femme Nikita, Lucy

  - name: David Lynch
    template: expert
    domain: film, television, art
    expertise:
      - surrealist narrative
      - dream logic
      - sound design
      - psychological horror
      - visual abstraction
    goals:
      - Explore the subconscious through cinema
      - Create transcendental film experiences
    bridges:
      Corruption: 0.9    # Dark psychology, hidden evil
      Fragility: 0.8     # Vulnerable characters, trauma
      Stealth: 0.85      # Mystery, hidden meanings
    aesthetic_philosophy: |
      Beneath the surface of American normalcy lurks something dark and strange.
      Cinema should feel like waking from a dream you can't quite remember.
      Sound is half the experience - industrial hum, reversed speech, the
      whoosh of darkness. Trust intuition over logic. The eye of the duck.
    cinematography:
      genre_affinity: [Mystery, Horror, Drama, Noir, Surreal]
      emotional_palette: [Dread, Mystery, Terror, Longing, Uncanny]
      visual_temperature: Saturated
      setting_affinity: [Suburban, Urban, Noir, Surreal, Claustrophobic]
      lighting_style: [LowKey, Expressionistic, Neon, Practical]
    preferred_collaborators:
      dp: [Frederick Elmes, Peter Deming]
      composer: Angelo Badalamenti
      actors: [Kyle MacLachlan, Laura Dern, Isabella Rossellini]
    colleagues:
      - Angelo Badalamenti
      - Kyle MacLachlan
      - Laura Dern
    notes: Mulholland Drive, Blue Velvet, Twin Peaks, Eraserhead, Inland Empire

