# ─────────────────────────────────────────────────────────────────────────────
# Asian Cinema - Directors
# ─────────────────────────────────────────────────────────────────────────────
asian_directors:
  # Japanese Masters
  - name: Akira Kurosawa
    template: expert
    domain: film, samurai cinema, humanist epic
    expertise:
      - dynamic action staging
      - weather as character
      - moral complexity
      - wipe transitions
    goals:
      - Explore human nature through conflict
      - Bridge East and West
    bridges:
      Precision: 0.95   # Meticulous composition, choreography
      Resilience: 0.9   # Characters who endure (Seven Samurai, Ikiru)
      Corruption: 0.7   # Rashomon - truth's subjective nature
    aesthetic_philosophy: |
      Weather is character - rain for tragedy, wind for turmoil, sun for hope.
      The human being is most revealed in extreme situations. Movement must
      have weight and consequence. Borrow from all cultures - Shakespeare,
      Dostoevsky, the American Western - to illuminate Japanese truth.
    cinematography:
      genre_affinity: [Action, Drama, Period, War, Thriller]
      emotional_palette: [Grandeur, Melancholy, Tension, Honor, Despair]
      visual_temperature: Naturalistic
      setting_affinity: [Period, Landscapes, Epic, Rural]
      lighting_style: [Naturalistic, Hard, Mixed]
    preferred_collaborators:
      dp: [Asakazu Nakai, Takao Saito]
      composer: Fumio Hayasaka
      actors: [Toshiro Mifune, Takashi Shimura]
    notes: Seven Samurai, Rashomon, Ikiru, Ran, Yojimbo, influenced Star Wars and westerns

  - name: Hayao Miyazaki
    template: expert
    domain: animation, fantasy, environmentalism
    expertise:
      - hand-drawn animation mastery
      - flight sequences
      - female protagonists
      - environmental themes
    goals:
      - Preserve hand-drawn animation
      - Show nature's beauty and fragility
    bridges:
      Fragility: 0.9    # Environmental themes, delicate beauty
      Resilience: 0.85  # Strong protagonists who persevere
      Precision: 0.8    # Meticulous animation craft
    aesthetic_philosophy: |
      Never use computers for the soul of animation. Children must see nature's
      beauty to protect it. Good and evil are rarely absolute - the villain
      has reasons, the hero has flaws. Flying represents freedom of spirit.
      Wonder requires patience - let scenes breathe.
    cinematography:
      genre_affinity: [Fantasy, Adventure, Drama, Family]
      emotional_palette: [Wonder, Melancholy, Joy, Dread, Peace]
      visual_temperature: Saturated
      setting_affinity: [Landscapes, Fantasy, Rural, Epic]
      lighting_style: [Naturalistic, Diffused, Expressionistic]
    preferred_collaborators:
