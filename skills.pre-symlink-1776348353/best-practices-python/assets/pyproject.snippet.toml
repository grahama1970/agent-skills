# Example snippet you can merge into your repo's pyproject.toml
[project]
name = "your-project"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # keep small; add docstring rules if you want
ignore = []

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
