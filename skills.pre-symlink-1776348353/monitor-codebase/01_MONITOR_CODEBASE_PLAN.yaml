version: 1
kind: orchestrate-plan
metadata:
  title: "Harden monitor-codebase: code searchability, fix dispatch, trend tracking"
  description: >
    Fix missing, broken, and aspirational features in monitor-codebase.
    Three tracks: (A) code searchability via treesitter + embedding,
    (B) fix dispatch via orchestrate + code-runner replacing broken subagent path,
    (C) trend tracking across nightly runs.
repo_root: /home/graham/workspace/experiments/pi-mono

capability_overlap:
  memory_recall: |
    Searched "monitor-codebase code search treesitter embedding" — found:
    - ingest-code already has Phase 3 for treesitter (not wired into rescan)
    - treesitter scan command exists and works
    - embedding service running on port 8602
    - Embedding-at-insert contract: memory learn embeds automatically
  skills_checked:
    ingest-code: EXTEND
    treesitter: CALL
    embedding: CALL
    orchestrate: CALL
    memory: CALL
  create_justification: |
    Only trend_tracker.py is new code. All other tasks extend or wire existing skills.

lanes:
  - id: track-a
    label: "Code searchability via treesitter + embedding"
  - id: track-b
    label: "Fix dispatch via orchestrate + code-runner"
  - id: track-c
    label: "Trend tracking across nightly runs"
  - id: track-d
    label: "Cleanup dead references and update docs"

tasks:
  - id: A1-ingest-code-treesitter
    title: "Enhance ingest-code rescan to extract symbols via treesitter"
    runner: code-runner
    lane: track-a
    backend: codex
    mode: iterative
    gate: skills-ci
    prompt: |
      Enhance ingest_code.py rescan command to call the treesitter skill's scan
      subcommand on each configured directory. Add a --treesitter flag that:
      1. Invokes the treesitter skill scan on each configured dir
      2. Extracts function signatures, class hierarchies, imports
      3. Stores each symbol to memory with tags:
         ["codebase", "symbol", "function|class|method", "<name>", "<file_stem>"]
      4. Uses memory daemon Unix socket at /run/user/1000/embry/memory.sock

      The treesitter skill entry point is at:
      .pi/skills/treesitter/run.sh symbols <file>
      .pi/skills/treesitter/run.sh scan <directory>
    allowlist:
      - .pi/skills/ingest-code/ingest_code.py
    max_rounds: 5
    tests:
      - "bash .pi/skills/ingest-code/run.sh rescan --help 2>&1 | grep -q treesitter"
    definition_of_done:
      command: "bash .pi/skills/ingest-code/run.sh rescan --help 2>&1 | grep -c treesitter"
      assertion: "exit_code == 0"

  - id: A2-embedding-verification
    title: "Add --verify-embeddings flag to ingest-code rescan"
    runner: code-runner
    lane: track-a
    backend: codex
    mode: iterative
    gate: skills-ci
    depends_on: [A1-ingest-code-treesitter]
    prompt: |
      Add a --verify-embeddings flag to ingest_code.py rescan that spot-checks
      10 random stored items to confirm they have embeddings. Uses memory recall
      with the function name — should return the function entry.

      Memory daemon: Unix socket at /run/user/1000/embry/memory.sock
      Endpoint: POST with {"q": "function_name", "k": 1} to the recall path
    allowlist:
      - .pi/skills/ingest-code/ingest_code.py
    max_rounds: 3
    tests:
      - "bash .pi/skills/ingest-code/run.sh rescan --help 2>&1 | grep -q verify-embeddings"
    definition_of_done:
      command: "bash .pi/skills/ingest-code/run.sh rescan --help 2>&1 | grep -c verify-embeddings"
      assertion: "exit_code == 0"

  - id: A3-monitor-codebase-step6
    title: "Update monitor-codebase Step 6 to use --treesitter flag"
    runner: code-runner
    lane: track-a
    backend: codex
    mode: one_shot
    gate: skills-ci
    depends_on: [A1-ingest-code-treesitter]
    prompt: |
      Update the monitor-codebase shell script Step 6 to pass --treesitter flag
      to ingest-code rescan. Remove --no-validate so CWE scanning runs too.

      Current ingest_args line:
        ingest_args=(rescan --since "$since" --no-validate --scope "monitor-$project_name")

      Change to:
        ingest_args=(rescan --since "$since" --treesitter --scope "monitor-$project_name")
    allowlist:
      - .pi/skills/monitor-codebase/run.sh
    max_rounds: 2
    tests:
      - "grep -q 'treesitter' .pi/skills/monitor-codebase/run.sh"
    definition_of_done:
      command: "grep -c 'treesitter' .pi/skills/monitor-codebase/run.sh"
      assertion: "exit_code == 0"

  - id: B1-replace-subagent-dispatch
    title: "Replace Step 10 broken subagent dispatch with orchestrate code-runner"
    runner: code-runner
    lane: track-b
    backend: codex
    mode: iterative
    gate: skills-ci
    prompt: |
      Replace Step 10 in the monitor-codebase shell script. The current dispatch
      uses agent-inbox and subagent-service which has 0% file write success.

      Replace with:
      1. Safety git commit (revert point)
      2. Call generate_fix_plan.py from skills-ci to generate YAML from violations
      3. Call the orchestrate skill entry point to execute the fix plan
      4. Commit any fixes made

      The generate_fix_plan.py is at:
      .pi/skills/skills-ci/generate_fix_plan.py

      The orchestrate skill entry point is at:
      .pi/skills/orchestrate/run.sh

      Keep --fix as the gate (scan-only mode must never trigger this step).
    allowlist:
      - .pi/skills/monitor-codebase/run.sh
    max_rounds: 3
    tests:
      - "grep -q 'orchestrate' .pi/skills/monitor-codebase/run.sh"
      - "grep -q 'generate_fix_plan' .pi/skills/monitor-codebase/run.sh"
    definition_of_done:
      command: "grep -c 'orchestrate' .pi/skills/monitor-codebase/run.sh"
      assertion: "exit_code == 0"

  - id: C1-trend-comparison
    title: "Add trend comparison step: diff current report vs previous"
    runner: code-runner
    lane: track-c
    backend: codex
    mode: one_shot
    gate: skills-ci
    prompt: |
      After Step 9 (aggregate report) in the monitor-codebase shell script,
      add a trend comparison step.

      1. Find previous report for this project:
         prev=$(ls -t "$ARTIFACTS_DIR/${project_name}_2*.json" | sed -n '2p')

      2. If previous exists, compute delta via inline python:
         Print REGRESSION (+N issues), IMPROVED (-N issues), or STABLE.

      3. Store delta in a shell variable for the notification step.

      Add between Step 9 and Step 10.
    allowlist:
      - .pi/skills/monitor-codebase/run.sh
    max_rounds: 3
    tests:
      - "grep -q 'REGRESSION' .pi/skills/monitor-codebase/run.sh"
    definition_of_done:
      command: "grep -c 'REGRESSION' .pi/skills/monitor-codebase/run.sh"
      assertion: "exit_code == 0"

  - id: C2-trend-to-memory
    title: "Create trend_tracker.py to store trend data to memory"
    runner: code-runner
    lane: track-c
    backend: codex
    mode: iterative
    gate: skills-ci
    depends_on: [C1-trend-comparison]
    prompt: |
      Create a new file trend_tracker.py in the monitor-codebase skill directory.
      This file stores trend data to memory via httpx.

      Uses httpx to Unix socket /run/user/1000/embry/memory.sock.
      Endpoint: POST to the learn path.
      Payload: problem="monitor-codebase trend: {project} {date}",
        solution=JSON with project, date, total_issues, delta, breakdown.
        scope="codebase_trends", tags=["trend", "project:{name}"]

      Also update the shell script to call this after trend comparison:
        python3 "$SKILL_DIR/trend_tracker.py" "$project_name" "$report_file" "$prev"
    allowlist:
      - .pi/skills/monitor-codebase/trend_tracker.py
      - .pi/skills/monitor-codebase/run.sh
    max_rounds: 3
    tests:
      - "test -f .pi/skills/monitor-codebase/trend_tracker.py"
    definition_of_done:
      command: "test -f .pi/skills/monitor-codebase/trend_tracker.py"
      assertion: "exit_code == 0"

  - id: D1-cleanup-skill-md
    title: "Remove dead composes and update SKILL.md pipeline table"
    runner: code-runner
    lane: track-d
    backend: codex
    mode: one_shot
    gate: skills-ci
    depends_on: [B1-replace-subagent-dispatch, C1-trend-comparison, A3-monitor-codebase-step6]
    prompt: |
      Update the monitor-codebase SKILL.md:
      1. Remove battle, create-code, agent-inbox from composes list. Add orchestrate.
      2. Update the pipeline table:
         - Step 6 now includes --treesitter flag for symbol extraction
         - New Step 9.5: trend comparison (REGRESSION/IMPROVED/STABLE)
         - Step 10 uses orchestrate + code-runner (not subagent-service)
      3. Remove all references to subagent-service dispatch flow.
    allowlist:
      - .pi/skills/monitor-codebase/SKILL.md
    max_rounds: 2
    tests:
      - "grep -q 'orchestrate' .pi/skills/monitor-codebase/SKILL.md"
      - "! grep -q 'battle' .pi/skills/monitor-codebase/SKILL.md"
    definition_of_done:
      command: "grep -c 'orchestrate' .pi/skills/monitor-codebase/SKILL.md"
      assertion: "exit_code == 0"
