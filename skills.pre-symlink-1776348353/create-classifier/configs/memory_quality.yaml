# Memory Quality Classifier Configuration
#
# Two classifiers trained from the same JSONL data:
# 1. content_quality: Is the memory event-grounded with sensory detail?
# 2. taxonomy_quality: Are the bridge attributes correct?
#
# Training data: data/memory_quality_labels.jsonl
# Generated by: scripts/extract_memory_quality_training_data.py

# ── Content Quality Classifier ──
content_quality:
  task_name: memory_content_quality
  task_type: text_multilabel

  classes:
    - grounded    # Event-specific, sensory, bridge-tagged
    - thin        # Has some signal but weak grounding
    - ambiguous   # Vague feelings, no event anchor, no sensory

  model:
    name: distilbert-base-uncased
    pretrained: true

  training:
    batch_size: 16
    learning_rate: 2e-5
    epochs: 15
    max_length: 256
    warmup_ratio: 0.1
    weight_decay: 0.01
    early_stopping_patience: 5

  multilabel:
    threshold: 0.5
    loss: binary_cross_entropy
    pos_weight_auto: true

  eval_thresholds:
    f1_micro: 0.75
    f1_macro: 0.70

  data:
    train_file: data/memory_quality_content_train.jsonl
    val_file: data/memory_quality_content_val.jsonl
    text_field: text
    label_field: content_label
    # JSONL format: {"text": "...", "labels": ["grounded"]}

# ── Taxonomy Quality Classifier ──
taxonomy_quality:
  task_name: memory_taxonomy_quality
  task_type: text_multilabel

  classes:
    - correct    # Stored bridges match re-extracted bridges
    - vague      # Bridges came from literal name match
    - missing    # No bridges at all
    - wrong      # Stored bridges contradict re-extracted

  model:
    name: distilbert-base-uncased
    pretrained: true

  training:
    batch_size: 16
    learning_rate: 2e-5
    epochs: 15
    max_length: 256
    warmup_ratio: 0.1
    weight_decay: 0.01
    early_stopping_patience: 5

  multilabel:
    threshold: 0.5
    loss: binary_cross_entropy
    pos_weight_auto: true

  eval_thresholds:
    f1_micro: 0.75
    f1_macro: 0.70

  data:
    train_file: data/memory_quality_taxonomy_train.jsonl
    val_file: data/memory_quality_taxonomy_val.jsonl
    text_field: text
    label_field: taxonomy_label

# ── Integration ──
integration:
  target_skills:
    - /monitor-personas   # Nightly quality scan
    - /memory             # Pre-commit quality gate
  fallback:
    enabled: true
    confidence_threshold: 0.6
    # Below threshold: use heuristic labeler from extract script
