task: structural_classification
type: multi_class_hybrid

classes:
  - Header
  - Footnote
  - Reference
  - BodyText

model:
  architecture: cross_modal_transformer
  text_encoder: microsoft/deberta-v3-small
  layout_encoder: multi_layer_mlp
  features:
    spatial: [bbox, y_pos_rel, block_width_rel]
    font: [size, body_size_ref, is_bold, flags]
  hidden_dims: [512, 256, 128]
  fusion_strategy: concatenation
  dropout: 0.15

training:
  epochs: 25
  batch_size: 64
  learning_rate: 3e-5
  weight_decay: 0.05
  early_stopping_patience: 3

validation:
  split: 0.2
  metrics:
    [
      f1_macro,
      precision_Header,
      recall_Header,
      precision_Footnote,
      recall_Footnote,
    ]

inference:
  confidence_threshold: 0.90
  fallback_to_heuristic: true
