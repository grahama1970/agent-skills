[project]
name = "sfx-catalog"
version = "0.1.0"
description = "SFX audio cataloging and search system"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "joblib",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "typer>=0.9.0",
    "loguru>=0.7.0,<0.7.3",
    "rich>=13.0.0",
    "python-arango>=7.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
