[project]
name = "learn-timeout"
version = "1.0.0"
description = "General-purpose timeout estimation with dual-model prediction"
requires-python = ">=3.10,<3.13"
dependencies = [
    "scikit-learn>=1.3.0",
    "typer>=0.9.0",
    "loguru>=0.7.0,<0.7.3",
    "joblib>=1.3.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
