# /test-interactions skill policy — enforced by .claude/hooks/skill_policy.py
# Anti-patterns from SKILL.md: non-data-qid selectors, missing persona, LLM verdicts

name: test-interactions
slash_command: /test-interactions

required_reads:
  - .pi/skills/test-interactions/SKILL.md
  - .pi/skills/best-practices-react/SKILL.md

forbidden_use:
  any_of:
    # WRONG: Using CSS selectors that aren't [data-qid] (Critical Rule #1)
    - pattern: "\"target\":\\s*\"#"
      reason: "All selectors must be [data-qid]. No #id selectors allowed."
    - pattern: "\"target\":\\s*\"\\."
      reason: "All selectors must be [data-qid]. No .class selectors allowed."
    - pattern: "nth-child"
      reason: "All selectors must be [data-qid]. No nth-child selectors allowed."
    - pattern: "\"target\":\\s*\"//|xpath"
      reason: "All selectors must be [data-qid]. No XPath selectors allowed."

    # WRONG: Running review without --persona (Critical Rule #2)
    - shell_contains: "run.sh review --captures"
      reason: "Review command requires --persona. A review without a persona produces generic, unfocused feedback."

    # WRONG: Relying on LLM to decide pass/fail (Architecture rule)
    - pattern: "ask the VLM|VLM.*decide|LLM.*pass.fail|LLM.*verdict"
      reason: "The LLM never decides pass/fail. Deterministic assertions decide verdicts. LLM only comments on evidence after tests run."
