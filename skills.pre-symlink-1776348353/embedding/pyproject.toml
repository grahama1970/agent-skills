[project]
name = "embedding-skill"
version = "1.0.0"
description = "Standalone embedding service for semantic search"
requires-python = ">=3.10,<3.13"
dependencies = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "loguru>=0.7.0,<0.7.3",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "python-arango>=7.0.0",
    "tqdm>=4.60.0",
    "rich>=13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["embed.py"]
