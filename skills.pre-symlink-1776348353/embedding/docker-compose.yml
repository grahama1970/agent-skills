version: "3.8"

# Embedding Skill — dual-backend architecture
#
# memory-embedding:     MiniLM text-only (CPU/GPU, :8602) — existing production
# memory-embedding-mm:  Qwen3-VL multimodal via vLLM (GPU, :8603) — new
# memory-embedding-ft:  Ollama finetunes (GPU, :8604) — future stub
#
# Usage:
#   docker compose up -d                    # Start all backends
#   docker compose up -d memory-embedding-mm  # Start only multimodal
#   docker compose logs -f memory-embedding-mm

services:
  # ── Existing: MiniLM text-only embeddings ──────────────────────────
  memory-embedding:
    build:
      context: ../../../../workspace/experiments/memory/docker/embedding
      dockerfile: Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN:-}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    container_name: embry-embedding
    restart: always
    ports:
      - "8602:8602"
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cuda}
      - EMBEDDING_TASK=retrieval
      - EMBEDDING_DIMENSIONS=384
      - EMBEDDING_PORT=8602
      - EMBEDDING_HOST=0.0.0.0
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://127.0.0.1:8602/health',timeout=5); assert r.status_code==200"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── New: Qwen3-VL multimodal embeddings via vLLM ───────────────────
  # Text: /v1/embeddings  (OpenAI-compatible, returns single pooled vector)
  # Image: /pooling        (returns per-token vectors, client mean-pools)
  memory-embedding-mm:
    image: vllm/vllm-openai:latest
    container_name: embry-embedding-mm
    restart: always
    ports:
      - "8603:8603"
    volumes:
      # Model cache on 12TB — avoids re-downloading 4GB+ model
      - /mnt/storage12tb/huggingface:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    entrypoint: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
    command:
      - --model
      - Qwen/Qwen3-VL-Embedding-2B
      - --host
      - "0.0.0.0"
      - --port
      - "8603"
      - --dtype
      - bfloat16
      - --trust-remote-code
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.55"
      - --runner
      - pooling
      - --enable-mm-embeds
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8603/health')"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
    ipc: host
    shm_size: "16g"
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Future: Ollama for domain-finetuned GGUF models ────────────────
