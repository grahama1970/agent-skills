[project]
name = "create-music"
version = "0.1.0"
description = "AI-assisted music creation for Horus persona"
requires-python = ">=3.10,<3.13"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchcodec>=0.10.0",  # Required by torchaudio for saving audio
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "audiocraft",
    "httpx>=0.25.0",       # Sonauto cloud API client
    "loguru>=0.7.0,<0.7.3",       # Project-standard logging
    "pretty_midi>=0.2.10", # MIDI ↔ piano roll spec conversion
    "jsonschema>=4.20.0",  # Schema validation for annotated lyrics + piano roll
]
# NOTE: demucs dependency has moved to .pi/skills/create-stems/

# NOTE: audiocraft/MusicGen has strict requirements:
#   1. Python 3.11 or older (pins torch 2.1.0 which lacks cp313 wheels)
#   2. System ffmpeg dev libraries
# To use MusicGen, create a separate Python 3.11 environment:
#   sudo apt install libavdevice-dev libavfilter-dev libavformat-dev \
#                    libavcodec-dev libswscale-dev libswresample-dev
#   python3.11 -m venv .venv-musicgen
#   source .venv-musicgen/bin/activate
#   pip install audiocraft

[tool.hatch.build.targets.wheel]
# This is a CLI skill, not a library - include cli.py as the package
packages = ["."]
only-include = ["cli.py"]
