# F-36 Plant Floor Operations — Stream Deck Button Manifest
# Single source of truth for all f36 namespace buttons.
#
# UX Model: 5ft-Away Glanceable Status Board
# - Max 13 buttons per context (out of 32 XL slots)
# - Empty space = breathing room between zones
# - Voice (PersonaPlex) drives workflow, deck reflects state
# - Context service pushes the right surface automatically
#
# Zone Layout (8x4 grid, positions 0-31):
#   Top row    [0-7]:   Status widgets — readable from 5ft
#   Middle     [8-23]:  Contextual action buttons, grouped left, sparse
#   Bottom-left [24-26]: Disposition / primary actions
#   Position   [7]:     ESCALATE — always-on emergency, never moves
#   Position   [31]:    UNDO — always present, isolated, never moves
#
# Schema per button:
#   name:          unique identifier (warm pond key)
#   command:       full pi invocation string
#   text:          Stream Deck label (max 9 chars)
#   icon:          icon filename (white variant)
#   active_icon:   icon filename (active/pressed state)
#   priority:      primary | secondary | tertiary
#   zone:          status | action | disposition | emergency | undo
#   context:       which voice/workflow context triggers this button
#   position:      preferred grid position (0-31), context service resolves conflicts
#   color_hint:    optional color override (green, red, amber)
#   widget:        optional widget name for auto-updating buttons
#   workflow_step: optional integer for sequential workflows
#   disposition:   true if this is a pass/fail action

# ============================================================
# UNIVERSAL BUTTONS — Present in EVERY context, never move
# ============================================================

- name: f36_escalate
  command: "pi f36 escalate --part-id $(xclip -o) --notify-qa"
  text: "ESCALATE"
  icon: alert-triangle_white.png
  active_icon: alert-triangle_active.png
  priority: primary
  zone: emergency
  context: "*"
  position: 7
  color_hint: amber

- name: f36_undo
  command: "pi f36 undo"
  text: "UNDO"
  icon: repeat_white.png
  active_icon: repeat_active.png
  priority: primary
  zone: undo
  context: "*"
  position: 31

