[project]
name = "pi-skill-create-peer-review"
version = "0.1.0"
description = "Self-improving peer review via Shadow-LEGO cascade"
requires-python = ">=3.10,<3.13"
dependencies = [
    "httpx>=0.24.0",
    "loguru>=0.7.0,<0.7.3",
    "matplotlib",
    "numpy",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
