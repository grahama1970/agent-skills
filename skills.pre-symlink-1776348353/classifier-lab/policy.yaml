# /classifier-lab skill policy — enforced by .claude/hooks/skill_policy.py
# Agents skip eval loops, report val metrics as test metrics,
# train with insufficient data, and fire-and-forget training runs.

name: classifier-lab
slash_command: /classifier-lab

required_reads:
  - .pi/skills/classifier-lab/SKILL.md

forbidden_use:
  any_of:
    # Training without data audit first (documented Common Mistake)
    - pattern: "benchmark.*--data-dir(?!.*data_audit)"
      reason: "Don't train without running data audit first. Create data_audit.json with class balance, then /dogpile, then train."

    # Reporting val metrics as test results (documented Common Mistake)
    - pattern: "val_f1|val_accuracy|validation.*accuracy.*final"
      reason: "Never report validation metrics as evaluation results. Always evaluate on held-out test set via ./run.sh evaluate."

    # Training with fewer than 200 samples per class (documented Common Mistake + NON-NEGOTIABLE)
    - pattern: "n_samples.*<\\s*200|samples_per_class.*<\\s*200"
      reason: "NON-NEGOTIABLE: Do not train with fewer than 200 samples per class. Models below this threshold will not cross the 90% gate."

    # Fire-and-forget training (documented Anti-Pattern)
    - shell_contains: "run.sh benchmark"
      reason: "MANDATORY: Monitor training runs. Check ./run.sh status every 2-5 min. Check ./run.sh tb-summary. Never fire-and-forget."

    # Inline training bypassing the lab
    - pattern: "model\\.fit\\(|trainer\\.train\\(|Trainer\\("
      reason: "Don't train classifiers inline. Use ./run.sh train or ./run.sh benchmark for the full lab workflow with monitoring."
