<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scatter Plot</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Scatter Plot</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [
  {"x": 10, "y": 25, "group": "A"}, {"x": 22, "y": 48, "group": "A"}, {"x": 35, "y": 32, "group": "B"},
  {"x": 42, "y": 65, "group": "B"}, {"x": 55, "y": 78, "group": "A"}, {"x": 68, "y": 52, "group": "C"},
  {"x": 75, "y": 90, "group": "C"}, {"x": 88, "y": 45, "group": "B"}, {"x": 15, "y": 58, "group": "A"},
  {"x": 48, "y": 72, "group": "C"}, {"x": 62, "y": 38, "group": "B"}, {"x": 30, "y": 85, "group": "C"}
];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 24, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`);

const x = d3.scaleLinear().domain(d3.extent(data, d => d.x)).nice().range([margin.left, width - margin.right]);
const y = d3.scaleLinear().domain(d3.extent(data, d => d.y)).nice().range([height - margin.bottom, margin.top]);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

svg.selectAll('circle').data(data).join('circle')
  .attr('data-label', d => d.group)
  .attr('cx', d => x(d.x))
  .attr('cy', d => y(d.y))
  .attr('r', 0)
  .attr('fill', d => colors(d.group))
  .attr('opacity', 0.7)
  .attr('stroke', '#fff').attr('stroke-width', 2)
  .transition().duration(600).delay((d, i) => i * 50)
  .attr('r', 8);

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).ticks(6)).selectAll('text').attr('font-size', '18px');
svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(6)).selectAll('text').attr('font-size', '18px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);
</script>
</body>
</html>
