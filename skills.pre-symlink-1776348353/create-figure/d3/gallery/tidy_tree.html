<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidy Tree</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Tidy Tree</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || {
  name: "Embry OS", children: [
    {name: "Create", children: [
      {name: "figure"}, {name: "music"}, {name: "story"}, {name: "movie"}, {name: "persona"}
    ]},
    {name: "Monitor", children: [
      {name: "skills"}, {name: "memory"}, {name: "sparta"}, {name: "drift"}
    ]},
    {name: "Learn", children: [
      {name: "datalake"}, {name: "extractor"}, {name: "voice"}
    ]},
    {name: "Ops", children: [
      {name: "claude"}, {name: "chutes"}, {name: "runpod"}
    ]}
  ]
};

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 120, bottom: 20, left: 80};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

const root = d3.hierarchy(data);
d3.tree().size([height - margin.top - margin.bottom, width - margin.left - margin.right])(root);

const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

// Links
g.selectAll('path.link').data(root.links()).join('path')
  .attr('class', 'link')
  .attr('d', d3.linkHorizontal().x(d => d.y).y(d => d.x))
  .attr('fill', 'none')
  .attr('stroke', '#94a3b8').attr('stroke-width', 1.5);

// Nodes
const node = g.selectAll('g.node').data(root.descendants()).join('g')
  .attr('class', 'node')
  .attr('transform', d => `translate(${d.y},${d.x})`);

node.append('circle')
  .attr('data-label', d => d.data.name)
  .attr('r', d => d.children ? 6 : 4)
  .attr('fill', d => { let p = d; while (p.depth > 1) p = p.parent; return d.depth === 0 ? '#1e293b' : colors(p.data.name); })
  .attr('stroke', '#fff').attr('stroke-width', 2);

node.append('text')
  .attr('dy', '0.35em')
  .attr('x', d => d.children ? -12 : 10)
  .attr('text-anchor', d => d.children ? 'end' : 'start')
  .attr('font-size', d => d.depth === 0 ? '16px' : d.depth === 1 ? '14px' : '13px')
  .attr('font-weight', d => d.depth <= 1 ? 600 : 400)
  .attr('fill', '#1e293b')
  .text(d => d.data.name);
</script>
</body>
</html>
