<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked Area Chart</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Stacked Area Chart</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// Multi-series time data
const data = window.__INJECTED_DATA__ || [
  {month: "Jan", api: 120, batch: 45, voice: 20},
  {month: "Feb", api: 135, batch: 52, voice: 28},
  {month: "Mar", api: 148, batch: 61, voice: 35},
  {month: "Apr", api: 160, batch: 58, voice: 42},
  {month: "May", api: 175, batch: 70, voice: 55},
  {month: "Jun", api: 190, batch: 82, voice: 68},
  {month: "Jul", api: 210, batch: 90, voice: 78},
  {month: "Aug", api: 225, batch: 95, voice: 85},
  {month: "Sep", api: 240, batch: 105, voice: 92},
  {month: "Oct", api: 255, batch: 112, voice: 100},
  {month: "Nov", api: 270, batch: 120, voice: 110},
  {month: "Dec", api: 290, batch: 130, voice: 125}
];

const keys = ["voice", "batch", "api"];

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 120, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal().domain(keys).range(["#4F46E5", "#06B6D4", "#F59E0B"]);

const stack = d3.stack().keys(keys).order(d3.stackOrderNone).offset(d3.stackOffsetNone);
const series = stack(data);

const x = d3.scalePoint()
  .domain(data.map(d => d.month))
  .range([margin.left, width - margin.right]);

const y = d3.scaleLinear()
  .domain([0, d3.max(series, s => d3.max(s, d => d[1]))]).nice()
  .range([height - margin.bottom, margin.top]);

const area = d3.area()
  .x((d, i) => x(data[i].month))
  .y0(d => y(d[0]))
  .y1(d => y(d[1]))
  .curve(d3.curveMonotoneX);

// Stacked areas
svg.selectAll('path.layer').data(series).join('path')
  .attr('class', 'layer')
  .attr('data-label', d => d.key)
  .attr('d', area)
  .attr('fill', d => colors(d.key))
  .attr('fill-opacity', 0.7)
  .attr('stroke', d => colors(d.key))
  .attr('stroke-width', 1.5);

// Axes
svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).tickSizeOuter(0))
  .selectAll('text').attr('font-size', '16px');

svg.append('g').attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(6))
  .selectAll('text').attr('font-size', '16px');

svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);

// Legend
const legend = svg.selectAll('g.legend').data(keys.slice().reverse()).join('g')
  .attr('class', 'legend')
  .attr('transform', (d, i) => `translate(${width - margin.right + 16},${margin.top + i * 24})`);
legend.append('rect').attr('width', 14).attr('height', 14).attr('rx', 3)
  .attr('fill', d => colors(d)).attr('opacity', 0.8);
legend.append('text').attr('x', 20).attr('y', 11).attr('font-size', '14px').attr('fill', '#1e293b').text(d => d);
</script>
</body>
</html>
