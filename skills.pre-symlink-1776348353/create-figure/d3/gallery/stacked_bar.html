<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked Bar Chart</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Stacked Bar Chart</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [
  {"category": "Q1", "Product A": 30, "Product B": 20, "Product C": 15},
  {"category": "Q2", "Product A": 45, "Product B": 25, "Product C": 20},
  {"category": "Q3", "Product A": 35, "Product B": 30, "Product C": 25},
  {"category": "Q4", "Product A": 50, "Product B": 35, "Product C": 30}
];
const keys = ["Product A", "Product B", "Product C"];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 120, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const series = d3.stack().keys(keys)(data);

const x = d3.scaleBand().domain(data.map(d => d.category)).range([margin.left, width - margin.right]).padding(0.3);
const y = d3.scaleLinear().domain([0, d3.max(series, s => d3.max(s, d => d[1]))]).nice().range([height - margin.bottom, margin.top]);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

svg.selectAll('g.series').data(series).join('g')
  .attr('class', 'series').attr('fill', (d, i) => colors(i))
  .selectAll('rect').data(d => d).join('rect')
  .attr('data-label', (d, i) => data[i].category)
  .attr('x', (d, i) => x(data[i].category)).attr('width', x.bandwidth())
  .attr('y', height - margin.bottom).attr('height', 0).attr('rx', 2)
  .transition().duration(800).ease(d3.easeCubicOut)
  .attr('y', d => y(d[1])).attr('height', d => y(d[0]) - y(d[1]));

const legend = svg.append('g').attr('transform', `translate(${width - margin.right + 16}, ${margin.top})`);
keys.forEach((key, i) => {
  const g = legend.append('g').attr('transform', `translate(0, ${i * 24})`);
  g.append('rect').attr('width', 16).attr('height', 16).attr('fill', colors(i)).attr('rx', 3);
  g.append('text').attr('x', 22).attr('y', 13).text(key).attr('font-size', '14px');
});

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).tickSizeOuter(0)).selectAll('text').attr('font-size', '18px');
svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5)).selectAll('text').attr('font-size', '18px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);
</script>
</body>
</html>
