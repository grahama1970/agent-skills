<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marimekko Chart</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Marimekko Chart</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [
  {category: "Create", segments: {figure: 35, music: 25, story: 20, movie: 20}, total: 45},
  {category: "Monitor", segments: {skills: 30, memory: 25, sparta: 25, drift: 20}, total: 30},
  {category: "Learn", segments: {datalake: 25, extractor: 40, voice: 35}, total: 35},
  {category: "Ops", segments: {claude: 50, chutes: 25, runpod: 25}, total: 25}
];

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 24, bottom: 80, left: 24};
const chartW = width - margin.left - margin.right;
const chartH = height - margin.top - margin.bottom;

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

const totalWidth = d3.sum(data, d => d.total);
let xOffset = margin.left;

data.forEach(cat => {
  const colW = (cat.total / totalWidth) * chartW;
  const segKeys = Object.keys(cat.segments);
  const segTotal = d3.sum(segKeys.map(k => cat.segments[k]));
  let yOffset = margin.top;

  segKeys.forEach(key => {
    const segH = (cat.segments[key] / segTotal) * chartH;
    svg.append('rect')
      .attr('data-label', `${cat.category}-${key}`)
      .attr('x', xOffset + 1).attr('y', yOffset)
      .attr('width', colW - 2).attr('height', segH)
      .attr('fill', colors(key)).attr('opacity', 0.8)
      .attr('rx', 2);

    if (segH > 20 && colW > 50) {
      svg.append('text')
        .attr('x', xOffset + colW / 2).attr('y', yOffset + segH / 2)
        .attr('text-anchor', 'middle').attr('dominant-baseline', 'central')
        .attr('font-size', '12px').attr('fill', '#fff').attr('font-weight', 500)
        .text(key);
    }
    yOffset += segH;
  });

  // Category label below
  svg.append('text')
    .attr('x', xOffset + colW / 2).attr('y', height - margin.bottom + 20)
    .attr('text-anchor', 'middle').attr('font-size', '14px').attr('fill', '#1e293b').attr('font-weight', 600)
    .text(cat.category);
  svg.append('text')
    .attr('x', xOffset + colW / 2).attr('y', height - margin.bottom + 38)
    .attr('text-anchor', 'middle').attr('font-size', '12px').attr('fill', '#64748b')
    .text(`${cat.total}%`);

  xOffset += colW;
});
</script>
</body>
</html>
