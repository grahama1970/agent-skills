<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Force-Directed Graph</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Force-Directed Graph</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const graph = window.__INJECTED_DATA__ || {
  nodes: [
    {id: "Memory", group: 0}, {id: "Extractor", group: 0}, {id: "SPARTA", group: 1},
    {id: "Taxonomy", group: 1}, {id: "Lean4", group: 2}, {id: "Dashboard", group: 2},
    {id: "Persona", group: 3}, {id: "Voice", group: 3}, {id: "Horus", group: 3},
    {id: "Analytics", group: 0}, {id: "Classifier", group: 2}
  ],
  links: [
    {source: "Memory", target: "Extractor"}, {source: "Memory", target: "SPARTA"},
    {source: "SPARTA", target: "Taxonomy"}, {source: "SPARTA", target: "Lean4"},
    {source: "Taxonomy", target: "Memory"}, {source: "Dashboard", target: "Memory"},
    {source: "Persona", target: "Voice"}, {source: "Persona", target: "Horus"},
    {source: "Analytics", target: "Dashboard"}, {source: "Classifier", target: "Memory"},
    {source: "Extractor", target: "Analytics"}, {source: "Lean4", target: "Dashboard"}
  ]
};

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

const simulation = d3.forceSimulation(graph.nodes)
  .force('link', d3.forceLink(graph.links).id(d => d.id).distance(80))
  .force('charge', d3.forceManyBody().strength(-300))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(30));

const link = svg.append('g').selectAll('line').data(graph.links).join('line')
  .attr('stroke', '#94A3B8').attr('stroke-width', 2).attr('stroke-opacity', 0.6);

const node = svg.append('g').selectAll('circle').data(graph.nodes).join('circle')
  .attr('data-label', d => d.id)
  .attr('r', 12).attr('fill', d => colors(d.group))
  .attr('stroke', '#fff').attr('stroke-width', 2)
  .call(d3.drag()
    .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
  );

const label = svg.append('g').selectAll('text').data(graph.nodes).join('text')
  .text(d => d.id).attr('font-size', '14px').attr('text-anchor', 'middle').attr('dy', -18)
  .attr('fill', '#1e293b');

simulation.on('tick', () => {
  link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('cx', d => d.x).attr('cy', d => d.y);
  label.attr('x', d => d.x).attr('y', d => d.y);
});
</script>
</body>
</html>
