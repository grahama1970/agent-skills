<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hierarchical Edge Bundling</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Hierarchical Edge Bundling</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// Hierarchical structure with cross-links
const hierarchy = {
  name: "root",
  children: [
    {name: "Create", children: [
      {name: "figure"}, {name: "music"}, {name: "story"}, {name: "movie"}
    ]},
    {name: "Monitor", children: [
      {name: "skills"}, {name: "memory"}, {name: "sparta"}, {name: "drift"}
    ]},
    {name: "Learn", children: [
      {name: "datalake"}, {name: "extractor"}, {name: "voice"}, {name: "artist"}
    ]},
    {name: "Ops", children: [
      {name: "claude"}, {name: "chutes"}, {name: "runpod"}, {name: "docker"}
    ]}
  ]
};

// Cross-links between leaves
const links = window.__INJECTED_DATA__ || [
  ["figure", "memory"], ["figure", "extractor"], ["music", "voice"],
  ["story", "memory"], ["movie", "music"], ["movie", "story"],
  ["skills", "sparta"], ["memory", "datalake"], ["sparta", "extractor"],
  ["drift", "memory"], ["datalake", "voice"], ["extractor", "claude"],
  ["voice", "chutes"], ["artist", "voice"], ["claude", "runpod"],
  ["figure", "skills"], ["story", "extractor"], ["music", "artist"]
];

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const size = Math.min(width, height);
const radius = size / 2 - 80;

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`)
  .append('g').attr('transform', `translate(${width/2},${height/2})`);

const colors = d3.scaleOrdinal(d3.schemeTableau10);

const root = d3.hierarchy(hierarchy);
const cluster = d3.cluster().size([360, radius]);
cluster(root);

// Build name->node map
const nodeMap = {};
root.leaves().forEach(d => { nodeMap[d.data.name] = d; });

// Draw bundled edges
const line = d3.lineRadial()
  .curve(d3.curveBundle.beta(0.85))
  .radius(d => d.y)
  .angle(d => d.x * Math.PI / 180);

links.forEach(([src, tgt]) => {
  const source = nodeMap[src];
  const target = nodeMap[tgt];
  if (!source || !target) return;
  const path = source.path(target);
  svg.append('path')
    .datum(path)
    .attr('d', line)
    .attr('fill', 'none')
    .attr('stroke', colors(source.parent.data.name))
    .attr('stroke-opacity', 0.4)
    .attr('stroke-width', 1.5);
});

// Draw leaf nodes
const leaf = svg.selectAll('g.leaf').data(root.leaves()).join('g')
  .attr('class', 'leaf')
  .attr('transform', d => `rotate(${d.x - 90}) translate(${d.y},0)`);

leaf.append('circle')
  .attr('data-label', d => d.data.name)
  .attr('r', 5)
  .attr('fill', d => colors(d.parent.data.name))
  .attr('stroke', '#fff').attr('stroke-width', 1.5);

leaf.append('text')
  .attr('dy', '0.35em')
  .attr('x', d => d.x < 180 ? 10 : -10)
  .attr('text-anchor', d => d.x < 180 ? 'start' : 'end')
  .attr('transform', d => d.x >= 180 ? 'rotate(180)' : null)
  .attr('font-size', '13px').attr('fill', '#1e293b')
  .text(d => d.data.name);
</script>
</body>
</html>
