<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arc Diagram</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Arc Diagram</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const nodes = window.__INJECTED_DATA__ ? [...new Set(window.__INJECTED_DATA__.flatMap(d => [d.source || d.from, d.target || d.to]))] : ["Memory", "Extractor", "Analytics", "SPARTA", "Dashboard", "Taxonomy", "Sankey", "Figure"];
const links = window.__INJECTED_DATA__ ? window.__INJECTED_DATA__.map(d => ({source: d.source || d.from, target: d.target || d.to, value: d.value || 1})) : [
  {source: 0, target: 1, value: 8}, {source: 0, target: 3, value: 6},
  {source: 1, target: 2, value: 5}, {source: 1, target: 3, value: 7},
  {source: 2, target: 4, value: 9}, {source: 3, target: 5, value: 4},
  {source: 4, target: 7, value: 6}, {source: 5, target: 3, value: 3},
  {source: 0, target: 4, value: 5}, {source: 2, target: 7, value: 4},
  {source: 6, target: 7, value: 7}, {source: 1, target: 5, value: 3}
];

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 40, bottom: 80, left: 40};
const midY = height * 0.65;

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

const x = d3.scalePoint()
  .domain(d3.range(nodes.length))
  .range([margin.left + 40, width - margin.right - 40]);

// Arcs
const maxVal = d3.max(links, d => d.value);
svg.selectAll('path.arc').data(links).join('path')
  .attr('class', 'arc')
  .attr('d', d => {
    const x1 = x(d.source), x2 = x(d.target);
    const r = Math.abs(x2 - x1) / 2;
    return `M ${x1},${midY} A ${r},${r} 0 0,${x1 < x2 ? 1 : 0} ${x2},${midY}`;
  })
  .attr('fill', 'none')
  .attr('stroke', d => colors(d.source))
  .attr('stroke-width', d => 1 + (d.value / maxVal) * 4)
  .attr('stroke-opacity', 0.4);

// Nodes
svg.selectAll('circle').data(nodes).join('circle')
  .attr('data-label', d => d)
  .attr('cx', (d, i) => x(i)).attr('cy', midY)
  .attr('r', 8)
  .attr('fill', (d, i) => colors(i))
  .attr('stroke', '#fff').attr('stroke-width', 2);

// Labels
svg.selectAll('text.label').data(nodes).join('text')
  .attr('class', 'label')
  .attr('x', (d, i) => x(i)).attr('y', midY + 28)
  .attr('text-anchor', 'middle')
  .attr('font-size', '13px').attr('fill', '#1e293b')
  .attr('transform', (d, i) => `rotate(30, ${x(i)}, ${midY + 28})`)
  .text(d => d);
</script>
</body>
</html>
