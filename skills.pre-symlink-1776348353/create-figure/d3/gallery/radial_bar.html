<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radial Bar Chart</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Radial Bar Chart</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [
  {label: "Memory", value: 92}, {label: "Extractor", value: 78},
  {label: "Analytics", value: 85}, {label: "SPARTA", value: 70},
  {label: "Dashboard", value: 88}, {label: "Taxonomy", value: 65},
  {label: "Figure", value: 95}, {label: "Music", value: 60}
];

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const innerRadius = 40;
const outerRadius = Math.min(width, height) / 2 - 50;

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`)
  .append('g').attr('transform', `translate(${width/2},${height/2})`);

const colors = d3.scaleOrdinal(d3.schemeTableau10);

const angle = d3.scaleBand()
  .domain(data.map(d => d.label))
  .range([0, 2 * Math.PI])
  .padding(0.1);

const radius = d3.scaleLinear()
  .domain([0, d3.max(data, d => d.value)])
  .range([innerRadius, outerRadius]);

// Background arcs
svg.selectAll('path.bg').data(data).join('path')
  .attr('class', 'bg')
  .attr('d', d3.arc()
    .innerRadius(innerRadius)
    .outerRadius(outerRadius)
    .startAngle(d => angle(d.label))
    .endAngle(d => angle(d.label) + angle.bandwidth())
    .padAngle(0.02).padRadius(innerRadius))
  .attr('fill', '#e2e8f0');

// Data arcs
svg.selectAll('path.bar').data(data).join('path')
  .attr('class', 'bar')
  .attr('data-label', d => d.label)
  .attr('d', d3.arc()
    .innerRadius(innerRadius)
    .outerRadius(d => radius(d.value))
    .startAngle(d => angle(d.label))
    .endAngle(d => angle(d.label) + angle.bandwidth())
    .padAngle(0.02).padRadius(innerRadius))
  .attr('fill', (d, i) => colors(i));

// Labels
svg.selectAll('text').data(data).join('text')
  .attr('transform', d => {
    const a = angle(d.label) + angle.bandwidth() / 2;
    const r = outerRadius + 14;
    return `rotate(${(a * 180 / Math.PI - 90)}) translate(${r},0) ${a > Math.PI ? 'rotate(180)' : ''}`;
  })
  .attr('text-anchor', d => {
    const a = angle(d.label) + angle.bandwidth() / 2;
    return a > Math.PI ? 'end' : 'start';
  })
  .attr('dy', '0.35em')
  .attr('font-size', '13px').attr('fill', '#1e293b')
  .text(d => `${d.label} (${d.value})`);
</script>
</body>
</html>
