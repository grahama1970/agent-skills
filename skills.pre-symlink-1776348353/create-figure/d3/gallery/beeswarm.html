<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beeswarm Plot</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Beeswarm Plot</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

function randn() { return Math.sqrt(-2 * Math.log(Math.random())) * Math.cos(2 * Math.PI * Math.random()); }

const groups = ["Batch A", "Batch B", "Batch C"];
const data = window.__INJECTED_DATA__ || [];
groups.forEach((g, gi) => {
  for (let i = 0; i < 40; i++) {
    data.push({group: g, value: 60 + gi * 12 + randn() * (8 + gi * 2)});
  }
});

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 24, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

const x = d3.scaleBand().domain(groups).range([margin.left, width - margin.right]).padding(0.3);
const y = d3.scaleLinear().domain(d3.extent(data, d => d.value)).nice().range([height - margin.bottom, margin.top]);

// Force simulation to dodge overlapping dots
const r = 5;
const simulation = d3.forceSimulation(data)
  .force('x', d3.forceX(d => x(d.group) + x.bandwidth() / 2).strength(1))
  .force('y', d3.forceY(d => y(d.value)).strength(1))
  .force('collide', d3.forceCollide(r + 1))
  .stop();

for (let i = 0; i < 120; i++) simulation.tick();

svg.selectAll('circle').data(data).join('circle')
  .attr('data-label', d => d.group)
  .attr('cx', d => d.x).attr('cy', d => d.y)
  .attr('r', r)
  .attr('fill', d => colors(d.group))
  .attr('fill-opacity', 0.7)
  .attr('stroke', d => colors(d.group))
  .attr('stroke-width', 1);

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).tickSizeOuter(0)).selectAll('text').attr('font-size', '16px');
svg.append('g').attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(6)).selectAll('text').attr('font-size', '16px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);
</script>
</body>
</html>
