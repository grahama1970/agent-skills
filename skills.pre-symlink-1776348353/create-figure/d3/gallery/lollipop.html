<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lollipop Chart</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Lollipop Chart</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [
  {label: "Memory", value: 92}, {label: "Figure", value: 88},
  {label: "Extractor", value: 85}, {label: "Dashboard", value: 82},
  {label: "Analytics", value: 78}, {label: "SPARTA", value: 75},
  {label: "Taxonomy", value: 68}, {label: "Music", value: 62}
].sort((a, b) => a.value - b.value);

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 40, bottom: 40, left: 120};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleSequential(d3.interpolateViridis).domain([0, d3.max(data, d => d.value)]);

const y = d3.scaleBand().domain(data.map(d => d.label)).range([margin.top, height - margin.bottom]).padding(0.4);
const x = d3.scaleLinear().domain([0, d3.max(data, d => d.value)]).nice().range([margin.left, width - margin.right]);

// Stems
svg.selectAll('line.stem').data(data).join('line')
  .attr('class', 'stem')
  .attr('x1', margin.left).attr('x2', d => x(d.value))
  .attr('y1', d => y(d.label) + y.bandwidth() / 2)
  .attr('y2', d => y(d.label) + y.bandwidth() / 2)
  .attr('stroke', '#94a3b8').attr('stroke-width', 2);

// Dots
svg.selectAll('circle').data(data).join('circle')
  .attr('data-label', d => d.label)
  .attr('cx', d => x(d.value))
  .attr('cy', d => y(d.label) + y.bandwidth() / 2)
  .attr('r', 8)
  .attr('fill', d => colors(d.value))
  .attr('stroke', '#fff').attr('stroke-width', 2);

// Value labels
svg.selectAll('text.val').data(data).join('text')
  .attr('class', 'val')
  .attr('x', d => x(d.value) + 16)
  .attr('y', d => y(d.label) + y.bandwidth() / 2 + 5)
  .attr('font-size', '13px').attr('fill', '#64748b')
  .text(d => d.value);

svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).tickSizeOuter(0)).selectAll('text').attr('font-size', '14px');
svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).ticks(5)).selectAll('text').attr('font-size', '14px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);
</script>
</body>
</html>
