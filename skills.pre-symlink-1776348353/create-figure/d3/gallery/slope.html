<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before and After</title>
<style>
  body {
    background: #111;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .canvas-header {
    padding: 24px 32px 12px;
    flex-shrink: 0;
  }
  .canvas-title {
    font-size: 28px;
    font-weight: 700;
  }
  .canvas-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 32px 32px;
    overflow: hidden;
    animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #chart { width: 100%; height: 100%; }
  /* Override D3 axis/tick colors for dark theme */
  .domain, .tick line { stroke: #475569 !important; }
  .tick text { fill: #e2e8f0 !important; }
  text { fill: #e2e8f0; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Before and After</div></div>
<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [{"label": "Metric A", "start": 30, "end": 55}, {"label": "Metric B", "start": 60, "end": 45}, {"label": "Metric C", "start": 25, "end": 70}, {"label": "Metric D", "start": 50, "end": 35}];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 140, bottom: 40, left: 140};

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`);

const allVals = data.flatMap(d => [d.start, d.end]);
const y = d3.scaleLinear()
  .domain([d3.min(allVals) * 0.8, d3.max(allVals) * 1.1])
  .range([height - margin.bottom, margin.top]);

const xLeft = margin.left;
const xRight = width - margin.right;
const colors = d3.scaleOrdinal(d3.schemeTableau10);

// Column headers
svg.append('text').attr('x', xLeft).attr('y', margin.top - 12)
  .attr('text-anchor', 'middle').attr('font-size', '18px')
  .attr('fill', '#94a3b8').attr('font-weight', '600').text('Before');
svg.append('text').attr('x', xRight).attr('y', margin.top - 12)
  .attr('text-anchor', 'middle').attr('font-size', '18px')
  .attr('fill', '#94a3b8').attr('font-weight', '600').text('After');

data.forEach((d, i) => {
  // Slope line
  svg.append('line')
    .attr('x1', xLeft).attr('y1', y(d.start))
    .attr('x2', xLeft).attr('y2', y(d.start))
    .attr('stroke', colors(i)).attr('stroke-width', 3)
    .transition().duration(800).ease(d3.easeCubicOut)
    .attr('x2', xRight).attr('y2', y(d.end));

  // Left dot + label
  svg.append('circle').attr('cx', xLeft).attr('cy', y(d.start))
    .attr('r', 5).attr('fill', colors(i));
  svg.append('text').attr('x', xLeft - 10).attr('y', y(d.start) + 5)
    .attr('text-anchor', 'end').attr('font-size', '14px').attr('fill', '#e2e8f0')
    .text(`${d.label} (${d.start})`);

  // Right dot + label
  svg.append('circle').attr('cx', xRight).attr('cy', y(d.end))
    .attr('r', 5).attr('fill', colors(i));
  svg.append('text').attr('x', xRight + 10).attr('y', y(d.end) + 5)
    .attr('text-anchor', 'start').attr('font-size', '14px').attr('fill', '#e2e8f0')
    .text(`${d.label} (${d.end})`);
});

</script>
</body>
</html>
