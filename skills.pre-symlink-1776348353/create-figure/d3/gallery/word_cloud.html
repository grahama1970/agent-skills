<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Cloud</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Word Cloud</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import cloud from "https://cdn.jsdelivr.net/npm/d3-cloud@1/+esm";

const words = window.__INJECTED_DATA__ || [
  {text: "Memory", size: 90}, {text: "Extractor", size: 75}, {text: "Analytics", size: 68},
  {text: "SPARTA", size: 65}, {text: "Dashboard", size: 60}, {text: "Taxonomy", size: 55},
  {text: "Figure", size: 80}, {text: "Music", size: 50}, {text: "Voice", size: 48},
  {text: "Persona", size: 58}, {text: "Story", size: 45}, {text: "Monitor", size: 62},
  {text: "Scheduler", size: 42}, {text: "Orchestrate", size: 70}, {text: "Plan", size: 52},
  {text: "Assess", size: 56}, {text: "Review", size: 50}, {text: "Claude", size: 65},
  {text: "Dogpile", size: 44}, {text: "Lean4", size: 40}, {text: "Movie", size: 55},
  {text: "Chutes", size: 38}, {text: "RunPod", size: 36}, {text: "Docker", size: 42},
  {text: "Embedding", size: 52}, {text: "Training", size: 48}
];

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;

const colors = d3.scaleOrdinal(d3.schemeTableau10);

const layout = cloud()
  .size([width, height])
  .words(words.map(d => ({...d})))
  .padding(5)
  .rotate(() => (~~(Math.random() * 3) - 1) * 30)
  .font("system-ui")
  .fontSize(d => d.size)
  .on("end", draw);

layout.start();

function draw(words) {
  d3.select('#chart').append('svg')
    .attr('viewBox', `0 0 ${width} ${height}`)
    .append('g').attr('transform', `translate(${width/2},${height/2})`)
    .selectAll('text').data(words).join('text')
    .attr('data-label', d => d.text)
    .attr('font-size', d => d.size + 'px')
    .attr('font-family', 'system-ui')
    .attr('font-weight', d => d.size > 60 ? 700 : 500)
    .attr('fill', (d, i) => colors(i))
    .attr('text-anchor', 'middle')
    .attr('transform', d => `translate(${d.x},${d.y}) rotate(${d.rotate})`)
    .text(d => d.text);
}
</script>
</body>
</html>
