<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contour Plot</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Contour Plot</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 24, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);

// Generate a 2D scalar field (two Gaussian peaks)
const n = 100, m = 80;
const values = window.__INJECTED_DATA__ ? window.__INJECTED_DATA__.map(d => d.value || d.z || d) : new Array(n * m);
for (let j = 0; j < m; j++) {
  for (let i = 0; i < n; i++) {
    const x = i / n, y = j / m;
    // Two peaks
    const g1 = Math.exp(-((x - 0.3) ** 2 + (y - 0.4) ** 2) / 0.02);
    const g2 = 0.7 * Math.exp(-((x - 0.7) ** 2 + (y - 0.6) ** 2) / 0.03);
    values[j * n + i] = g1 + g2;
  }
}

const contours = d3.contours().size([n, m]).thresholds(d3.range(0.05, 1, 0.05))(values);

const xScale = d3.scaleLinear().domain([0, n]).range([margin.left, width - margin.right]);
const yScale = d3.scaleLinear().domain([0, m]).range([height - margin.bottom, margin.top]);
const color = d3.scaleSequential(d3.interpolateMagma).domain([0, 1]);

svg.selectAll('path.contour').data(contours).join('path')
  .attr('class', 'contour')
  .attr('d', d3.geoPath(d3.geoIdentity().scale(
    (width - margin.left - margin.right) / n
  ).translate([margin.left, margin.top])))
  .attr('fill', d => color(d.value))
  .attr('fill-opacity', 0.6)
  .attr('stroke', d => color(d.value))
  .attr('stroke-width', 0.5);

// Axes
const xAxis = d3.scaleLinear().domain([0, 1]).range([margin.left, width - margin.right]);
const yAxis = d3.scaleLinear().domain([0, 1]).range([height - margin.bottom, margin.top]);

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(xAxis).ticks(8)).selectAll('text').attr('font-size', '14px');
svg.append('g').attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(yAxis).ticks(6)).selectAll('text').attr('font-size', '14px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);
</script>
</body>
</html>
