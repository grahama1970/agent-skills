[project]
name = "pi-skill-create-regressor"
version = "0.1.0"
description = "Train task-specific regression models from tabular data"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.24.0",
    "joblib>=1.3.0",
    "loguru>=0.7.2,<0.7.3",
    "numpy>=1.26.0",
    "optuna",
    "scikit-learn>=1.4.0",
    "typer>=0.16.0",
    "xgboost",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0.0"]
tuning = ["optuna>=3.5.0"]
all = ["xgboost>=2.0.0", "optuna>=3.5.0", "httpx>=0.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
