[project]
name = "voice-lab"
version = "0.3.0"
description = "Unified voice workbench: TTS quality eval, waveform visualization, RVC parameter sweep, PipeWire recording, follow-along sessions, and voice lesson packages"
requires-python = ">=3.10,<3.13"
dependencies = [
    "dbus-fast",
    "httpx>=0.24.0",
    "librosa",
    "loguru>=0.7.0,<0.7.3",
    "nisqa",
    "noisereduce>=3.0.0",
    "numpy>=1.24.0",
    "PySide6",
    "python-dotenv>=1.0.0",
    "resemblyzer",
    "rich>=13.0.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "typer>=0.9.0",
    "yt-dlp>=2026.2.4",
]

[project.scripts]
voice-lab = "voice_lab:app"

[project.optional-dependencies]
editor = [
    "pyside6>=6.6.0",
    "pyside6-addons>=6.6.0",
    "requests>=2.28.0",
    "dbus-fast>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
