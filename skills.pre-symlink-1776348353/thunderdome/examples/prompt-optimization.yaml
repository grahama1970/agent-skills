name: prompt-optimization
description: "Optimize LLM prompts via concurrent variant testing"

scoring:
  metric_path: "$.score"
  gate_threshold: 0.85
  direction: higher_better

convergence:
  max_rounds: 4
  plateau_window: 3
  plateau_epsilon: 0.03

strategies:
  - name: structured-cot
    model: sonnet
    timeout_s: 300
    prompt: |
      You are a prompt engineer. Create a structured chain-of-thought prompt.

      Task: {{ task_description }}
      Round: {{ round }}
      Best score: {{ best_score }}

      {% if diagnosis %}
      Previous diagnosis: {{ diagnosis }}
      {% endif %}

      Steps:
      1. Write a structured CoT prompt with step-by-step reasoning
      2. Evaluate against the ground truth using /prompt-lab eval
      3. Output JSON: {"score": <0-1>, "prompt_text": "...", "eval_details": {...}}

  - name: few-shot-examples
    model: sonnet
    timeout_s: 300
    prompt: |
      You are a prompt engineer. Create a few-shot prompt with examples.

      Task: {{ task_description }}
      Round: {{ round }}
      Best score: {{ best_score }}

      {% if diagnosis %}
      Previous diagnosis: {{ diagnosis }}
      {% endif %}

      Steps:
      1. Write a few-shot prompt with 3-5 representative examples
      2. Evaluate against the ground truth using /prompt-lab eval
      3. Output JSON: {"score": <0-1>, "prompt_text": "...", "eval_details": {...}}

  - name: role-based
    model: sonnet
    timeout_s: 300
    prompt: |
      You are a prompt engineer. Create a role-based system prompt.

      Task: {{ task_description }}
      Round: {{ round }}
      Best score: {{ best_score }}

      {% if diagnosis %}
      Previous diagnosis: {{ diagnosis }}
      {% endif %}

      Steps:
      1. Write a role-based prompt (persona + constraints + output format)
      2. Evaluate against the ground truth using /prompt-lab eval
      3. Output JSON: {"score": <0-1>, "prompt_text": "...", "eval_details": {...}}

reviewers:
  - name: brandon-bailey

variables:
  task_description: "Classify SPARTA QRA quality as PASS/WARN/FAIL"

dogpile_on_failure: true
memory_scope: prompt-lab
