[project]
name = "security-scan"
version = "0.1.0"
description = "Self-hosted security scanning orchestrator (SAST, deps, secrets)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0,<0.7.3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
