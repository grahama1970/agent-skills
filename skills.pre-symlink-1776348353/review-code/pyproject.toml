[project]
name = "review-code"
version = "0.1.0"
description = "Multi-provider AI code review with unified diff output"
requires-python = ">=3.11,<3.13"

dependencies = [
    "httpx>=0.27.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "loguru>=0.7.0,<0.7.3",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["code_review.py", "config.py", "prompts.py", "utils.py", "diff_parser.py", "commands", "providers"]
