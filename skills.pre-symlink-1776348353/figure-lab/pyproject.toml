[project]
name = "figure-lab"
version = "0.1.0"
description = "Iterative D3 visualization composition, testing, and promotion lab"
requires-python = ">=3.10,<3.13"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "loguru>=0.7.0,<0.7.3",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
