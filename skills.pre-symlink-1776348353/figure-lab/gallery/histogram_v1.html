<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render a histogram for embry: Quality Scores</title>
<style>
        body {
            background: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .canvas-header {
            padding: 16px 24px 8px;
            flex-shrink: 0;
        }
        .canvas-title {
            font-size: 24px;
            font-weight: 700;
        }
        .canvas-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 24px 24px;
            overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #chart { width: 100%; height: 100%; }
        </style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Render a histogram for embry: Quality Scores</div></div>
<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = [{"label": "PASS", "value": 50}, {"label": "WARN", "value": 50}, {"label": "FAIL", "value": 50}];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 24, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`);

const values = data.map(d => d.value || d.x || d.y || 0);

const x = d3.scaleLinear()
  .domain(d3.extent(values)).nice()
  .range([margin.left, width - margin.right]);

const bins = d3.bin().domain(x.domain()).thresholds(x.ticks(20))(values);

const y = d3.scaleLinear()
  .domain([0, d3.max(bins, d => d.length)])
  .nice()
  .range([height - margin.bottom, margin.top]);

svg.selectAll('rect').data(bins).join('rect')
  .attr('x', d => x(d.x0) + 1)
  .attr('width', d => Math.max(0, x(d.x1) - x(d.x0) - 2))
  .attr('y', height - margin.bottom)
  .attr('height', 0)
  .attr('fill', 'steelblue')
  .attr('opacity', 0.75)
  .transition().duration(800).ease(d3.easeCubicOut)
  .attr('y', d => y(d.length))
  .attr('height', d => height - margin.bottom - y(d.length));

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).ticks(10))
  .selectAll('text').attr('font-size', '18px');

svg.append('g').attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(5))
  .selectAll('text').attr('font-size', '18px');

</script>
</body>
</html>
