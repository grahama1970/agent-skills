<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure Lab</title>
<style>
        body {
            background: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .canvas-header {
            padding: 16px 24px 8px;
            flex-shrink: 0;
        }
        .canvas-title {
            font-size: 24px;
            font-weight: 700;
        }
        .canvas-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 24px 24px;
            overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #chart { width: 100%; height: 100%; }
        </style>
</head>
<body>

<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = [{"label": "A", "value": 42}, {"label": "B", "value": 28}, {"label": "C", "value": 65}, {"label": "D", "value": 17}, {"label": "E", "value": 53}];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 24, bottom: 60, left: 100};

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`);

const groups = [...new Set(data.map(d => d.label || d.group || 'all'))];

const x = d3.scaleLinear()
  .domain(d3.extent(data, d => d.value || d.x || 0)).nice()
  .range([margin.left, width - margin.right]);

const y = d3.scaleBand()
  .domain(groups)
  .range([margin.top, height - margin.bottom])
  .padding(0.3);

const colors = d3.scaleOrdinal(d3.schemeTableau10);
const r = 4;

// Simple dodge: stack dots vertically within each band
groups.forEach(grp => {
  const pts = data.filter(d => (d.label || d.group || 'all') === grp)
    .sort((a, b) => (a.value || a.x || 0) - (b.value || b.x || 0));
  const cy = y(grp) + y.bandwidth() / 2;

  pts.forEach((d, i) => {
    svg.append('circle')
      .attr('cx', x(d.value || d.x || 0))
      .attr('cy', cy + (i % 3 - 1) * (r * 2.5))
      .attr('r', 0)
      .attr('fill', colors(grp))
      .attr('opacity', 0.7)
      .transition().duration(800).delay(i * 10).ease(d3.easeCubicOut)
      .attr('r', r);
  });
});

svg.append('g').attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).tickSizeOuter(0))
  .selectAll('text').attr('font-size', '18px');

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).ticks(8))
  .selectAll('text').attr('font-size', '18px');

</script>
</body>
</html>
