<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render a gauge for embry: Quality Comparison</title>
<style>
        body {
            background: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .canvas-header {
            padding: 16px 24px 8px;
            flex-shrink: 0;
        }
        .canvas-title {
            font-size: 24px;
            font-weight: 700;
        }
        .canvas-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 24px 24px;
            overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #chart { width: 100%; height: 100%; }
        </style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Render a gauge for embry: Quality Comparison</div></div>
<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = [{"label": "FAIL", "content coverage": 1.0, "section alignment": 1.0, "table fidelity": 0.0, "equation fidelity": 0.6, "ordering yx": 1.0, "figure fidelity": 0.0, "data quality": 1.0}];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const size = Math.min(rect.width || 400, rect.height || 400);

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${size} ${size * 0.65}`);

const g = svg.append('g').attr('transform', `translate(${size/2},${size * 0.55})`);
const radius = size * 0.4;
const val = data[0]?.value || data[0]?.y || 0;
const maxVal = data[0]?.max || 100;
const pct = Math.min(1, val / maxVal);

const arcBg = d3.arc()
  .innerRadius(radius * 0.7)
  .outerRadius(radius)
  .startAngle(-Math.PI / 2)
  .endAngle(Math.PI / 2);

const arcFg = d3.arc()
  .innerRadius(radius * 0.7)
  .outerRadius(radius)
  .startAngle(-Math.PI / 2);

g.append('path').attr('d', arcBg())
  .attr('fill', '#e2e8f0');

g.append('path')
  .attr('fill', pct > 0.8 ? '#22c55e' : pct > 0.5 ? '#eab308' : '#ef4444')
  .transition().duration(800).ease(d3.easeCubicOut)
  .attrTween('d', () => {
    const interp = d3.interpolate(-Math.PI / 2, -Math.PI / 2 + Math.PI * pct);
    return t => arcFg.endAngle(interp(t))();
  });

g.append('text')
  .attr('text-anchor', 'middle')
  .attr('y', -10)
  .attr('font-size', `${size * 0.12}px`)
  .attr('font-weight', '700')
  .attr('fill', '#1e293b')
  .text(`${(pct * 100).toFixed(0)}%`);

g.append('text')
  .attr('text-anchor', 'middle')
  .attr('y', size * 0.06)
  .attr('font-size', '18px')
  .attr('fill', '#64748b')
  .text(data[0]?.label || data[0]?.name || '');

</script>
</body>
</html>
