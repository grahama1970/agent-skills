[project]
name = "taxonomy"
version = "0.1.0"
description = "Federated Taxonomy tag extraction for multi-hop graph traversal"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.24.0",
    "joblib",
    "loguru>=0.7.0,<0.7.3",
    "numpy",
    "optuna",
    "python-arango>=8.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn",
    "transformers",
    "typer>=0.9.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
