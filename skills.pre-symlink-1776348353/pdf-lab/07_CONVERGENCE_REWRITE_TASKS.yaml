version: 1
kind: orchestrate-plan

metadata:
  title: "pdf-lab Convergence: Deterministic Coded Loop"
  goal: "Replace VLM-directed convergence with coded strategy sweep over body_font_size × header_ratio, scored by text + visual (multimodal embedding), storing winners as ArangoDB presets"
  plan_type: code
  created: "2026-04-01"
  primary_persona:
    name: "Nico Bailon"
    role: "Extraction QA Engineer"
    source: ".pi/agents/nico-bailon/AGENTS.md"

execution:
  max_concurrency: 2

capability_overlap:
  - "/pdf-lab REWRITE: convergence.py (596 LOC) — VLM-directed loop → deterministic strategy sweep"
  - "/fixture-tricky CALL: generates synthetic PDFs with ReportLab, ground_truth.json sidecar has exact answers"
  - "/embedding CALL: text backend :8602 POST /embed, multimodal backend :8603 POST /pooling for image embeddings"
  - "/memory (via graph_memory container :8601) CALL: POST /upsert to store presets collection"
  - "/best-practices-self-improvement-loop FOLLOW: coded loop pattern from classifier-lab"
  - "pdf_oxide extract_document() CALL: body_font_size_override + header_ratio_override params (wired in Rust this session)"
  - "compare.py REUSE: text scoring against ground truth already works"
  - "CREATE justification: strategy_sweep.py is new — no existing skill does deterministic parameter grid search for extraction tuning"

questions_blockers: []

lanes:
  - id: "0"
    label: "Wave 0: Strategy Definition"
  - id: "1"
    label: "Wave 1: Coded Loop"
  - id: "2"
    label: "Wave 2: Visual Scoring"
  - id: "3"
    label: "Wave 3: Preset Storage + Validation"

tasks:
  # === WAVE 0: Define the strategy grid ===
  - id: "1"
    title: "Create lib/strategies.py — pre-defined extraction parameter strategies"
    lane: "0"
    runner: "code-runner"
    backend: "sonnet"
    mode: "iterative"
    depends_on: []
    allowlist:
      - ".pi/skills/pdf-lab/lib/strategies.py"
    read_context:
      - ".pi/skills/pdf-lab/lib/compare.py"
      - ".pi/skills/best-practices-self-improvement-loop/SKILL.md"
    implementation:
      - "Create lib/strategies.py with a STRATEGIES list — ordered, deterministic, exhausted in sequence"
      - "Each strategy is a dict: {name, body_font_size_override, header_ratio_override, description}"
      - "Strategy order (from best-practices-self-improvement-loop — try cheapest first):"
      - "  1. baseline: {body_font_size_override: None, header_ratio_override: None} — default pdf_oxide"
      - "  2-8. header_ratio sweep: [1.05, 1.1, 1.15, 1.2, 1.3, 1.5, 2.0] with default body_font_size"
      - "  9-13. body_font_size sweep: [8.0, 9.0, 10.0, 11.0, 12.0] with best header_ratio from step 2-8"
      - "  14-18. grid refinement: best_body ± 0.5 × best_ratio ± 0.05 (5 combos)"
      - "Function: generate_strategies(baseline_median: float | None = None) -> list[dict]"
      - "  If baseline_median is provided, center the body_font_size sweep around it"
      - "Function: strategy_grid(ratios: list[float], sizes: list[float]) -> list[dict]"
      - "  For grid search phase — returns all combos"
      - "Max 60 lines"
    definition_of_done:
      command: "cd /home/graham/workspace/experiments/pi-mono/.pi/skills/pdf-lab && python3 -c \"from lib.strategies import generate_strategies; s = generate_strategies(); print(f'strategies={len(s)}'); assert len(s) >= 10; assert s[0]['name'] == 'baseline'\""
      assertion: "At least 10 strategies, first is baseline"

  # === WAVE 1: Rewrite the convergence loop ===
  - id: "2"
    title: "Rewrite lib/convergence.py — deterministic coded loop replacing VLM-directed"
    lane: "1"
    runner: "code-runner"
    backend: "opus"
    mode: "iterative"
    depends_on: ["1"]
    allowlist:
      - ".pi/skills/pdf-lab/lib/convergence.py"
    read_context:
      - ".pi/skills/pdf-lab/lib/strategies.py"
      - ".pi/skills/pdf-lab/lib/compare.py"
      - ".pi/skills/best-practices-self-improvement-loop/SKILL.md"
    implementation:
      - "REWRITE convergence.py following best-practices-self-improvement-loop pattern exactly"
      - "Keep the existing dataclasses: Adjustment, RoundResult, ConvergenceResult (public API)"
      - "DELETE: _call_vlm(), _build_vlm_prompt(), _render_pages(), _get_font_info() — all VLM code"
      - "DELETE: _identify_mismatch_pages(), _format_category_detail() — VLM helpers"
      - "NEW run_convergence() flow:"
      - "  1. Pre-flight: verify fixture_pdf exists, ground_truth.json exists, pdf_oxide importable"
      - "  2. Get baseline median font size from pdf_oxide (one extract call)"
      - "  3. Generate strategies from lib/strategies.py using baseline_median"
      - "  4. FOR strategy IN strategies (deterministic, ordered):"
      - "     a. overrides = {body_font_size_override: s.body_font_size, header_ratio_override: s.header_ratio}"
      - "     b. result = compare(fixture_pdf, ground_truth, overrides=overrides)"
      - "     c. text_score = result['overall_score']"
      - "     d. Append to round_history, write to disk IMMEDIATELY (rule 6)"
      - "     e. If text_score >= target_score: CONVERGED — break"
      - "     f. Log: strategy name, score, delta vs previous best"
      - "  5. After loop: return ConvergenceResult with best strategy, all rounds, converged flag"
      - "  6. Write convergence_audit.json to fixture_pdf.parent with full audit trail"
      - "Keep under 200 lines (was 596 — VLM code was 400 lines of bloat)"
    definition_of_done:
      command: "cd /home/graham/workspace/experiments/pi-mono/.pi/skills/pdf-lab && python3 -c \"from lib.convergence import run_convergence, ConvergenceResult; print('import OK')\""
      assertion: "Imports without error"

  # === WAVE 2: Visual scoring via multimodal embedding ===
  - id: "3"
    title: "Create lib/visual_score.py — cosine similarity between page image and extracted text embeddings"
    lane: "2"
    runner: "code-runner"
    backend: "sonnet"
    mode: "iterative"
    depends_on: []
    allowlist:
      - ".pi/skills/pdf-lab/lib/visual_score.py"
    read_context:
      - ".pi/skills/embedding/SKILL.md"
    implementation:
      - "Create lib/visual_score.py with functions:"
      - "  embed_text(text: str) -> list[float]: POST http://localhost:8602/embed {text: text} → embedding (384d)"
      - "  embed_image(image_path: Path) -> list[float]: POST http://localhost:8603/pooling with base64 PNG → mean-pool token vectors (2048d)"
      - "  visual_score(image_path: Path, extracted_text: str) -> float:"
      - "    - Embed both via multimodal backend (:8603) so they're in same vector space"
      - "    - For text: POST /v1/embeddings with model Qwen/Qwen3-VL-Embedding-2B, input=[text]"
      - "    - For image: POST /pooling with base64 PNG in messages"
      - "    - Cosine similarity between the two vectors"
      - "    - Return float 0..1"
      - "  score_extraction(fixture_pdf: Path, ground_truth: dict, extracted_sections: list) -> float:"
      - "    - Render fixture pages via /pdf-screenshot or pdf_oxide"
      - "    - For each page with sections: visual_score(page_image, extracted_text)"
      - "    - Return mean visual score across pages"
      - "Use httpx with 30s timeout, graceful fallback to 0.0 if embedding service unavailable"
      - "Max 80 lines"
    definition_of_done:
      command: "cd /home/graham/workspace/experiments/pi-mono/.pi/skills/pdf-lab && python3 -c \"from lib.visual_score import visual_score; print('import OK')\""
      assertion: "Imports without error"

  - id: "4"
    title: "Wire visual scoring into convergence loop as secondary gate"
    lane: "2"
    runner: "code-runner"
    backend: "sonnet"
    mode: "iterative"
    depends_on: ["2", "3"]
    allowlist:
      - ".pi/skills/pdf-lab/lib/convergence.py"
    read_context:
      - ".pi/skills/pdf-lab/lib/visual_score.py"
      - ".pi/skills/pdf-lab/lib/strategies.py"
    implementation:
      - "In convergence.py, after text_score computation (step 4c), add:"
      - "  v_score = score_extraction(fixture_pdf, gt, extracted_sections) if visual_gate else 0.0"
      - "  combined = text_score * 0.7 + v_score * 0.3  (text-weighted, visual is reality check)"
      - "  Use combined score for gate check"
      - "  Store both text_score and visual_score in RoundResult"
      - "  visual_gate parameter defaults to False (opt-in, requires embedding service)"
      - "Add visual_gate: bool = False to run_convergence() signature"
    definition_of_done:
      command: "cd /home/graham/workspace/experiments/pi-mono/.pi/skills/pdf-lab && python3 -c \"from lib.convergence import run_convergence; import inspect; sig = inspect.signature(run_convergence); assert 'visual_gate' in sig.parameters; print('visual_gate param exists')\""
      assertion: "visual_gate parameter exists in run_convergence"

  # === WAVE 3: Preset storage + end-to-end validation ===
  - id: "5"
    title: "Create lib/preset_store.py — store converged params as ArangoDB preset"
    lane: "3"
    runner: "code-runner"
    backend: "sonnet"
    mode: "iterative"
    depends_on: []
    allowlist:
      - ".pi/skills/pdf-lab/lib/preset_store.py"
    read_context:
      - ".pi/skills/embedding/SKILL.md"
    implementation:
      - "Create lib/preset_store.py with function:"
      - "  store_preset(name: str, params: dict, source_doc: str, score: float, audit: dict) -> str:"
      - "    POST to graph_memory container :8601 /upsert with:"
      - "    collection: 'presets'"
      - "    documents: [{"
      - "      _key: f'pdf_extraction_{name}'"
      - "      type: 'pdf_extraction'"
      - "      title: f'PDF Extraction: {name}'"
      - "      params: {body_font_size_override, header_ratio_override, ...}"
      - "      tags: ['pdf_extraction', 'converged', source_doc]"
      - "      taxonomy: {domain: ['Code'], function: ['Fix']}"
      - "      score: score"
      - "      audit: {rounds, best_strategy, convergence_date}"
      - "    }]"
      - "    Return the preset _key"
      - "  load_preset(name: str) -> dict | None:"
      - "    POST /recall/by-keys with collection='presets', keys=[f'pdf_extraction_{name}']"
      - "    Return params dict or None"
      - "Use httpx to localhost:8601 (graph_memory container), NOT via memory daemon socket"
      - "Actually — use the memory daemon socket at /run/user/1000/embry/memory.sock for consistency"
      - "Max 50 lines"
    definition_of_done:
      command: "cd /home/graham/workspace/experiments/pi-mono/.pi/skills/pdf-lab && python3 -c \"from lib.preset_store import store_preset, load_preset; print('import OK')\""
      assertion: "Imports without error"

  - id: "6"
    title: "Wire preset storage into convergence — on converge, store preset; on halt, write audit"
    lane: "3"
    runner: "code-runner"
    backend: "sonnet"
    mode: "iterative"
    depends_on: ["2", "5"]
    allowlist:
      - ".pi/skills/pdf-lab/lib/convergence.py"
    read_context:
      - ".pi/skills/pdf-lab/lib/preset_store.py"
    implementation:
      - "In convergence.py, after the loop:"
      - "  If converged: call store_preset(fixture_id, best_params, source_doc, best_score, audit)"
      - "  Always: write convergence_audit.json with full audit trail to fixture dir"
      - "  Add preset_key to ConvergenceResult if stored"
    definition_of_done:
      command: "grep -c 'store_preset' /home/graham/workspace/experiments/pi-mono/.pi/skills/pdf-lab/lib/convergence.py"
      assertion: "At least 1 call to store_preset"

  - id: "7"
    title: "End-to-end: generate fixture, run coded convergence, verify preset stored"
    lane: "3"
    runner: "local"
    backend: ""
    mode: ""
    depends_on: ["4", "6"]
    command: |
      cd /home/graham/workspace/experiments/pi-mono/.pi/skills/pdf-lab &&
      echo "=== Generate fixture ===" &&
      cd /home/graham/workspace/experiments/pi-mono/.pi/skills/fixture-tricky &&
      uv run gen_cli.py single numbered-sections-as-text --output /tmp/convergence_test.pdf 2>&1 | tail -3 &&
      echo "=== Run convergence ===" &&
      cd /home/graham/workspace/experiments/pi-mono/.pi/skills/pdf-lab &&
      uv run pdf_lab.py tune-gt /tmp/convergence_test.pdf -g /tmp/convergence_test_ground_truth.json --max-rounds 5 --target 0.8 2>&1 | tail -10 &&
      echo "=== Check audit trail ===" &&
      cat /tmp/convergence_audit.json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'rounds={len(d.get(\"rounds\",[]))} best_score={d.get(\"best_score\",0)} converged={d.get(\"converged\",False)}')" &&
      echo "=== Check preset ===" &&
      curl -sf http://localhost:8601/recall/by-keys -X POST -H 'Content-Type: application/json' \
        -d '{"collection":"presets","keys":["pdf_extraction_convergence_test"],"return_fields":["_key","type","params","score"]}' | python3 -c "import sys,json; d=json.load(sys.stdin); docs=d.get('documents',[]); print(f'preset stored: {len(docs) > 0}')" 2>/dev/null &&
      echo "CONVERGENCE LOOP VALIDATED"
    definition_of_done:
      command: "test -f /tmp/convergence_audit.json && python3 -c \"import json; d=json.load(open('/tmp/convergence_audit.json')); assert len(d.get('rounds',[])) >= 1\" && echo OK"
      assertion: "Audit trail exists with at least 1 round"
