[project]
name = "pdf-lab"
version = "1.0.0"
description = "Self-improving PDF extraction convergence loop with pipeline write-back"
dependencies = [
    "pdf_oxide",
    "reportlab>=4.0.0",
    "typer>=0.9.0",
    "loguru>=0.7.0,<0.7.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "PySide6>=6.6.0",
]

requires-python = ">=3.10,<3.13"

[project.scripts]
pdf-lab = "pdf_lab:main"
