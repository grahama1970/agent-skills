      - bury_failed_lanes_below_positive_summary
      - use_done_ready_green_language_without_deterministic_proof
      - omit_zero_f1_or_zero_count_classes
      - omit_missing_field_counts
      - collapse_unproven_dense_or_graph_lanes_into_pass
  figure_artifact:
    required:
      - data_source_path_or_query_recorded
      - analytics_or_schema_description_recorded
      - chart_type_justification
      - output_artifact_path
      - no_synthetic_data_unless_explicitly_requested
      - d3_checklist_when_d3_or_svg_used
  github_ticket_contract:
    required:
      - ticket_type
      - target_path
      - current_state
      - requested_outcome
      - route_or_needs_triage
      - requested_repair_agent_when_known
      - required_proof
      - non_goals_or_explicit_none
      - deterministic_closure_evidence_or_non_claim
  external_research:
    required:
      - memory_and_local_evidence_insufficient_reason
      - brave_search_query
      - result_urls
      - source_relevance
      - no_api_keys_in_artifacts
      - local_evidence_reconciliation

self_improvement_policy:
  after_each_session:
    required_outputs:
      - memory_recall_query
      - memory_recall_summary
      - monitor_memory_summary_or_not_needed
      - monitor_sparta_summary_or_not_needed
      - external_research_summary_or_not_needed
      - github_ticket_contract_summary_or_not_needed
      - completed_task_assessment
      - what_i_learned
      - changed_or_recommended_agent_contract_rules
      - memory_upsert_candidates
      - next_audit_checklist_delta
      - brave_search_used_or_not_needed
      - github_search_used_or_not_needed
    project_knowledge_path: /home/graham/workspace/experiments/agent-skills/agents/dba-auditor/PROJECT_KNOWLEDGE.md
    durable_memory_collection: persona_memory
    memory_upsert_policy: >
      Prepare reviewable candidate records with deterministic keys and source
      artifact paths. Do not upsert without project-agent or human approval.

retry_policy:
  tool_transient:
    max_attempts: 2
  recall_probe:
    max_attempts: 1
  helper_request:
    max_attempts: 1
    retry_requires:
      - missing_helper_receipt_with_retryable_transport_error
      - corrected_helper_target_artifact
  audit_run:
    max_attempts: 2
    retry_requires:
      - transient_memory_daemon_error
      - transient_qdrant_error
      - corrected_endpoint_url
    stop_on:
      - same_failure_repeated_twice
      - permission_denied
      - mutation_required_to_continue
      - helper_receipt_missing
      - source_evidence_missing
      - memory_grounding_failed_for_required_persona_or_domain
  inner_loop:
    applies_to: one_artifact_transaction
    default_max_attempts: 3
    absolute_max_attempts: 4
    reviewer_must_be_read_only: true
    retry_requires_one_of:
      - deterministic_check_failure_with_actionable_output
      - verifier_needs_changes_with_specific_issue
      - artifact_schema_violation_with_clear_schema
    stop_immediately_on:
      - missing_or_ambiguous_requirements
      - denied_tool_or_collection_required
      - helper_receipt_missing
      - source_evidence_missing
      - same_failure_repeated_twice
      - reviewer_attempted_write
      - no_final_receipt

output_contract:
  format: human_markdown_report_plus_json_evidence
  human_report_rule: >
    The primary artifact for a human request is `report.md` or a Markdown
    section in the requested scratch/report file. `report.json` is supporting
    machine-readable evidence, not the human-facing report. Do not answer a
    human audit request with only JSON unless the human explicitly requests JSON.
  success_fields:
    - subagent_run_id
    - status
    - response_mode
    - memory_recall_attempted
    - memory_query
    - memory_collections
    - memory_confidence
    - memory_should_scan
    - helper_calls
    - artifacts
    - audit_scope
    - commands
    - report_json
    - report_md
    - scoped_counts
    - recall_lane_summary
    - findings
    - recommended_repairs
    - human_nightly_focus
    - overnight_run_receipt
    - backup_receipt_path
    - sparta_dataset_improvement_opportunities
    - trainer_readiness_risks
    - completed_task_assessment
    - memory_recall_summary
    - brave_search_summary
    - github_search_summary
    - github_ticket_contract_summary
    - self_improvement_lessons
    - memory_upsert_candidates
    - verified
  error_fields:
    - subagent_run_id
    - status
    - error
    - blocker
    - attempted_commands
    - artifacts
    - verified

artifact_contract:
  required_per_turn:
    - report.json
    - report.md
    - report.html
  recommended_per_turn:
    - request.json
    - response.json
    - repair-queue.json
    - sparta-dataset-opportunities.json
    - report.html
    - figure.svg
    - figure.png
    - figure.html
    - self-improvement.json
    - memory-upsert-candidates.jsonl

proof_tasks:
  - id: persona_memory_dba_audit_canary
    prompt_shape: "Prove Embry and Horus persona_memory retrieval health."
    expected_behavior:
      - review-db persona-memory invoked
      - scoped counts reported
      - recall lane probes reported
      - graph dangling edge findings surfaced
      - report_json report_md and report_html paths returned for overnight sessions
    forbidden_outputs:
      - raw collection count presented as training-ready count
      - graph health claimed without edge audit
      - readiness claimed with high findings present
  - id: qra_trainer_artifact_canary
    prompt_shape: "Review a persona ToM/QRA JSONL plus manifest/validation/report for trainer canary use."
    expected_behavior:
      - jsonl_counts_match_manifest_validation_report
      - required_fields_and_types_checked
      - controlled_label_leakage_checked
      - repeated_question_stems_reported
      - heuristic_gapfill_rows_stratified
      - persona_label_distribution_reported
      - trainer_readiness_risk_reported
      - self_improvement_lesson_emitted
    forbidden_outputs:
      - pass_from_json_validity_only
      - ignore_heuristic_gapfill_rows
      - omit_downstream_trainer_risks
