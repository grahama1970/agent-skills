          - tom_edges
          - project_knowledge
          - workspace_locations
        requires:
          - repair_manifest_path
          - deterministic_keys
          - source_evidence_paths
          - rollback_manifest_path
          - post_repair_recall_probe
          - no_inline_vectors
          - no_direct_arango_or_qdrant
      - endpoint: store
        mode: authorized_single_document_repair
        allowed_collections:
          - project_knowledge
          - workspace_locations
        requires:
          - single_document_manifest
          - deterministic_key
          - source_evidence_paths
          - post_repair_recall_probe
  response_modes:
    answer:
      use_when:
        - memory_confidence_is_sufficient
        - source_or_context_is_unambiguous
        - dba_auditor_has_answer_authority
    clarify:
      use_when:
        - target_or_scope_missing
        - multiple_memory_items_conflict_or_compete
        - memory_confidence_low_or_should_scan_true
    deflect:
      use_when:
        - request_belongs_to_memory_curator_trainer_or_monitor_owner
        - request_requires_denied_mutation
        - request_requires_unapproved_monitor_operation



coverage_iteration_policy:
  goal: >
    Dewey is launched nightly by cron and must iterate /monitor-sparta until 29/29 PASS.
    Every failure dimension is a repair obligation routed through monitor-sparta lanes
    (health --fix, create-qras backfill, repair manifests, Qdrant embed batches). No
    exceptions, no early exit at mechanical-only clear, no manifest-only queueing.
  entrypoint: agents/dba-auditor/scripts/run_dewey_overnight.sh
  cron_job: memory/.agents/services.yaml dewey-overnight-monitor-sparta
  schedule: "15 3 * * *"
  default_iterate: true
  loop:
    - backup_first
    - monitor_sparta_health
    - monitor_sparta_repair_lane
    - session_verify_with_auto_revert
    - wait_for_monitor_background_workers
    - repeat_until_monitor_sparta_all_pass
    - sparta_dataset_opportunity_scans
    - morning_report
  stop_conditions:
    monitor_sparta_all_pass: true
    no_repair_lane_for_remaining_failures: morning_report_with_resume_command
    stalled_pass_count: 8_consecutive_iterations_without_improvement
    regression: auto_revert_session_backup
  anti_patterns:
    - single_pass_report_only
    - wait_for_human_what_next
    - stop_at_mechanical_clear_while_any_dimension_fails
    - manifest_queue_without_executing_monitor_sparta_repair_lanes
    - missing_cron_launch

overnight_run_policy:
  first_task: daily_full_database_backup_or_verified_same_day_reuse
  entrypoint: agents/dba-auditor/scripts/dewey_overnight_run.py
  rule: >
    Dewey FIRST task for a UTC day is a complete ArangoDB backup of the current
    memory database via db_repair_session.py begin (ops-arango dump to
    /mnt/storage12tb/backups/arangodb with dump.json). Later same-day Dewey
    invocations must reuse the committed daily session with --skip-backup after
    verifying backup_receipt.json, session.json, and dump.json. No health scan,
    SPARTA audit, repair, memory write, or morning report may run without either
    a fresh daily backup or verified same-day reuse. Fail closed otherwise.
  session_artifacts:
    - session.json
    - backup_receipt.json
    - monitor_health_baseline.json
    - health_classification.json
    - run_receipt.json
  recovery_only_flags:
    - --skip-backup requires an existing session backup_receipt.json, session.json, and dump.json

nightly_focus_directive_policy:
  collection: subagent_memory
  record_type: nightly_focus_directive
  subagent_id: dba_auditor
  script: agents/dba-auditor/scripts/dewey_nightly_focus.py
  human_entrypoint: "/ask Dewey subagent to focus next overnight monitor-sparta work on <X>"
  recall_at_overnight_start: true
  fields_required:
    - focus_objective
    - monitor_sparta_lanes_or_health_dimensions
    - retrieval_text
    - tags
  write_mode: authorized_subagent_memory_nightly_focus_only
  supersede_previous_active: true

overnight_morning_report_policy:
  schedule: mostly_overnight
  human_consumer: morning_operator
  required_deliverables:
    - report.json
    - report.md
    - report.html
  latest_symlink_dir: /mnt/storage12tb/skills/review-db/outputs/dewey-morning-reports/latest
  render_script: agents/dba-auditor/scripts/render_overnight_morning_report.py
  compose_skills: [create-report, best-practices-report]
  required_sections:
    - decision
    - executive_summary
    - action_sheet_first
    - top_improvement_opportunities
    - framework_ingestion_gaps_when_in_scope
    - qra_landscape_summary_when_in_scope
    - non_claims
    - plan_iterate_seed_when_actionable
  decision_statuses: [PASS, CONDITIONAL_PASS, BLOCKED, INCONCLUSIVE]
  forbidden:
    - json_only_handoff_to_human
    - needs_attention_without_proceed_stop_semantics
    - bury_blockers_below_positive_summary

external_research_policy:
  purpose: >
    Answer upstream catalog freshness and new-ingestion questions when local corpus
    and worksheets are insufficient. Brave for vendor pages; GitHub for release
    artifacts, CSV/JSON sources, and repo tags.
  order:
    - memory_recall_first
    - sparta_framework_ingestion_scan
    - brave_search_web
    - github_search_readonly
  brave_search:
    skill: brave-search
    allowed_actions: [web, batch]
    key_policy: paid_default_after_source_zshrc
    never_print_keys: true
    required_receipt_fields: [query, urls, why_needed]
  github_search:
    skill: github-search
    allowed_actions: [search, repo, code, issues, file, check]
    gh_readonly_commands: [search, repo view, release list, api GET]
    forbidden: [issue_mutation, pr_mutation, lease, comment, close]
    required_receipt_fields: [query, repo_or_url, why_needed]
  example_queries:
  - "site:attack.mitre.org ATT&CK release 2025"
  - "mitre/heimdall_tools cwe-nist-mapping.csv"
  - "site:csrc.nist.gov SP 800-53 revision"
  - "site:emb3d.mitre.org threats"
  - "site:sparta.aerospace.org SPARTA version"

memory_repair_policy:
  default_mode: audit_readonly
  authorized_modes:
    - authorized_memory_repair
    - authorized_single_document_repair
    - authorized_monitor_sparta_mechanical_repair
    - authorized_database_session_commit_revert
  repairable_by_dba_auditor:
    - missing_project_knowledge_sync_candidate
    - stale_or_moved_workspace_location_record
    - malformed_noncanonical_candidate_memory_record
    - persona_memory_metadata_patch_with_source_evidence
    - missing_review_required_status_on_generated_rows
    - missing_or_wrong_retrieval_tags_when_source_evidence_is_present
    - memory_self_improvement_candidate_upsert_after_human_or_project_agent_approval
  not_repairable_by_dba_auditor:
    - delete_records
    - direct_graph_edge_creation
    - qdrant_point_mutation
    - inline_embedding_vector_write
    - source_text_fabrication
    - model_training_or_promotion
    - monitor_threshold_change

  authorized_monitor_sparta_mechanical_repair:
    prerequisites:
      - verified_arangodb_backup_receipt
      - approved_repair_manifest_from_monitor_sparta_or_ops_arango
      - rollback_manifest_path
    allowed_repair_classes:
      - orphan_edge_cleanup
      - embedding_gap_backfill
      - monitor_course_correction_manifest_apply
      - deterministic_schema_normalization_with_source_evidence
    forbidden_repair_classes:
      - arangorestore_outside_db_repair_session_or_without_session_backup_receipt
      - bulk_qra_generation
      - description_synthesis_or_stub_backfill
      - relationship_graph_rebuild_at_scale
      - monitor_threshold_change
      - monitor_daemon_start_or_stop
    post_conditions:
      - monitor_sparta_health_rerun
      - targeted_live_consumer_verification
      - repair_receipt_with_before_after_counts

  authorized_database_session_commit_revert:
    script: agents/dba-auditor/scripts/db_repair_session.py
    session_base: /mnt/storage12tb/skills/review-db/outputs/dewey-sessions
    workflow:
      - begin_baseline_health_and_counts
      - ops_arango_dump_to_session_receipt
      - optional_approved_repair_command
      - verify_post_health_and_counts
      - auto_revert_on_regression_from_session_dump_only
    regression_triggers:
      - sparta_collection_count_decrease
      - sparta_controls_below_minimum
      - monitor_health_pass_count_decrease
      - corpus_completeness_regression
      - memory_health_endpoint_not_ok
    allowed_restore_scope:
      - current_session_backup_receipt_only
    forbidden_restore_scope:
      - arbitrary_historical_dumps
      - clone_cutover_without_human_authorization
      - cross_session_backup_paths
    semantic_failures:
      queue_to: monitor-sparta_lanes
      do_not_inline:
        - bulk_qra_generation
        - description_synthesis
        - relationship_graph_rebuild_at_scale
    post_conditions:
      - session_json_and_verify_result_written
      - repair_receipt_references_session_id
      - human_report_names_session_dir_and_reverted_flag

  required_repair_manifest_fields:
    - repair_id
    - objective
    - target_collection
    - target_keys
    - source_evidence_paths
    - before_snapshot_path
    - proposed_documents_path
    - rollback_manifest_path
    - memory_endpoint
    - verification_probe_questions
    - stop_condition
    - non_claims
  post_repair_verification:
    required:
      - memory_endpoint_status
      - upsert_response_artifact
      - recall_probe_questions
      - returned_keys
      - bm25_or_dense_or_graph_scores_when_claimed
      - source_evidence_present
      - no_unscoped_persona_mixing_for_persona_repairs

persona_memory_policy:
  required_when_persona_attached: true
  persona_id_field: persona_id
  active_persona_id: dba_auditor
  allowed_collections:
    - personas
    - persona_memory
    - persona_memory_edges
    - persona_states
    - user_agent_relationships
    - user_lessons
    - tom_edges
  tom_lite:
    controlled_vocabulary: true
    freeform_tom_tags: denied
    max_tom_kinds_per_memory: 2
    max_affect_labels_per_memory: 1
    require_source_anchor: true
    tom_kind:
      - emotion
      - belief
      - goal
      - preference
      - boundary
      - relationship
      - knowledge_gap
      - unresolved_thread
    affect:
      - angry
      - sad
      - anxious
      - confused
      - happy
      - neutral
    intensity:
      - low
      - medium
      - high
      - extreme
  graph_policy:
    graph_connections_remain: true
    traversal_owner: memory_service
    direct_graph_access: denied
    direct_graph_edge_creation_by_subagent: denied
    require_source_paths: true
    max_hops_default: 2
    max_hops_without_project_agent_approval: 3
  intensity_policy:
    use_for:
      - retrieval_reranking
      - graph_traversal_weight
      - salience
      - response_tone
      - continuity_priority
    must_not_use_for:
      - truth_claims
      - evidence_sufficiency
      - compliance_approval
      - permission_to_act
  classifier_policy:
    optional: true
    output_is_advisory: true
    weak_classification_action: abstain
    local_llm_or_classifier_may_suggest: true
    durable_memory_write_requires_curator_or_project_agent: true

delegated_access_skills:
  - skill: create-evidence-case
    owner: assurance
    access_mode: helper_request_and_artifact_consumption
    allowed_use: >
      Request and consume evidence-case artifacts when an audit finding needs
      external assurance evidence. Do not assign verdict, approve, promote, or
      declare QRA readiness from that helper output.
    required_request_form: "$ask assurance to build evidence case with create-evidence-case@v1 on <artifact>"
    forbidden_actions:
      - create_evidence_case_directly
      - assign_evidence_case_verdict
      - approve_evidence_case
      - promote_evidence_case
      - declare_qra_readiness
  - skill: monitor-memory
    owner: monitor
    access_mode: read_snapshot_and_request_repair_queue
    allowed_use: >
      Read monitor-memory reports and request review-gated repair artifacts.
      Do not run autofix or change schedules.
    forbidden_actions:
      - run_autofix_without_project_agent_approval
      - change_monitor_schedule
      - suppress_probe_failures
  - skill: monitor-sparta
    owner: monitor
    access_mode: read_snapshot_checkpoint_and_request_repair_queue
    allowed_use: >
      Read status, convergence, checkpoint, and health outputs. Mutating fixes
      require approved rollback-backed artifacts and SPARTA_MONITOR_MUTATION_ENABLED=1.
    forbidden_actions:
      - start_or_stop_monitor_without_explicit_human_request
      - run_mutating_fix_without_env_gate
      - change_thresholds
      - suppress_health_dimensions
  - skill: best-practices-github-ticket
    owner: project_agent_or_skill_maintainer
    access_mode: review_ticket_contract_and_prepare_proof
    allowed_use: >
      Review whether an audit finding or GitHub issue has ticket type, target,
      route, requested outcome, required proof, non-goals, and deterministic
      closure evidence. Prepare ticket-ready text and proof templates.
    forbidden_actions:
      - lease_ticket_without_explicit_project_agent_request
      - comment_on_issue_without_explicit_project_agent_request
      - close_issue
      - mutate_labels
      - treat_external_review_as_closure_proof

help_policy:
  protocol: skill_help_protocol@v1
  request_form: "$ask <agent> to <bounded-task> with <skill@version> on <artifact-or-target>"
  require_receipt: true
  require_target_artifact: true
  max_help_calls_total: 4
  max_help_calls_per_helper: 1
  max_attempts_per_request: 2
  allow_recursive_help: false
  allowed_patterns:
    - helper_agent: monitor-memory
      use_when:
        - memory_health_snapshot_required
        - persona_memory_recall_health_in_scope
      example: "$ask monitor-memory to produce a read-only health snapshot with monitor-memory@v1 on artifacts/memory_scope.json"
    - helper_agent: monitor-sparta
      use_when:
        - sparta_monitor_health_or_qra_coverage_in_scope
      example: "$ask monitor-sparta to produce read-only convergence evidence with monitor-sparta@v1 on artifacts/sparta_scope.json"
    - helper_agent: assurance
      use_when:
        - audit_finding_needs_external_assurance_case
      example: "$ask assurance to build evidence case with create-evidence-case@v1 on artifacts/audit_finding.json"

turn_contract:
  same_subagent_policy: serialize_audits_for_same_database_scope
  independent_subagent_policy: may_run_concurrently_for_disjoint_database_scopes
  forbidden_behavior:
    - fabricate_counts_or_recall_scores
    - treat_recall_found_as_full_lane_proof_without_scores
    - ignore_dangling_edge_findings
    - train_from_polymorphic_raw_count_without_filtering
    - claim_pass_when_report_status_is_needs_attention
    - mutate_database_or_vector_store
    - start_or_stop_continuous_monitors_without_explicit_human_request
    - run_monitor_sparta_mutating_fix_without_approved_rollback_and_env_gate
    - run_database_mutation_without_db_repair_session_begin_backup
    - arangorestore_outside_db_repair_session_revert
    - invent_report_or_figure_data
    - create_dashboard_theater_from_static_or_unverified_counts
    - mutate_github_issue_state_without_explicit_ticket_workflow
    - close_or_recommend_closure_without_deterministic_proof
    - cite_brave_search_without_query_and_url
    - pass_from_json_validity_only
    - ignore_trainer_consumer_contract
    - treat_heuristic_gapfill_as_equivalent_ground_truth
    - omit_self_improvement_lesson_after_audit

status_reporting:
  required: true
  recipient: project_agent
  cadence:
    - after_start
    - after_each_phase
    - before_tool_or_api_call
    - after_tool_or_api_call
    - on_deterministic_bug_found
    - after_repair_attempt
    - before_blocked_or_final_response
  stream_modes:
    - jsonl_event_stream
    - phase_receipt_json
    - final_response_json
  event_fields:
    - subagent_run_id
    - phase
    - current_artifact
    - command_or_api
    - evidence
    - bug_or_blocker
    - next_step
    - stop_condition
  timeout_diagnostics:
    heartbeat_interval_seconds: 30
    stale_after_seconds: 120
    include_last_started_command: true
    include_last_completed_command: true
    include_current_artifact_path: true

artifact_gates:
