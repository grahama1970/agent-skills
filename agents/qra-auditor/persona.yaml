    tier: bash.scoped_mutate
    allowed_commands:
      - rg
      - sed
      - cat
      - jq
      - python3
      - uv run python
      - uv run python /home/graham/workspace/experiments/memory/scripts/validation/subagent_approval_registry.py check
      - uv run python /home/graham/workspace/experiments/memory/scripts/validation/subagent_approval_registry.py decision
      - bash /home/graham/workspace/experiments/agent-skills/skills/scillm/run.sh
      - bash /home/graham/workspace/experiments/agent-skills/skills/ops-chutes/run.sh budget-check
      - bash /home/graham/workspace/experiments/agent-skills/skills/ops-chutes/run.sh can-complete
      - bash /home/graham/workspace/experiments/agent-skills/skills/ops-chutes/run.sh model-health
      - bash /home/graham/workspace/experiments/agent-skills/skills/create-qras/run.sh review
      - bash /home/graham/workspace/experiments/agent-skills/skills/create-qras/run.sh manifest
      - bash /home/graham/workspace/experiments/agent-skills/skills/review-prompt/run.sh review
      - python3 /home/graham/workspace/experiments/memory/scripts/validation/monitor_sparta.py qra-final-assessment
      - python3 /home/graham/workspace/experiments/agent-skills/agents/qra-auditor/scripts/qra_final_assessment_worker.py
    denied_commands:
      - rm -rf
      - git push
      - docker compose down
      - systemctl
      - crontab
      - monitor_sparta_broad_repair_loop
      - monitor_sparta_mutating_health_command
      - python scripts/validation/monitor_sparta.py start
      - python scripts/validation/monitor_sparta.py stop
      - huggingface-cli upload
      - arangosh
      - arangorestore
      - curl https://api.chutes.ai
  filesystem:
    read:
      allowed_globs:
        - /home/graham/workspace/experiments/agent-skills/agents/qra-auditor/**
        - /home/graham/workspace/experiments/agent-skills/skills/create-qras/**
        - /home/graham/workspace/experiments/agent-skills/skills/review-prompt/**
        - /home/graham/workspace/experiments/agent-skills/skills/scillm/**
        - /home/graham/workspace/experiments/agent-skills/skills/ops-chutes/**
        - /home/graham/workspace/experiments/memory/scripts/validation/**
        - /mnt/storage12tb/media/agents/shared/monitor-sparta/**
        - /mnt/storage12tb/skills/review-db/outputs/qra-auditor/**
      denied_globs: []
    write:
      allowed_globs:
        - /home/graham/workspace/experiments/agent-skills/agents/qra-auditor/**
        - /mnt/storage12tb/media/agents/shared/monitor-sparta/repair_queue.jsonl
        - /mnt/storage12tb/skills/review-db/outputs/qra-auditor/**
        - /tmp/qra-auditor*/**
      denied_globs:
        - /etc/**
        - /home/graham/workspace/experiments/memory/**
