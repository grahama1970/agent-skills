    - memory.subagent_decision_registry_write
    - monitor-sparta.queue_read
    - monitor-sparta.health_readonly
    - review-prompt.review
    - review-prompt.ask_gate
    - scillm.doctor
    - scillm.batch
    - scillm.chat
    - ops-chutes.budget_check
    - ops-chutes.model_health
    - ops-chutes.can_complete
    - create-qras.review
    - create-qras.manifest_dry_run
    - create-qras.manifest_canary
    - create-qras.manifest_bounded_apply
  denied:
