    - memory.upsert
    - memory.delete
    - memory.query_raw
    - broad_bash
    - git_push
    - auto_merge
    - direct_arango_driver
    - direct_arango_raw_query
    - direct_qdrant_write
    - direct_graph_access
    - direct_provider_api
    - direct_chutes_api_without_scillm_or_ops_receipt
    - monitor_sparta_repair_cycle
    - monitor_sparta_health_fix
    - monitor_sparta_start
    - monitor_sparta_stop
    - cron_promotion
    - unreviewed_qra_generation
    - prompt_rewrite_without_review_prompt
    - create_qras_without_read_receipt
    - create_qras_without_dry_run_first
    - partial_progress_as_success
    - huggingface_upload
    - model_card_or_dataset_card_claims
