memory_policy:
  allowed_endpoints:
    - intent
    - recall
    - answer
    - clarify
    - deflect
    - list
  denied_endpoints:
    - store
    - upsert
    - delete
    - raw_query
    - query_raw
  allowed_collections:
    - project_knowledge
    - lessons
    - checkpoints
    - subagent_approval_registry
    - subagent_approval_edges
    - subagent_memory
    - sparta_qra
    - sparta_qra_candidates
    - sparta_controls
    - sparta_relationships
    - sparta_url_knowledge
  preferred_collections:
    - sparta_qra
    - sparta_qra_candidates
    - sparta_controls
    - sparta_relationships
    - project_knowledge
    - lessons
  collection_access_contract:
    sparta_collections: read_only_recall_or_list_for_ledger_audit
    mutation: denied_unless_memory_pipeline_or_human_authorized_apply_gate
    rule: >
      QRA ledger audits may read SPARTA QRA, control, relationship, and source
      collections through Memory endpoints to check related approved QRAs,
      entity grounding, and crosswalk evidence. Qbert must not write those
      collections directly.
  denied_collections: []
  allowed_recall_profiles:
    - brief
    - evidence
  write_policy:
    default: denied
    exceptions:
      - collection: subagent_approval_registry
        via: /home/graham/workspace/experiments/memory/scripts/validation/subagent_approval_registry.py decision
        allowed_when:
          - qra_issue_blocked_by_missing_petey_approval
          - qra_issue_blocked_by_provider_or_manifest_gate
          - qra_issue_needs_human_review
      - collection: subagent_approval_edges
        via: /home/graham/workspace/experiments/memory/scripts/validation/subagent_approval_registry.py decision
      - collection: subagent_memory
        via: /home/graham/workspace/experiments/memory/scripts/validation/subagent_approval_registry.py decision

delegated_access_skills:
  - skill: review-prompt
    owner: prompt-reviewer
    access_mode: helper_request_and_artifact_consumption
    allowed_use: >
      Review prompt contracts, rendered fixtures, expected responses, validators,
      and consumer/schema evidence before QRA generation.
    required_request_form: "$ask prompt-reviewer to review QRA prompt contract with review-prompt@v1 on <prompt-contract-bundle>"
    forbidden_actions:
      - mutate_database
      - run_create_qras
      - approve_without_expected_response
  - skill: scillm
    owner: scillm-agent
    access_mode: executable_preflight_and_receipt_consumption
    allowed_use: >
      Verify proxy auth, QRA model pool health, batch surface, and Chutes-backed
      route availability before QRA spend.
    forbidden_actions:
      - bypass_scillm_proxy
      - hand_write_provider_calls
      - use_scillm_as_dag_runner
  - skill: ops-chutes
    owner: ops
    access_mode: budget_and_model_health_receipt_consumption
    allowed_use: >
      Check Chutes budget, model health, and feasibility before Chutes-backed QRA
      work. Provider calls still route through Scillm or create-qras.
    forbidden_actions:
      - direct_chutes_generation
      - exceed_chutes_concurrency
      - ignore_budget_check_failure
  - skill: create-qras
    owner: qra-generation
    access_mode: reviewed_manifest_execution
    allowed_use: >
      Run review, manifest dry-run, canary, and bounded apply for the claimed
      QRA issue after preflight gates pass.
    forbidden_actions:
      - generate_without_read_receipt
      - skip_manifest_review
      - skip_dry_run_before_apply
      - report_partial_progress_as_success
  - skill: tau
    owner: tau
    access_mode: dag_contract_and_receipt_consumption
    allowed_use: >
      Execute ledger-auditor model calls as Tau DAG nodes with immutable goal,
      retry limits, schema validation, and receipt readback. Qbert consumes Tau
      node receipts instead of direct provider responses.
    forbidden_actions:
      - prose_only_orchestration
      - bypass_tau_for_ledger_audit_model_call
      - ignore_tau_terminal_verdict
  - skill: brave-search
    owner: research-retrieval
    access_mode: bounded_context_read
    allowed_use: >
      Fetch current source context when a ledger-audit work order records that
      external source context is needed to judge reasonableness.
    forbidden_actions:
      - treat_search_snippet_as_answer_authority
      - use_brave_without_recording_query_and_receipt
  - skill: dogpile
    owner: research-retrieval
    access_mode: bounded_context_read
    allowed_use: >
      Fetch multi-source research context when the ledger or reviewer requires
      source triangulation beyond Memory related QRAs and Brave raw results.
    forbidden_actions:
      - treat_dogpile_synthesis_as_expert_verification
      - hide_degraded_or_skipped_sources
  - skill: llm-eval-lab
    owner: evaluation-quality
    access_mode: model_selection_eval
    allowed_use: >
      Run the 30-call seeded stratified model eval for the ledger-auditor prompt
      before making Chutes the default model for this lane.
    forbidden_actions:
      - hand_pick_only_easy_qras
      - score_infra_failures_as_model_accuracy
      - promote_model_without_schema_gate
  - skill: best-practices-prompt
    owner: engineering-standards
    access_mode: prompt_contract_rulebook
    allowed_use: >
      Check the ledger-auditor prompt for rationale, exact field paths, closed
      vocabulary, output schema, example, rejection criteria, and deterministic
      validation before review-prompt or llm-eval-lab runs.
    forbidden_actions:
      - vague_prompt_without_schema
      - prompt_without_review_payload

turn_contract:
  same_subagent_policy: serialized_only_when_same_qra_issue_or_manifest
  independent_subagent_policy: may_run_concurrently_only_when_claiming_different_queue_issues
  forbidden_behavior:
    - infer_workflow_from_prose_only_request
    - continue_without_dag_spec
    - run_more_than_one_queue_issue_per_invocation
    - run_unbounded_generation
    - self_promote_to_cron
    - accept_partial_generation_as_success

help_policy:
  protocol: skill_help_protocol@v1
  request_form: "$ask <agent> to <bounded-task> with <skill@version> on <artifact-or-target>"
  max_help_calls_total: 4
  max_help_calls_per_helper: 2
  max_attempts_per_request: 2
  allow_recursive_help: false
  allow_alternate_helper: false
  require_target_artifact: true
  require_terminal_event: true
  require_receipt: true
  allowed_patterns:
    - helper_agent: prompt-reviewer
      use_when:
        - prompt_contract_bundle_ready
        - expected_response_and_validator_present
      example: "$ask prompt-reviewer to review QRA prompt contract with review-prompt@v1 on artifacts/qra-auditor/<run_id>/prompt-contract"
    - helper_agent: scillm-agent
      use_when:
        - scillm_auth_or_batch_surface_uncertain
        - qra_model_pool_health_unknown
      example: "$ask scillm-agent to run scillm QRA pool preflight with scillm@v1 on artifacts/qra-auditor/<run_id>/provider-preflight"
  forbidden_behavior:
    - free_chat_with_helper
    - ask_helper_to_decide_global_readiness
    - continue_without_helper_receipt
    - treat_helper_response_as_runtime_proof

create_qras_read_receipt_contract:
  required_fields:
    - skill_path
    - line_count
    - sha256
    - selected_mode
    - execution_scope
    - backend_contract
    - execution_gate
    - json_repair_path
    - fail_fast_rule
  selected_modes:
    - native
    - relationship
    - standalone
    - auto
  execution_scopes:
    - smoke
    - canary
    - corpus_repair

qra_repair_policy:
  deterministic_vs_generative: bounded_gated_generation_repair
  default_limit: 1
  max_apply_limit_without_human: 25
  require_prompt_review: true
  require_manifest_review: true
  require_dry_run_before_apply: true
  require_canary_before_larger_batch: true
  preferred_corpus_batch_size: 100
  preferred_scillm_endpoint: /v1/scillm/batch/completions/stream
  preferred_model_pool: qra-deepseek-pool
  required_response_format:
    type: json_object
  stable_ids_required: true
  item_error_policy: fail_fast
  partial_progress_policy: not_success
  post_run_proof_required:
    - manifest_path
    - review_verdict
    - dry_run_command_result
    - write_command_result
    - generated_qra_count
    - controls_covered
    - skipped_job_count
    - failed_job_count
    - storage_collections
    - forbidden_field_absence_check
    - monitor_sparta_or_source_text_qra_gap_delta
    - qra_coverage_per_control_status
    - artifact_paths

memory_qra_pipeline_ledger_audit:
  owner: qra-auditor
  purpose: >
    Produce the agent-plausibility review for one QRA record by auditing the
    QRA's persisted `ledger` field. The ledger must contain the real Memory
    pipeline trace. Qbert reviews the trace; Qbert does not rerun or simulate
    the pipeline.
  input_contract:
    required_fields:
      - qra._key
      - qra.question
      - qra.ledger
      - qra.ledger.pipeline_steps
      - qra.ledger.intent
      - qra.ledger.final_action
    required_when_terminal_action_is_clarify_or_draft:
      - qra.ledger.human_checkpoint
    optional_context_fields:
      - review_context.memory_related_qras
      - review_context.brave_search_results
      - review_context.dogpile_report
    qra_ledger_field_rule: >
      Every QRA submitted for this lane must carry the complete Memory pipeline
      ledger as a field on the QRA object. Missing `qra.ledger` is a BLOCKER,
      not a prompt condition to work around.
  sequential_audit_order:
    - intent
    - entity_extraction
    - recall_context_selection
    - crosswalk_chain
    - policy_admission_gate
    - terminal_action
    - final_text
  audit_questions:
    intent: >
      Do I agree that `qra.ledger.intent` and `qra.ledger.final_action` follow
      from `qra.question`, `qra.ledger.query_plan`, and the intent pipeline step?
    entity_extraction: >
      Do I agree that accepted entities are grounded and invalid/unresolved
      terms are correctly marked in `qra.ledger.entities`,
      `qra.ledger.valid_entities`, `qra.ledger.invalid_terms`, and
      `qra.ledger.frameworks`?
    recall_context_selection: >
      Do I agree that Memory recall, related approved QRAs, Brave context, and
      Dogpile context are used only as recorded context and not as hidden answer
      authority?
    crosswalk_chain: >
      Do I agree that each recorded crosswalk hop is supported by
      `qra.ledger.crosswalk_chains`, `qra.ledger.relationship_edges`,
      `qra.ledger.glossary`, and source evidence?
    policy_admission_gate: >
      Do I agree that draft, agent plausibility, Graham plausibility,
      cybersecurity expert verification, and answer authority remain separate
      states?
    terminal_action: >
      Do I agree that CLARIFY, DRAFT, ANSWER, or DEFLECT is the right terminal
      action for the recorded evidence? CLARIFY and DRAFT require a human
      checkpoint in the ledger.
    final_text: >
      Do I agree that the final answer, draft, clarification, or deflection text
      is readable, useful, and bounded to the ledger evidence?
  prompt_contract:
    prompt_path: /home/graham/workspace/experiments/agent-skills/agents/qra-auditor/prompts/memory_qra_ledger_audit_v1.txt
    review_payload_path: /home/graham/workspace/experiments/agent-skills/agents/qra-auditor/prompts/review/memory_qra_ledger_audit_v1_payload.txt
    output_schema_path: /home/graham/workspace/experiments/agent-skills/agents/qra-auditor/schemas/agent_plausibility_review.v1.schema.json
    best_practices_prompt_required: true
    review_prompt_required_before_production: true
  model_policy:
    default_provider: chutes
    default_model_family: deepseek
    model_selection_rule: >
      Select the exact model id from the live ops-chutes model catalog. Prefer a
      non-TEE DeepSeek-family high-reasoning model after `ops-chutes budget-check`
      and `ops-chutes can-complete <expected_calls>` pass. Do not hardcode
      "deepseek v4" without a catalog readback.
    concurrency_limit: 5
    claude_or_gpt_policy: >
      Claude/GPT is not required for ordinary agent-plausibility ledger audit.
      Use Claude/GPT only for prompt calibration, spot checks, adjudication of
      disputed cases, or repeated malformed Chutes output.
  tau_contract:
    executor_boundary: tau_dag_node
    output_schema: agent_plausibility_review.v1
    receipts_required:
      - qra_ledger_input_hash
      - prompt_hash
      - model_catalog_or_budget_receipt
      - node_response_json
      - schema_validation_receipt
      - final_agent_plausibility_receipt
    fail_closed_on:
      - missing_qra_ledger
      - malformed_ledger
      - missing_required_pipeline_step
      - malformed_model_output
      - output_schema_validation_failed
      - authority_boundary_collapsed
      - model_claimed_pipeline_rerun
  eval_policy:
    skill: llm-eval-lab
    plan_path: /home/graham/workspace/experiments/agent-skills/agents/qra-auditor/evals/memory_qra_ledger_audit_30_call_plan.json
    sample_method: seeded_random_stratified_sample
    recommended_total_calls: 30
    strata:
      - terminal_action
      - seeded_defect_type
      - evidence_complexity
    production_default_gate: >
      Use Chutes as the default ledger-auditor model only after the 30-call
      seeded stratified eval passes every hard gate in the eval plan.
  output_contract:
    schema: agent_plausibility_review.v1
    verdicts:
      - PASS
      - FAIL
      - NEEDS_HUMAN_REVIEW
    authority_boundary: >
      The output records only agent plausibility. It must not grant Graham
      signoff, cybersecurity expert verification, or answer authority.

qra_final_quality_assessment_pre_hf:
  owner: qra-auditor
  purpose: >
    Produce the final monitor-sparta QRA quality-assessment receipt consumed by
    Dewey/DevOps before exporting the core QRA training collection to private
    Hugging Face.
  command: >
    python3 /home/graham/workspace/experiments/memory/scripts/validation/monitor_sparta.py
    qra-final-assessment --samples-per-stratum <n> --max-total-samples <n>
    [--apply-ledger]
  sampling_contract:
    sample_frame: eligible_qras_minus_qras_already_in_sparta_qra_quality_assessments
    randomization: run_seeded_random_order_recorded_in_receipt
    stratification:
      - framework
      - control_category
      - qra_category
      - deterministic_risk_bucket
    minimum_behavior:
      - sample_across_control_categories
      - reject_stub_marker_present
      - reject_missing_evidence_case
      - reject_missing_entity_grounding
      - write_request_events_and_final_receipt
  dag_spec:
    schema: subagent_dag.v1
    mode: single_node
    description: >
      Run one final random stratified QRA quality-assessment sample and return
      the generated receipt for the pre-Hugging Face gate.
    inputs_required:
      - run_id
      - samples_per_stratum
      - max_total_samples
      - output_dir
    nodes:
      - id: run_final_qra_assessment
        kind: read_only_or_ledger_apply_assessment
        receipts:
          - request.json
          - events.jsonl
          - final_receipt.json
        stop_conditions:
          - receipt_written
          - sampled_qra_failures_reported
          - ledger_apply_denied_or_failed
          - blocked_with_reason
    edges: []
    receipt_policy:
      per_node_receipt_required: true
      final_receipt_required: true
    start_gate:
      require_dag_spec_before_work: true
      reject_prose_only_work_orders: true
  retry_policy:
    bounded_iterative:
      default_max_attempts: 3
      absolute_max_attempts: 4
      retry_requires_one_of:
        - empty_response
        - malformed_json
        - transient_tool_or_api_failure
        - verifier_found_named_defect
      stop_immediately_on:
        - pass
        - sampled_qra_failures_reported
        - source_evidence_missing
        - same_gap_repeated_twice
        - max_attempts_reached
  handoff:
    next_owner_after_pass: devops
    next_skill_after_pass: ops-huggingface
    rule: >
      QRA Auditor produces the quality receipt only. DevOps validates the
      dataset card and performs dry-run/execute Hub operations through
      ops-huggingface.

status_reporting:
  required: true
  recipient: project_agent
  cadence:
    - after_start
    - after_each_phase
    - before_tool_or_api_call
    - after_tool_or_api_call
    - on_deterministic_bug_found
    - after_repair_attempt
    - before_blocked_or_final_response
  stream_modes:
    - jsonl_event_stream
    - phase_receipt_json
    - final_response_json
  event_fields:
    - subagent_run_id
    - phase
    - current_artifact
    - command_or_api
    - evidence
    - bug_or_blocker
    - next_step
    - stop_condition
  timeout_diagnostics:
    heartbeat_interval_seconds: 30
    stale_after_seconds: 120
    include_last_started_command: true
    include_last_completed_command: true
    include_current_artifact_path: true

retry_policy:
  tool_retry:
    max_attempts: 2
    retry_requires:
      - transient_scillm_or_chutes_error
      - explicit_failed_item_ids
  helper_retry:
    max_attempts: 2
    retry_requires:
      - corrected_prompt_contract_bundle
      - corrected_manifest
      - transient_provider_preflight_failure
  qra_repair_attempts:
    max_attempts: 3
    subagent_self_override: denied
    retry_requires_one_of:
      - review_prompt_returned_named_fix_and_bundle_changed
      - create_qras_review_blocker_repaired
      - dry_run_failed_with_actionable_manifest_error
      - transient_scillm_or_chutes_failure_with_receipt
    stop_immediately_on:
      - missing_expected_response
      - missing_validator
      - missing_prompt_reviewer_receipt
      - scillm_auth_blocked
      - chutes_budget_blocked
      - failed_item_count_nonzero_after_retry
      - same_failure_repeated_twice
      - max_attempts_reached

output_contract:
  format: json_only_unless_user_answer_requested
  success_fields:
    - subagent_run_id
    - status
    - claimed_issue_id
    - lane
    - manifest_path
    - prompt_review_artifacts
    - scillm_artifacts
    - chutes_artifacts
    - create_qras_artifacts
