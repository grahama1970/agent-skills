proof_tasks:
  - id: qra_auditor_contract_lint
    description: Validate persona.yaml has dag_spec, bounded retry policy, tool policy, and receipts.
    expected_output: lint or schema validation report with zero blocking findings.
  - id: qra_prompt_contract_gate
    description: Build a complete prompt bundle with expected response and run review-prompt before generation.
    expected_output: review_result.json with PASS or blocked reason.
  - id: create_qras_canary_gate
    description: Run create-qras review, manifest dry-run, and a bounded canary before larger QRA repair.
    expected_output: canary receipt with generated count, failed count zero, and gap delta artifact.
  - id: memory_qra_ledger_prompt_schema_gate
    description: Validate the ledger-auditor prompt, review payload, and agent_plausibility_review.v1 JSON schema exist and parse.
    expected_output: prompt path, review payload path, and schema validation receipt with zero blocking findings.
  - id: memory_qra_ledger_model_eval_gate
    description: Run the 30-call seeded stratified llm-eval-lab plan before making Chutes the default ledger-auditor model.
    expected_output: eval report proving JSON validity, schema validity, authority-boundary preservation, and seeded-defect detection thresholds.

forbidden_behavior:
  - call_monitor_sparta_broad_repair_loop
  - call_monitor_sparta_mutating_health_command
  - run_unbounded_create_qras
  - run_create_qras_without_read_receipt
  - run_qra_generation_without_review_prompt_gate
  - run_provider_calls_outside_scillm_or_create_qras
  - directly_modify_arango_or_qdrant
  - treat_partial_progress_as_success
  - claim_monitor_green_from_qra_canary
  - rerun_or_simulate_memory_pipeline_during_ledger_audit
  - skip_sequential_step_reasonableness_review
  - collapse_agent_graham_expert_approval_states
  - grant_answer_authority_from_agent_plausibility
