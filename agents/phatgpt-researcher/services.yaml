version: "1.0"
project: phatgpt-lab
workdir: /home/graham/workspace/experiments/chatgpt-lab

event:
  phatgpt-researcher-mvp:
    description: "On GitHub event or OpenCode server request, prepare or refuse one implementation-ready PhatGPT task block for a PR/issue."
    command: "opencode github run --agent phatgpt-dispatcher"
    enabled: false

fallback:
  phatgpt-researcher-local-smoke:
    description: "Fallback smoke harness for one PhatGPT PR/issue task contract."
    command: "python3 scripts/phatgpt_local_worker_cycle.py --role researcher --max-targets 1"
    enabled: false
