version: "1.0"
project: phatgpt-lab
workdir: /home/graham/workspace/experiments/chatgpt-lab

event:
  phatgpt-coder-mvp:
    description: "On GitHub event or OpenCode server request, process at most one implementation-ready PhatGPT PR task, push a scoped patch, mark it ready for review, and exit."
    command: "opencode github run --agent phatgpt-dispatcher"
    enabled: false

fallback:
  phatgpt-coder-local-smoke:
    description: "Fallback smoke harness for one implementation-ready PhatGPT PR task."
    command: "python3 scripts/phatgpt_local_worker_cycle.py --role coder --max-targets 1"
    enabled: false
