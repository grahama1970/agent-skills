version: "1.0"
project: phatgpt-lab
workdir: /home/graham/workspace/experiments/chatgpt-lab

event:
  phatgpt-reviewer-mvp:
    description: "On GitHub event or OpenCode server request, review at most one PhatGPT PR marked ready-for-review, label pass/needs-changes/blocked, and exit."
    command: "opencode github run --agent phatgpt-dispatcher"
    enabled: false

fallback:
  phatgpt-reviewer-local-smoke:
    description: "Fallback smoke harness for one ready-for-review PhatGPT PR."
    command: "python3 scripts/phatgpt_local_worker_cycle.py --role reviewer --max-targets 1"
    enabled: false
