[project]
name = "runpod_ops_fixed"
version = "1.0.1"
description = "Fixed RunPod operations for GPU instance management"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Graham", email = "graham@example.com"},
]
keywords = ["runpod", "gpu", "training", "inference", "cloud"]

dependencies = [
    "runpod>=1.6.0",
    "httpx>=0.25.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "tenacity>=8.2.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
runpod_ops = "runpod_ops_fixed.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runpod_ops_fixed"]
