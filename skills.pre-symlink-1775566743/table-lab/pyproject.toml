[project]
name = "debug-table"
version = "0.1.0"
description = "Iterative Camelot parameter tuning for table extraction"
requires-python = ">=3.11,<3.13"
dependencies = [
    "camelot-py[base]>=0.11.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0,<0.7.3",
    "opencv-python-headless>=4.8.0",
    "pandas",
    "pillow>=10.0.0",
    "pymupdf>=1.23.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
]
