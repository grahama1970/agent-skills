version: 1
kind: orchestrate-plan
metadata:
  title: "Fill monitor-codebase gaps: security scanning, duplication, dependency graph, test coverage"
  description: >
    Wire existing /security-scan into nightly pipeline (secrets + deps),
    add code duplication detection, dependency graph analysis for circular deps,
    and basic test coverage tracking.
repo_root: /home/graham/workspace/experiments/pi-mono

capability_overlap:
  memory_recall: |
    Searched "security scan secrets dependency vulnerability duplication coverage" — found:
    - /security-scan exists with scan, sast, deps, secrets subcommands (Semgrep, pip-audit, gitleaks)
    - /treesitter can extract imports for dependency graph
    - No existing duplication detection skill
    - No existing test coverage skill
  skills_checked:
    security-scan: CALL (wire into monitor-codebase Step 4.5)
    treesitter: CALL (import extraction for dep graph)
    ingest-code: EXTEND (already extracts imports)
    memory: CALL (store results)
  create_justification: |
    duplication_detector.py and coverage_tracker.py are new — no existing skill covers these.
    dep_graph.py is new — treesitter extracts imports but no graph analysis exists.

lanes:
  - id: security
    label: "Wire security-scan into nightly pipeline"
  - id: duplication
    label: "Code duplication detection"
  - id: deps
    label: "Dependency graph and circular dep detection"
  - id: coverage
    label: "Test coverage tracking"

tasks:
  # ── Security ─────────────────────────────────────────────────────────────

  - id: S1-wire-security-scan
    title: "Add security-scan as Step 4.5 in monitor-codebase"
    runner: code-runner
    lane: security
    backend: codex
    mode: iterative
    gate: skills-ci
    prompt: |
      Add a new Step 4.5 to the monitor-codebase shell script (run.sh) that
      runs the security-scan skill on the project being scanned.

      Insert between Step 4 (quality checks) and Step 5 (autofix docstrings).

      The security-scan skill is at .pi/skills/security-scan/run.sh and
      supports: scan (all), sast, deps, secrets.

      For the nightly scan, run the full scan with JSON output:
        run_skill_timed security-scan scan "$project_path" --format json > "$sec_file"

      Store the output to $ARTIFACTS_DIR/${project_name}_security.json

      Also update the Step 9 aggregate report to include security findings count.
      Parse the JSON for counts: secrets_found, vulnerable_deps, sast_findings.

      Add these to the summary variables used in the memory learn step.
    allowlist:
      - .pi/skills/monitor-codebase/run.sh
    max_rounds: 3
    tests:
      - "grep -q 'security-scan' .pi/skills/monitor-codebase/run.sh"
      - "grep -q 'security' .pi/skills/monitor-codebase/run.sh"
    definition_of_done:
      command: "grep -c 'security.scan' .pi/skills/monitor-codebase/run.sh"
      assertion: "exit_code == 0"

  - id: S2-update-skill-md-security
    title: "Update SKILL.md pipeline table with Step 4.5 security scan"
    runner: code-runner
    lane: security
    backend: codex
    mode: one_shot
    gate: skills-ci
    depends_on: [S1-wire-security-scan]
    prompt: |
      Update the monitor-codebase SKILL.md pipeline table to include the new
      Step 4.5 for security scanning. Add it between Step 4 and Step 5.

      New row:
      | 4.5 | `/security-scan` | Secrets detection (gitleaks), dependency vulnerabilities (pip-audit/trivy), SAST (Semgrep) |

      Also add security-scan to the composes list in frontmatter.
    allowlist:
      - .pi/skills/monitor-codebase/SKILL.md
    max_rounds: 2
    tests:
      - "grep -q 'security-scan' .pi/skills/monitor-codebase/SKILL.md"
    definition_of_done:
      command: "grep -c 'security-scan' .pi/skills/monitor-codebase/SKILL.md"
      assertion: "exit_code == 0"

  # ── Code Duplication ─────────────────────────────────────────────────────

  - id: D1-duplication-detector
    title: "Create duplication_detector.py for cross-file code duplication"
    runner: code-runner
    lane: duplication
    backend: codex
    mode: iterative
    gate: skills-ci
    prompt: |
      Create duplication_detector.py in the monitor-codebase skill directory.

      This module detects duplicated code blocks across Python files in a project.
      Use a simple but effective approach:

      1. Parse each .py file, extract function bodies using ast module
      2. Normalize whitespace and variable names (replace all identifiers with _)
      3. Hash each normalized function body
      4. Group functions with identical hashes = duplicates
      5. Report duplicate clusters with file paths and line numbers

      Interface:
        def detect_duplicates(scan_dirs: list[str], min_lines: int = 10) -> dict:
            Returns {"clusters": [{"hash": str, "count": int, "locations": [{"file": str, "line": int, "name": str}]}],
                     "total_duplicates": int}

      Use loguru for logging. Use ast module for parsing (no external deps).
      Skip files in .venv, node_modules, __pycache__, .git.

      Keep it under 200 lines.
    allowlist:
      - .pi/skills/monitor-codebase/duplication_detector.py
    max_rounds: 5
    tests:
      - "test -f .pi/skills/monitor-codebase/duplication_detector.py"
      - "python3 -c 'from duplication_detector import detect_duplicates' 2>&1 | grep -v Error || true"
    definition_of_done:
      command: "python3 -c 'import ast; exec(open(\".pi/skills/monitor-codebase/duplication_detector.py\").read())' 2>&1; echo $?"
      assertion: "exit_code == 0"

  - id: D2-wire-duplication
    title: "Wire duplication detection into monitor-codebase Step 4.6"
    runner: code-runner
    lane: duplication
    backend: codex
    mode: one_shot
    gate: skills-ci
    depends_on: [D1-duplication-detector]
    prompt: |
      Add Step 4.6 to monitor-codebase run.sh that runs duplication detection.

      Insert after Step 4.5 (security scan), before Step 5 (autofix).

      Call: python3 "$SKILL_DIR/duplication_detector.py" with scan_dirs as args,
      capture JSON output to $ARTIFACTS_DIR/${project_name}_duplicates.json.

      Only run if the project has more than 10 Python files (skip tiny projects).

      Include duplicate count in the Step 9 aggregate report.
    allowlist:
      - .pi/skills/monitor-codebase/run.sh
    max_rounds: 3
    tests:
      - "grep -q 'duplication' .pi/skills/monitor-codebase/run.sh"
    definition_of_done:
      command: "grep -c 'duplication' .pi/skills/monitor-codebase/run.sh"
      assertion: "exit_code == 0"

  # ── Dependency Graph ─────────────────────────────────────────────────────

  - id: G1-dep-graph
    title: "Create dep_graph.py for import dependency analysis and circular dep detection"
    runner: code-runner
    lane: deps
    backend: codex
    mode: iterative
    gate: skills-ci
    prompt: |
      Create dep_graph.py in the monitor-codebase skill directory.

      This module builds an import dependency graph from Python files and detects
      circular dependencies.

      1. Walk Python files in scan directories
      2. Use ast module to extract import statements (import X, from X import Y)
      3. Map imports to local modules (file stems) vs external packages
      4. Build a directed graph of local module dependencies
      5. Detect cycles using DFS (Tarjan's algorithm or simple visited-set DFS)
      6. Report circular dependencies and dependency depth

      Interface:
        def analyze_dependencies(scan_dirs: list[str]) -> dict:
            Returns {"modules": int, "edges": int,
                     "circular_deps": [{"cycle": ["a", "b", "c", "a"], "severity": "high"|"medium"}],
                     "max_depth": int, "most_depended": [{"module": str, "dependents": int}]}

      Use loguru for logging. Use ast module only (no networkx or external deps).
      Skip .venv, node_modules, __pycache__.

      Keep it under 200 lines.
    allowlist:
      - .pi/skills/monitor-codebase/dep_graph.py
    max_rounds: 5
    tests:
      - "test -f .pi/skills/monitor-codebase/dep_graph.py"
    definition_of_done:
      command: "python3 -c 'import ast; exec(open(\".pi/skills/monitor-codebase/dep_graph.py\").read())' 2>&1; echo $?"
      assertion: "exit_code == 0"

  - id: G2-wire-dep-graph
    title: "Wire dependency graph analysis into monitor-codebase Step 4.7"
    runner: code-runner
    lane: deps
    backend: codex
    mode: one_shot
    gate: skills-ci
    depends_on: [G1-dep-graph]
    prompt: |
      Add Step 4.7 to monitor-codebase run.sh that runs dependency graph analysis.

      Insert after Step 4.6 (duplication), before Step 5 (autofix).

      Call: python3 "$SKILL_DIR/dep_graph.py" with scan_dirs as args,
      capture JSON output to $ARTIFACTS_DIR/${project_name}_deps.json.

      Include circular dependency count in Step 9 aggregate report.
      If circular deps found, add them to the dogpile research query in Step 8.
    allowlist:
      - .pi/skills/monitor-codebase/run.sh
    max_rounds: 3
    tests:
      - "grep -q 'dep_graph' .pi/skills/monitor-codebase/run.sh"
    definition_of_done:
      command: "grep -c 'dep_graph' .pi/skills/monitor-codebase/run.sh"
      assertion: "exit_code == 0"

  # ── Test Coverage ────────────────────────────────────────────────────────

  - id: T1-coverage-tracker
    title: "Create coverage_tracker.py for test coverage analysis"
    runner: code-runner
    lane: coverage
    backend: codex
    mode: iterative
    gate: skills-ci
    prompt: |
      Create coverage_tracker.py in the monitor-codebase skill directory.

      This module provides lightweight test coverage analysis without running tests.
      It checks coverage structurally:

      1. Walk Python files in scan directories
      2. For each module, check if a corresponding test file exists:
         - module.py → test_module.py or tests/test_module.py
      3. For each test file, count test functions (def test_*)
      4. Calculate coverage metrics:
         - Module coverage: % of modules with at least one test file
         - Test density: average test functions per tested module
         - Untested modules: list of modules with no test file

      Interface:
        def analyze_coverage(scan_dirs: list[str]) -> dict:
            Returns {"total_modules": int, "tested_modules": int,
                     "coverage_pct": float, "test_density": float,
                     "untested": [{"module": str, "path": str}],
                     "sparse_tests": [{"module": str, "test_count": int}]}

      Use loguru for logging. Use ast module for test function counting.
      Skip .venv, node_modules, __pycache__, test files themselves.

      Keep it under 150 lines.
    allowlist:
      - .pi/skills/monitor-codebase/coverage_tracker.py
    max_rounds: 5
    tests:
      - "test -f .pi/skills/monitor-codebase/coverage_tracker.py"
    definition_of_done:
      command: "python3 -c 'import ast; exec(open(\".pi/skills/monitor-codebase/coverage_tracker.py\").read())' 2>&1; echo $?"
      assertion: "exit_code == 0"

  - id: T2-wire-coverage
    title: "Wire coverage tracking into monitor-codebase Step 4.8"
    runner: code-runner
    lane: coverage
    backend: codex
    mode: one_shot
    gate: skills-ci
    depends_on: [T1-coverage-tracker]
    prompt: |
      Add Step 4.8 to monitor-codebase run.sh that runs test coverage analysis.

      Insert after Step 4.7 (dep graph), before Step 5 (autofix).

      Call: python3 "$SKILL_DIR/coverage_tracker.py" with scan_dirs as args,
      capture JSON output to $ARTIFACTS_DIR/${project_name}_coverage.json.

      Include coverage_pct in Step 9 aggregate report.
      If coverage below 30%, add to Discord notification as a warning.
    allowlist:
      - .pi/skills/monitor-codebase/run.sh
    max_rounds: 3
    tests:
      - "grep -q 'coverage' .pi/skills/monitor-codebase/run.sh"
    definition_of_done:
      command: "grep -c 'coverage_tracker' .pi/skills/monitor-codebase/run.sh"
      assertion: "exit_code == 0"
