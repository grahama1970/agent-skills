<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waterfall Chart</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Waterfall Chart</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const rawData = window.__INJECTED_DATA__ || [
  {"label": "Revenue", "value": 420}, {"label": "COGS", "value": -180},
  {"label": "Gross Profit", "value": null}, {"label": "OpEx", "value": -120},
  {"label": "Marketing", "value": -45}, {"label": "Net Income", "value": null}
];

let cumulative = 0;
const data = rawData.map(d => {
  if (d.value === null) return {label: d.label, start: 0, end: cumulative, isTotal: true};
  const start = cumulative;
  cumulative += d.value;
  return {label: d.label, start, end: cumulative, isTotal: false, delta: d.value};
});

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 24, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const x = d3.scaleBand().domain(data.map(d => d.label)).range([margin.left, width - margin.right]).padding(0.3);
const yExt = [Math.min(0, d3.min(data, d => Math.min(d.start, d.end))), d3.max(data, d => Math.max(d.start, d.end))];
const y = d3.scaleLinear().domain(yExt).nice().range([height - margin.bottom, margin.top]);

svg.selectAll('rect.bar').data(data).join('rect').attr('class', 'bar')
  .attr('data-label', d => d.label)
  .attr('x', d => x(d.label)).attr('width', x.bandwidth())
  .attr('y', d => y(Math.max(d.start, d.end))).attr('height', 0).attr('rx', 3)
  .attr('fill', d => d.isTotal ? '#6366F1' : (d.delta >= 0 ? '#22C55E' : '#EF4444'))
  .attr('opacity', 0.85)
  .transition().duration(800).ease(d3.easeCubicOut)
  .attr('height', d => Math.abs(y(d.start) - y(d.end)));

data.forEach((d, i) => {
  if (i < data.length - 1 && !data[i + 1].isTotal) {
    svg.append('line')
      .attr('x1', x(d.label) + x.bandwidth()).attr('x2', x(data[i + 1].label))
      .attr('y1', y(d.end)).attr('y2', y(d.end))
      .attr('stroke', '#94A3B8').attr('stroke-width', 1).attr('stroke-dasharray', '4,3');
  }
});

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).tickSizeOuter(0)).selectAll('text').attr('font-size', '16px');
svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5)).selectAll('text').attr('font-size', '18px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);
</script>
</body>
</html>
