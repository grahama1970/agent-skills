<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Series Trend</title>
<style>
  body {
    background: #111;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .canvas-header {
    padding: 24px 32px 12px;
    flex-shrink: 0;
  }
  .canvas-title {
    font-size: 28px;
    font-weight: 700;
  }
  .canvas-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 32px 32px;
    overflow: hidden;
    animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #chart { width: 100%; height: 100%; }
  /* Override D3 axis/tick colors for dark theme */
  .domain, .tick line { stroke: #475569 !important; }
  .tick text { fill: #e2e8f0 !important; }
  text { fill: #e2e8f0; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Multi-Series Trend</div></div>
<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [{"label": "Jan", "series_a": 10, "series_b": 30, "series_c": 20}, {"label": "Feb", "series_a": 25, "series_b": 28, "series_c": 22}, {"label": "Mar", "series_a": 18, "series_b": 35, "series_c": 30}, {"label": "Apr", "series_a": 32, "series_b": 22, "series_c": 38}, {"label": "May", "series_a": 28, "series_b": 40, "series_c": 35}, {"label": "Jun", "series_a": 45, "series_b": 38, "series_c": 42}];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 120, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`);

const keys = Object.keys(data[0]).filter(k => k !== 'label' && k !== 'name' && k !== 'x');
const x = d3.scalePoint()
  .domain(data.map(d => d.label || d.name || String(d.x)))
  .range([margin.left, width - margin.right])
  .padding(0.5);

const y = d3.scaleLinear()
  .domain([0, d3.max(data, d => d3.max(keys, k => d[k]))])
  .nice()
  .range([height - margin.bottom, margin.top]);

const color = d3.scaleOrdinal(d3.schemeTableau10).domain(keys);

keys.forEach(key => {
  const line = d3.line()
    .x(d => x(d.label || d.name || String(d.x)))
    .y(d => y(d[key]))
    .curve(d3.curveMonotoneX);

  const path = svg.append('path').datum(data)
    .attr('fill', 'none').attr('stroke', color(key))
    .attr('stroke-width', 3).attr('d', line);

  const totalLength = path.node()?.getTotalLength() || 0;
  path.attr('stroke-dasharray', `${totalLength} ${totalLength}`)
    .attr('stroke-dashoffset', totalLength)
    .transition().duration(800).ease(d3.easeCubicOut)
    .attr('stroke-dashoffset', 0);
});

// Legend
const legend = svg.append('g').attr('transform', `translate(${width - margin.right + 12}, ${margin.top})`);
keys.forEach((k, i) => {
  const g = legend.append('g').attr('transform', `translate(0,${i * 28})`);
  g.append('line').attr('x1', 0).attr('x2', 20).attr('y1', 8).attr('y2', 8)
    .attr('stroke', color(k)).attr('stroke-width', 3);
  g.append('text').attr('x', 26).attr('y', 13).text(k)
    .attr('font-size', '14px').attr('fill', '#e2e8f0');
});

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).tickSizeOuter(0))
  .selectAll('text').attr('font-size', '18px');

svg.append('g').attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(5))
  .selectAll('text').attr('font-size', '18px');

svg.selectAll('.domain, .tick line')
  .attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);

</script>
</body>
</html>
