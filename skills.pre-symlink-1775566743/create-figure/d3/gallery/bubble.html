<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Dimension Comparison</title>
<style>
  body {
    background: #111;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .canvas-header {
    padding: 24px 32px 12px;
    flex-shrink: 0;
  }
  .canvas-title {
    font-size: 28px;
    font-weight: 700;
  }
  .canvas-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 32px 32px;
    overflow: hidden;
    animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #chart { width: 100%; height: 100%; }
  /* Override D3 axis/tick colors for dark theme */
  .domain, .tick line { stroke: #475569 !important; }
  .tick text { fill: #e2e8f0 !important; }
  text { fill: #e2e8f0; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Multi-Dimension Comparison</div></div>
<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [{"label": "Alpha", "x": 10, "y": 20, "size": 30}, {"label": "Beta", "x": 25, "y": 35, "size": 50}, {"label": "Gamma", "x": 40, "y": 15, "size": 20}, {"label": "Delta", "x": 55, "y": 45, "size": 70}, {"label": "Epsilon", "x": 30, "y": 60, "size": 40}];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 24, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`);

const x = d3.scaleLinear()
  .domain(d3.extent(data, d => d.x || 0)).nice()
  .range([margin.left, width - margin.right]);

const y = d3.scaleLinear()
  .domain(d3.extent(data, d => d.y || d.value || 0)).nice()
  .range([height - margin.bottom, margin.top]);

const r = d3.scaleSqrt()
  .domain([0, d3.max(data, d => d.size || d.r || d.value || 1)])
  .range([4, 40]);

const color = d3.scaleOrdinal(d3.schemeTableau10);

svg.selectAll('circle').data(data).join('circle')
  .attr('cx', d => x(d.x || 0))
  .attr('cy', d => y(d.y || d.value || 0))
  .attr('r', 0)
  .attr('fill', (d, i) => color(d.group || d.label || i))
  .attr('fill-opacity', 0.7)
  .attr('stroke', (d, i) => color(d.group || d.label || i))
  .attr('stroke-width', 1)
  .transition().duration(800).ease(d3.easeCubicOut)
  .attr('r', d => r(d.size || d.r || d.value || 1));

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).ticks(5))
  .selectAll('text').attr('font-size', '18px');

svg.append('g').attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(5))
  .selectAll('text').attr('font-size', '18px');

</script>
</body>
</html>
