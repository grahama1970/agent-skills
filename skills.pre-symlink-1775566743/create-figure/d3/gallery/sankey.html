<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sankey Diagram</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Sankey Diagram</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import {sankey as d3Sankey, sankeyLinkHorizontal} from "https://cdn.jsdelivr.net/npm/d3-sankey@0.12/+esm";

const graph = window.__INJECTED_DATA__ || {
  nodes: [
    {name: "Source A"}, {name: "Source B"}, {name: "Source C"},
    {name: "Process 1"}, {name: "Process 2"},
    {name: "Output X"}, {name: "Output Y"}
  ],
  links: [
    {source: 0, target: 3, value: 40}, {source: 0, target: 4, value: 20},
    {source: 1, target: 3, value: 30}, {source: 1, target: 4, value: 25},
    {source: 2, target: 4, value: 35},
    {source: 3, target: 5, value: 50}, {source: 3, target: 6, value: 20},
    {source: 4, target: 5, value: 30}, {source: 4, target: 6, value: 50}
  ]
};

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 10, right: 10, bottom: 10, left: 10};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);

const sk = d3Sankey()
  .nodeId(d => d.index)
  .nodeWidth(20)
  .nodePadding(16)
  .extent([[margin.left, margin.top], [width - margin.right, height - margin.bottom]]);

const {nodes, links} = sk(graph);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

// Links
svg.append('g').attr('fill', 'none')
  .selectAll('path').data(links).join('path')
  .attr('d', sankeyLinkHorizontal())
  .attr('stroke', d => colors(d.source.index))
  .attr('stroke-width', d => Math.max(1, d.width))
  .attr('stroke-opacity', 0.4)
  .on('mouseover', function() { d3.select(this).attr('stroke-opacity', 0.7); })
  .on('mouseout', function() { d3.select(this).attr('stroke-opacity', 0.4); });

// Nodes
svg.append('g').selectAll('rect').data(nodes).join('rect')
  .attr('data-label', d => d.name)
  .attr('x', d => d.x0).attr('y', d => d.y0)
  .attr('width', d => d.x1 - d.x0).attr('height', d => d.y1 - d.y0)
  .attr('fill', d => colors(d.index)).attr('rx', 3);

// Labels
svg.append('g').selectAll('text').data(nodes).join('text')
  .attr('x', d => d.x0 < width / 2 ? d.x1 + 8 : d.x0 - 8)
  .attr('y', d => (d.y0 + d.y1) / 2)
  .attr('dy', '0.35em')
  .attr('text-anchor', d => d.x0 < width / 2 ? 'start' : 'end')
  .attr('font-size', '16px').attr('fill', '#1e293b')
  .text(d => d.name);
</script>
</body>
</html>
