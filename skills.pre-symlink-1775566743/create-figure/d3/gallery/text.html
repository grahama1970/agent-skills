<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Status</title>
<style>
  body {
    background: #111;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .canvas-header {
    padding: 24px 32px 12px;
    flex-shrink: 0;
  }
  .canvas-title {
    font-size: 28px;
    font-weight: 700;
  }
  .canvas-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 32px 32px;
    overflow: hidden;
    animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #chart { width: 100%; height: 100%; }
  /* Override D3 axis/tick colors for dark theme */
  .domain, .tick line { stroke: #475569 !important; }
  .tick text { fill: #e2e8f0 !important; }
  text { fill: #e2e8f0; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Pipeline Status</div></div>
<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [{"label": "Pipeline Status", "value": "Operational"}, {"label": "Total Documents", "value": "12,117"}, {"label": "Pass Rate", "value": "95.4%"}];
const container = document.getElementById('chart');
container.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;height:100%';

data.forEach((d, i) => {
  const card = document.createElement('div');
  card.style.cssText = `text-align:center;opacity:0;animation:fadeIn 500ms ${i * 200}ms ease forwards`;

  const label = document.createElement('div');
  label.textContent = d.label || d.name || '';
  label.style.cssText = 'font-size:16px;color:#94a3b8;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px';

  const value = document.createElement('div');
  value.textContent = d.value || '';
  value.style.cssText = 'font-size:48px;font-weight:800;color:#e2e8f0';

  card.appendChild(label);
  card.appendChild(value);
  container.appendChild(card);
});

const style = document.createElement('style');
style.textContent = '@keyframes fadeIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }';
document.head.appendChild(style);

</script>
</body>
</html>
