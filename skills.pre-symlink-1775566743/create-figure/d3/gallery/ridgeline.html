<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridgeline Plot</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Ridgeline Plot</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

function randn() { return Math.sqrt(-2 * Math.log(Math.random())) * Math.cos(2 * Math.PI * Math.random()); }

const groups = window.__INJECTED_DATA__ || ["Jan", "Feb", "Mar", "Apr", "May", "Jun"];
const rawData = {};
groups.forEach((g, i) => {
  rawData[g] = Array.from({length: 100}, () => 50 + i * 5 + randn() * (12 + i));
});

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 24, bottom: 40, left: 80};
const overlap = 3;

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

const allVals = Object.values(rawData).flat();
const x = d3.scaleLinear().domain(d3.extent(allVals)).nice().range([margin.left, width - margin.right]);
const y = d3.scaleBand().domain(groups).range([margin.top, height - margin.bottom]).padding(0.1);

function kde(kernel, thresholds, data) {
  return thresholds.map(t => [t, d3.mean(data, d => kernel(t - d))]);
}
function epanechnikov(bw) {
  return v => Math.abs(v /= bw) <= 1 ? 0.75 * (1 - v * v) / bw : 0;
}

const thresholds = x.ticks(50);
const bandwidth = 5;
const densities = {};
let maxDensity = 0;
groups.forEach(g => {
  densities[g] = kde(epanechnikov(bandwidth), thresholds, rawData[g]);
  const m = d3.max(densities[g], d => d[1]);
  if (m > maxDensity) maxDensity = m;
});

const yDensity = d3.scaleLinear().domain([0, maxDensity]).range([0, -y.bandwidth() * overlap]);

groups.forEach((g, gi) => {
  const baseY = y(g) + y.bandwidth();
  const area = d3.area()
    .x(d => x(d[0]))
    .y0(baseY)
    .y1(d => baseY + yDensity(d[1]))
    .curve(d3.curveBasis);

  svg.append('path')
    .datum(densities[g])
    .attr('data-label', g)
    .attr('d', area)
    .attr('fill', colors(gi))
    .attr('fill-opacity', 0.7)
    .attr('stroke', colors(gi))
    .attr('stroke-width', 1.5);
});

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).ticks(8)).selectAll('text').attr('font-size', '14px');
svg.append('g').attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).tickSizeOuter(0)).selectAll('text').attr('font-size', '14px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);
</script>
</body>
</html>
