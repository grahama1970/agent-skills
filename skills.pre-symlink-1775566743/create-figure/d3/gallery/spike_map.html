<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spike Map</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Spike Map</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);

const world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
const land = topojson.feature(world, world.objects.land);

const projection = d3.geoNaturalEarth1().fitSize([width - 20, height - 40], land);
const path = d3.geoPath(projection);

// Base map
svg.append('path').datum(land)
  .attr('fill', '#e2e8f0').attr('stroke', '#94a3b8').attr('stroke-width', 0.5)
  .attr('d', path);

// Sample data: [lon, lat, value, name]
const data = window.__INJECTED_DATA__ || [
  [-74.0, 40.7, 83, "New York"], [-118.2, 34.1, 39, "LA"],
  [-87.6, 41.9, 27, "Chicago"], [2.3, 48.9, 22, "Paris"],
  [-0.1, 51.5, 89, "London"], [139.7, 35.7, 139, "Tokyo"],
  [116.4, 39.9, 215, "Beijing"], [77.2, 28.6, 168, "Delhi"],
  [-46.6, -23.5, 123, "São Paulo"], [37.6, 55.8, 126, "Moscow"],
  [31.2, 30.0, 102, "Cairo"], [151.2, -33.9, 53, "Sydney"],
  [121.5, 31.2, 249, "Shanghai"], [100.5, 13.8, 107, "Bangkok"],
  [3.4, 6.5, 154, "Lagos"], [-43.2, -22.9, 67, "Rio"],
  [126.9, 37.6, 97, "Seoul"], [72.9, 19.1, 210, "Mumbai"],
];

const hScale = d3.scaleLinear().domain([0, d3.max(data, d => d[2])]).range([0, 80]);

// Draw spikes as thin triangles
svg.selectAll('path.spike').data(data).join('path')
  .attr('class', 'spike')
  .attr('data-label', d => d[3])
  .attr('d', d => {
    const [cx, cy] = projection([d[0], d[1]]);
    const h = hScale(d[2]);
    const w = 3;
    return `M${cx - w},${cy} L${cx},${cy - h} L${cx + w},${cy}Z`;
  })
  .attr('fill', '#EF4444')
  .attr('fill-opacity', 0.7)
  .attr('stroke', '#EF4444')
  .attr('stroke-width', 0.5);
</script>
</body>
</html>
