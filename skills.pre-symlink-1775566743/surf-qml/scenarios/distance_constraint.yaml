name: distance_constraint_5ft
description: >
  UX Scenario 1.2: Distance Constraint - 5ft Standing Review.
  Embry standing 5 feet from monitor during team review.
  All elements must be visible at distance (32pt+ text, 2px borders).

persona: embry
success_criteria:
  - All interactive elements visible at 5ft
  - Focus ring visible without squinting
  - No need to approach monitor

accessibility_requirements:
  min_text_size: 32pt  # 2.3x scale factor for 5ft
  focus_glow: { blur: 12px, opacity: 0.4 }
  touch_targets: 44pt
  contrast: WCAG_AAA
  border_minimum: 2px

steps:
  # Open overlay and capture initial state
  - find: "main.py"
  - focus: "main.py"
  - wait: 0.5
  - snap: { output: "01_initial_view.png" }

  # Read all elements to audit bounds/sizes
  - read: { depth: 10 }

  # Check search field visibility
  - read: { role: "text" }
  - snap: { output: "02_text_elements.png" }

  # Type a query to populate results
  - type: "authentication"
  - wait: 0.5
  - snap: { output: "03_results_populated.png" }

  # Verify result items have adequate size
  - read: { role: "list-item" }
  - verify: { role: "list-item" }
  - snap: { output: "04_result_items.png" }

  # Test focus visibility at distance
  - key: "Tab"
  - wait: 0.3
  - snap: { output: "05_focus_tab.png" }
  - verify: { state: "focused" }

  - key: "Down"
  - wait: 0.3
  - snap: { output: "06_focus_down.png" }

  # Record focus movement for frame-by-frame analysis
  - record: { duration: 4, output: "07_focus_movement.mp4" }

  # Test status indicators
  - read: { role: "icon" }
  - snap: { output: "08_status_indicators.png" }

  # Bottom bar keyboard shortcut visibility
  - read: { name: "shortcut" }
  - snap: { output: "09_keyboard_hints.png" }

  # Clean exit
  - key: "Escape"
  - wait: 0.3
  - snap: { output: "10_clean_exit.png" }
