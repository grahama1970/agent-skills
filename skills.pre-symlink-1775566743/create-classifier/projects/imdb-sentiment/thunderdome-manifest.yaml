name: imdb-sentiment
description: 'Classifier tournament for: Classify IMDB movie reviews as positive or
  negative'
data_dir: /home/graham/workspace/experiments/pi-mono/.pi/skills/create-classifier/projects/imdb-sentiment
skill: classifier-lab
scoring:
  metric_path: $.selected_metrics.macro_f1
  metric_regex: macro_f1[\:\s=]+([0-9.]+)
  gate_threshold: 0.9
  direction: higher_better
convergence:
  max_rounds: 4
  n_strategies: 2
  plateau_window: 3
  plateau_epsilon: 0.02
strategies:
- name: distilbert-base-uncased
  skill: classifier-lab
  timeout_s: 600
  prompt: Train distilbert-base-uncased on {{ data_dir }}/train.jsonl with lr=2e-05
    epochs=10 batch_size=16 max_length=128. Use /classifier-lab benchmark --modality
    text --backbones distilbert-base-uncased --data-dir {{ data_dir }}. Output JSON
    with selected_metrics.macro_f1.
- name: sentence-transformers-all-MiniLM-L6-v2
  skill: classifier-lab
  timeout_s: 600
  prompt: Train sentence-transformers/all-MiniLM-L6-v2 on {{ data_dir }}/train.jsonl
    with lr=2e-05 epochs=10 batch_size=16 max_length=128. Use /classifier-lab benchmark
    --modality text --backbones sentence-transformers/all-MiniLM-L6-v2 --data-dir
    {{ data_dir }}. Output JSON with selected_metrics.macro_f1.
variables:
  data_dir: /home/graham/workspace/experiments/pi-mono/.pi/skills/create-classifier/projects/imdb-sentiment
  modality: text
  gate_f1: 0.9
dogpile_on_failure: true
memory_scope: classifier-lab
