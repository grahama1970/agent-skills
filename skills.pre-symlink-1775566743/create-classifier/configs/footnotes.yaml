task: footnote_detection
type: hybrid

classes:
  - footnote
  - body_text

model:
  architecture: hybrid_transformer_mlp
  text_backbone: bert-base-uncased
  layout_features:
    - bbox
    - y_pos_rel
    - font_size
    - is_bold
  hidden_dims: [256, 128]
  dropout: 0.1

training:
  epochs: 15
  batch_size: 32
  learning_rate: 2e-5
  optimizer: adamw
  weight_decay: 0.01

confidence:
  threshold: 0.85 # High precision preferred for structural isolation

feedback:
  mode: grpo
  reward_fn: validate_section_flow
  baseline: heuristic
