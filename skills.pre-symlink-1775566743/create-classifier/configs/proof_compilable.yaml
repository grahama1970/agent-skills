# Proof Compilability Classifier (Tier 0.5)
# Binary routing: can this requirement-control pair be formally verified in Lean4?
#
# Training data: scripts/build_proof_training_data.py
# Sources:
#   - HF: limsc/mlm-tapt-requirements (aerospace SHALL sentences)
#   - HF: archanatikayatray/aeroBERT-NER (aerospace NER)
#   - F-36 datalake: 40,210 requirement_control_edges
#   - Shadow-LEGO teacher labels (DeepSeek V3 via scillm)
#   - Synthetic negatives (vague, off-topic, wrong pairings)

task: proof_compilable
type: text

classes:
  - compilable       # Requirement has precise language, control scope aligns, Lean4 can formalize
  - not_compilable   # Vague, off-topic, mismatched, or not formalizable

class_definitions:
  compilable:
    description: "Requirement can be formally verified in Lean4 against the paired control"
    indicators:
      - "Contains SHALL, MUST, or REQUIRED modal verbs"
      - "Quantitative bounds or measurable properties"
      - "Control scope matches requirement scope"
      - "Framework-specific terminology present"
      - "Clear subject-predicate-object structure"
      - "Deterministic properties amenable to Lean4 predicates"
  not_compilable:
    description: "Requirement cannot be formally verified"
    indicators:
      - "Vague or aspirational language (should, may, try to)"
      - "No testable properties or measurable criteria"
      - "Control-requirement scope mismatch"
      - "Off-topic or non-requirement text"
      - "Narrative prose without formalizable assertions"
      - "Missing context needed for predicate construction"

model:
  architecture: distilbert-base-uncased  # ~67M params, ~5ms inference
  max_length: 512

training:
  epochs: 10
  batch_size: 32
  learning_rate: 3e-5
  warmup_ratio: 0.1
  weight_decay: 0.01

  # Class balancing (expect ~60% not_compilable from negatives + teacher fails)
  class_weights:
    compilable: 1.2
    not_compilable: 1.0

  early_stopping:
    patience: 3
    metric: f1_macro

validation:
  split: 0.1
  stratified: true

confidence:
  threshold: 0.80

  fallback:
    mode: escalate  # Send to proof-rationale GPT for detailed assessment
    message: "Compilability uncertain — escalating to rationale model for detailed analysis."

# GRPO feedback from Lean4 proof outcomes
feedback:
  mode: grpo
  reward_fn: lean4_proof_outcome
  # reward = 1.0 if predicted compilable AND proof succeeded (or predicted not_compilable AND proof failed)
  # reward = 0.0 otherwise
  baseline: modal_verb_heuristic

integration:
  input_filter:
    enabled: true
    action: route
    # Route compilable → Lean4 proof pipeline
    # Route not_compilable → skip (save compute)

data_collection:
  source: data/labels/proof_classifier.jsonl
  label_field: label
  text_field: text

  hf_augment:
    datasets:
      - limsc/mlm-tapt-requirements
      - archanatikayatray/aeroBERT-NER

inference:
  batch_size: 32
  max_concurrent: 8
  cache:
    enabled: true
    ttl_seconds: 86400  # Cache 24h — requirements don't change often

  onnx:
    enabled: true
    quantize: true  # INT8 for H200 deployment

metrics:
  - accuracy
  - f1_macro
  - precision_per_class
  - recall_per_class
  - confusion_matrix
  - inference_latency_p50
  - inference_latency_p95
  - fallback_rate

shadow_deploy:
  duration_days: 7
  log_path: logs/proof_compilable_shadow.jsonl
  compare_against: modal_verb_heuristic
  success_criteria:
    accuracy: 0.85
    f1_macro: 0.82
    fallback_rate_max: 0.20
