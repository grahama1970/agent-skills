<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render a hbar for embry: Analysis (hbar)</title>
<style>
        body {
            background: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .canvas-header {
            padding: 16px 24px 8px;
            flex-shrink: 0;
        }
        .canvas-title {
            font-size: 24px;
            font-weight: 700;
        }
        .canvas-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 24px 24px;
            overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #chart { width: 100%; height: 100%; }
        </style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Render a hbar for embry: Analysis (hbar)</div></div>
<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = [{"label": "PASS", "value": 50}, {"label": "WARN", "value": 50}, {"label": "FAIL", "value": 50}];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 40, bottom: 40, left: 140};

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`);

const y = d3.scaleBand()
  .domain(data.map(d => d.label || d.name))
  .range([margin.top, height - margin.bottom])
  .padding(0.3);

const x = d3.scaleLinear()
  .domain([0, d3.max(data, d => d.value || d.y || 0)])
  .nice()
  .range([margin.left, width - margin.right]);

const colors = d3.scaleOrdinal(d3.schemeTableau10);

svg.selectAll('rect').data(data).join('rect')
  .attr('y', d => y(d.label || d.name))
  .attr('height', y.bandwidth())
  .attr('x', margin.left)
  .attr('width', 0)
  .attr('rx', 4)
  .attr('fill', (d, i) => colors(i))
  .attr('opacity', 0.85)
  .transition().duration(800).ease(d3.easeCubicOut)
  .attr('width', d => x(d.value || d.y || 0) - margin.left);

svg.append('g')
  .attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).tickSizeOuter(0))
  .selectAll('text').attr('font-size', '18px');

svg.append('g')
  .attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).ticks(5))
  .selectAll('text').attr('font-size', '18px');

svg.selectAll('.domain, .tick line')
  .attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);

</script>
</body>
</html>
