<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render a grouped_bar for embry: Quality Comparison</title>
<style>
        body {
            background: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .canvas-header {
            padding: 16px 24px 8px;
            flex-shrink: 0;
        }
        .canvas-title {
            font-size: 24px;
            font-weight: 700;
        }
        .canvas-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 24px 24px;
            overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #chart { width: 100%; height: 100%; }
        </style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Render a grouped_bar for embry: Quality Comparison</div></div>
<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = [{"dimension": "content coverage", "PASS": 1.0, "WARN": 0.944, "FAIL": 0.906}, {"dimension": "data quality", "PASS": 1.0, "WARN": 0.991, "FAIL": 0.992}, {"dimension": "equation fidelity", "PASS": 0.943, "WARN": 0.871, "FAIL": 0.6}, {"dimension": "figure fidelity", "WARN": 0.0, "FAIL": 0.0}, {"dimension": "ordering yx", "PASS": 1.0, "WARN": 1.0, "FAIL": 1.0}, {"dimension": "section alignment", "PASS": 0.992, "WARN": 0.922, "FAIL": 0.915}, {"dimension": "table fidelity", "PASS": 0.9, "WARN": 0.886, "FAIL": 0.0}];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 120, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`);

const keys = Object.keys(data[0]).filter(k => k !== 'label' && k !== 'name');

const x0 = d3.scaleBand()
  .domain(data.map(d => d.label || d.name))
  .range([margin.left, width - margin.right])
  .padding(0.2);

const x1 = d3.scaleBand()
  .domain(keys)
  .range([0, x0.bandwidth()])
  .padding(0.05);

const y = d3.scaleLinear()
  .domain([0, d3.max(data, d => d3.max(keys, k => d[k]))])
  .nice()
  .range([height - margin.bottom, margin.top]);

const color = d3.scaleOrdinal(d3.schemeTableau10).domain(keys);

svg.selectAll('g.group').data(data).join('g')
  .attr('class', 'group')
  .attr('transform', d => `translate(${x0(d.label || d.name)},0)`)
  .selectAll('rect').data(d => keys.map(k => ({key: k, value: d[k]})))
  .join('rect')
  .attr('x', d => x1(d.key))
  .attr('width', x1.bandwidth())
  .attr('y', height - margin.bottom)
  .attr('height', 0)
  .attr('fill', d => color(d.key))
  .attr('opacity', 0.85)
  .attr('rx', 2)
  .transition().duration(800).ease(d3.easeCubicOut)
  .attr('y', d => y(d.value))
  .attr('height', d => height - margin.bottom - y(d.value));

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x0).tickSizeOuter(0))
  .selectAll('text').attr('font-size', '18px');

svg.append('g').attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(5))
  .selectAll('text').attr('font-size', '18px');

</script>
</body>
</html>
