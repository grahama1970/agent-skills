<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render a heatmap for embry: Quality Dimensions</title>
<style>
        body {
            background: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .canvas-header {
            padding: 16px 24px 8px;
            flex-shrink: 0;
        }
        .canvas-title {
            font-size: 24px;
            font-weight: 700;
        }
        .canvas-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 24px 24px;
            overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #chart { width: 100%; height: 100%; }
        </style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Render a heatmap for embry: Quality Dimensions</div></div>
<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = [{"label": "WARN", "value": 679}, {"label": "PASS", "value": 2905}, {"label": "FAIL", "value": 1087}];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 80, bottom: 60, left: 100};

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`);

const rows = [...new Set(data.map(d => d.row || d.y))];
const cols = [...new Set(data.map(d => d.col || d.x))];

const x = d3.scaleBand().domain(cols).range([margin.left, width - margin.right]).padding(0.05);
const y = d3.scaleBand().domain(rows).range([margin.top, height - margin.bottom]).padding(0.05);

const vals = data.map(d => d.value || d.z || 0);
const color = d3.scaleSequential(d3.interpolateBlues)
  .domain([d3.min(vals), d3.max(vals)]);

svg.selectAll('rect').data(data).join('rect')
  .attr('x', d => x(d.col || d.x))
  .attr('y', d => y(d.row || d.y))
  .attr('width', x.bandwidth())
  .attr('height', y.bandwidth())
  .attr('rx', 2)
  .attr('fill', d => color(d.value || d.z || 0))
  .attr('opacity', 0)
  .transition().duration(800).ease(d3.easeCubicOut)
  .attr('opacity', 1);

// Cell value labels
svg.selectAll('text.cell').data(data).join('text')
  .attr('class', 'cell')
  .attr('x', d => x(d.col || d.x) + x.bandwidth() / 2)
  .attr('y', d => y(d.row || d.y) + y.bandwidth() / 2)
  .attr('text-anchor', 'middle')
  .attr('dominant-baseline', 'central')
  .attr('font-size', '14px')
  .attr('fill', d => (d.value || d.z || 0) > (d3.max(vals) * 0.6) ? 'white' : '#1e293b')
  .text(d => typeof (d.value || d.z) === 'number' ? (d.value || d.z).toFixed(1) : (d.value || d.z));

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).tickSizeOuter(0))
  .selectAll('text').attr('font-size', '18px');

svg.append('g').attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).tickSizeOuter(0))
  .selectAll('text').attr('font-size', '18px');

</script>
</body>
</html>
