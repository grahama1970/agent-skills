[project]
name = "create-intent-map"
version = "0.1.0"
description = "LoRA training for SPARTA intent mapper (DeepSeek-R1-Distill-Qwen-7B)"
readme = "SKILL.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.20.0,<4.4.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.24.0",
    "loguru>=0.7.0,<0.7.3",
    "peft>=0.12.0",
    "pydantic>=2.0.0",
    "python-arango>=8.0.0",
    "rich>=13.7.0",
    "tenacity>=8.2.0",
    "torch>=2.4.0",
    "tqdm>=4.66.0",
    "transformers>=4.44.0",
    "trl>=0.9.0",
    "typer>=0.12.0",
    "unsloth",
    "wandb",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17.0", "tensorboard>=2.17.0"]

[project.scripts]
intent-train = "scripts.train:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
