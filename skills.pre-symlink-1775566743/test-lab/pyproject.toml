[project]
name = "test-lab"
version = "0.1.0"
description = "Adversarial blind evaluation harness for coding agents"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.24",
    "loguru>=0.7,<0.7.3",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.9",
    "pydantic>=2.0",
]

[dependency-groups]
test = ["fastapi", "pytest>=7.0"]
