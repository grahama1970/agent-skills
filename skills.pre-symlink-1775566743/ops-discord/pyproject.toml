[project]
name = "pi-skill-ops-discord"
version = "0.1.0"
description = "Runtime package for the ops-discord skill"
requires-python = ">=3.11,<3.13"
dependencies = [
    "discord.py>=2.5.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2,<0.7.3",
    "rich>=13.9.4",
    "typer>=0.16.0",
]

[dependency-groups]
test = ["pytest>=7.0"]
