[project]
name = "cmmc-assessor"
version = "0.1.0"
description = "CMMC Level 2/3 compliance assessment against NIST SP 800-171"
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
