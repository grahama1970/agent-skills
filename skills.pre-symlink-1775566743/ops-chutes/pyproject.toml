[project]
name = "ops-chutes"
version = "0.1.0"
description = "Chutes.ai operational skill for budget tracking and status monitoring"
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "pytz",
    "loguru>=0.7.0,<0.7.3",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = [
    "manager.py",
    "util.py",
    "run.sh",
    "SKILL.md",
    "sanity",
]
