[project]
name = "evidence-case-lab"
version = "0.2.0"
description = "Self-improving evidence case convergence loop"
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "loguru>=0.7.0,<0.7.3",
    "httpx>=0.25.0",
    "python-arango>=8.0.0",
    "rapidfuzz>=3.14.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "spacy>=3.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["evidence_case_lab", "diagnosis"]
