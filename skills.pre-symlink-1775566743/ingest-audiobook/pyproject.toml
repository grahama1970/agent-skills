requires-python = ">=3.11,<3.13"

dependencies = [
    "faster-whisper",
    "loguru>=0.7.0,<0.7.3",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]
