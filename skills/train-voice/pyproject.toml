[project]
name = "train-voice"
version = "1.0.0"
description = "Unified voice training for personas: PersonaPlex + Qwen3-TTS"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate",
    "bitsandbytes",
    "huggingface-hub",
    "librosa",
    "loguru>=0.7.0,<0.7.3",
    "numpy",
    "openai-whisper",
    "optuna",
    "pyyaml>=6.0",
    "resemblyzer",
    "rich>=13.0.0",
    "safetensors",
    "torch",
    "transformers",
    "typer>=0.9.0",
]

[dependency-groups]
test = ["pytest>=7.0"]

[project.optional-dependencies]
personaplex = [
    "resemblyzer>=0.1.3",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]

[project.scripts]
train-voice = "train:app"
