[project]
name = "sprite-atlas"
version = "0.1.0"
description = "Inspect, repair, validate, and promote sprite atlases from profiles."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26.0",
  "opencv-python-headless>=4.8.0",
  "pillow>=10.0.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprite_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
