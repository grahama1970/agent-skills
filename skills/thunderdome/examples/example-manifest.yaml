name: example-dry-run
description: "Minimal example for sanity testing — strategies echo fake JSON"

scoring:
  metric_path: "$.f1"
  gate_threshold: 0.95
  direction: higher_better

convergence:
  max_rounds: 3
  plateau_window: 2
  plateau_epsilon: 0.02

strategies:
  - name: strategy-alpha
    model: sonnet
    timeout_s: 30
    prompt: |
      Return ONLY this JSON (no other text):
      {"f1": 0.87, "accuracy": 0.85, "strategy": "alpha", "round": {{ round }}}

  - name: strategy-beta
    model: sonnet
    timeout_s: 30
    prompt: |
      Return ONLY this JSON (no other text):
      {"f1": 0.92, "accuracy": 0.91, "strategy": "beta", "round": {{ round }}}

reviewers: []

variables: {}

dogpile_on_failure: false
memory_scope: thunderdome-test
