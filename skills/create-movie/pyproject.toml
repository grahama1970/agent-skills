[project]
name = "create-movie"
version = "0.1.0"
description = "Orchestrated movie creation for Horus persona"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "fal-client>=0.4.0",
    "requests>=2.28.0",
    "PyJWT>=2.0.0",
    "python-arango>=8.2.6",
    "typer>=0.21.1",
    "google-generativeai>=0.8.6",
    "loguru>=0.7.0,<0.7.3",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (may require real skills)",
]
