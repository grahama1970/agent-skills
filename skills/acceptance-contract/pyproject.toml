[project]
name = "acceptance-contract"
version = "0.1.0"
description = "Extract typed acceptance contracts from briefs and bundles"
requires-python = ">=3.11"
dependencies = [
  "loguru>=0.7.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "typer>=0.12.0",
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
