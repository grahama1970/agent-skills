[project]
name = "qra-grade-advice"
version = "0.1.0"
description = "Typed speed-first QRA grading advice skill"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "loguru>=0.7.0",
  "pydantic>=2.7.0",
  "typer>=0.12.0",
]

[project.scripts]
qra-grade-advice = "qra_grade_advice.__main__:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["qra_grade_advice*"]
exclude = ["fixtures*"]
