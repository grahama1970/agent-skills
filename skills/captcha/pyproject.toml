[project]
name = "captcha-skill"
version = "0.1.0"
description = "Authorization-gated local ReCAP CAPTCHA security evaluation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "loguru>=0.7,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
captcha = "captcha_skill.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_skill"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
