[project]
name = "create-persona"
version = "0.1.0"
description = "Deliberate persona creation for client modeling"
requires-python = ">=3.10,<3.13"
dependencies = [
    "loguru>=0.7.0,<0.7.3",
    "pyyaml>=6.0",
    "resemblyzer",
    "rich>=13.0.0",
    "speechbrain",
    "torch",
    "torchaudio",
    "typer>=0.9.0",
]

[project.optional-dependencies]
personaplex = [
    "resemblyzer>=0.1.3",   # Speaker embedding extraction
    "torch>=2.0.0",         # PyTorch for embedding computation
    "torchaudio>=2.0.0",    # Audio processing
]

[project.scripts]
create-persona = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
