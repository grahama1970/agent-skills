[project]
name = "llm-eval-lab"
version = "0.1.0"
description = "LLM model evaluation, comparison, and cost analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.24.0",
    "loguru>=0.7.0,<0.7.3",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "scillm @ git+https://github.com/grahama1970/scillm.git",
    "typer>=0.9.0",
]

[project.scripts]
llm-eval-lab = "llm_eval_lab:app"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]
