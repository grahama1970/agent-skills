[project]
name = "battle-skill"
version = "0.1.0"
description = "Red vs Blue team security competition orchestrator"
requires-python = ">=3.11,<3.13"
dependencies = [
"httpx>=0.25.0",
"loguru>=0.7.0,<0.7.3",
"numpy>=1.26.0",
"opencv-python>=4.8.0",
"pillow>=10.0.0",
"pydantic>=2.0.0",
"python-dotenv>=1.0.0",
"rich>=13.0.0",
"textual",
"typer>=0.9.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true
dev-dependencies = [
"jsonschema>=4.0.0",
"pytest>=7.0.0",
]

[tool.pytest.ini_options]
# Only collect the project's own tests. `fixtures/` and `monitor/**/artifacts/`
# contain target-app `test_app.py` files (the exploit targets' own suites) that
# import a local `app` module and must NOT be collected by the skill's pytest run.
testpaths = ["tests"]
pythonpath = ["src", "..", "../.."]
norecursedirs = ["fixtures", "monitor", "arena", "sanity", "runtime-matrix", "spectator", ".venv", "*.egg", "build", "dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/battle_skill"]

[tool.hatch.build.targets.sdist]
include = [
"src/battle_skill",
"fixtures",
"docs",
"GOAL.md",
"README.md",
"SKILL.md",
"PROJECT_KNOWLEDGE.md",
]
