<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adaptive Lineage Battle Scorecard</title>
  <style>
:root {
  color-scheme: dark;
  --red: #ff2c42;
  --blue: #258fff;
  --cyan: #4ad9ff;
}

* { box-sizing: border-box; }

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  background: #01040a;
  font-family: "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}

.demo-stage {
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 48%, rgba(19, 37, 61, 0.20), transparent 55%),
    linear-gradient(#040a14, #01040a);
}

.battle-scorecard {
  position: relative;
  width: min(100vw, 2172px);
  aspect-ratio: 2172 / 724;
  overflow: hidden;
  isolation: isolate;
  background: #01050c;
}

.battle-scorecard::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  opacity: 0.17;
  mix-blend-mode: screen;
  background:
    repeating-linear-gradient(to bottom, rgba(255,255,255,0.035) 0 1px, transparent 1px 4px),
    radial-gradient(circle, rgba(153, 204, 255, 0.12) 0 0.7px, transparent 0.9px);
  background-size: auto, 4px 4px;
}

.battle-scorecard__svg {
  display: block;
  width: 100%;
  height: 100%;
}

.plate,
.footer,
.face,
.bridge,
.center-diamond {
  vector-effect: non-scaling-stroke;
}

.plate--red,
.footer--red {
  fill: url(#redPlate);
  stroke: #8c1027;
  stroke-width: 2.5;
}

.plate--blue,
.footer--blue {
  fill: url(#bluePlate);
  stroke: #0b5ca9;
  stroke-width: 2.5;
}

.face--red {
  fill: #050810;
  stroke: url(#redStroke);
  stroke-width: 2.1;
}

.face--blue {
  fill: #050910;
  stroke: url(#blueStroke);
  stroke-width: 2.1;
}

.outer-stroke,
.inner-stroke,
.trace {
  fill: none;
  vector-effect: non-scaling-stroke;
  stroke-linecap: square;
  stroke-linejoin: miter;
}

.outer-stroke {
  stroke-width: 2.7;
}

.outer-stroke--red {
  stroke: url(#redStroke);
  filter: url(#redGlow);
}

.outer-stroke--blue {
  stroke: url(#blueStroke);
  filter: url(#blueGlow);
}

.inner-stroke {
  stroke-width: 1.4;
  opacity: 0.72;
}

.inner-stroke--red { stroke: #9f1830; }
.inner-stroke--blue { stroke: #0d5da4; }

.trace {
  stroke-width: 1.2;
  opacity: 0.5;
}
.trace--red { stroke: #9d1730; }
.trace--blue { stroke: #0c5da6; }
.trace.faint { opacity: 0.26; }

.bridge {
  fill: #050a12;
  stroke: #15364d;
  stroke-width: 2;
}

.center-diamond {
  fill: #050b14;
  stroke: url(#centerStroke);
  stroke-width: 2.2;
}

.team-title,
.score,
.versus,
.mode-label {
  font-family: "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  font-weight: 800;
  user-select: none;
}

.team-title {
  font-size: 43px;
  letter-spacing: 0.4px;
}

.team-title--red {
  fill: url(#redText);
  filter: url(#redGlow);
}

.team-title--blue {
  fill: url(#blueText);
  filter: url(#blueGlow);
}

.score {
  font-family: "Arial Black", Arial, Helvetica, sans-serif;
  font-size: 170px;
  letter-spacing: -7px;
  filter: url(#scoreShadow);
}

.score--red {
  fill: url(#redText);
}

.score--blue {
  fill: url(#blueText);
}

.versus {
  fill: url(#vsText);
  font-size: 68px;
  letter-spacing: -2px;
  filter: url(#cyanGlow);
}

.mode-label {
  font-size: 24px;
  letter-spacing: 9px;
}
.mode-label--red { fill: #ff344a; }
.mode-label--blue { fill: #2995ff; }

.emblem {
  filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
}

.meter use {
  filter: drop-shadow(0 0 4px rgba(0,0,0,0.8));
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@media (prefers-reduced-motion: no-preference) {
  .battle-scorecard {
    animation: scorecard-entry 420ms cubic-bezier(.19,.7,.2,1) both;
  }
  @keyframes scorecard-entry {
    from { opacity: 0; transform: scale(.985); filter: brightness(.7); }
    to { opacity: 1; transform: scale(1); filter: brightness(1); }
  }
}

</style>
</head>

            <feOffset in="blur" dx="0" dy="7" result="offset" />

            <feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>

          <symbol id="slash" viewBox="0 0 52 24">
            <path d="M14 0H52L38 24H0Z" />
          </symbol>

            <use href="#slash" x="282" width="52" height="24" fill="#0d376c" />
          </g>
        </g>

        <rect width="2172" height="724" fill="url(#scanLines)" opacity="0.32" pointer-events="none" />
      </svg>
    </section>
  </main>

  <script>
(() => {
  const root = document.querySelector('.battle-scorecard');
  if (!root) return;

  const fields = {
    redTeam: document.querySelector('#redTeam'),
    redScore: document.querySelector('#redScore'),
    blueTeam: document.querySelector('#blueTeam'),
    blueScore: document.querySelector('#blueScore'),
  };

  function syncFromDataset() {
    fields.redTeam.textContent = root.dataset.redTeam || 'RED TEAM';
    fields.redScore.textContent = root.dataset.redScore || '8.4';
    fields.blueTeam.textContent = root.dataset.blueTeam || 'BLUE TEAM';
    fields.blueScore.textContent = root.dataset.blueScore || '7.2';

    const description = `${fields.redTeam.textContent} ${fields.redScore.textContent} versus ${fields.blueTeam.textContent} ${fields.blueScore.textContent}`;
    root.setAttribute('aria-label', description);
  }

  syncFromDataset();

  window.battleScorecard = {
    update(values = {}) {
      for (const [key, value] of Object.entries(values)) {
        if (value == null) continue;
        root.dataset[key] = String(value);
      }
      syncFromDataset();
    },
  };
})();

</script>
</body>
</html>
