[project]
name = "learn-datalake"
version = "0.1.0"
description = "Orchestrator for datalake self-improvement loops"
readme = "SKILL.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.100.0",
    "typer>=0.12.0",
    "loguru>=0.7.0,<0.7.3",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "joblib>=1.3",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "uvicorn>=0.23.0",
]

[project.scripts]
learn-datalake = "learn_datalake.cli:app"

[view]
# Standard tool config (uv/ruff/pytest)
[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "types-requests>=2.31.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
