schema: pitchdeck.source_manifest.v1
project_name: Atlas Evidence Workbench
deck_title: Atlas Evidence Workbench
audience: Design partners and technical reviewers
sources:
  - id: atlas-readme
    title: Atlas README
    path: README.md
    visibility: public
    role: primary
    required: true
policy:
  public_deck_source_ids:
    - atlas-readme
  forbidden_unqualified_claims:
    - production-ready
    - fully validated
  mandatory_non_claims:
    - This fixture does not establish factual correctness or production readiness.
    - Candidate claims require human review before external use.
seam_validation:
  kind: source_manifest
  status: PASS
