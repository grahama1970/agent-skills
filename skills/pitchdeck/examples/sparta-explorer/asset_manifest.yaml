schema: pitchdeck.asset_manifest.v1
project_name: Sparta Explorer
assets:
  - id: sparta-helmet-mark
    kind: logo
    visibility: public
    local_path: ${SPARTA_PUBLIC_ROOT}/docs/assets/sparta-front-helmet-cyan.svg
    required: false
    alt_text: Sparta Explorer cyan helmet mark
    target_aspect: "1:1"
    status: present
    generation_brief: Export a transparent PNG fallback at 1024 by 1024 if the SVG import changes in Google Slides.
    source_ref:
      source_id: sparta-public-readme
      section: Introduction
  - id: sparta-threat-matrix
    kind: screenshot
    visibility: public
    local_path: ${SPARTA_PUBLIC_ROOT}/docs/assets/screenshots/sparta-explorer-threat-matrix-20260730.webp
    required: true
    alt_text: Sparta Explorer Threat Matrix showing tactic coverage, mapping state, mission context, and candidate versus reviewed state
    target_aspect: "16:9"
    status: present
    generation_brief: Recapture from one preflighted commit at 2560 by 1440 if the current UI differs from the dated image.
    source_ref:
      source_id: sparta-public-readme
      section: The Product in One View
  - id: sparta-global-posture
    kind: screenshot
    visibility: public
    local_path: ${SPARTA_PUBLIC_ROOT}/docs/assets/screenshots/sparta-explorer-posture-10ft-20260730.webp
    required: true
    alt_text: Global Posture showing degraded readiness, evidence gaps, threat context, and supplier lineage
    target_aspect: "16:9"
    status: present
    generation_brief: Recapture from the same commit and browser geometry as the other product slides.
    source_ref:
      source_id: sparta-public-readme
      section: Product Tour — Global Posture
  - id: sparta-chat-console
    kind: screenshot
    visibility: public
    local_path: ${SPARTA_PUBLIC_ROOT}/docs/assets/screenshots/sparta-explorer-console-supply-chain-20260730.webp
    required: true
    alt_text: Sparta Chat docked beside Supply Chain with an inspectable response pipeline and cited answer
    target_aspect: "16:9"
    status: present
    generation_brief: Recapture only after the exact response route and screenshot commit pass the current demo preflight.
    source_ref:
      source_id: sparta-public-readme
      section: Product Tour — Sparta Chat
  - id: sparta-embry-os-foundation
    kind: diagram
    visibility: public
    local_path: ${SPARTA_PUBLIC_ROOT}/docs/assets/sparta-explorer-embry-os-value-prop-header.webp
    required: true
    alt_text: Conceptual Embry OS foundation connecting plant and warfighter program profiles through separated evidence, identity, policy, data scope, and authority boundaries
    target_aspect: "16:9"
    status: regenerate
    generation_brief: Recompose for a true 16:9 slide with three zones—plant, governed local foundation, warfighter program—and no embedded small text.
    source_ref:
      source_id: sparta-public-readme
      section: Built on Embry OS
  - id: sparta-response-flow
    kind: diagram
    visibility: public
    local_path: ${SPARTA_PUBLIC_ROOT}/docs/assets/sparta-explorer-response-flow.webp
    required: false
    alt_text: Conceptual response flow from source material through answerability to human workflow
    target_aspect: "16:9"
    status: regenerate
    generation_brief: Prefer native PowerPoint flow shapes; use the image only as design reference.
    source_ref:
      source_id: sparta-public-readme
      section: How Sparta Works
  - id: sparta-supply-chain
    kind: screenshot
    visibility: public
    local_path: ${SPARTA_PUBLIC_ROOT}/docs/assets/screenshots/sparta-explorer-supply-chain-20260730.webp
    required: false
    alt_text: Supply-chain topology showing a simulated service loss through suppliers, mission threads, and candidate requirements
    target_aspect: "16:9"
    status: present
    generation_brief: Optional appendix capture; recapture with the main set if used.
    source_ref:
      source_id: sparta-public-readme
      section: Product Tour — Supply Chain
  - id: sparta-qra-review
    kind: screenshot
    visibility: public
    local_path: ${SPARTA_PUBLIC_ROOT}/docs/assets/screenshots/sparta-explorer-qras-20260730.webp
    required: false
    alt_text: QRA review queue showing candidate records, evidence gates, review state, and adjudication actions
    target_aspect: "16:9"
    status: stale
    generation_brief: Keep in the private appendix or recapture after the named reasoning-field defect is repaired.
    source_ref:
      source_id: sparta-public-readme
      section: Product Tour — QRAs
  - id: sparta-problem-fragmentation
    kind: illustration
    visibility: public
    required: false
    alt_text: Disconnected frameworks, engineering records, supplier data, tests, and human review converging on an unsupported answer
    target_aspect: "16:9"
    status: planned
    generation_brief: Create a restrained dark 16:9 conceptual illustration with six disconnected source classes; do not include text or fake product UI.
    source_ref:
      source_id: sparta-public-readme
      section: Why Sparta Explorer
seam_validation:
  kind: asset_manifest
  status: PASS
