- id: 05-qra-governance
  order: 5
  role: private-qra-governance
  layout: appendix
  visibility: private
  title: QRA generation and answer correctness are different authorities
  message: Agent-driven answerability, human candidate review, reasoning repair, and
    lineage reuse must remain distinguishable in the deck and product story.
  body:
  - Generated candidates remain candidates until human review.
  - Human interview, accept, reject, and promote actions determine correctness status.
  - Canonical-active means retrieval-eligible, not expert-approved or compliance-credited.
  - Reuse must preserve multi-hop lineage and reviewed-only governance where required.
  - Direct bypass or legacy release paths remain explicit defects, not hidden implementation
    detail.
  source_refs:
