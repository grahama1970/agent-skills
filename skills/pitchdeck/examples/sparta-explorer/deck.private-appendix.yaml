schema: pitchdeck.deck_manifest.v1
deck:
  id: sparta-explorer-private-appendix
  title: Sparta Explorer — Private Technical Appendix
  subtitle: Architecture, bounded proof, open gates, and demonstration controls
  audience: Authorized technical reviewers and design partners
  visibility: private
  target_editor: google_slides
  theme: dark_cyan_evidence
  source_policy: public_and_private
  author: Graham Anderson
slides:
- id: 01-status-ledger
  order: 1
  role: private-current-status
  layout: appendix
  visibility: private
  title: Current status is a ledger, not one readiness score
  message: Working product surfaces, bounded proof, response-route integration, and
    deployment gaps must remain separately visible.
  body:
  - Explorer surfaces are implemented on the prepared host.
  - Selected evidence and human-review slices have dated receipts.
  - Response-route convergence remains in integration.
  - A verified clean-machine quick start is not yet published.
  - Each live demonstration requires a fresh commit-bound preflight.
  source_refs:
  - source_id: sparta-private-readme
    section: Current Status and Closure Gates
  - source_id: sparta-private-readme
    section: Evaluate a Prepared Host
  claim_ids:
  - sparta-public-working-surfaces
  - sparta-private-response-gaps
  - sparta-private-deployment-gap
  - sparta-private-preflight
  visual:
    type: none
    position: right
    items: []
    callouts: []
  claim_guard:
    allowed_claim_ids: []
    requires_non_claim_ids: []
    forbidden_unqualified: []
  elements: []
