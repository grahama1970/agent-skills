  - path: body:3
    kind: non_claim
  - path: body:4
    kind: non_claim
  - path: footer
    kind: qualifier
    claim_id: sparta-public-working-surfaces
  - path: footer
    kind: qualifier
    claim_id: sparta-private-response-gaps
  - path: footer
    kind: qualifier
    claim_id: sparta-private-deployment-gap
  - path: footer
    kind: qualifier
    claim_id: sparta-private-preflight
  transition: slide
  transition_duration_ms: 400
  reveal: stagger_up
  hidden: false
  notes: 'Treat this as a prepared-host late-stage prototype claim and verify the
    exact commit, preflight, and current screenshots before presenting it.

    These named gaps keep the broader response-surface claim in integration rather
    than closed.

    Prepared-host orchestration is not a clone-and-run installation path or supported
    external deployment profile.

    The preflight receipt binds to commit c60318363 only; rerun it against the exact
    commit demonstrated and do not demonstrate on failure.'
