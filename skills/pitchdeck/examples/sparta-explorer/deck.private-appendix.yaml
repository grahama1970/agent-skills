- id: 03-prepared-host-route
  order: 3
  role: private-demo-route
  layout: flow
  visibility: private
  title: The demonstration route fails closed before the client session
  message: The prepared-host path binds source state, preflight, route capture, and
    visible degradation to one exact demonstration commit.
  body:
  - Pin the commit and working tree
  - Run the deterministic client preflight
  - Stop on any failed gate
  - Open Global Posture
  - Trace one relationship in Threat Matrix
  - Ask one bounded question beside the relevant surface
