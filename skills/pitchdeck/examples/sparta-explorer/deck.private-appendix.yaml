- id: 02-dated-proof
  order: 2
  role: private-dated-proof
  layout: proof_cards
  visibility: private
  title: Dated proof points establish bounded slices
  message: Counts and passes are useful only when the population, date, source artifact,
    and non-claim are carried with them.
  body:
  - Canonical QRA snapshot — 2,180 active canonical records, 2,180 aliases, 5,046
    quarantined records, zero duplicate active semantic identities, expected identity
    at rank 1.
  - Human-review slice — one accepted, one rejected, one pending, one accepted evidence
    case, two reviewed overlays, and one compliance-credit unit.
  - Chat campaign — 115 broad browser cases and 35 interaction cases in the dated
    aggregate receipt.
  - Proof boundary — implementation receipts do not substitute for broader expert
    review, response quality, or deployment closure.
  source_refs:
  - source_id: sparta-private-readme
    section: Dated Proof Points
  claim_ids:
