  - path: body:3
    kind: non_claim
  - path: footer
    kind: qualifier
    claim_id: sparta-private-qra-snapshot
  - path: footer
    kind: qualifier
    claim_id: sparta-private-review-slice
  - path: footer
    kind: qualifier
    claim_id: sparta-private-chat-campaign
  transition: slide
  transition_duration_ms: 400
  reveal: stagger_up
  hidden: false
  notes: 'Quote these counts only for the 2026-07-29 population and source artifact;
    canonical-active does not mean expert-approved or compliance-credited.

    This is a bounded 2026-07-29 slice and does not establish corpus-wide review or
