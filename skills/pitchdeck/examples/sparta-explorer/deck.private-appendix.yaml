- id: 04-answerability-contract
  order: 4
  role: private-answerability-contract
  layout: flow
  visibility: private
  title: Retrieval, answerability, language, and authority remain separate
  message: The governed response path preserves source identity, scopes the current
    turn, assembles evidence, decides answerability, presents a bounded response,
    and leaves the final decision to a person.
  body:
  - Preserve native sources and fingerprints
  - Build typed candidates and relationships
  - Scope the current question and recall boundary
  - Assemble the current evidence case
  - Return answerable, clarification, unsupported, or error
  - Present for inspection and human workflow
  source_refs:
  - source_id: sparta-answerability-contract
    section: Semantic contract
  - source_id: sparta-private-readme
    section: How Sparta Works
  claim_ids:
