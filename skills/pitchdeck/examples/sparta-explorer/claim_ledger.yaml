schema: pitchdeck.claim_ledger.v1
project_name: Sparta Explorer
claims:
- id: sparta-public-thesis
  text: Trace a space-cyber conclusion from framework guidance to program evidence
    and human review without letting AI turn relevance into authority.
  kind: thesis
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Introduction
  risk: medium
  status: candidate
  evidence_spans:
  - source_id: sparta-public-readme
    text: '**Trace a space-cyber conclusion from framework guidance to program evidence
      and human review—without letting AI turn relevance into authority.**'
- id: sparta-public-one-thread
  text: Sparta Explorer turns scattered space-cyber, engineering, supplier, and test
    evidence into one inspectable decision thread.
  kind: product
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Introduction
  risk: medium
  status: candidate
  evidence_spans:
  - source_id: sparta-public-readme
    text: '**Sparta Explorer turns scattered space-cyber, engineering, supplier, and
      test'
- id: sparta-public-three-questions
  text: The product helps teams ask why a conclusion is believed, what is missing
    or disputed, and who is allowed to decide.
  kind: product
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Introduction
  risk: low
  status: candidate
  evidence_spans:
  - source_id: sparta-public-readme
    text: 'It helps a team answer three practical questions:'
  - source_id: sparta-public-readme
    text: '**Why do we believe this?**'
  - source_id: sparta-public-readme
    text: '**What is missing, stale, disputed, or still only a candidate?**'
  - source_id: sparta-public-readme
    text: '**Who is allowed to decide?**'
- id: sparta-public-model-boundary
  text: The model helps users navigate while governed evidence and authorized people
    decide.
  kind: thesis
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Why Sparta Explorer
  risk: medium
  status: candidate
  evidence_spans:
  - source_id: sparta-public-readme
    text: governed evidence and authorized people decide.**
- id: sparta-public-relevance-not-support
  text: Search, embeddings, and graph traversal can identify relevant material without
    establishing support, scope, currency, or approval.
  kind: thesis
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Why Sparta Explorer
  risk: medium
  status: candidate
  evidence_spans:
  - source_id: sparta-public-readme
    text: '- **Relevance is not support.** Search, embeddings, and graph traversal
      identify'
- id: sparta-public-embry-foundation
  text: Sparta Explorer is the assurance workbench inside the planned Embry OS local
    operating foundation for policy-bounded and disconnected environments.
  kind: product
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Built on Embry OS
  risk: high
  status: candidate
  required_qualifier: Embry OS is a planned local operating foundation; it is not
    flight-control software and this claim does not establish deployment.
  evidence_spans:
  - source_id: sparta-public-readme
    text: '**Sparta Explorer is the assurance workbench inside Embry OS: one planned
      local'
- id: sparta-public-f36-demo
  text: The synthetic F-36 program world tests whether one evidence thread can serve
    program, engineering, supplier, test, and operational readers without collapsing
    authority boundaries.
  kind: product
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: The Synthetic F-36 Demonstration
  risk: medium
  status: candidate
  evidence_spans:
  - source_id: sparta-public-readme
    text: '| Synthetic F-36 demonstration | The program, engineering, supplier, test,
      and operational evidence thread. |'
- id: sparta-public-working-surfaces
  text: The prepared-host investigation experience includes Global Posture, Threat
    Matrix, Supply Chain, QRAs, Coverage, Controls, Sources, URLs, and a docked Console.
  kind: status
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Current Status and Closure Gates
  risk: high
  status: candidate
  required_qualifier: Treat this as a prepared-host late-stage prototype claim and
    verify the exact commit, preflight, and current screenshots before presenting
    it.
  evidence_spans:
  - source_id: sparta-public-readme
    text: '| **Explorer** | **Implemented:** repository-local Global Posture, Threat
      Matrix, Supply Chain, QRAs, Coverage, Controls, Sources, URLs, and docked Console
      surfaces. | Refresh the remaining older captures and continue page-level interaction
      proof as the UI changes. |'
- id: sparta-public-response-path-status
  text: On the governed path, Sparta Chat can answer, clarify, deflect, or expose
    insufficient evidence while transitional response branches remain open.
  kind: status
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Product Tour — Sparta Chat
  risk: high
  status: candidate
  required_qualifier: The governed path is bounded and transitional branches are still
    being converged; do not claim every visible response uses it.
  evidence_spans:
  - source_id: sparta-public-readme
    text: '| **Response path** | **In integration:** bounded answer, clarify, deflect,
      error, citation, selected-QRA, and visible-answer admission receipts exist on
      the governed path. | Remove or govern direct recall-cache release, raw QuerySpec
      rendering, and legacy Tau fallback; extend reviewed-only reuse across governed
      paths. |'
- id: sparta-public-collaboration-stage
  text: Sparta Explorer is ready for design-partner conversation, architecture walkthrough,
    workflow evaluation, co-design, and prepared-host technical sessions.
  kind: ask
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Why Collaborate Now
  risk: high
  status: candidate
  required_qualifier: The offer is a late-stage prototype and prepared-host evaluation,
    not a turnkey production deployment.
  evidence_spans:
  - source_id: sparta-public-readme
    text: '> walkthrough, workflow evaluation, co-design, and prepared-host technical'
- id: sparta-public-open-gates
  text: Independent corpus review, response-route convergence, QRA reasoning and reuse,
    decision authority, voice, setup, and deployment remain explicit closure gates.
  kind: roadmap
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Current Status and Closure Gates
  risk: medium
  status: candidate
  evidence_spans:
  - source_id: sparta-private-readme
    text: demo health, response-route convergence, independent corpus review, clean-machine
  - source_id: sparta-private-readme
    text: '**Separated:** identity, data access, release state, approval scope, and
      decision authority.'
- id: sparta-private-preflight
  text: A prepared-host client demo preflight passed for one exact commit and closed
    issue 38.
  kind: proof
  visibility: private
  source_refs:
  - source_id: sparta-private-readme
    section: Current Status and Closure Gates
  risk: high
  status: candidate
  required_qualifier: The preflight receipt binds to commit c60318363 only; rerun
    it against the exact commit demonstrated and do not demonstrate on failure.
  evidence_spans:
  - source_id: sparta-public-readme
    text: '| **Client demo** | **Prepared-host ready:** deterministic route, preflight,
      route capture, and evidence-bundle tooling exist, and issue #38 closed on a
      passing preflight bound to commit `c60318363` (`passed=true`, `failed_gates=[]`,
      `working_tree_clean=true`, `mocked=false`). | Rerun the preflight against each
      commit actually demonstrated; the receipt binds to one exact commit, not to
      the branch. |'
- id: sparta-private-qra-snapshot
  text: The dated issue 20 proof records 2,180 active canonical QRAs, 2,180 aliases,
    5,046 quarantined records, zero duplicate active semantic identities, and expected
    identity at rank 1.
  kind: proof
  visibility: private
  source_refs:
  - source_id: sparta-private-readme
    section: Dated Proof Points
  risk: high
  status: candidate
  required_qualifier: Quote these counts only for the 2026-07-29 population and source
    artifact; canonical-active does not mean expert-approved or compliance-credited.
  evidence_spans:
  - source_id: sparta-public-readme
    text: '- The issue #20 proof records 2,180 active canonical QRAs, 2,180 aliases,
      5,046 quarantined records, zero duplicate active semantic identities, and expected
      identity at rank 1 for the 2026-07-29 snapshot.'
- id: sparta-private-review-slice
  text: The dated issue 6 proof records one accepted decision, one rejected decision,
    one pending decision, one accepted evidence case, two reviewed overlays, and one
    compliance-credit unit.
  kind: proof
  visibility: private
  source_refs:
  - source_id: sparta-private-readme
    section: Dated Proof Points
  risk: high
  status: candidate
  required_qualifier: This is a bounded 2026-07-29 slice and does not establish corpus-wide
    review or quality.
  evidence_spans:
  - source_id: sparta-public-readme
    text: '- The issue #6 proof records one accepted decision, one rejected decision,
      one pending decision, one accepted evidence case, two reviewed overlays, and
      one compliance-credit unit for the bounded 2026-07-29 slice.'
- id: sparta-private-chat-campaign
  text: The dated Sparta Chat aggregate receipt records 115 broad browser cases and
    35 interaction cases.
  kind: proof
  visibility: private
  source_refs:
  - source_id: sparta-private-readme
    section: Dated Proof Points
  risk: high
  status: candidate
  required_qualifier: This dated local campaign is implementation evidence, not full
    response-quality or production-readiness proof.
  evidence_spans:
  - source_id: sparta-public-readme
    text: '- The Sparta Chat aggregate receipt records 115 broad browser cases and
      35 interaction cases for the dated local campaign.'
- id: sparta-private-answerability-contract
  text: The governed response path separates source preservation, candidate construction,
    current-turn scope, answerability, presentation, and human decision.
  kind: product
  visibility: private
  source_refs:
  - source_id: sparta-answerability-contract
    section: Semantic contract
  risk: medium
  status: candidate
  evidence_spans:
  - source_id: sparta-public-readme
    text: '| **Memory + `create-evidence-case`** | On the governed path, scope the
      current turn, retrieve candidate material, decide answerability, and select
      answer, clarify, or deflect. |'
- id: sparta-private-response-gaps
  text: Direct recall-cache release, raw QuerySpec rendering, legacy Tau fallback,
    and reviewed-only reuse remain named response-route gaps.
  kind: status
  visibility: private
  source_refs:
  - source_id: sparta-private-readme
    section: Current Status and Closure Gates
  risk: high
  status: candidate
  required_qualifier: These named gaps keep the broader response-surface claim in
    integration rather than closed.
  evidence_spans:
  - source_id: sparta-public-readme
    text: '| **Response path** | **In integration:** bounded answer, clarify, deflect,
      error, citation, selected-QRA, and visible-answer admission receipts exist on
      the governed path. | Remove or govern direct recall-cache release, raw QuerySpec
      rendering, and legacy Tau fallback; extend reviewed-only reuse across governed
      paths. |'
- id: sparta-private-deployment-gap
  text: A verified clean-machine quick start and supported external deployment profile
    are not yet published.
  kind: status
  visibility: private
  source_refs:
  - source_id: sparta-private-readme
    section: Evaluate a Prepared Host
  risk: high
  status: candidate
  required_qualifier: Prepared-host orchestration is not a clone-and-run installation
    path or supported external deployment profile.
  evidence_spans:
  - source_id: sparta-public-readme
    text: A verified clean-machine quick start is not yet published.
- id: sparta-private-qra-governance
  text: Candidate QRA generation, human interview and promotion, reasoning repair,
    and reviewed-only lineage reuse require distinct governance boundaries.
  kind: product
  visibility: private
  source_refs:
  - source_id: sparta-qra-governance
    section: Governance lifecycle
  risk: medium
  status: candidate
  evidence_spans:
  - source_id: sparta-public-readme
    text: '| **QRA reasoning and reuse** | Complete the reasoning-field repair and
      add reviewed-only predicates to remaining lineage-reuse paths. |'
