  visual:
    type: native_diagram
    position: right
    items:
    - Framework guidance
    - Program mapping candidate
    - Component and supplier lineage
    - Verification and test evidence
    - Review state and blockers
    - Human decision
    callouts: []
  claim_guard:
    allowed_claim_ids: []
    requires_non_claim_ids: []
    forbidden_unqualified: []
  elements: []
  bindings:
  - path: title
    kind: non_claim
  - path: message
    kind: non_claim
  - path: body:0
    kind: non_claim
  - path: body:1
    kind: non_claim
  - path: body:2
    kind: non_claim
  - path: body:3
    kind: non_claim
  - path: body:4
    kind: non_claim
  - path: body:5
    kind: non_claim
  - path: visual.items:0
    kind: non_claim
  - path: visual.items:1
    kind: non_claim
  - path: visual.items:2
    kind: non_claim
  - path: visual.items:3
    kind: non_claim
  - path: visual.items:4
    kind: non_claim
  - path: visual.items:5
    kind: non_claim
  transition: slide
  transition_duration_ms: 400
  reveal: stagger_up
  hidden: false
  notes: Say explicitly that F-36 is a fictional synthetic program world. The demo
    tests separation and lineage; it does not represent operational program truth.
- id: 06-embry-os
  order: 6
  role: embry-os-foundation
  layout: split
  visibility: public
  title: Shared foundation, separated authority
  message: Plant and warfighter-program evidence can share governed local infrastructure
    while identity, data, release state, approval scope, and decision authority remain
    mission-separated.
  body:
  - Shared — governed memory, evidence lineage, monitoring, orchestration, local inference,
    and human review.
  - Separated — identity, data access, release state, approval scope, and decision
    authority.
  - Evidence continuity informs assurance without silently becoming operational truth.
  source_refs:
  - source_id: sparta-public-readme
    section: Built on Embry OS
  claim_ids:
  - sparta-public-embry-foundation
  visual:
    type: image
    asset_id: sparta-embry-os-foundation
    position: right
    items: []
    callouts: []
    caption: Synthetic conceptual illustration; not a live product capture or deployment
      claim.
  claim_guard:
    allowed_claim_ids: []
    requires_non_claim_ids: []
    forbidden_unqualified: []
  elements: []
  bindings:
  - path: title
    kind: non_claim
  - path: message
    kind: non_claim
  - path: body:0
    kind: non_claim
  - path: body:1
    kind: non_claim
  - path: body:2
    kind: non_claim
  - path: footer
    kind: qualifier
    claim_id: sparta-public-embry-foundation
  transition: slide
  transition_duration_ms: 400
  reveal: stagger_up
  hidden: false
  notes: Embry OS is a planned local operating foundation; it is not flight-control
    software and this claim does not establish deployment.
  footer: Embry OS is a planned local operating foundation; it is not flight-control
    software and this claim does not establish deployment.
- id: 07-threat-matrix
  order: 7
  role: product-surface-threat-matrix
  layout: screenshot
  visibility: public
  title: Threat Matrix keeps relationship state visible
  message: Enter through a synthetic requirement and inspect tactic coverage, mapping
    provenance, direction, review state, and the next unresolved decision.
  body:
  - Candidate coverage remains separate from reviewed controls.
  - Adjacency is never proof.
  - Direction, source, release, and review state remain inspectable.
  source_refs:
  - source_id: sparta-public-readme
    section: The Product in One View — Threat Matrix
  claim_ids:
  - sparta-public-working-surfaces
