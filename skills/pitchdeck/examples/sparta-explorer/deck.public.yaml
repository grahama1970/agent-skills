  visual:
    type: screenshot
    asset_id: sparta-threat-matrix
    position: right
    items: []
    callouts:
    - Synthetic F-36 scope
    - Candidate versus reviewed state
    - Next unresolved decision
    caption: Dated live local capture; recapture from the exact demonstration commit
      if the UI has changed.
  claim_guard:
    allowed_claim_ids: []
    requires_non_claim_ids: []
    forbidden_unqualified: []
  elements: []
  bindings:
  - path: title
    kind: non_claim
  - path: message
    kind: non_claim
  - path: body:0
