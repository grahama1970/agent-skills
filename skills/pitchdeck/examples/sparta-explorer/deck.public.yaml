  transition: slide
  transition_duration_ms: 400
  reveal: stagger_up
  hidden: false
  notes: 'The offer is a late-stage prototype and prepared-host evaluation, not a
    turnkey production deployment.

    The F-36 corpus and program world are fictional and synthetic.

    Candidate visibility is not compliance credit.

    A model may explain; authorized people retain approval, risk, certification, and
    signoff authority.

    Prepared-host receipts bind to the exact demonstrated commit and must be rerun
    before a live demonstration.

    This deck does not establish production readiness, accreditation, certification,
    customer deployment, or endorsement.'
  footer: The offer is a late-stage prototype and prepared-host evaluation, not a
    turnkey production deployment.
