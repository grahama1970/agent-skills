  transition_duration_ms: 400
  reveal: stagger_up
  hidden: false
  notes: The governed path is bounded and transitional branches are still being converged;
    do not claim every visible response uses it.
  footer: The governed path is bounded and transitional branches are still being converged;
    do not claim every visible response uses it.
- id: 10-proof-today
  order: 10
  role: proof-today
  layout: proof_cards
  visibility: public
  title: Working evidence, not product theater
  message: The project can support a bounded prepared-host evaluation today while
    keeping broader corpus, response-route, and deployment closure explicit.
  body:
  - Working surfaces — Threat Matrix, Global Posture, Supply Chain, QRA review, corpus
    views, and docked Console exist on the prepared host.
  - Review separation — candidate, reviewed, accepted, rejected, pending, and compliance-credit
    states remain distinct.
  - Bounded proof — dated receipts exist for selected retrieval, review, answerability,
    and interaction paths.
  - Design-partner stage — the offer is workflow evaluation, architecture review,
    co-design, and prepared-host technical sessions.
  source_refs:
  - source_id: sparta-public-readme
    section: Current Status and Closure Gates
  - source_id: sparta-public-readme
    section: Why Collaborate Now
