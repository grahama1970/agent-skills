- id: 12-collaboration
  order: 12
  role: collaboration-ask
  layout: collaboration
  visibility: public
  title: Trace one representative claim together
  message: A useful next conversation tests one real workflow from framework source
    through program relationship, component or supplier lineage, evidence, review
    state, and final human decision.
  body:
  - Workflow co-design — validate how assessors, engineers, suppliers, program teams,
    and risk owners move through one evidence thread.
  - Integration design — prioritize GRC, OSCAL, PLM, requirements, test, supplier,
    identity, and evidence-store boundaries.
  - Deployment planning — define prepared-host, disconnected, policy-bounded, logging,
    access-control, and review requirements.
  source_refs:
  - source_id: sparta-public-readme
    section: Collaboration
  claim_ids:
  - sparta-public-collaboration-stage
  - non-claim-f36-synthetic
  - non-claim-candidate-credit
  - non-claim-human-authority
  - non-claim-preflight-commit
  - non-claim-no-production
  visual:
    type: none
    position: right
    items: []
    callouts: []
  claim_guard:
    allowed_claim_ids:
    - sparta-public-collaboration-stage
    requires_non_claim_ids:
    - non-claim-f36-synthetic
    - non-claim-candidate-credit
    - non-claim-human-authority
    - non-claim-preflight-commit
    - non-claim-no-production
