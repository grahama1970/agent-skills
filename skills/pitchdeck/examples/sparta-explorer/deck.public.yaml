    commit, preflight, and current screenshots before presenting it.
  footer: Treat this as a prepared-host late-stage prototype claim and verify the
    exact commit, preflight, and current screenshots before presenting it.
- id: 08-global-posture
  order: 8
  role: product-surface-global-posture
  layout: screenshot
  visibility: public
  title: Global Posture starts with the strongest blocker
  message: A degraded state is a truthful answer when evidence is missing, stale,
    disputed, or insufficient for signoff.
  body:
  - Lead with the strongest current blocker.
  - Keep unavailable readings unavailable rather than inventing zeroes.
  - Link posture back to evidence and unresolved decisions.
  source_refs:
  - source_id: sparta-public-readme
    section: Product Tour — Global Posture
  claim_ids:
  - sparta-public-working-surfaces
  visual:
    type: screenshot
    asset_id: sparta-global-posture
    position: right
    items: []
    callouts:
    - Readiness verdict
    - Named evidence gap
    - Supplier and threat context
    caption: Dated live local capture; degraded is valid behavior, not a failed demo.
  claim_guard:
    allowed_claim_ids: []
    requires_non_claim_ids: []
    forbidden_unqualified: []
  elements: []
