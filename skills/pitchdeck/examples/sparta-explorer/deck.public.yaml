schema: pitchdeck.deck_manifest.v1
deck:
  id: sparta-explorer-public
  title: Sparta Explorer — Inspectable Space-Cyber Assurance
  subtitle: Trace a conclusion from framework guidance to program evidence and human
    review
  audience: Aerospace and defense design partners, assessors, engineers, cyber analysts,
    and program leads
  visibility: public
  target_editor: google_slides
  theme: dark_cyan_evidence
  source_policy: public_only
  author: Graham Anderson
slides:
- id: 01-cover
  order: 1
  role: cover
  layout: cover
  visibility: public
  title: Sparta Explorer
  message: Trace a space-cyber conclusion from framework guidance to program evidence
    and human review—without letting AI turn relevance into authority.
  body: []
  source_refs:
  - source_id: sparta-public-readme
    section: Introduction
  claim_ids:
  - sparta-public-thesis
  visual:
    type: screenshot
    asset_id: sparta-threat-matrix
    position: right
    items: []
    callouts: []
  claim_guard:
    allowed_claim_ids: []
    requires_non_claim_ids: []
    forbidden_unqualified: []
  elements: []
  bindings:
  - path: title
    kind: non_claim
  - path: message
    kind: non_claim
  transition: slide
  transition_duration_ms: 400
  reveal: stagger_up
  hidden: false
  notes: Public design-partner opener. Keep the proposition intact and do not add
    deployment, customer, or readiness language.
- id: 02-problem
  order: 2
  role: problem
  layout: statement
  visibility: public
  title: The failure is not finding another document
  message: The failure is carrying a defensible claim across frameworks, program records,
    suppliers, tests, review states, and decision owners without collapsing their
    authority.
  body:
  - General-purpose models remain fluent when evidence is weak.
  - Relevance is easily mistaken for evidentiary support.
  - Candidate mappings can look like approved compliance conclusions.
  - Teams rebuild the same decision thread across disconnected tools.
  source_refs:
  - source_id: sparta-public-readme
    section: Why Sparta Explorer
  claim_ids:
  - sparta-public-one-thread
  - sparta-public-relevance-not-support
  visual:
    type: none
    position: right
    items: []
    callouts: []
  claim_guard:
    allowed_claim_ids: []
    requires_non_claim_ids: []
    forbidden_unqualified: []
  elements: []
  bindings:
  - path: title
    kind: non_claim
  - path: message
    kind: non_claim
  - path: body:0
    kind: non_claim
  - path: body:1
    kind: non_claim
  - path: body:2
    kind: non_claim
  - path: body:3
    kind: non_claim
  transition: slide
  transition_duration_ms: 400
  reveal: stagger_up
  hidden: false
  notes: Frame the problem as evidence and authority fragmentation, not as a generic
    search or chatbot problem.
- id: 03-thesis
  order: 3
  role: product-thesis
  layout: three_cards
  visibility: public
  title: Three boundaries make the product useful
  message: The system is designed to make uncertainty and authority visible rather
    than turn navigation into approval.
  body:
  - Relevance is not support — retrieval identifies useful material but does not prove
    the claim.
  - Candidate visibility is not compliance credit — proposed mappings stay separate
    from reviewed conclusions.
  - A model may explain; a person still decides — approval, risk, certification, and
    signoff remain human authorities.
  source_refs:
  - source_id: sparta-public-readme
    section: Why Sparta Explorer
  claim_ids:
  - sparta-public-relevance-not-support
  - sparta-public-model-boundary
  - non-claim-candidate-credit
  - non-claim-human-authority
  visual:
    type: none
    position: right
    items: []
    callouts: []
  claim_guard:
    allowed_claim_ids: []
    requires_non_claim_ids: []
    forbidden_unqualified: []
  elements: []
  bindings:
  - path: title
    kind: non_claim
  - path: message
    kind: non_claim
  - path: body:0
    kind: non_claim
  - path: body:1
    kind: non_claim
  - path: body:2
    kind: non_claim
  transition: slide
  transition_duration_ms: 400
  reveal: stagger_up
  hidden: false
  notes: This is the deck's intellectual center. Preserve the three distinctions exactly
    enough that later slides cannot imply stronger authority.
- id: 04-product
  order: 4
  role: product-in-one-view
  layout: split
  visibility: public
  title: One inspectable decision thread
  message: Start with a threat, control, requirement, component, supplier, test, or
    finding and follow the relevant evidence, derivation, uncertainty, and remaining
    human decision.
  body:
  - Why do we believe this?
  - What is missing, stale, disputed, or still only a candidate?
  - Who is allowed to decide?
  - What blocks signoff next?
  source_refs:
  - source_id: sparta-public-readme
    section: Introduction
  claim_ids:
  - sparta-public-one-thread
  - sparta-public-three-questions
  visual:
    type: none
    position: right
    items: []
    callouts: []
  claim_guard:
    allowed_claim_ids: []
    requires_non_claim_ids: []
    forbidden_unqualified: []
  elements: []
  bindings:
  - path: title
    kind: non_claim
  - path: message
    kind: non_claim
  - path: body:0
    kind: non_claim
  - path: body:1
    kind: non_claim
  - path: body:2
    kind: non_claim
  - path: body:3
    kind: non_claim
  transition: slide
  transition_duration_ms: 400
  reveal: stagger_up
  hidden: false
  notes: Use native slide shapes for the decision-thread visual; do not paste the
    README's long workflow verbatim.
- id: 05-f36-demo
  order: 5
  role: synthetic-f36-demonstration
  layout: flow
  visibility: public
  title: A synthetic F-36 world tests the hard boundary
  message: Can one evidence thread serve program, engineering, supplier, test, and
    operational readers without silently transferring authority between them?
  body:
  - Framework guidance
  - Program mapping candidate
  - Component and supplier lineage
  - Verification and test evidence
  - Review state and blockers
  - Human decision
  source_refs:
  - source_id: sparta-public-readme
    section: The Synthetic F-36 Demonstration
  claim_ids:
  - sparta-public-f36-demo
