    kind: non_claim
  - path: message
    kind: non_claim
  - path: body:0
    kind: non_claim
  - path: body:1
    kind: non_claim
  - path: body:2
    kind: non_claim
  - path: footer
    kind: qualifier
    claim_id: sparta-public-working-surfaces
  transition: slide
  transition_duration_ms: 400
  reveal: stagger_up
  hidden: false
  notes: Treat this as a prepared-host late-stage prototype claim and verify the exact
    commit, preflight, and current screenshots before presenting it.
  footer: Treat this as a prepared-host late-stage prototype claim and verify the
    exact commit, preflight, and current screenshots before presenting it.
- id: 09-sparta-chat
  order: 9
  role: product-surface-sparta-chat
  layout: screenshot
  visibility: public
  title: Chat stays beside the evidence surface
  message: On the governed route, the Console can answer, clarify, deflect, or expose
    insufficient evidence while showing the response stages and citations beside the
    work that prompted the question.
  body:
  - Scope the current turn and recall boundary.
  - Assemble a current evidence case.
  - Separate answerability from language generation.
  - Fail closed rather than manufacture support.
  source_refs:
  - source_id: sparta-public-readme
    section: Product Tour — Sparta Chat
  claim_ids:
  - sparta-public-response-path-status
  visual:
    type: screenshot
    asset_id: sparta-chat-console
    position: right
    items: []
    callouts:
    - Page-aware question context
    - Visible processing stages
    - Cited bounded response
    caption: Dated live local capture; transitional response branches remain in integration.
  claim_guard:
    allowed_claim_ids: []
    requires_non_claim_ids: []
    forbidden_unqualified: []
  elements: []
  bindings:
  - path: title
    kind: non_claim
  - path: message
    kind: non_claim
  - path: body:0
    kind: non_claim
  - path: body:1
    kind: non_claim
  - path: body:2
    kind: non_claim
  - path: body:3
    kind: non_claim
  - path: footer
    kind: qualifier
    claim_id: sparta-public-response-path-status
