    kind: non_claim
  - path: message
    kind: non_claim
  - path: body:0
    kind: non_claim
  - path: body:1
    kind: non_claim
  - path: body:2
    kind: non_claim
  - path: body:3
    kind: non_claim
  - path: body:4
    kind: non_claim
  - path: body:5
    kind: non_claim
