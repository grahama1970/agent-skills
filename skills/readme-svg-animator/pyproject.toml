[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-svg-animator"
version = "0.1.0"
description = "Deterministic animated SVG generator and validator for GitHub READMEs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "defusedxml>=0.7.1",
  "lxml>=5.2",
  "loguru>=0.7,<0.7.3",
  "Pillow>=10.4",
  "playwright>=1.47",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "tinycss2>=1.3",
  "typer>=0.12",
]

[project.scripts]
readme-svg = "readme_svg_animator.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "browser: real Chromium verification",
]
