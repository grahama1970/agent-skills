[project]
name = "get-subtitles"
version = "0.1.0"
description = "Verify and recover movie subtitles through Bazarr, with Brave-backed discovery."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
