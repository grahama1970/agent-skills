      test -s skills/monitor-opportunities/plans/01_BEST_IN_CLASS_ROADMAP_TASKS.yaml &&
      test -s /mnt/storage12tb/skills/governance/reports/8e561829c30c47a3/20260815T150702Z/report.json &&
