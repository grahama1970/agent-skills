version: 1
kind: orchestrate-plan
repo_root: /home/graham/workspace/experiments/agent-skills-worktrees/monitor-opportunities-cron-main

metadata:
  title: Monitor Opportunities Best-In-Class Roadmap
  created: "2026-08-15"
  owner: monitor-opportunities
  plan_type: code
  primary_persona:
    name: Graham Anderson
    role: Candidate, consultant, and human approver for opportunity actions
    source: skills/monitor-opportunities/SKILL.md
  goal: >
    Turn monitor-opportunities into a dependable Stage 0 leads and opportunity generator
    for human-agent collaboration: small ranked opportunity sets, source-grounded
    relationship paths, claim-bound resume variants, no external effects without exact
    human authorization, and a morning report that is the single source of truth.
  immutable_goal: >
    Daily top opportunities that are highly targeted, delivered in an interactive
    report/interview, with human-authorized application preparation using a custom
    targeted resume given the algorithm likely employed by the employer or client.
  roadmap_source:
    webgpt_response: /mnt/storage12tb/skills/ask/outputs/monitor-opportunities-best-in-class-roadmap-20260815/ask-tau-review-the-attached-monitor-oppo-5b371f8d40e3/node-artifacts/handler-webgpt/response.md
    governance_report: /mnt/storage12tb/skills/governance/reports/8e561829c30c47a3/20260815T150702Z/report.json
  readiness_definition: >
    Stage 0 readiness means the cron path can run without external effects, produces a
    validated report manifest and HTML report, truthfully reports degraded or skipped
    sources, exposes all action-worthy artifacts in the report, preserves relationship
    evidence for human LinkedIn/Gmail handoff decisions, and emits deterministic receipts
    that create-report or another project agent can consume.

execution:
  max_concurrency: 1
  wave_barrier: true
  scheduling_policy: dependency_only
  per_slice_review:
    required: true
    handler: webgpt
    skill: ask
    purpose: >
      After each implementation slice passes its deterministic local command,
      attach the slice diff, proof output, and updated project-state summary to a
      real /ask Tau webgpt run. Treat the review as advisory drift detection;
      local deterministic receipts remain the closure authority.
    required_artifacts:
      - slice_review_bundle.md
      - ask run_dir
      - node-artifacts/handler-webgpt/node-receipt.json
      - node-artifacts/handler-webgpt/response.md
      - node-artifacts/join/node-receipt.json when present
  operator_note: >
    These tasks are ordered acceptance gates for project-agent implementation. The
    project agent edits the named monitor-opportunities files between gates; the local
    commands prove each slice. Promotion gates are intentionally excluded from automatic
    execution because Stage 0 forbids external effects without human authorization.

capability_overlap:
  memory_recall:
    command: >
      ./skills/memory/run.sh recall --q "create full YAML plan and implement WebGPT
      roadmap recommendations for monitor-opportunities best-in-class human-agent
      opportunity generator" --brief
    result: >
      Attempted on 2026-08-15 and timed out after 30 seconds against 127.0.0.1:8601.
      The plan therefore records Memory integration requirements from the current
      skill contract and WebGPT review rather than claiming fresh recall evidence.
  existing_skills:
    memory: CALL for governed BM25, semantic, and graph recall; do not use raw ArangoDB.
    monitor-contacts: CALL for direct and adjacent relationship evidence.
    brave-search: CALL for primary source and company/event discovery.
    surf: CALL for read-only browser capture when APIs fail or human-supplied tabs exist.
    ask: CALL for WebGPT and roundtable review artifacts.
    scheduler: CALL only after deterministic pre-cron gates pass.
    agentic-evals: CALL for deterministic admission checks before cron.
    create-report: CALL by downstream agents against the report manifest; this skill must emit stable report artifacts.
  extend_existing:
    - skills/monitor-opportunities/src/monitor_opportunities
    - skills/monitor-opportunities/tests
    - skills/monitor-opportunities/schemas
    - skills/monitor-opportunities/config
  create_only_when_needed:
    - relationship_candidate.v1 schema or fixture if the existing report schema cannot express degree-grounded contact paths.
    - screening_interface_profile.v1 fixture additions if existing profile fields lack required evidence and limitations.

questions_blockers: []

non_negotiable_constraints:
  - No auto-apply, no auto-submit, no auto-send, no LinkedIn automation, no Meetup RSVP automation.
  - Every action-worthy artifact must have visible_in_report true and hidden_total must be zero.
  - Meetup evidence is supplemental only; it must not admit an opportunity by itself.
  - Corporate email may be stale or blocked; prefer human LinkedIn handoff when source evidence supports it.
  - A source API failure must fall back to read-only website capture or fail with an explicit degraded receipt.
  - A model or reviewer claim is not proof; local schema, tests, receipts, and run artifacts are proof.
  - Capability promotions are separate, explicit, receipt-bound, revocable, and human-authorized.

lanes:
  - id: "0"
    label: Planning and baseline
  - id: "1"
    label: Cron-safe source-of-truth report
  - id: "2"
    label: Relationship and memory intelligence
  - id: "3"
    label: Meetup, screening, and human decisions
  - id: "4"
    label: Pre-cron admission

