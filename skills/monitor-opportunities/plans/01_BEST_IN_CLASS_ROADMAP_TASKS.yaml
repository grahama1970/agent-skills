promotion_gates:
  - id: MO-PROMOTE-11
    title: Promote private tracker writes only after zero-effect replay proof
    depends_on:
      - MO-ROAD-10
    required_human_authorization: true
    must_not_run_in_stage0_cron: true
    proof_required:
      - exact repository target
      - dry-run issue payloads
      - dedup and alias replay receipts
      - rollback path
  - id: MO-PROMOTE-12
    title: Promote ATS selector memory writes only after selector read receipts stabilize
    depends_on:
      - MO-ROAD-10
    required_human_authorization: true
    must_not_run_in_stage0_cron: true
    proof_required:
      - accepted selector schema
      - write-noop replay
      - stale selector rejection fixture
      - source URL and digest binding
  - id: MO-PROMOTE-13
    title: Promote provider-live Tau canary only as an explicit addendum
    depends_on:
      - MO-ROAD-10
    required_human_authorization: true
    must_not_run_in_stage0_cron: true
    proof_required:
      - provider_live true receipt
      - closed-schema parser
      - no external site effects
      - install receipt bound to a report manifest
  - id: MO-PROMOTE-14
    title: Promote exact-payload local draft workflow only after separate draft authorization
    depends_on:
      - MO-ROAD-10
    required_human_authorization: true
    must_not_run_in_stage0_cron: true
    proof_required:
      - exact payload digest
      - recipient and channel evidence
      - roundtable SEND_AS_IS or SEND_WITH_REVISIONS receipt
      - draft-only effect receipt
