[project]
name = "monitor-opportunities"
version = "0.1.0"
description = "Zero-network Stage 0 report kernel for monitor-opportunities"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jsonschema>=4.23,<5",
    "python-dotenv>=1.0.0",
  "httpx>=0.28,<1",
  "loguru>=0.7,<1",
  "pydantic>=2.10,<3",
  "pytest>=8,<10",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
monitor-opportunities = "monitor_opportunities.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor_opportunities"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
