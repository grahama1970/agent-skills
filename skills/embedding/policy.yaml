# /embedding skill policy — enforced by .claude/hooks/skill_policy.py
# Agents reimplement embeddings with sentence_transformers/faiss instead of
# using the service. 3 violations in post-check logs. Also wrong ports and
# dimension mismatches cause silent data corruption.

name: embedding
slash_command: /embedding

required_reads:
  - .pi/skills/embedding/SKILL.md

forbidden_use:
  any_of:
    # Reimplementing embeddings locally
    - import: sentence_transformers
      reason: "Don't import sentence_transformers. Use embedding service at localhost:8602."
    - pattern: "SentenceTransformer"
      reason: "Don't instantiate SentenceTransformer. Use embedding service at localhost:8602."
    - import: faiss
      reason: "Don't import faiss directly. Use /vector-store skill or embedding service."
    - pattern: "faiss\\."
      reason: "Don't use faiss directly. Use /vector-store skill or embedding service."

    # Wrong port for multimodal (8602 is text-only, 8603 is multimodal)
    - pattern: "8602.*/v1/embeddings"
      reason: "Wrong port. /v1/embeddings is multimodal on port 8603, not 8602."
    - pattern: "8602.*/pooling"
      reason: "Wrong port. /pooling is multimodal on port 8603, not 8602."

    # Setting embedding fields to null (blocks vector index)
    - pattern: '"embedding"\\s*:\\s*null|"embedding_visual"\\s*:\\s*null'
      reason: "Don't set embedding fields to null. Omit the field entirely if no embedding."

    # Wrong sort direction for cosine similarity
    - pattern: "APPROX_NEAR_COSINE.*ASC"
      reason: "APPROX_NEAR_COSINE must sort DESC, not ASC."
