name: mechanisms
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run python -m compileall -q src scripts
      - run: uv run python scripts/verify.py --profile core --trials 3 --samples 128
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification
          path: reports/qualification/
# Browser/full and native release are explicit operator gates, not implied by this job.
# Resolve/commit uv.lock and pin reviewed action SHAs before treating this as a release workflow.
