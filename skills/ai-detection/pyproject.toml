[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-detection"
version = "0.1.0"
description = "Local-first coding-assessment evidence and AI-code detection research workbench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ai-detection contributors"}]
dependencies = [
  "fastapi>=0.128.2,<1", "starlette>=0.50,<1", "uvicorn>=0.48,<1", "pydantic>=2.13.4,<3",
  "typer>=0.26.3,<1", "loguru>=0.7.3,<1", "httpx>=0.28.1,<1",
  "numpy>=2.3.5,<3", "scipy>=1.17,<2", "scikit-learn>=1.8,<2", "PyYAML>=6.0.3,<7",
  "python-dotenv>=1.0.0,<2"
]
[project.optional-dependencies]
dev = ["pytest>=9.0.2,<10", "playwright>=1.57,<2", "ruff>=0.12,<1"]
research = ["torch>=2.6", "transformers>=4.57,<6", "safetensors>=0.6"]
[project.scripts]
ai-detection = "ai_detection.cli:app"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
ai_detection = ["static/*", "resources/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.ruff.lint.per-file-ignores]
# Typer evaluates option defaults at decoration time; Path.cwd() there is the
# documented Typer idiom, not a shared-mutable-default bug.
"src/ai_detection/cli.py" = ["B008"]
