[project]
name = "personaplex-skill"
version = "0.1.0"
description = "PersonaPlex voice prompt bridge for Orpheus-TTS persona artifacts"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "loguru>=0.7",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "soundfile>=0.12",
  "pyyaml>=6.0",
  "websockets>=16.0",
]

[project.optional-dependencies]
personaplex = ["torch>=2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
