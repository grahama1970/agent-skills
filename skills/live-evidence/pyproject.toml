[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "live-evidence"
version = "0.1.0"
description = "Local-first realtime interview evidence copilot"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "loguru>=0.7,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
stt = [
  "RealtimeSTT[faster-whisper] @ git+https://github.com/grahama1970/RealtimeSTT.git@cbdbd12a8f573a92d7ffd14cfbd82baa59a59849",
]

[project.scripts]
live-evidence = "live_evidence.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/live_evidence"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
