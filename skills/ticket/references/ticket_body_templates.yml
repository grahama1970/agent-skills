schema: ticket.templates.v1
required_common_fields:
  - Type
  - Target
  - Current state
  - Requested outcome
  - Required proof
  - Route
  - Requested repair agent
  - Non-goals
footer: >
  This ticket was generated by the ticket skill and must be resolved under
  best-practices-github-ticket. Closure requires deterministic proof; reviewer
  opinion or CI green alone is not sufficient.
