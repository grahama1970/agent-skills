    <rect x="150.0" y="640" width="360" height="220" rx="16" fill="rgba(8,18,26,0.78)" stroke="rgba(255,255,255,0.2)" stroke-width="3.0"/>
    <circle cx="210.0" cy="700" r="26" fill="#00FF10"/>
    <text x="210.0" y="700" class="rsa-sans" font-size="34" fill="#0A0E14" text-anchor="middle" dominant-baseline="central" font-weight="700">1</text>
    <text x="330.0" y="770" class="rsa-sans rsa-shadow" font-size="38.0" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" letter-spacing="2.0">TURN</text>
    <text x="330.0" y="805.635" class="rsa-mono" font-size="22.099999999999998" fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="central">shame validates, triage</text>
    <text x="330.0" y="834.365" class="rsa-mono" font-size="22.099999999999998" fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="central">names failures</text>
  </g>
  <g data-target="target-card-1" class="rsa-target rsa_a004">
    <rect x="570.0" y="640" width="360" height="220" rx="16" fill="rgba(8,18,26,0.78)" stroke="rgba(255,255,255,0.2)" stroke-width="3.0"/>
    <circle cx="630.0" cy="700" r="26" fill="#00F3FF"/>
    <text x="630.0" y="700" class="rsa-sans" font-size="34" fill="#0A0E14" text-anchor="middle" dominant-baseline="central" font-weight="700">2</text>
    <text x="750.0" y="770" class="rsa-sans rsa-shadow" font-size="38.0" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" letter-spacing="2.0">WORKFLOW</text>
    <text x="750.0" y="803.1" class="rsa-mono" font-size="26.0" fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="central">ask compiles, tau</text>
    <text x="750.0" y="836.9" class="rsa-mono" font-size="26.0" fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="central">executes and accepts</text>
  </g>
  <g data-target="target-card-2" class="rsa-target rsa_a006">
    <rect x="990.0" y="640" width="360" height="220" rx="16" fill="rgba(8,18,26,0.78)" stroke="rgba(255,255,255,0.2)" stroke-width="3.0"/>
    <circle cx="1050.0" cy="700" r="26" fill="#FFB020"/>
    <text x="1050.0" y="700" class="rsa-sans" font-size="34" fill="#0A0E14" text-anchor="middle" dominant-baseline="central" font-weight="700">3</text>
    <text x="1170.0" y="770" class="rsa-sans rsa-shadow" font-size="38.0" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" letter-spacing="2.0">OPERATIONS</text>
    <text x="1170.0" y="803.1" class="rsa-mono" font-size="26.0" fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="central">watchdog dispatches,</text>
    <text x="1170.0" y="836.9" class="rsa-mono" font-size="26.0" fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="central">herdr transports</text>
  </g>
  <g data-target="target-card-3" class="rsa-target rsa_a008">
    <rect x="1410.0" y="640" width="360" height="220" rx="16" fill="rgba(8,18,26,0.78)" stroke="rgba(255,255,255,0.2)" stroke-width="3.0"/>
    <circle cx="1470.0" cy="700" r="26" fill="#E5683C"/>
    <text x="1470.0" y="700" class="rsa-sans" font-size="34" fill="#0A0E14" text-anchor="middle" dominant-baseline="central" font-weight="700">4</text>
    <text x="1590.0" y="770" class="rsa-sans rsa-shadow" font-size="38.0" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" letter-spacing="2.0">MEMORY</text>
    <text x="1590.0" y="805.635" class="rsa-mono" font-size="22.099999999999998" fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="central">labels, minted codes,</text>
    <text x="1590.0" y="834.365" class="rsa-mono" font-size="22.099999999999998" fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="central">receipts recalled</text>
  </g>
  <text x="960" y="960" class="rsa-sans" font-size="30.0" fill="rgba(255,255,255,0.55)" text-anchor="middle" dominant-baseline="central" letter-spacing="3.0">ONE VOCABULARY, EVERY LAYER - AMBIGUITY IS UNREPRESENTABLE</text>
</svg>
