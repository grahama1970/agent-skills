# /extractor skill policy — enforced by .claude/hooks/skill_policy.py
# Anti-patterns from SKILL.md: PyMuPDF (AGPL), unbounded concurrency, wrong mode

name: extractor
slash_command: /extractor

required_reads:
  - .pi/skills/extractor/SKILL.md

forbidden_use:
  any_of:
    # PyMuPDF is AGPL-licensed — use extract-pdf (MIT) or the extractor pipeline instead
    - import: fitz
      reason: "PyMuPDF (fitz) is AGPL-licensed. Use /extractor pipeline or /extract-pdf (MIT-licensed pdf_oxide)."
    - import: pymupdf
      reason: "PyMuPDF is AGPL-licensed. Use /extractor pipeline or /extract-pdf (MIT-licensed pdf_oxide)."

    # Unbounded concurrency (Common Mistakes: 79+ processes, 141GB RAM incident)
    - pattern: "for.*pdf.*subprocess\\.run.*extractor"
      reason: "Don't spawn extractors in a loop without concurrency limit. Enforce MAX_CONCURRENT=4 to avoid system swap death."
    - pattern: "for.*glob.*run\\.sh.*--accurate"
      reason: "Don't run --accurate on all PDFs in a loop. Use --fast first pass, --accurate only on high-value docs."

    # Wrong HTTP client
    - import: requests
      reason: "Use httpx, not requests."
