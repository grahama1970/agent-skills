[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-extractor"
version = "0.2.0"
description = "Thin wrapper for canonical Extractor file extraction"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.setuptools]
py-modules = ["extract"]
