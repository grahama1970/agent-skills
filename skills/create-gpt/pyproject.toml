[project]
name = "create-gpt"
version = "0.1.0"
description = "Train task-specific small GPTs (Tier 1.5) with SFT, GRPO, and microgpt"
readme = "SKILL.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.20.0,<4.4.0",
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "llama-cpp-python>=0.3.0",
    "loguru>=0.7.0,<0.7.3",
    "optuna>=3.6.0",
    "peft>=0.12.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.0",
    "rich>=13.7.0",
    "runpod>=1.8.1",
    "runpod-flash>=1.10.0",
    "sentencepiece>=0.2.0",
    "tiktoken",
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "trl>=0.9.0",
    "typer>=0.12.0",
    "unsloth>=2026.3.10",
    "wandb",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17.0", "tensorboard>=2.17.0"]
flash = ["runpod>=1.7.0"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
