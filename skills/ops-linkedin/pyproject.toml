[project]
name = "pi-skill-ops-linkedin"
version = "0.1.0"
description = "Draft-only LinkedIn operations with typed human handoff receipts"
requires-python = ">=3.11,<3.14"
dependencies = [
  "loguru>=0.7.2,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
ops-linkedin = "ops_linkedin.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_linkedin"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
