[project]
name = "pi-skill-monitor-contacts"
version = "0.1.0"
description = "Runtime package for the monitor-contacts skill"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loguru>=0.7.0,<0.7.3",
    "typer>=0.9.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["monitor_contacts*"]
