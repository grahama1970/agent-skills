    heading: GUARD + SCAN
    detail: Pydantic checks state, registry, issues; target locks avoid races
    accent: cyan
  - number: 2
    heading: REPAIR LANE
    detail: Ask compiles DAG; Tau runs creator and independent reviewer
    accent: green
  - number: 3
    heading: PROOF + CLOSE
    detail: Pydantic validates plans and receipts; ticket reruns proof
    accent: amber
  - number: 4
    heading: AUDIT + TRIAGE
    detail: closure audit reopens gaps; triage-error owns failure codes
    accent: red
caption: EMPTY QUEUE IS NOT PROOF; RECEIPTS, Pydantic, ticket proof, and agentic-evals close the loop
