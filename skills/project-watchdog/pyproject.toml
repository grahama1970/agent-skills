[project]
name = "agent-skills-project-watchdog"
version = "0.2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "loguru>=0.7.0,<0.7.3",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
