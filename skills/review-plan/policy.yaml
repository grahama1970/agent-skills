# /review-plan skill policy — enforced by .claude/hooks/skill_policy.py
# Agents skip codebase verification of plan claims, skip blind test enforcement,
# and proceed to /orchestrate without review.

name: review-plan
slash_command: /review-plan

required_reads:
  - .pi/skills/review-plan/SKILL.md

forbidden_use:
  any_of:
    # Skipping review-plan before orchestrate (the whole pipeline is /plan -> /review-plan -> /orchestrate)
    - shell_contains: "orchestrate"
      reason: "Run /review-plan before /orchestrate. The pipeline is /plan -> /review-plan -> /orchestrate."

    # Plans without blind adversarial tests (NON-NEGOTIABLE check #1)
    - pattern: "definition_of_done.*verify it works|definition_of_done.*feature is implemented"
      reason: "Vague DoD is banned. Every task MUST have a blind test (test-lab/run.sh verify-task or sanity.sh) the coding agent cannot see."

    # Plans without Capability Overlap section (FAIL grade)
    - pattern: "## Tasks|## Phase 1"
      reason: "Plans MUST have a ## Capability Overlap section proving Phase 0 skill discovery was done before writing tasks."
