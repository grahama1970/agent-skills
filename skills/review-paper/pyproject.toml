[project]
name = "review-paper"
version = "0.1.0"
description = "Multi-persona documentation review with deterministic diagnostics and humanization analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
    "python-dotenv>=1.0.0",
  "pyyaml>=6.0.1",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pydantic>=2.8.2",
  "python-docx>=1.1.2",
  "loguru>=0.7.0,<0.7.3",
]

[project.scripts]
review-paper = "review_paper.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["review_paper*"]
