# The generate-dream pipeline, as data.
#
# This exists because the 42-step taxonomy lived inside
# scripts/persist_immutable_goal_steps.py, fused with one revision's results
# (hardcoded RUN_ID and REVISION_ID). A definition welded to a run record cannot
# be executed, cannot be diffed, and cannot be compiled into a Tau DAG. So the
# definition moves here and the audit script keeps only its own job.
#
# Scope is the SPINE: the pipeline terminates when the dream is produced and
# journaled. The video/Kling lane (42-step numbers 6-38) is an optional branch
# off the dream packet, not the spine -- a run that produces a journal without
# video is a COMPLETE run, not a failed one. That reframing is deliberate: the
# old ledger reported BLOCKED_FINAL_ACCEPTANCE because a movie did not finish,
# and agents routed around the blocker rather than stopping at it.
#
# Conversation is NOT here. Chatting with her about the dream consumes the
# finished journal and appends only to conversation.jsonl; it is a downstream
# surface, not a step.
#
# Every step declares the artifacts it must produce. A step that exits 0 without
# producing them FAILS -- exit status is what a script claims, artifacts are what
# it did.

schema: persona_dream.dream_spine.v1
version: 1

terminates_at: journal_entry
# The run dir IS the cycle dir: reports/goal_v3/cycles/<cycle_id>. Both
# autonomous-dream-cycle and write-dream-journal hardcode that location.
#
# TWO LANES, AND THIS IS THE COGNITION ONE.
#
#   cycle lane (here)  autonomous-dream-cycle -> write-dream-journal
#                      Rich cognition: ToM validation, certified persistence,
#                      identity subgates, instruments frozen pre-dream.
#                      write-dream-journal emits BOTH dream_journal.v1.json and
#                      dream_journal.md, so rendering is already included.
#                      HAS NO SPEECH PATH.
#
#   generate lane      generate -> render-journal-entry -> speak-journal
#                      Produces dream_packet.json and contradiction_report.json,
#                      which render/speak both require, plus journal_spoken.txt.
#                      HAS speech, lacks the cognition.
#
# render-journal-entry and speak-journal were in this spine until they were run:
# both fail here because the cycle writes neither dream_packet.json nor
# contradiction_report.json. They are not spine steps for this lane, and wiring
# them as if they were only produced a pipeline that could not finish.
#
# KNOWN GAP: a cycle-lane dream cannot currently be spoken. Bridging it means
# either teaching speak-journal to read dream_journal.md, or having the cycle
# emit the two artifacts the generate lane's renderer expects. That is a design
# decision about which lane owns voice, not a wiring fix.
optional_branches:
  video: "steps 6-38 of the legacy ledger; branches off dream_packet"

steps:
  # THE IDEA steers step 1. It restricts residue selection to memories the idea
  # actually touches, then the existing cluster engine finds a valence conflict
  # within that subset. Proven to steer: three ideas selected three different
  # counterpart clusters (kai / maya_chen / james), and an idea matching nothing
  # is REFUSED rather than silently replaced by an autonomous pick.
  #
  # Omit --idea for fully autonomous selection.
  #
  # An idea never invents residue: she can only dream about what she remembers.
  - id: dream_cycle
    name: Autonomous Dream Cycle
    command: autonomous-dream-cycle
    run_dir_arg: null
    args: ["--persona", "{persona}", "--cycle-id", "{cycle_id}", "--about", "{idea}"]
    produces: [storyboard_plan.json, selection_receipt.v1.json, residue_links.json,
               phase14_tom.json, observation_packet.json]
    proves: residue was selected, dreamt, observed, interpreted, and persisted
    does_not_prove: that the dream is meaningful or that recall improves

  - id: journal_entry
    name: Journal Entry
    command: write-dream-journal
    run_dir_arg: null
    args: ["--cycle", "{cycle_id}", "--persona", "{persona}"]
    produces: [dream_journal.v1.json, dream_journal.md]
    proves: she wrote an entry conforming to persona_journal.v1
    does_not_prove: that the entry is true of events


# Artifacts a run directory may hold that no step produces. Anything else found
# there is reported as undeclared -- that is how a bespoked side path becomes
# visible instead of blending in.
permitted_unowned:
  - conversation.jsonl        # downstream chat surface, appended post-pipeline
  - dream_pipeline_receipt.json
  - contradiction_report.json
  - "*.wav"                   # reply audio from the chat surface
