services:
  whisper:
    image: hwdsl2/whisper-server:cuda
    container_name: watch-whisper
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - whisper-data:/var/lib/whisper
    environment:
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - whisper
      - all

  diarization:
    build:
      context: ..
      dockerfile: docker/Dockerfile.diarization
      args:
        WATCH_DIARIZATION_BASE_IMAGE: ${WATCH_DIARIZATION_BASE_IMAGE:-agent-skills/audio-caption-service:local}
    container_name: watch-diarization
    restart: always
    ports:
      - "127.0.0.1:9001:9001"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - PYANNOTE_MODEL=${PYANNOTE_MODEL:-pyannote/speaker-diarization-community-1}
      - PYANNOTE_DEVICE=${PYANNOTE_DEVICE:-cuda}
      - PYANNOTE_METRICS_ENABLED=0
      - HF_HOME=/models/huggingface
    volumes:
      - pyannote-models:/models/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    profiles:
      - diarization
      - all

  watch-ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    container_name: watch-ui
    restart: always
    ports:
      - "3002:3002"
    environment:
      - WATCH_API_PORT=3002
      - WATCH_REPORT_PATH=/data/report.json
      - WATCH_FRAMES_DIR=/data/frames
      - MEMORY_DAEMON_URL=http://embry-memory:8601
    volumes:
      - watch-data:/data
      - /mnt/storage12tb/media/watch-frames:/mnt/storage12tb/media/watch-frames:ro
    profiles:
      - ui
      - all

volumes:
  whisper-data:
  pyannote-models:
  watch-data:

networks:
  default:
    name: watch-net
