[project]
name = "watch"
version = "0.1.0"
description = "Video analysis: scene-change frames, transcripts, SRT emotion analysis"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "rich",
    "loguru",
    "typer",
    "pillow",
    "faster-whisper",
    "jsonschema",
]

[project.optional-dependencies]
tracking = [
    "ultralytics",
    "opencv-python",
    "lap>=0.5.12",
]

[tool.setuptools]
py-modules = []
