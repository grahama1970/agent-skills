# /scillm skill policy — enforced by .claude/hooks/skill_policy.py
# Agents bypass the proxy and call providers directly, use wrong model names,
# or miss required params. 1 violation in post-check logs + constant manual fixes.

name: scillm
slash_command: /scillm

required_reads:
  - .pi/skills/scillm/SKILL.md

forbidden_use:
  any_of:
    # Direct provider SDKs — must go through scillm proxy
    - import: anthropic
      reason: "Don't import anthropic SDK directly. Use scillm proxy at localhost:4001."
    - import: openai
      reason: "Don't import openai SDK directly. Use scillm proxy at localhost:4001."
    - import: google.generativeai
      reason: "Don't import google.generativeai directly. Use scillm proxy at localhost:4001."

    # Direct provider endpoints
    - pattern: "api\\.anthropic\\.com"
      reason: "Don't call Anthropic API directly. Use scillm at localhost:4001."
    - pattern: "api\\.openai\\.com"
      reason: "Don't call OpenAI API directly. Use scillm at localhost:4001."
    - pattern: "generativelanguage\\.googleapis\\.com"
      reason: "Don't call Google AI API directly. Use scillm at localhost:4001."

    # Wrong Claude model names (causes 500 errors)
    - pattern: "text-claude-sonnet|claude-3-sonnet|claude-3-opus"
      reason: "Wrong Claude model name. Use claude-sonnet-4-6 or claude-opus-4-6."

    # response_format with Claude (unsupported, causes errors)
    - pattern: 'response_format.*json_object'
      reason: "Claude doesn't support response_format json_object. Ask for JSON in the prompt."

    # Importing scillm package directly (it's a Docker service, not a library)
    - pattern: "from scillm|import scillm"
      reason: "scillm is a Docker service at localhost:4001, not an importable package. Use httpx."

    # curl to scillm (agents use Bash curl instead of httpx in code)
    - shell_contains: "curl localhost:4001"
      reason: "Don't curl scillm. Use httpx.post('http://localhost:4001/v1/chat/completions')."
    - shell_contains: "curl http://localhost:4001"
      reason: "Don't curl scillm. Use httpx.post('http://localhost:4001/v1/chat/completions')."
