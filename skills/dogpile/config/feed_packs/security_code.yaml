version: 1
description: Optional Dogpile RSS pack for code, cybersecurity, threat intel, and ethical offensive-security research.
default_use: enrichment_only
false_positive_policy: Block on certainty, hunt on suspicion, enrich everything else. Feed hits are context signals, not automatic alerts or block decisions.
excluded_candidates:
  - name: Hack The Box
    reason: The public URL currently serves HTML, not a clean RSS document; keep as a non-RSS web source unless an official feed endpoint is available.
  - name: VMRay ThreatFeed
    reason: Public RSS endpoint was not fetchable without access controls; treat VMRay as optional API/vendor enrichment, not a default RSS source.
  - name: CISA Cybersecurity Advisories RSS
    reason: The RSS endpoint is valuable but intermittently returns 403 in concurrent automated dry-runs; use CISA KEV JSON as raw enrichment unless the project specifically configures CISA RSS handling.
  - name: Reddit r/netsec RSS
    reason: Useful community curation, but repeated automated checks can return 429; use as manual/community enrichment or configure separately with longer polling intervals.
raw_indicator_feeds:
  - name: CISA Known Exploited Vulnerabilities catalog
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    use: raw_enrichment_not_rss
    note: Structured JSON catalog; useful for enrichment and prioritization, not a human-readable RSS article feed.
  - name: URLhaus
    url: https://urlhaus.abuse.ch/
    use: raw_ioc_enrichment_not_rss
    note: Malware URL data belongs in SIEM/TIP enrichment pipelines, not this readable RSS lane.
  - name: Spamhaus
    url: https://www.spamhaus.org/
    use: raw_ioc_enrichment_not_rss
    note: Reputation data should be filtered and correlated before action.
  - name: OpenPhish
    url: https://openphish.com/
    use: raw_ioc_enrichment_not_rss
    note: Phishing indicators should be correlated before alerting or blocking.
