[project]
name = "plan-skill"
version = "0.1.0"
description = "Create orchestration-ready task files with enforced quality gates"
requires-python = ">=3.11,<3.13"

# Core dependencies - standard library only for the base skill
# Additional dependencies for enhanced features
dependencies = [
    "typer>=0.23.1",
    "loguru>=0.7.0,<0.7.3",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# For interview integration
interview = ["textual>=0.40.0"]
# For research integration
research = []  # Uses /dogpile and /context7 skills

[project.scripts]
plan = "plan:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
