<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROC Curve</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">ROC Curve</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// Generate synthetic ROC curves for 3 classifiers
function makeROC(auc) {
  const points = [{fpr: 0, tpr: 0}];
  const n = 50;
  for (let i = 1; i < n; i++) {
    const fpr = i / n;
    // Power function gives controllable AUC shape
    const tpr = Math.min(1, Math.pow(fpr, 1 / (auc * 3)));
    points.push({fpr, tpr});
  }
  points.push({fpr: 1, tpr: 1});
  return points;
}

const models = window.__INJECTED_DATA__ || [
  {name: "Model A (AUC=0.95)", data: makeROC(0.95), color: "#4F46E5"},
  {name: "Model B (AUC=0.82)", data: makeROC(0.82), color: "#F59E0B"},
  {name: "Model C (AUC=0.68)", data: makeROC(0.68), color: "#EF4444"},
];

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 24, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);

const x = d3.scaleLinear().domain([0, 1]).range([margin.left, width - margin.right]);
const y = d3.scaleLinear().domain([0, 1]).range([height - margin.bottom, margin.top]);

// Diagonal (random classifier)
svg.append('line')
  .attr('x1', x(0)).attr('y1', y(0))
  .attr('x2', x(1)).attr('y2', y(1))
  .attr('stroke', '#94a3b8').attr('stroke-width', 1.5)
  .attr('stroke-dasharray', '6,4');

// ROC curves
const line = d3.line().x(d => x(d.fpr)).y(d => y(d.tpr)).curve(d3.curveMonotoneX);

// AUC fill for best model
const area = d3.area().x(d => x(d.fpr)).y0(y(0)).y1(d => y(d.tpr)).curve(d3.curveMonotoneX);
svg.append('path').datum(models[0].data)
  .attr('d', area).attr('fill', models[0].color).attr('fill-opacity', 0.08);

models.forEach(model => {
  svg.append('path').datum(model.data)
    .attr('fill', 'none')
    .attr('stroke', model.color)
    .attr('stroke-width', 2.5)
    .attr('d', line);
});

// Axes
svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).ticks(10)).selectAll('text').attr('font-size', '14px');
svg.append('g').attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(10)).selectAll('text').attr('font-size', '14px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);

// Axis labels
svg.append('text').attr('x', width / 2).attr('y', height - 10)
  .attr('text-anchor', 'middle').attr('font-size', '14px').attr('fill', '#64748b')
  .text('False Positive Rate');
svg.append('text').attr('transform', 'rotate(-90)').attr('x', -height / 2).attr('y', 18)
  .attr('text-anchor', 'middle').attr('font-size', '14px').attr('fill', '#64748b')
  .text('True Positive Rate');

// Legend
const legend = svg.selectAll('g.legend').data(models).join('g')
  .attr('class', 'legend')
  .attr('transform', (d, i) => `translate(${margin.left + 30},${margin.top + 10 + i * 22})`);
legend.append('line').attr('x1', 0).attr('x2', 20).attr('y1', 0).attr('y2', 0)
  .attr('stroke', d => d.color).attr('stroke-width', 2.5);
legend.append('text').attr('x', 28).attr('dy', '0.35em')
  .attr('font-size', '12px').attr('fill', '#1e293b').text(d => d.name);
</script>
</body>
</html>
