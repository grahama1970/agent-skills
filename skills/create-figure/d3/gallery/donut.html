<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extraction Verdicts</title>
<style>
  body {
    background: #111;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .canvas-header {
    padding: 24px 32px 12px;
    flex-shrink: 0;
  }
  .canvas-title {
    font-size: 28px;
    font-weight: 700;
  }
  .canvas-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 32px 32px;
    overflow: hidden;
    animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #chart { width: 100%; height: 100%; }
  /* Override D3 axis/tick colors for dark theme */
  .domain, .tick line { stroke: #475569 !important; }
  .tick text { fill: #e2e8f0 !important; }
  text { fill: #e2e8f0; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Extraction Verdicts</div></div>
<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [{"label": "Passed", "value": 340}, {"label": "Warned", "value": 14}, {"label": "Failed", "value": 2}];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const size = Math.min(rect.width || 600, rect.height || 600);

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${size} ${size}`);

const g = svg.append('g').attr('transform', `translate(${size/2},${size/2})`);
const radius = size * 0.4;

const pie = d3.pie().value(d => d.value || d.y || 0).sort(null);
const arc = d3.arc().innerRadius(radius * 0.55).outerRadius(radius);
const colors = d3.scaleOrdinal(['#22c55e', '#eab308', '#ef4444', '#60a5fa', '#a78bfa']);

const arcs = g.selectAll('path').data(pie(data)).join('path')
  .attr('fill', (d, i) => colors(i))
  .attr('stroke', '#111').attr('stroke-width', 2)
  .each(function(d) { this._current = {startAngle: d.startAngle, endAngle: d.startAngle}; });

arcs.transition().duration(800).ease(d3.easeCubicOut)
  .attrTween('d', function(d) {
    const interp = d3.interpolate(this._current, d);
    this._current = interp(1);
    return t => arc(interp(t));
  });

// Center total
const total = data.reduce((s, d) => s + (d.value || 0), 0);
g.append('text').attr('text-anchor', 'middle').attr('y', -8)
  .attr('font-size', `${size * 0.08}px`).attr('font-weight', '700')
  .attr('fill', '#e2e8f0').text(total);
g.append('text').attr('text-anchor', 'middle').attr('y', size * 0.04)
  .attr('font-size', '18px').attr('fill', '#94a3b8').text('Total');

// Legend below
const legend = svg.append('g').attr('transform', `translate(${size * 0.15}, ${size * 0.88})`);
data.forEach((d, i) => {
  const lg = legend.append('g').attr('transform', `translate(${i * (size * 0.22)}, 0)`);
  lg.append('rect').attr('width', 14).attr('height', 14).attr('fill', colors(i)).attr('rx', 3);
  lg.append('text').attr('x', 20).attr('y', 12).text(`${d.label} (${d.value})`)
    .attr('font-size', '14px').attr('fill', '#e2e8f0');
});

</script>
</body>
</html>
