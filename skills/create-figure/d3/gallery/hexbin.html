<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexbin Plot</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Hexbin Plot</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import {hexbin as d3Hexbin} from "https://cdn.jsdelivr.net/npm/d3-hexbin@0.2/+esm";

function randn() { return Math.sqrt(-2 * Math.log(Math.random())) * Math.cos(2 * Math.PI * Math.random()); }

const data = window.__INJECTED_DATA__ || [];
for (let i = 0; i < 500; i++) {
  data.push([50 + randn() * 15, 50 + randn() * 15]);
}
for (let i = 0; i < 300; i++) {
  data.push([70 + randn() * 10, 30 + randn() * 10]);
}

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 24, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);

const x = d3.scaleLinear().domain([0, 100]).range([margin.left, width - margin.right]);
const y = d3.scaleLinear().domain([0, 100]).range([height - margin.bottom, margin.top]);

const hexbin = d3Hexbin()
  .x(d => x(d[0])).y(d => y(d[1]))
  .radius(15)
  .extent([[margin.left, margin.top], [width - margin.right, height - margin.bottom]]);

const bins = hexbin(data);
const color = d3.scaleSequential(d3.interpolateViridis).domain([0, d3.max(bins, d => d.length)]);

svg.selectAll('path.hex').data(bins).join('path')
  .attr('class', 'hex')
  .attr('data-label', d => `hex-${d.x.toFixed(0)}-${d.y.toFixed(0)}`)
  .attr('d', hexbin.hexagon())
  .attr('transform', d => `translate(${d.x},${d.y})`)
  .attr('fill', d => color(d.length))
  .attr('stroke', '#fff').attr('stroke-width', 0.5);

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).ticks(8)).selectAll('text').attr('font-size', '14px');
svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(6)).selectAll('text').attr('font-size', '14px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);
</script>
</body>
</html>
