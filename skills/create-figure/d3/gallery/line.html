<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Chart</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Line Chart</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [
  {x: 1, y: 12}, {x: 2, y: 19}, {x: 3, y: 15}, {x: 4, y: 28},
  {x: 5, y: 24}, {x: 6, y: 35}, {x: 7, y: 32}, {x: 8, y: 41},
  {x: 9, y: 38}, {x: 10, y: 47}, {x: 11, y: 44}, {x: 12, y: 52}
];

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 24, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);

const x = d3.scaleLinear()
  .domain(d3.extent(data, d => d.x))
  .range([margin.left, width - margin.right]);

const y = d3.scaleLinear()
  .domain([0, d3.max(data, d => d.y)]).nice()
  .range([height - margin.bottom, margin.top]);

// Area fill under the line
const area = d3.area()
  .x(d => x(d.x))
  .y0(height - margin.bottom)
  .y1(d => y(d.y))
  .curve(d3.curveMonotoneX);

svg.append('path')
  .datum(data)
  .attr('d', area)
  .attr('fill', '#4F46E5')
  .attr('opacity', 0.1);

// Line path
const line = d3.line()
  .x(d => x(d.x))
  .y(d => y(d.y))
  .curve(d3.curveMonotoneX);

const path = svg.append('path')
  .datum(data)
  .attr('data-label', 'trend')
  .attr('d', line)
  .attr('fill', 'none')
  .attr('stroke', '#4F46E5')
  .attr('stroke-width', 2.5);

// Animate line drawing
const totalLength = path.node().getTotalLength();
path.attr('stroke-dasharray', `${totalLength} ${totalLength}`)
  .attr('stroke-dashoffset', totalLength)
  .transition().duration(1200).ease(d3.easeCubicOut)
  .attr('stroke-dashoffset', 0);

// Dots
svg.selectAll('circle').data(data).join('circle')
  .attr('cx', d => x(d.x)).attr('cy', d => y(d.y))
  .attr('r', 4)
  .attr('fill', '#4F46E5')
  .attr('stroke', '#fff').attr('stroke-width', 2)
  .attr('opacity', 0)
  .transition().delay(1200).duration(400)
  .attr('opacity', 1);

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).ticks(data.length)).selectAll('text').attr('font-size', '16px');
svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(6)).selectAll('text').attr('font-size', '16px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);
</script>
</body>
</html>
