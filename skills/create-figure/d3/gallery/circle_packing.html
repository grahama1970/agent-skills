<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle Packing</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Circle Packing</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || {
  name: "Skills",
  children: [
    {name: "Create", children: [
      {name: "figure", value: 800}, {name: "music", value: 400},
      {name: "story", value: 350}, {name: "persona", value: 250},
      {name: "movie", value: 600}
    ]},
    {name: "Monitor", children: [
      {name: "skills", value: 500}, {name: "memory", value: 300},
      {name: "sparta", value: 280}, {name: "drift", value: 200}
    ]},
    {name: "Ops", children: [
      {name: "claude", value: 450}, {name: "chutes", value: 200},
      {name: "runpod", value: 180}, {name: "docker", value: 150}
    ]},
    {name: "Learn", children: [
      {name: "memory", value: 700}, {name: "datalake", value: 350},
      {name: "extractor", value: 550}, {name: "voice", value: 300}
    ]}
  ]
};

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const size = Math.min(width, height);

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

const root = d3.hierarchy(data).sum(d => d.value).sort((a, b) => b.value - a.value);
d3.pack().size([size, size]).padding(4)(root);

const offsetX = (width - size) / 2;
const offsetY = (height - size) / 2;

const node = svg.selectAll('g').data(root.descendants()).join('g')
  .attr('transform', d => `translate(${d.x + offsetX},${d.y + offsetY})`);

node.append('circle')
  .attr('data-label', d => d.data.name)
  .attr('r', 0)
  .attr('fill', d => d.depth === 0 ? 'none' : d.children ? colors(d.data.name) : colors(d.parent.data.name))
  .attr('fill-opacity', d => d.children ? 0.15 : 0.7)
  .attr('stroke', d => d.depth === 0 ? '#94a3b8' : d.children ? colors(d.data.name) : 'none')
  .attr('stroke-width', d => d.depth === 0 ? 1.5 : 1)
  .transition().duration(800).ease(d3.easeCubicOut)
  .attr('r', d => d.r);

// Labels for leaves
node.filter(d => !d.children && d.r > 20).append('text')
  .attr('text-anchor', 'middle').attr('dy', '0.35em')
  .attr('font-size', d => Math.min(d.r / 3, 14) + 'px')
  .attr('fill', '#1e293b')
  .text(d => d.data.name);

// Labels for groups
node.filter(d => d.children && d.depth === 1).append('text')
  .attr('text-anchor', 'middle').attr('dy', d => -d.r - 6)
  .attr('font-size', '14px').attr('font-weight', 600).attr('fill', '#1e293b')
  .text(d => d.data.name);
</script>
</body>
</html>
