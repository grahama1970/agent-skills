<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diverging Bar Chart</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Diverging Bar Chart</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [
  {"label": "Feature A", "value": 35}, {"label": "Feature B", "value": -20},
  {"label": "Feature C", "value": 55}, {"label": "Feature D", "value": -45},
  {"label": "Feature E", "value": 12}, {"label": "Feature F", "value": -30},
  {"label": "Feature G", "value": 40}, {"label": "Feature H", "value": -15}
];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 40, bottom: 40, left: 120};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);

const y = d3.scaleBand().domain(data.map(d => d.label)).range([margin.top, height - margin.bottom]).padding(0.3);
const maxAbs = d3.max(data, d => Math.abs(d.value));
const x = d3.scaleLinear().domain([-maxAbs, maxAbs]).nice().range([margin.left, width - margin.right]);

svg.selectAll('rect').data(data).join('rect')
  .attr('data-label', d => d.label)
  .attr('y', d => y(d.label)).attr('height', y.bandwidth())
  .attr('x', x(0)).attr('width', 0).attr('rx', 4)
  .attr('fill', d => d.value >= 0 ? '#4F46E5' : '#EF4444').attr('opacity', 0.8)
  .transition().duration(800).ease(d3.easeCubicOut)
  .attr('x', d => d.value >= 0 ? x(0) : x(d.value))
  .attr('width', d => Math.abs(x(d.value) - x(0)));

svg.append('line').attr('x1', x(0)).attr('x2', x(0))
  .attr('y1', margin.top).attr('y2', height - margin.bottom)
  .attr('stroke', '#1e293b').attr('stroke-width', 1.5);

svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).tickSizeOuter(0)).selectAll('text').attr('font-size', '16px');
svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).ticks(6)).selectAll('text').attr('font-size', '16px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);
</script>
</body>
</html>
