<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Density Contour</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Density Contour</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

function randn() { return Math.sqrt(-2 * Math.log(Math.random())) * Math.cos(2 * Math.PI * Math.random()); }

// Generate bivariate normal data with two clusters
const data = window.__INJECTED_DATA__ || [];
for (let i = 0; i < 200; i++) {
  data.push({x: 30 + randn() * 10, y: 40 + randn() * 12});
}
for (let i = 0; i < 150; i++) {
  data.push({x: 65 + randn() * 8, y: 60 + randn() * 10});
}

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 24, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);

const x = d3.scaleLinear().domain(d3.extent(data, d => d.x)).nice().range([margin.left, width - margin.right]);
const y = d3.scaleLinear().domain(d3.extent(data, d => d.y)).nice().range([height - margin.bottom, margin.top]);

// Density contours
const contours = d3.contourDensity()
  .x(d => x(d.x))
  .y(d => y(d.y))
  .size([width, height])
  .bandwidth(25)
  .thresholds(10)
  (data);

const color = d3.scaleSequential(d3.interpolateBlues)
  .domain([0, d3.max(contours, d => d.value)]);

svg.selectAll('path.contour').data(contours).join('path')
  .attr('class', 'contour')
  .attr('d', d3.geoPath())
  .attr('fill', d => color(d.value))
  .attr('fill-opacity', 0.6)
  .attr('stroke', d => color(d.value))
  .attr('stroke-width', 0.5);

// Points
svg.selectAll('circle').data(data).join('circle')
  .attr('cx', d => x(d.x)).attr('cy', d => y(d.y))
  .attr('r', 2)
  .attr('fill', '#1e293b').attr('fill-opacity', 0.3);

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).ticks(8)).selectAll('text').attr('font-size', '14px');
svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(6)).selectAll('text').attr('font-size', '14px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);
</script>
</body>
</html>
