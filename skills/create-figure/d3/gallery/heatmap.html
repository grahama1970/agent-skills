<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heatmap</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Heatmap</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// Generate matrix data: skill quality scores across dimensions
const rows = ["Memory", "Extractor", "Analytics", "Dashboard", "SPARTA", "Taxonomy"];
const cols = ["Tests", "Docs", "Sanity", "Deps", "Lint"];
const data = window.__INJECTED_DATA__ || [];
rows.forEach(row => {
  cols.forEach(col => {
    data.push({row, col, value: Math.round(40 + Math.random() * 60)});
  });
});

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 80, bottom: 60, left: 120};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);

const x = d3.scaleBand().domain(cols).range([margin.left, width - margin.right]).padding(0.05);
const y = d3.scaleBand().domain(rows).range([margin.top, height - margin.bottom]).padding(0.05);

const color = d3.scaleSequential(d3.interpolateYlOrRd)
  .domain([100, 40]);  // Reversed: high=green-ish, low=red

// Cells
svg.selectAll('rect.cell').data(data).join('rect')
  .attr('class', 'cell')
  .attr('data-label', d => `${d.row}-${d.col}`)
  .attr('x', d => x(d.col)).attr('y', d => y(d.row))
  .attr('width', x.bandwidth()).attr('height', y.bandwidth())
  .attr('rx', 4)
  .attr('fill', d => color(d.value))
  .attr('opacity', 0)
  .transition().duration(800).ease(d3.easeCubicOut)
  .attr('opacity', 1);

// Value labels in cells
svg.selectAll('text.val').data(data).join('text')
  .attr('class', 'val')
  .attr('x', d => x(d.col) + x.bandwidth() / 2)
  .attr('y', d => y(d.row) + y.bandwidth() / 2)
  .attr('text-anchor', 'middle').attr('dominant-baseline', 'central')
  .attr('font-size', '14px').attr('font-weight', 600)
  .attr('fill', d => d.value > 70 ? '#1e293b' : '#fff')
  .text(d => d.value);

// Axes
svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).tickSizeOuter(0))
  .selectAll('text').attr('font-size', '16px');

svg.append('g').attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).tickSizeOuter(0))
  .selectAll('text').attr('font-size', '16px');

svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);

// Legend
const legendH = height - margin.top - margin.bottom;
const legendW = 16;
const legendX = width - margin.right + 20;
const defs = svg.append('defs');
const grad = defs.append('linearGradient').attr('id', 'hm-grad').attr('x1', '0%').attr('y1', '100%').attr('x2', '0%').attr('y2', '0%');
grad.append('stop').attr('offset', '0%').attr('stop-color', color(40));
grad.append('stop').attr('offset', '100%').attr('stop-color', color(100));
svg.append('rect').attr('x', legendX).attr('y', margin.top).attr('width', legendW).attr('height', legendH).attr('fill', 'url(#hm-grad)').attr('rx', 3);
svg.append('text').attr('x', legendX + legendW + 6).attr('y', margin.top + 4).attr('font-size', '12px').attr('fill', '#64748b').text('100');
svg.append('text').attr('x', legendX + legendW + 6).attr('y', height - margin.bottom).attr('font-size', '12px').attr('fill', '#64748b').text('40');
</script>
</body>
</html>
