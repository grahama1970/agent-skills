<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voronoi Diagram</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Voronoi Diagram</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;

const n = 30;
const points = window.__INJECTED_DATA__ ? window.__INJECTED_DATA__.map(d => [d.x, d.y]) : Array.from({length: n}, () => [
  Math.random() * width,
  Math.random() * height
]);

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

const delaunay = d3.Delaunay.from(points);
const voronoi = delaunay.voronoi([0, 0, width, height]);

// Voronoi cells
svg.selectAll('path.cell').data(points).join('path')
  .attr('class', 'cell')
  .attr('data-label', (d, i) => `cell-${i}`)
  .attr('d', (d, i) => voronoi.renderCell(i))
  .attr('fill', (d, i) => colors(i % 10))
  .attr('fill-opacity', 0.15)
  .attr('stroke', '#94a3b8')
  .attr('stroke-width', 1);

// Delaunay triangulation (subtle)
svg.append('path')
  .attr('d', delaunay.render())
  .attr('fill', 'none')
  .attr('stroke', '#cbd5e1')
  .attr('stroke-width', 0.5);

// Points
svg.selectAll('circle').data(points).join('circle')
  .attr('cx', d => d[0]).attr('cy', d => d[1])
  .attr('r', 4)
  .attr('fill', (d, i) => colors(i % 10))
  .attr('stroke', '#fff').attr('stroke-width', 1.5);
</script>
</body>
</html>
