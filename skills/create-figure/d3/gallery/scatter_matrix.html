<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scatter Matrix</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Scatter Matrix</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

function randn() { return Math.sqrt(-2 * Math.log(Math.random())) * Math.cos(2 * Math.PI * Math.random()); }

const dims = ["accuracy", "latency", "memory", "cost"];
const groups = ["fast", "balanced", "accurate"];
const data = window.__INJECTED_DATA__ || [];
groups.forEach((g, gi) => {
  for (let i = 0; i < 20; i++) {
    data.push({
      group: g,
      accuracy: 70 + gi * 10 + randn() * 5,
      latency: 10 + gi * 20 + randn() * 8,
      memory: 100 + gi * 200 + randn() * 50,
      cost: 0.5 + gi * 1.5 + randn() * 0.5
    });
  }
});

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const size = Math.min(width, height);
const padding = 30;
const cellSize = (size - padding * 2) / dims.length;

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const offsetX = (width - size) / 2;
const offsetY = (height - size) / 2;
const g = svg.append('g').attr('transform', `translate(${offsetX},${offsetY})`);
const colors = d3.scaleOrdinal().domain(groups).range(["#4F46E5", "#F59E0B", "#EF4444"]);

const scales = {};
dims.forEach(dim => {
  scales[dim] = d3.scaleLinear().domain(d3.extent(data, d => d[dim])).nice().range([padding, padding + cellSize - 8]);
});

dims.forEach((dimY, row) => {
  dims.forEach((dimX, col) => {
    const cellG = g.append('g').attr('transform', `translate(${col * cellSize},${row * cellSize})`);

    // Cell background
    cellG.append('rect')
      .attr('x', padding).attr('y', padding)
      .attr('width', cellSize - 8).attr('height', cellSize - 8)
      .attr('fill', row === col ? '#f1f5f9' : 'none')
      .attr('stroke', '#e2e8f0').attr('stroke-width', 0.5);

    if (row === col) {
      // Diagonal: dimension name
      cellG.append('text')
        .attr('x', padding + (cellSize - 8) / 2).attr('y', padding + (cellSize - 8) / 2)
        .attr('text-anchor', 'middle').attr('dominant-baseline', 'central')
        .attr('font-size', '12px').attr('font-weight', 600).attr('fill', '#1e293b')
        .text(dimX);
    } else {
      // Off-diagonal: scatter
      cellG.selectAll('circle').data(data).join('circle')
        .attr('cx', d => scales[dimX](d[dimX]))
        .attr('cy', d => scales[dimY](d[dimY]))
        .attr('r', 2)
        .attr('fill', d => colors(d.group))
        .attr('fill-opacity', 0.6);
    }
  });
});

// Legend
const legend = svg.selectAll('g.legend').data(groups).join('g')
  .attr('class', 'legend')
  .attr('transform', (d, i) => `translate(${width - 100},${offsetY + 20 + i * 20})`);
legend.append('circle').attr('r', 4).attr('fill', d => colors(d));
legend.append('text').attr('x', 10).attr('dy', '0.35em').attr('font-size', '12px').attr('fill', '#1e293b').text(d => d);
</script>
</body>
</html>
