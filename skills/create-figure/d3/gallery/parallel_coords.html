<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parallel Coordinates</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Parallel Coordinates</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [
  {name: "Model A", accuracy: 92, latency: 15, memory: 200, cost: 0.5, group: "fast"},
  {name: "Model B", accuracy: 96, latency: 45, memory: 800, cost: 2.1, group: "accurate"},
  {name: "Model C", accuracy: 88, latency: 8, memory: 100, cost: 0.2, group: "fast"},
  {name: "Model D", accuracy: 97, latency: 120, memory: 1600, cost: 5.0, group: "accurate"},
  {name: "Model E", accuracy: 91, latency: 22, memory: 400, cost: 0.8, group: "balanced"},
  {name: "Model F", accuracy: 94, latency: 35, memory: 600, cost: 1.5, group: "balanced"}
];
const dimensions = ["accuracy", "latency", "memory", "cost"];

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 40, bottom: 30, left: 40};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

const yScales = {};
dimensions.forEach(dim => {
  yScales[dim] = d3.scaleLinear()
    .domain(d3.extent(data, d => d[dim]))
    .range([height - margin.bottom, margin.top]);
});

const xScale = d3.scalePoint()
  .domain(dimensions)
  .range([margin.left, width - margin.right]);

// Lines
svg.selectAll('path.trace').data(data).join('path')
  .attr('class', 'trace')
  .attr('data-label', d => d.name)
  .attr('d', d => d3.line()(dimensions.map(dim => [xScale(dim), yScales[dim](d[dim])])))
  .attr('fill', 'none')
  .attr('stroke', d => colors(d.group))
  .attr('stroke-width', 2.5)
  .attr('stroke-opacity', 0.6)
  .on('mouseover', function() { d3.select(this).attr('stroke-opacity', 1).attr('stroke-width', 4).raise(); })
  .on('mouseout', function() { d3.select(this).attr('stroke-opacity', 0.6).attr('stroke-width', 2.5); });

// Axes
dimensions.forEach(dim => {
  const g = svg.append('g').attr('transform', `translate(${xScale(dim)},0)`);
  g.call(d3.axisLeft(yScales[dim]).ticks(5))
    .selectAll('text').attr('font-size', '14px');
  g.append('text')
    .attr('y', margin.top - 12).attr('text-anchor', 'middle')
    .attr('font-size', '16px').attr('font-weight', 600).attr('fill', '#1e293b')
    .text(dim);
});
</script>
</body>
</html>
