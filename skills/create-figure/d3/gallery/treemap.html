<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treemap</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Treemap</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || {
  name: "Skills",
  children: [
    {name: "Create", children: [
      {name: "create-figure", value: 800}, {name: "create-music", value: 400},
      {name: "create-story", value: 350}, {name: "create-persona", value: 250}
    ]},
    {name: "Monitor", children: [
      {name: "monitor-skills", value: 500}, {name: "monitor-memory", value: 300},
      {name: "monitor-sparta", value: 280}, {name: "dashboard", value: 600}
    ]},
    {name: "Ops", children: [
      {name: "ops-claude", value: 450}, {name: "ops-chutes", value: 200},
      {name: "ops-runpod", value: 180}
    ]},
    {name: "Learn", children: [
      {name: "memory", value: 700}, {name: "learn-datalake", value: 350},
      {name: "extractor", value: 550}
    ]}
  ]
};

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

const root = d3.hierarchy(data).sum(d => d.value).sort((a, b) => b.value - a.value);
d3.treemap().size([width, height]).padding(3).round(true)(root);

const leaves = root.leaves();

const cell = svg.selectAll('g').data(leaves).join('g')
  .attr('transform', d => `translate(${d.x0},${d.y0})`);

cell.append('rect')
  .attr('data-label', d => d.data.name)
  .attr('width', d => d.x1 - d.x0).attr('height', d => d.y1 - d.y0)
  .attr('fill', d => colors(d.parent.data.name))
  .attr('opacity', 0.8).attr('rx', 4)
  .attr('stroke', '#fff').attr('stroke-width', 1.5);

cell.append('text')
  .attr('x', 6).attr('y', 20)
  .attr('font-size', d => (d.x1 - d.x0) > 80 ? '14px' : '10px')
  .attr('fill', '#1e293b')
  .text(d => {
    const w = d.x1 - d.x0;
    return w > 50 ? d.data.name : '';
  });

cell.append('text')
  .attr('x', 6).attr('y', 38)
  .attr('font-size', '12px').attr('fill', '#64748b')
  .text(d => {
    const w = d.x1 - d.x0;
    return w > 60 ? d.data.value : '';
  });
</script>
</body>
</html>
