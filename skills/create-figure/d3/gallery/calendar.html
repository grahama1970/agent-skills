<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar Heatmap</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Calendar Heatmap</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// Generate a year of daily data
const year = 2025;
const data = window.__INJECTED_DATA__ || [];
const start = new Date(year, 0, 1);
const end = new Date(year, 11, 31);
for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
  data.push({
    date: new Date(d),
    value: Math.floor(Math.random() * 10) + (d.getDay() > 0 && d.getDay() < 6 ? 5 : 0)
  });
}

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const cellSize = Math.min((width - 60) / 53, (height - 60) / 9);
const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const offsetX = (width - 53 * cellSize) / 2;
const offsetY = (height - 7 * cellSize) / 2 + 20;

const color = d3.scaleSequential(d3.interpolateGreens).domain([0, d3.max(data, d => d.value)]);

// Day labels
svg.selectAll('text.day').data(dayNames).join('text')
  .attr('class', 'day')
  .attr('x', offsetX - 8).attr('y', (d, i) => offsetY + i * cellSize + cellSize / 2)
  .attr('text-anchor', 'end').attr('dominant-baseline', 'central')
  .attr('font-size', '11px').attr('fill', '#64748b')
  .text(d => d);

// Month labels
const months = d3.timeMonths(start, end);
svg.selectAll('text.month').data(months).join('text')
  .attr('class', 'month')
  .attr('x', d => offsetX + d3.timeWeek.count(d3.timeYear(d), d) * cellSize)
  .attr('y', offsetY - 8)
  .attr('font-size', '12px').attr('fill', '#64748b')
  .text(d => d3.timeFormat('%b')(d));

// Cells
svg.selectAll('rect.cell').data(data).join('rect')
  .attr('class', 'cell')
  .attr('data-label', d => d3.timeFormat('%Y-%m-%d')(d.date))
  .attr('x', d => offsetX + d3.timeWeek.count(d3.timeYear(d.date), d.date) * cellSize)
  .attr('y', d => offsetY + d.date.getDay() * cellSize)
  .attr('width', cellSize - 2).attr('height', cellSize - 2)
  .attr('rx', 2)
  .attr('fill', d => d.value > 0 ? color(d.value) : '#eef2ff')
  .attr('stroke', '#fff').attr('stroke-width', 1);
</script>
</body>
</html>
