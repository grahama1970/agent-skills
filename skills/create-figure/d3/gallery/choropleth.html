<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choropleth Map</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Choropleth Map</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);

// Fetch world TopoJSON (110m = low-res, ~30KB)
const world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
const countries = topojson.feature(world, world.objects.countries);

// Synthetic data: random value per country
const valueMap = new Map();
// Data injection: accept [{country/id, value}] from /create-figure
if (window.__INJECTED_DATA__) {
  window.__INJECTED_DATA__.forEach(d => valueMap.set(String(d.id || d.country), d.value));
} else {
countries.features.forEach(f => {
  valueMap.set(f.id, Math.random() * 100);
}
});

const color = d3.scaleSequential(d3.interpolateYlGnBu).domain([0, 100]);
const projection = d3.geoNaturalEarth1().fitSize([width - 20, height - 40], countries);
const path = d3.geoPath(projection);

// Draw countries
svg.selectAll('path.country').data(countries.features).join('path')
  .attr('class', 'country')
  .attr('data-label', d => `country-${d.id}`)
  .attr('d', path)
  .attr('fill', d => color(valueMap.get(d.id) || 0))
  .attr('stroke', '#fff')
  .attr('stroke-width', 0.3);

// Borders overlay
svg.append('path')
  .datum(topojson.mesh(world, world.objects.countries, (a, b) => a !== b))
  .attr('fill', 'none')
  .attr('stroke', '#94a3b8')
  .attr('stroke-width', 0.5)
  .attr('d', path);

// Legend
const legendW = 200, legendH = 10;
const legendX = width - legendW - 30, legendY = height - 30;
const legendScale = d3.scaleLinear().domain([0, 100]).range([0, legendW]);
const legendAxis = d3.axisBottom(legendScale).ticks(5).tickSize(legendH + 4);

const defs = svg.append('defs');
const grad = defs.append('linearGradient').attr('id', 'legend-grad');
d3.range(0, 1.01, 0.1).forEach(t => {
  grad.append('stop').attr('offset', `${t * 100}%`).attr('stop-color', color(t * 100));
});

svg.append('rect').attr('x', legendX).attr('y', legendY)
  .attr('width', legendW).attr('height', legendH)
  .attr('fill', 'url(#legend-grad)');

svg.append('g').attr('transform', `translate(${legendX},${legendY})`)
  .call(legendAxis).select('.domain').remove();
</script>
</body>
</html>
