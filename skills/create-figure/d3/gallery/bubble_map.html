<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Map</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Bubble Map</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import * as topojson from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);

// Fetch world map
const world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
const land = topojson.feature(world, world.objects.land);

const projection = d3.geoNaturalEarth1().fitSize([width - 20, height - 40], land);
const path = d3.geoPath(projection);

// Draw base map
svg.append('path').datum(land)
  .attr('fill', '#e2e8f0').attr('stroke', '#94a3b8').attr('stroke-width', 0.5)
  .attr('d', path);

// Sample city data: [lon, lat, population, name]
const cities = window.__INJECTED_DATA__ || [
  [-74.0, 40.7, 8300000, "New York"], [-118.2, 34.1, 3900000, "Los Angeles"],
  [-87.6, 41.9, 2700000, "Chicago"], [2.3, 48.9, 2200000, "Paris"],
  [-0.1, 51.5, 8900000, "London"], [139.7, 35.7, 13900000, "Tokyo"],
  [116.4, 39.9, 21500000, "Beijing"], [77.2, 28.6, 16800000, "Delhi"],
  [-46.6, -23.5, 12300000, "São Paulo"], [37.6, 55.8, 12600000, "Moscow"],
  [31.2, 30.0, 10200000, "Cairo"], [151.2, -33.9, 5300000, "Sydney"],
  [-99.1, 19.4, 9200000, "Mexico City"], [28.9, 41.0, 15500000, "Istanbul"],
  [121.5, 31.2, 24900000, "Shanghai"], [100.5, 13.8, 10700000, "Bangkok"],
  [3.4, 6.5, 15400000, "Lagos"], [-43.2, -22.9, 6700000, "Rio"],
];

const rScale = d3.scaleSqrt().domain([0, d3.max(cities, d => d[2])]).range([3, 30]);

svg.selectAll('circle.city').data(cities).join('circle')
  .attr('class', 'city')
  .attr('data-label', d => d[3])
  .attr('cx', d => projection([d[0], d[1]])[0])
  .attr('cy', d => projection([d[0], d[1]])[1])
  .attr('r', d => rScale(d[2]))
  .attr('fill', '#4F46E5')
  .attr('fill-opacity', 0.5)
  .attr('stroke', '#4F46E5')
  .attr('stroke-width', 1);

// Labels for largest cities
svg.selectAll('text.label').data(cities.filter(d => d[2] > 10000000)).join('text')
  .attr('class', 'label')
  .attr('x', d => projection([d[0], d[1]])[0])
  .attr('y', d => projection([d[0], d[1]])[1] - rScale(d[2]) - 4)
  .attr('text-anchor', 'middle')
  .attr('font-size', '11px').attr('fill', '#1e293b').attr('font-weight', 500)
  .text(d => d[3]);
</script>
</body>
</html>
