<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render a radar for embry: Verdict Distribution</title>
<style>
        body {
            background: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .canvas-header {
            padding: 16px 24px 8px;
            flex-shrink: 0;
        }
        .canvas-title {
            font-size: 24px;
            font-weight: 700;
        }
        .canvas-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 24px 24px;
            overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #chart { width: 100%; height: 100%; }
        </style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Render a radar for embry: Verdict Distribution</div></div>
<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [{"label": "B", "value": 489}, {"label": "A+", "value": 1369}, {"label": "A", "value": 1734}, {"label": "F", "value": 989}, {"label": "C", "value": 90}];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const size = Math.min(rect.width || 600, rect.height || 600);
const margin = 80;
const radius = size / 2 - margin;

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${size} ${size}`);

const g = svg.append('g').attr('transform', `translate(${size/2},${size/2})`);

const labels = data.map(d => d.label || d.name || d.axis);
const values = data.map(d => d.value || d.y || 0);
const maxVal = d3.max(values) || 1;
const n = labels.length;

// Grid circles
[0.25, 0.5, 0.75, 1.0].forEach(level => {
  g.append('circle')
    .attr('r', radius * level)
    .attr('fill', 'none')
    .attr('stroke', '#e2e8f0')
    .attr('stroke-width', 1);
});

// Axis lines + labels
const angleSlice = (2 * Math.PI) / n;
labels.forEach((label, i) => {
  const angle = angleSlice * i - Math.PI / 2;
  const lx = Math.cos(angle) * radius;
  const ly = Math.sin(angle) * radius;
  g.append('line')
    .attr('x1', 0).attr('y1', 0)
    .attr('x2', lx).attr('y2', ly)
    .attr('stroke', '#e2e8f0').attr('stroke-width', 1);
  g.append('text')
    .attr('x', Math.cos(angle) * (radius + 20))
    .attr('y', Math.sin(angle) * (radius + 20))
    .attr('text-anchor', 'middle')
    .attr('dominant-baseline', 'central')
    .attr('font-size', '18px')
    .text(label);
});

// Data polygon
const points = values.map((v, i) => {
  const angle = angleSlice * i - Math.PI / 2;
  const r = (v / maxVal) * radius;
  return [Math.cos(angle) * r, Math.sin(angle) * r];
});
points.push(points[0]); // Close

const line = d3.line().curve(d3.curveLinearClosed);

g.append('path')
  .attr('d', line(points))
  .attr('fill', 'steelblue')
  .attr('fill-opacity', 0.25)
  .attr('stroke', 'steelblue')
  .attr('stroke-width', 3);

g.selectAll('circle.dot').data(points.slice(0, -1)).join('circle')
  .attr('class', 'dot')
  .attr('cx', d => d[0]).attr('cy', d => d[1])
  .attr('r', 4).attr('fill', 'steelblue');

</script>
</body>
</html>
