# Canonical research-discipline vocabulary for agent-skills.
#
# Purpose: one controlled, client-facing category set for every skill, so
# projects can be retrieved by discipline via /memory recall and browsed by
# category. This is deliberately separate from the free-form `taxonomy:`
# frontmatter (a folksonomy for graph bridging); `disciplines:` is a CLOSED
# vocabulary — values outside `vocabulary:` are a validation error.
#
# Governance:
# - Applied to SKILL.md frontmatter (and a README banner line) by
#   scripts/apply_disciplines.py. The mapping below is EXPLICIT and
#   fail-closed: a skill directory with a SKILL.md but no entry here fails
#   the apply/check run. Add the skill here first.
# - Each skill gets 1-3 disciplines, primary first.
# - Registry documents are synced to /memory (collection skill_disciplines)
#   by the same script so `/memory recall "<discipline> skills"` works.

version: 1

vocabulary:
  extraction: >
    Document and data extraction: PDF/HTML parsing, tables, OCR, entities,
    structured output from unstructured sources.
  memory-knowledge: >
    Memory systems and knowledge graphs: recall, ArangoDB/Qdrant, embeddings,
    taxonomy bridges, episodic archives, knowledge curation.
  agentic-orchestration: >
    Multi-agent pipelines and workflow orchestration: DAGs, roundtables,
    subagents, planning, task execution, agent runtimes.
  compliance-security: >
    Compliance and security: NIST/CMMC/OSCAL/CUI/SPARTA, security scanning,
    hardening, evidence cases, audit trails.
  research-retrieval: >
    External research and retrieval: web/GitHub/arXiv search, fetching,
    deep-research aggregation, discovery APIs.
  model-ops: >
    LLM and model operations: provider gateways, proxies, quotas, GPU
    provisioning, inference infrastructure, prompt engineering runtimes.
  ml-training: >
    Model training: classifiers, regressors, small GPTs, LoRA/RVC/TTS
    training, GRPO, dataset-to-model pipelines.
  evaluation-quality: >
    Evaluation and quality assurance: evals, reviews, benchmarks, drift and
    integrity detection, adversarial testing, readiness gates.
  observability-operations: >
    Monitoring and operations: health monitors, schedulers, dashboards,
    service ops, cost tracking, workstation and infra maintenance.
  browser-automation: >
    Browser and UI automation transports: CDP/extension driving, web-app
    oracles, page capture and interaction.
  content-creation: >
    Content and media creation: papers, reports, decks, stories, movies,
    music, images, figures, diagrams.
  voice-audio: >
    Voice and audio: TTS/STT, voice conversion, stem separation, audio
    analysis, real-time voice agents.
  persona-simulation: >
    Personas and simulation: persona creation, journals, dreams, simulated
    reviewers/conversations, theory-of-mind modeling.
  ui-design-engineering: >
    UI design and design engineering: UX reviews, mockups, React/QML craft,
    animation, design systems and styleguides.
  developer-tooling: >
    Developer tooling: code parsing, debuggers, tickets, clipboards, skill
    scaffolding/CI, IDE and terminal utilities.
  human-collaboration: >
    Human-in-the-loop collaboration: interviews, alignment, handoffs,
    walkthroughs, onboarding.
  data-engineering: >
    Data ingestion and corpus engineering: ingest/consume pipelines,
    datalakes, feeds, coverage balancing, dataset curation.
  engineering-standards: >
    Codified best practices and standards packs that gate how other skills
    are built and reviewed.

