schema: readme_to_pitchdeck.source_manifest.v1
project_name: Replace with project name
deck_title: Replace with deck title
audience: Replace with exact audience
sources:
  - id: public-readme
    title: Public product README
    path: ${PROJECT_ROOT}/README.md
    visibility: public
    role: primary
    required: true
  - id: private-readme
    title: Private implementation README
    path: ${PRIVATE_PROJECT_ROOT}/README.md
    visibility: private
    role: evidence
    required: false
policy:
  public_deck_source_ids:
    - public-readme
  forbidden_unqualified_claims:
    - production-ready
    - fully validated
    - deployed in production
    - all responses are grounded
  mandatory_non_claims:
    - This deck does not establish production readiness, certification, accreditation, or deployment.
    - Candidate claims require human review before external use.
seam_validation:
  kind: source_manifest
  status: PASS
