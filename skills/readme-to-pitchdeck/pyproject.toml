[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "readme-to-pitchdeck"
version = "0.1.0"
description = "Compile claim-bound README content into editable PPTX pitch decks and Google Slides handoff bundles"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10,<13",
  "pydantic>=2.7,<3",
  "python-pptx>=1.0,<2",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
readme-to-pitchdeck = "readme_to_pitchdeck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/readme_to_pitchdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
