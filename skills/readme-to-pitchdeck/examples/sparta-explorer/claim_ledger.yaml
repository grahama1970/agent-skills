schema: readme_to_pitchdeck.claim_ledger.v1
project_name: Sparta Explorer
claims:
- id: sparta-public-thesis
  text: Trace a space-cyber conclusion from framework guidance to program evidence
    and human review without letting AI turn relevance into authority.
  kind: thesis
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Introduction
  risk: medium
  status: approved
  approval:
    approved_by: fixture-maintainer
    approved_at: '2026-08-05'
- id: sparta-public-one-thread
  text: Sparta Explorer turns scattered space-cyber, engineering, supplier, and test
    evidence into one inspectable decision thread.
  kind: product
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Introduction
  risk: medium
  status: approved
  approval:
    approved_by: fixture-maintainer
    approved_at: '2026-08-05'
- id: sparta-public-three-questions
  text: The product helps teams ask why a conclusion is believed, what is missing
    or disputed, and who is allowed to decide.
  kind: product
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Introduction
  risk: low
  status: approved
  approval:
    approved_by: fixture-maintainer
    approved_at: '2026-08-05'
- id: sparta-public-model-boundary
  text: The model helps users navigate while governed evidence and authorized people
    decide.
  kind: thesis
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Why Sparta Explorer
  risk: medium
  status: approved
  approval:
    approved_by: fixture-maintainer
    approved_at: '2026-08-05'
- id: sparta-public-relevance-not-support
  text: Search, embeddings, and graph traversal can identify relevant material without
    establishing support, scope, currency, or approval.
  kind: thesis
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Why Sparta Explorer
  risk: medium
  status: approved
  approval:
    approved_by: fixture-maintainer
    approved_at: '2026-08-05'
- id: sparta-public-embry-foundation
  text: Sparta Explorer is the assurance workbench inside the planned Embry OS local
    operating foundation for policy-bounded and disconnected environments.
  kind: product
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Built on Embry OS
  risk: high
  status: approved
  required_qualifier: Embry OS is a planned local operating foundation; it is not
    flight-control software and this claim does not establish deployment.
  approval:
    approved_by: fixture-maintainer
    approved_at: '2026-08-05'
- id: sparta-public-f36-demo
  text: The synthetic F-36 program world tests whether one evidence thread can serve
    program, engineering, supplier, test, and operational readers without collapsing
    authority boundaries.
  kind: product
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: The Synthetic F-36 Demonstration
  risk: medium
  status: approved
  approval:
    approved_by: fixture-maintainer
    approved_at: '2026-08-05'
- id: sparta-public-working-surfaces
  text: The prepared-host investigation experience includes Global Posture, Threat
    Matrix, Supply Chain, QRAs, Coverage, Controls, Sources, URLs, and a docked Console.
  kind: status
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Current Status and Closure Gates
  risk: high
  status: approved
  required_qualifier: Treat this as a prepared-host late-stage prototype claim and
    verify the exact commit, preflight, and current screenshots before presenting
    it.
  approval:
    approved_by: fixture-maintainer
    approved_at: '2026-08-05'
- id: sparta-public-response-path-status
  text: On the governed path, Sparta Chat can answer, clarify, deflect, or expose
    insufficient evidence while transitional response branches remain open.
  kind: status
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Product Tour — Sparta Chat
  risk: high
  status: approved
  required_qualifier: The governed path is bounded and transitional branches are still
    being converged; do not claim every visible response uses it.
  approval:
    approved_by: fixture-maintainer
    approved_at: '2026-08-05'
- id: sparta-public-collaboration-stage
  text: Sparta Explorer is ready for design-partner conversation, architecture walkthrough,
    workflow evaluation, co-design, and prepared-host technical sessions.
  kind: ask
  visibility: public
  source_refs:
  - source_id: sparta-public-readme
    section: Why Collaborate Now
  risk: high
  status: approved
  required_qualifier: The offer is a late-stage prototype and prepared-host evaluation,
    not a turnkey production deployment.
  approval:
    approved_by: fixture-maintainer
    approved_at: '2026-08-05'
- id: sparta-public-open-gates
  text: Independent corpus review, response-route convergence, QRA reasoning and reuse,
    decision authority, voice, setup, and deployment remain explicit closure gates.
  kind: roadmap
  visibility: public
  source_refs:
