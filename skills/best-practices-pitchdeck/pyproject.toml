[project]
name = "best-practices-pitchdeck"
version = "0.1.0"
description = "Deck architecture laws measured from a real corpus; sectioning contract that prevents bespoked slide architecture."
requires-python = ">=3.12"
dependencies = [
  "loguru>=0.7.0",
  "python-pptx>=0.6.23",
  "typer>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
