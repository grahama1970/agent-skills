[project]
name = "create-table-classifier"
version = "0.1.0"
description = "GRPO training for Camelot table extraction strategy prediction"
readme = "SKILL.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=0.33.0",
    "camelot-py[cv]>=0.11.0",
    "datasets>=2.20.0",
    "httpx>=0.27.0",
    "joblib>=1.5.3",
    "loguru>=0.7.0,<0.7.3",
    "numpy",
    "pandas",
    "peft>=0.12.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.8.0",
    "scipy",
    "timm>=1.0.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "tqdm>=4.66.0",
    "transformers>=4.44.0",
    "typer>=0.12.0",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
wandb = [
    "wandb>=0.17.0",
]
tensorboard = [
    "tensorboard>=2.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
