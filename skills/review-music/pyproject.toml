[project]
name = "review-music"
version = "0.1.0"
description = "Audio analysis with MIR tools + LLM music theory reasoning for Horus persona"
requires-python = ">=3.10,<3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    # Audio loading and basic features (core - always works)
    # Lyrics transcription (GPU-accelerated)
    # YouTube download
    # CLI and utilities
    "essentia",
    "faster-whisper>=1.0.0",
    "librosa>=0.10.0",
    "loguru>=0.7.0,<0.7.3",
    "madmom",
    "numpy>=1.20.0",
    "openai-whisper",
    "rich>=13.0.0",
    "scipy>=1.7.0",
    "soundfile>=0.12.0",
    "typer>=0.9.0",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
# Advanced MIR features (disabled - incompatible with Python 3.13)
# To install manually: pip install madmom essentia
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "llm: marks tests requiring LLM API calls",
    "integration: marks tests requiring external services",
]
