<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ops-excalidraw whiteboard</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  body.dark{background:#121212;color:#e0e0e0}
  body.dark #side{border-color:#333;background:#1b1b1f}
  body.dark #svgout{border-color:#333;background:#1b1b1f}
  body.dark button{background:#2a2a2e;color:#e0e0e0;border:1px solid #444}
  #app{display:flex;height:100%}
  #board{flex:1;min-width:0}
  #side{width:340px;border-left:1px solid #ccc;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px}
  #svgout{border:1px solid #ddd;min-height:200px;background:#fafafa}
  #svgout svg{max-width:100%;height:auto}
  button{padding:8px 12px;cursor:pointer}
  #err{color:#b00020;white-space:pre-wrap;font-size:12px}
  label{display:block;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div id="board"></div>
  <div id="side">
    <button id="theme" data-qid="whiteboard:action:theme-toggle" data-qs-action="WHITEBOARD_TOGGLE_THEME" title="Switch between dark and light mode" style="display:flex;align-items:center;justify-content:center;gap:6px">
      <svg id="theme-icon-moon" role="img" aria-label="Switch to dark mode" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Switch to dark mode</title><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <svg id="theme-icon-sun" role="img" aria-label="Switch to light mode" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><title>Switch to light mode</title><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    </button>
    <button id="render" data-qid="whiteboard:action:render" data-qs-action="WHITEBOARD_RENDER" title="Compile the board and render it to SVG" style="display:flex;align-items:center;justify-content:center;gap:6px">
      <svg role="img" aria-label="Compile the board and render it to SVG" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Compile the board and render it to SVG</title><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      <span>Render SVG</span>
    </button>
    <div><strong>Libraries</strong><div id="libs" data-qid="whiteboard:panel:libraries"></div></div>
    <div id="err" data-qid="whiteboard:panel:error"></div>
    <div id="svgout" data-qid="whiteboard:panel:svg-output"></div>
    <a id="dl" download="whiteboard.svg" style="display:none" data-qid="whiteboard:action:download" data-qs-action="WHITEBOARD_DOWNLOAD_SVG" title="Download the rendered SVG"><svg role="img" aria-label="Download the rendered SVG" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><title>Download the rendered SVG</title><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg> Download SVG</a>
  </div>
</div>
<script src="/static/react.min.js"></script>
<script src="/static/react-dom.min.js"></script>
<script src="/static/excalidraw.min.js"></script>
<script>
let api = null;
const loaded = new Map(); // libName -> items
let theme = localStorage.getItem("wb-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
let setThemeState = null;

const applyTheme = () => {
  document.body.classList.toggle("dark", theme === "dark");
  document.getElementById("theme-icon-sun").style.display = theme === "dark" ? "" : "none";
  document.getElementById("theme-icon-moon").style.display = theme === "dark" ? "none" : "";
  localStorage.setItem("wb-theme", theme);
  if (setThemeState) setThemeState(theme);
};

const err = (m) => { document.getElementById("err").textContent = m || ""; };

try {
  const App = () => {
    const [th, setTh] = React.useState(theme);
    setThemeState = setTh;
    return React.createElement(ExcalidrawLib.Excalidraw, {
      excalidrawAPI: (a) => { api = a; },
      theme: th,
      onLibraryChange: (items) => {
        // Persist only human/agent-curated personal items, not the preloaded sets.
        const preloaded = new Set([...loaded.values()].flat().map(i => i.id));
        const personal = items.filter(i => !preloaded.has(i.id));
        clearTimeout(window.__plTimer);
        window.__plTimer = setTimeout(() => {
          fetch("/personal-library", { method: "POST", body: JSON.stringify(personal) }).catch(() => {});
        }, 800);
      },
    });
  };
  ReactDOM.createRoot(document.getElementById("board")).render(React.createElement(App));
} catch (e) { err("editor failed to mount: " + e); }

const refreshLibrary = (openMenu) => {
  const items = [...loaded.values()].flat();
  api.updateLibrary({ libraryItems: items, merge: false, openLibraryMenu: !!openMenu });
};

const normalize = (lib) =>
  (lib.libraryItems ?? (lib.library ?? []).map((els, i) => ({ id: "v1-" + i, elements: els })))
    .map((it) => ({ ...it, status: "unpublished" }));

fetch("/libraries").then(r => r.json()).then(names => {
  const box = document.getElementById("libs");
  for (const name of names) {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    const slug = name.replace(/\.excalidrawlib$/, "");
    cb.dataset.qid = "whiteboard:library:" + slug;
    cb.dataset.qsAction = "WHITEBOARD_TOGGLE_LIBRARY";
    cb.title = "Load or unload library " + name;
    cb.onchange = async () => {
      err("");
      try {
        if (cb.checked) {
          const lib = await (await fetch("/library/" + name)).json();
          loaded.set(name, normalize(lib));
        } else {
          loaded.delete(name);
        }
        refreshLibrary(cb.checked);
      } catch (e) { err(String(e)); cb.checked = false; }
    };
    label.append(cb, " " + name);
    box.append(label);
    // Pre-fill the personal library on startup.
    fetch("/library/" + name).then(r => r.json()).then(lib => {
      loaded.set(name, normalize(lib));
      cb.checked = true;
      const waitApi = setInterval(() => { if (api) { clearInterval(waitApi); refreshLibrary(false); } }, 300);
    }).catch(() => {});
  }
});

// Hot reload: poll for agent-pushed board versions and apply live.
let boardVersion = 0;
setInterval(async () => {
  if (!api) return;
  try {
    const r = await fetch("/board?since=" + boardVersion);
    if (r.status !== 200) return;
    const { version, scene } = await r.json();
    boardVersion = version;
    try {
      const els = ExcalidrawLib.convertToExcalidrawElements ? ExcalidrawLib.convertToExcalidrawElements(scene.elements) : scene.elements;
      api.updateScene({ elements: els });
      api.scrollToContent(undefined, { fitToContent: true });
    } catch (e) { err("board apply failed: " + e); }
  } catch {}
}, 1500);

document.getElementById("theme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; applyTheme(); };
applyTheme();

document.getElementById("render").onclick = async () => {
  err("");
  try {
  if (!api) { err("editor still loading — try again in a moment"); return; }
  const scene = {
    type: "excalidraw", version: 2, source: "ops-excalidraw-whiteboard",
    elements: api.getSceneElements(), appState: { name: api.getAppState().name || "Whiteboard" }, files: {},
  };
  const resp = await fetch("/render", { method: "POST", body: JSON.stringify(scene) });
  const text = await resp.text();
  if (!resp.ok) { err(text); return; }
  document.getElementById("svgout").innerHTML = text;
  const dl = document.getElementById("dl");
  dl.href = URL.createObjectURL(new Blob([text], { type: "image/svg+xml" }));
  dl.style.display = "block";
  } catch (e) { err(String(e)); }
};
</script>
</body>
</html>
