<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ops-excalidraw whiteboard</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
  #board{position:fixed;inset:0}
  /* Floating icon toolbar, top-right, clear of Excalidraw's own Library button */
  #toolbar{position:fixed;top:12px;right:130px;display:flex;align-items:center;gap:4px;
    background:rgba(255,255,255,.92);border:1px solid #ddd;border-radius:10px;padding:4px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);z-index:50;backdrop-filter:blur(4px)}
  #toolbar button,#toolbar a{display:flex;align-items:center;justify-content:center;padding:8px;
    border:none;background:transparent;border-radius:8px;cursor:pointer;color:#555}
  #toolbar button:hover,#toolbar a:hover{background:#eee;color:#111}
  body.dark #toolbar{background:rgba(24,24,27,.92);border-color:#333}
  body.dark #toolbar button,body.dark #toolbar a{color:#a1a1aa}
  body.dark #toolbar button:hover,body.dark #toolbar a:hover{background:#27272a;color:#fafafa}
  /* Floating result panel, appears only after a render or error */
  #result{position:fixed;right:130px;top:64px;width:340px;max-height:70vh;overflow:auto;display:none;
    background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px;z-index:50;
    box-shadow:0 2px 10px rgba(0,0,0,.15)}
  body.dark #result{background:#18181b;border-color:#333;color:#e0e0e0}
  #result svg{max-width:100%;height:auto}
  #err{color:#b00020;white-space:pre-wrap;font-size:12px}
  #toolbar svg{pointer-events:none}
  /* Agent proposal banner, top-center; the canvas is untouched until Accept */
  #proposal{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;
    background:rgba(255,251,235,.97);border:1px solid #f0c000;border-radius:10px;padding:8px 12px;
    z-index:60;box-shadow:0 2px 12px rgba(0,0,0,.2);font-size:13px;color:#663c00}
  body.dark #proposal{background:rgba(60,50,15,.97);border-color:#8a6d00;color:#ffe9a8}
  #proposal button{padding:5px 10px;border-radius:7px;border:1px solid #ccc;cursor:pointer;font-size:12px}
  #proposal .accept{background:#22c55e;color:#fff;border-color:#16a34a}
  #proposal .reject{background:#ef4444;color:#fff;border-color:#dc2626}
  #proposal .focus{background:transparent}
</style>
</head>
<body>
<div id="board"></div>

<div id="toolbar" data-qid="whiteboard:panel:toolbar">
  <button id="theme" data-qid="whiteboard:action:theme-toggle" data-qs-action="WHITEBOARD_TOGGLE_THEME" title="Switch between dark and light mode">
    <svg id="theme-icon-moon" role="img" aria-label="Switch to dark mode" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Switch to dark mode</title><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    <svg id="theme-icon-sun" role="img" aria-label="Switch to light mode" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><title>Switch to light mode</title><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
  </button>
  <button id="laser" data-qid="whiteboard:action:laser" data-qs-action="WHITEBOARD_LASER" title="Laser pointer — point while you talk (Excalidraw native)">
    <svg role="img" aria-label="Laser pointer" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Laser pointer</title><path d="M12 2v3"/><path d="m19 5-1.5 1.5"/><path d="M22 12h-3"/><path d="M12 8a4 4 0 0 0-4 4c0 1.5.8 2.5 1.5 3.5L12 22l2.5-6.5c.7-1 1.5-2 1.5-3.5a4 4 0 0 0-4-4Z"/></svg>
  </button>
  <button id="render" data-qid="whiteboard:action:render" data-qs-action="WHITEBOARD_RENDER" title="Compile the board and render it to SVG [Ctrl+Shift+R]">
    <svg role="img" aria-label="Compile the board and render it to SVG" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Compile the board and render it to SVG</title><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
  </button>
  <button id="export-native" data-qid="whiteboard:action:export-native" data-qs-action="WHITEBOARD_EXPORT_NATIVE" title="Export the board exactly as drawn (keeps images, colors, background)">
    <svg role="img" aria-label="Export board as SVG (faithful)" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Export board as SVG (faithful)</title><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 17 4 4 4-4"/></svg>
  </button>
  <button id="copysvg" style="display:none" data-qid="whiteboard:action:copy-svg" data-qs-action="WHITEBOARD_COPY_SVG" title="Copy rendered SVG to clipboard">
    <svg role="img" aria-label="Copy rendered SVG to clipboard" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Copy rendered SVG to clipboard</title><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/><path d="m17 14-5 5-2-2"/></svg>
  </button>
  <a id="dl" download="whiteboard.svg" style="display:none" data-qid="whiteboard:action:download" data-qs-action="WHITEBOARD_DOWNLOAD_SVG" title="Download the rendered SVG">
    <svg role="img" aria-label="Download the rendered SVG" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><title>Download the rendered SVG</title><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
  </a>
</div>

<div id="proposal" data-qid="whiteboard:panel:proposal">
  <span id="proposal-msg"></span>
  <button class="accept" id="proposal-accept" data-qid="whiteboard:action:proposal-accept" data-qs-action="WHITEBOARD_ACCEPT_PROPOSAL" title="Accept the agent proposal (adds/updates elements; never deletes your work)">Accept</button>
  <button class="reject" id="proposal-reject" data-qid="whiteboard:action:proposal-reject" data-qs-action="WHITEBOARD_REJECT_PROPOSAL" title="Reject the agent proposal">Reject</button>
  <button class="focus" id="proposal-focus" data-qid="whiteboard:action:proposal-focus" data-qs-action="WHITEBOARD_FOCUS_PROPOSAL" title="Preview the proposed elements without applying">Focus</button>
</div>

<div id="result" data-qid="whiteboard:panel:result">
  <div id="err" data-qid="whiteboard:panel:error"></div>
  <div id="svgout" data-qid="whiteboard:panel:svg-output"></div>
</div>

<script src="/static/react.min.js"></script>
<script src="/static/react-dom.min.js"></script>
<script src="/static/excalidraw.min.js"></script>
<script>
let api = null;
const loaded = new Map(); // libName -> items
let theme = localStorage.getItem("wb-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
let setThemeState = null;

const updateResultVisibility = () => {
  const hasContent = document.getElementById("err").textContent || document.getElementById("svgout").innerHTML;
  document.getElementById("result").style.display = hasContent ? "block" : "none";
};

const err = (m) => {
  document.getElementById("err").textContent = m || "";
  updateResultVisibility();
};

const applyTheme = () => {
  document.body.classList.toggle("dark", theme === "dark");
  document.getElementById("theme-icon-sun").style.display = theme === "dark" ? "" : "none";
  document.getElementById("theme-icon-moon").style.display = theme === "dark" ? "none" : "";
  localStorage.setItem("wb-theme", theme);
  if (setThemeState) setThemeState(theme);
};

try {
  const App = () => {
    const [th, setTh] = React.useState(theme);
    setThemeState = setTh;
    return React.createElement(ExcalidrawLib.Excalidraw, {
      excalidrawAPI: (a) => { api = a; },
      theme: th,
      initialData: { appState: { gridSize: 20 } },  // grid mode on by default (toggle: Shift+G)
      onLibraryChange: (items) => {
        // Persist only human/agent-curated personal items, not the preloaded sets.
        const preloaded = new Set([...loaded.values()].flat().map(i => i.id));
        const personal = items.filter(i => !preloaded.has(i.id));
        clearTimeout(window.__plTimer);
        window.__plTimer = setTimeout(() => {
          fetch("/personal-library", { method: "POST", body: JSON.stringify(personal) }).catch(() => {});
        }, 800);
      },
    });
  };
  ReactDOM.createRoot(document.getElementById("board")).render(React.createElement(App));
} catch (e) { err("editor failed to mount: " + e); }

const refreshLibrary = (openMenu) => {
  const items = [...loaded.values()].flat();
  api.updateLibrary({ libraryItems: items, merge: false, openLibraryMenu: !!openMenu });
};

const normalize = (lib) =>
  (lib.libraryItems ?? (lib.library ?? []).map((els, i) => ({ id: "v1-" + i, elements: els })))
    .map((it) => ({ ...it, status: "unpublished" }));

// Pre-fill every library silently; browse them via Excalidraw's native Library button.
fetch("/libraries").then(r => r.json()).then(names => {
  for (const name of names) {
    fetch("/library/" + name).then(r => r.json()).then(lib => {
      loaded.set(name, normalize(lib));
      const waitApi = setInterval(() => { if (api) { clearInterval(waitApi); refreshLibrary(false); } }, 300);
    }).catch(() => {});
  }
});

const toEls = (scene) => {
  // Skeleton elements need conversion; already-full Excalidraw elements pass through
  // (convertToExcalidrawElements throws on full elements, so fall back to raw).
  try {
    return ExcalidrawLib.convertToExcalidrawElements
      ? ExcalidrawLib.convertToExcalidrawElements(scene.elements) : scene.elements;
  } catch { return scene.elements; }
};

// Replace path (/board): explicit --replace push for a disposable board. Applies live.
let boardVersion = 0;
let boardApplied = false;
setInterval(async () => {
  if (!api) return;
  try {
    const r = await fetch("/board?since=" + boardVersion);
    if (r.status !== 200) return;
    const { version, scene } = await r.json();
    boardVersion = version;
    try {
      api.updateScene({ elements: toEls(scene) });
      // Fit only on the first applied board; never steal the viewport on later live updates.
      if (!boardApplied) { api.scrollToContent(undefined, { fitToContent: true }); boardApplied = true; }
    } catch (e) { err("board apply failed: " + e); }
  } catch {}
}, 1500);

// Proposal path (/proposal): SAFE default. Poll for a pending agent proposal and
// show a banner. The canvas is NOT touched until the human clicks Accept.
let proposalVersion = 0;
let pendingProposal = null;
setInterval(async () => {
  if (!api) return;
  try {
    const r = await fetch("/proposal?since=" + proposalVersion);
    if (r.status !== 200) return;
    const { version, scene } = await r.json();
    proposalVersion = version;
    pendingProposal = scene;
    document.getElementById("proposal-msg").textContent =
      "Agent proposal: " + scene.elements.length + " element(s)";
    document.getElementById("proposal").style.display = "flex";
  } catch {}
}, 1500);

const clearProposal = () => {
  pendingProposal = null;
  document.getElementById("proposal").style.display = "none";
  fetch("/proposal/clear", { method: "POST" }).catch(() => {});
};

document.getElementById("proposal-accept").onclick = () => {
  if (!pendingProposal || !api) return;
  // Merge by id: proposed elements are added/updated; human elements not in the
  // proposal are never deleted. This is the safety guarantee.
  const current = api.getSceneElements();
  const byId = new Map(current.map((e) => [e.id, e]));
  for (const el of toEls(pendingProposal)) byId.set(el.id, el);
  api.updateScene({ elements: [...byId.values()] });
  clearProposal();
};
document.getElementById("proposal-reject").onclick = () => clearProposal();
document.getElementById("proposal-focus").onclick = () => {
  if (!pendingProposal || !api) return;
  // Explicit human action: preview proposed elements by fitting to them.
  try { api.scrollToContent(toEls(pendingProposal), { fitToContent: true }); } catch {}
};

document.getElementById("theme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; applyTheme(); };
applyTheme();

// Laser pointer: Excalidraw's native tool for pointing while presenting.
document.getElementById("laser").onclick = () => {
  try { api && api.setActiveTool({ type: "laser" }); } catch (e) { err("laser: " + e); }
};

// Faithful native export: the board exactly as drawn, preserving appState and
// binary files (images/icons/background) that the semantic render drops.
document.getElementById("export-native").onclick = async () => {
  err("");
  try {
    if (!api) { err("editor still loading"); return; }
    const svgEl = await ExcalidrawLib.exportToSvg({
      elements: api.getSceneElements(),
      appState: { ...api.getAppState(), exportBackground: true },
      files: api.getFiles(),
    });
    const text = new XMLSerializer().serializeToString(svgEl);
    document.getElementById("svgout").innerHTML = text;
    window.__lastSvg = text;
    const dl = document.getElementById("dl");
    dl.href = URL.createObjectURL(new Blob([text], { type: "image/svg+xml" }));
    dl.style.display = "flex";
    document.getElementById("copysvg").style.display = "flex";
    updateResultVisibility();
  } catch (e) { err("native export failed: " + e); }
};

document.getElementById("copysvg").onclick = async () => {
  try { await navigator.clipboard.writeText(window.__lastSvg || ""); err(""); } catch (e) { err("clipboard copy failed: " + e); }
};

// Hotkey: Ctrl/Cmd+Shift+R renders (R alone is Excalidraw's rectangle tool)
document.addEventListener("keydown", (e) => {
  if (e.key.toLowerCase() === "r" && e.shiftKey && (e.metaKey || e.ctrlKey) && !e.altKey) {
    e.preventDefault();
    document.getElementById("render").click();
  }
});

document.getElementById("render").onclick = async () => {
  err("");
  try {
  if (!api) { err("editor still loading — try again in a moment"); return; }
  const scene = {
    type: "excalidraw", version: 2, source: "ops-excalidraw-whiteboard",
    elements: api.getSceneElements(), appState: { name: api.getAppState().name || "Whiteboard" }, files: {},
  };
  const resp = await fetch("/render", { method: "POST", body: JSON.stringify(scene) });
  const text = await resp.text();
  if (!resp.ok) { err(text); return; }
  document.getElementById("svgout").innerHTML = text;
  const dl = document.getElementById("dl");
  dl.href = URL.createObjectURL(new Blob([text], { type: "image/svg+xml" }));
  dl.style.display = "flex";
  window.__lastSvg = text;
  document.getElementById("copysvg").style.display = "flex";
  updateResultVisibility();
  } catch (e) { err(String(e)); }
};
</script>
</body>
</html>
