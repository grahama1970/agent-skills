# /test-lab skill policy — enforced by .claude/hooks/skill_policy.py
# The #1 violation: coding agents read hidden test files, breaking the
# information barrier that prevents gaming.

name: test-lab
slash_command: /test-lab

required_reads:
  - .pi/skills/test-lab/SKILL.md

forbidden_use:
  any_of:
    # Reading hidden test source (breaks blind evaluation)
    - pattern: "test-lab/tests/|test-lab/generated/|test-lab/generators/"
      reason: "NEVER read test-lab test files. The information barrier is the entire point. Coding agents see only PASS/FAIL output."

    # Importing test-lab internals
    - pattern: "from test_lab|import test_lab"
      reason: "Don't import test-lab internals. Use run.sh commands: generate, run, report, verify-task."

    # Exposing test assertions to coding agent context
    - pattern: "assert.*test_lab|expected_value.*test"
      reason: "Never expose test assertions or expected values. Agents see only pass/fail descriptions."
