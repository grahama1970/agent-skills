# Model Registry for Vision Classifiers
# Research-backed configurations for document image classification
# Updated: 2026-02-08

models:
  # ========================================
  # EfficientNet Family (timm)
  # ========================================

  - name: efficientnet_b0
    family: efficientnet
    provider: timm
    params_millions: 5.3
    flops_billions: 0.39
    input_size: [3, 224, 224]
    inference_ms_gpu: 45
    inference_ms_cpu: 180
    priority: 2 # Recommended default (proven for table classifier)

    description: |
      Lightweight CNN with excellent accuracy-to-efficiency ratio.
      Proven success in document table classification.
      Best for: General document classification, edge deployment.

    pretrained_weights:
      - imagenet
      - imagenet21k

    hyperparameters:
      optimizer:
        default: adamw
        options: [adam, adamw, sgd]

      learning_rate:
        range: [1e-5, 1e-3]
        default: 5e-4
        log_scale: true
        notes: "Start higher (1e-3) for training from scratch, lower (1e-5) for fine-tuning"

      weight_decay:
        range: [1e-4, 1e-1]
        default: 0.01
        log_scale: true

      dropout:
        range: [0.2, 0.4]
        default: 0.3
        notes: "EfficientNetB0 default drop_connect_rate is 0.2, increase to 0.4 for stronger regularization"

      batch_size:
        options: [8, 16, 32, 64]
        default: 16
        notes: "16-32 is optimal for most GPUs, use gradient accumulation for larger effective batches"

      epochs:
        range: [10, 100]
        default: 50
        notes: "Use early stopping, typically converges in 20-50 epochs with transfer learning"

      warmup_epochs: 5
      lr_schedule: cosine
      mixup_alpha: 0.2
      cutmix_alpha: 1.0

  - name: efficientnetv2_s
    family: efficientnet
    provider: timm
    params_millions: 21.5
    flops_billions: 8.4
    input_size: [3, 384, 384]
    inference_ms_gpu: 95
    inference_ms_cpu: 420
    priority: 4

    description: |
      Improved EfficientNet with faster training and better parameter efficiency.
      Outperforms ViTs in training efficiency.
      Best for: High accuracy requirements with moderate compute budget.

    pretrained_weights:
      - imagenet
      - imagenet21k

    hyperparameters:
      optimizer:
        default: adamw
        options: [adamw, sgd]

      learning_rate:
        range: [1e-5, 5e-4]
        default: 1e-4
        log_scale: true

      weight_decay:
        range: [1e-4, 1e-2]
        default: 1e-3

      dropout:
        range: [0.1, 0.3]
        default: 0.2

      batch_size:
        options: [8, 16, 32]
        default: 16

      epochs:
        range: [20, 100]
        default: 60

      progressive_resizing: true
      stochastic_depth: 0.2

  # ========================================
  # MobileNet Family (Ultra-fast)
  # ========================================

  - name: mobilenetv3_small_100
    family: mobilenet
    provider: timm
    params_millions: 2.5
    flops_billions: 0.057
    input_size: [3, 224, 224]
    inference_ms_gpu: 15
    inference_ms_cpu: 65
    priority: 1 # Fastest option

    description: |
      Ultra-lightweight CNN for resource-constrained environments.
      Fastest inference among all models.
      Best for: Edge devices, real-time classification, simple tasks.

    pretrained_weights:
      - imagenet

    hyperparameters:
      optimizer:
        default: sgd
        options: [sgd, adam]
        notes: "SGD with momentum works best for lightweight CNNs"

      learning_rate:
        range: [1e-4, 1e-2]
        default: 1e-3

      weight_decay:
        range: [1e-5, 1e-3]
        default: 1e-4

      dropout:
        range: [0.2, 0.5]
        default: 0.3

      batch_size:
        options: [16, 32, 64]
        default: 32

      epochs:
        range: [50, 200]
        default: 100
        notes: "Lightweight models benefit from longer training"

      momentum: 0.9
      lr_schedule: step # Decay every 30 epochs

  # ========================================
  # ResNet Family (Baseline)
  # ========================================

  - name: resnet50
    family: resnet
    provider: timm
    params_millions: 25.6
    flops_billions: 4.1
    input_size: [3, 224, 224]
    inference_ms_gpu: 80
    inference_ms_cpu: 320
    priority: 4

    description: |
      Robust CNN baseline with residual connections.
      Well-understood, versatile, easy to customize.
      Best for: Standard baseline, research, when flexibility matters.

    pretrained_weights:
      - imagenet
      - imagenet21k

    hyperparameters:
      optimizer:
        default: sgd
        options: [sgd, adamw, lamb]
        notes: "SGD with momentum is traditional, AdamW for faster convergence"

      learning_rate:
        range: [1e-4, 1e-1]
        default: 1e-2
        notes: "Higher LR (0.01-0.1) with SGD + momentum, lower (1e-4) with Adam"

      weight_decay:
        range: [1e-5, 1e-2]
        default: 1e-4

      dropout:
        range: [0.3, 0.5]
        default: 0.5
        notes: "Add dropout after pooling layer"

      batch_size:
        options: [16, 32, 64, 128]
        default: 32

      epochs:
        range: [50, 600]
        default: 100
        notes: "Can train longer (300-600 epochs) with strong regularization"

      momentum: 0.9
      mixup: 0.2
      cutmix: 1.0
      randaugment: true

  # ========================================
  # Document Image Transformer (DiT)
  # ========================================

  - name: microsoft/dit-base
    family: dit
    provider: huggingface
    params_millions: 85
    flops_billions: 17.5
    input_size: [3, 224, 224]
    inference_ms_gpu: 150
    inference_ms_cpu: 980
    priority: 5 # Specialized, document-specific

    description: |
      Transformer encoder pre-trained on RVL-CDIP (document images).
      Document-specific features and spatial hierarchies.
      Best for: Complex documents, when accuracy is critical, domain expertise matters.

    pretrained_weights:
      - rvl-cdip # 16 document classes
      - rvl-cdip-imagenet

    hyperparameters:
      optimizer:
        default: adamw
        options: [adamw]
        notes: "Transformers require adaptive optimizers"

      learning_rate:
        range: [5e-6, 1e-3]
        default: 5e-5
        notes: "Very low LR for fine-tuning (5e-5 to 1e-4), higher for training (1e-3)"

      weight_decay:
        range: [1e-3, 1e-1]
        default: 0.01

      dropout:
        range: [0.1, 0.3]
        default: 0.1
        notes: "Transformers are less prone to overfitting than CNNs"

      batch_size:
        options: [8, 16, 32, 64, 128]
        default: 128
        notes: "Large batch sizes (128+) work well for transformers"

      epochs:
        range: [3, 90]
        default: 30
        notes: "Fine-tuning: 3-10 epochs, full training: 30-90 epochs"

      warmup_ratio: 0.1
      lr_schedule: linear
      layer_freeze_strategy: freeze_early # Freeze early layers for small datasets

      # DiT-specific
      use_adaptive_binarization: true
      random_resized_crop: true

  # ========================================
  # Vision Transformer (ViT)
  # ========================================

  - name: vit_base_patch16_224
    family: vit
    provider: timm
    params_millions: 86
    flops_billions: 17.6
    input_size: [3, 224, 224]
    inference_ms_gpu: 140
    inference_ms_cpu: 890
    priority: 6 # Experimental, requires large data

    description: |
      Pure transformer for vision tasks.
      Requires strong data augmentation and regularization.
      Best for: Very large datasets (10K+ samples), research, when transformers excel.

    pretrained_weights:
      - imagenet
      - imagenet21k

    hyperparameters:
      optimizer:
        default: adamw
        options: [adamw, lamb]

      learning_rate:
        range: [1e-5, 1e-3]
        default: 1e-4

      weight_decay:
        range: [1e-2, 5e-1]
        default: 0.05
        notes: "ViTs benefit from strong regularization"

      dropout:
        range: [0.1, 0.3]
        default: 0.1

      batch_size:
        options: [32, 64, 128, 256]
        default: 64
        notes: "Larger batches improve performance"

      epochs:
        range: [50, 300]
        default: 100

      warmup_epochs: 10
      mixup_alpha: 0.8
      cutmix_alpha: 1.0
      randaugment_magnitude: 9
      label_smoothing: 0.1

      # ViT requires extensive augmentation
      data_augmentation:
        required: true
        auto_augment: rand-m9-mstd0.5-inc1
        color_jitter: 0.4
        reprob: 0.25 # Random erasing probability

# ========================================
# Usage Recommendations
# ========================================

recommendations:
  quick_prototyping:
    models:
      - efficientnet_b0
      - mobilenetv3_small_100
    notes: "Fast training, proven results"

  production_deployment:
    models:
      - efficientnet_b0
      - efficientnetv2_s
    notes: "Best accuracy-to-speed ratio"

  edge_devices:
    models:
      - mobilenetv3_small_100
    notes: "Optimized for low latency and memory"

  maximum_accuracy:
    models:
      - microsoft/dit-base
      - efficientnetv2_s
    notes: "When compute budget allows, DiT leverages document-specific pretraining"

  small_datasets:
    models:
      - efficientnet_b0
      - resnet50
    notes: "Transfer learning from ImageNet, freeze early layers"

  large_datasets:
    models:
      - microsoft/dit-base
      - vit_base_patch16_224
    notes: "Transformers excel with >10K training samples"

# ========================================
# Hyperparameter Search Spaces (for Optuna)
# ========================================

optuna_search_spaces:
  efficient_search:
    # Quick search for EfficientNet/MobileNet/ResNet
    trials: 15
    max_steps_per_trial: 300
    search_params:
      lr: [1e-5, 1e-2, log]
      weight_decay: [1e-4, 1e-1, log]
      dropout: [0.1, 0.5, uniform]
      batch_size: [8, 16, 32, categorical]
      optimizer: [adam, adamw, sgd, categorical]

  transformer_search:
    # Focused search for DiT/ViT
    trials: 20
    max_steps_per_trial: 500
    search_params:
      lr: [1e-6, 1e-3, log]
      weight_decay: [1e-3, 5e-1, log]
      dropout: [0.05, 0.3, uniform]
      batch_size: [32, 64, 128, categorical]
      warmup_ratio: [0.05, 0.15, uniform]
      layer_freeze_depth: [0, 6, 12, categorical] # Number of layers to freeze

# ========================================
# Text Classifier Models (Transformers)
# ========================================

text_models:
  # ========================================
  # Ultra-Fast Text Models (< 10ms latency)
  # ========================================

  - name: distilbert-base-uncased
    family: distilbert
    provider: huggingface
    params_millions: 66
    flops_billions: 0.78
    input_type: text
    max_length: 512
    inference_ms_gpu: 5
    inference_ms_cpu: 25
    priority: 1 # Recommended for latency-sensitive tasks

    description: |
      Distilled version of BERT with 40% fewer parameters.
      Optimal balance of speed and accuracy for text classification.
      Best for: Real-time classification, persona routing, taxonomy mapping.

    pretrained_weights:
      - distilbert-base-uncased
      - distilbert-base-uncased-finetuned-sst-2-english

    hyperparameters:
      optimizer:
        default: adamw
        options: [adamw, adam]

      learning_rate:
        range: [1e-5, 5e-4]
        default: 2e-5
        log_scale: true
        notes: "Lower LR (2e-5) for fine-tuning, higher (1e-4) for training from scratch"

      weight_decay:
        range: [1e-4, 1e-1]
        default: 0.01
        log_scale: true

      dropout:
        range: [0.1, 0.3]
        default: 0.1

      batch_size:
        options: [16, 32, 64]
        default: 32

      epochs:
        range: [3, 20]
        default: 5
        notes: "Transformer fine-tuning converges quickly"

      warmup_ratio: 0.1
      lr_schedule: linear

  - name: prajjwal1/bert-tiny
    family: bert-tiny
    provider: huggingface
    params_millions: 4.4
    flops_billions: 0.01
    input_type: text
    max_length: 512
    inference_ms_gpu: 1.5
    inference_ms_cpu: 8
    priority: 1 # Fastest text model

    description: |
      Extremely compact BERT variant with 2 layers.
      Fastest inference for simple classification tasks.
      Best for: Ultra-low-latency, simple text routing, edge deployment.

    pretrained_weights:
      - prajjwal1/bert-tiny

    hyperparameters:
      optimizer:
        default: adamw
        options: [adamw]

      learning_rate:
        range: [1e-4, 5e-3]
        default: 5e-4
        notes: "Smaller models tolerate higher learning rates"

      weight_decay:
        range: [1e-4, 1e-2]
        default: 0.01

      dropout:
        range: [0.1, 0.4]
        default: 0.2

      batch_size:
        options: [32, 64, 128]
        default: 64

      epochs:
        range: [10, 50]
        default: 20
        notes: "Smaller models benefit from longer training"

  - name: sentence-transformers/all-MiniLM-L6-v2
    family: minilm
    provider: huggingface
    params_millions: 22
    flops_billions: 0.08
    input_type: text
    max_length: 256
    inference_ms_gpu: 2.5
    inference_ms_cpu: 12
    priority: 1 # Excellent speed/accuracy tradeoff

    description: |
      6-layer MiniLM optimized for sentence embeddings.
      Excellent balance of speed and semantic understanding.
      Best for: Semantic classification, multi-label tasks, taxonomy mapping.

    pretrained_weights:
      - sentence-transformers/all-MiniLM-L6-v2

    hyperparameters:
      optimizer:
        default: adamw
        options: [adamw]

      learning_rate:
        range: [1e-5, 3e-4]
        default: 3e-5

      weight_decay:
        range: [1e-4, 1e-1]
        default: 0.01

      dropout:
        range: [0.1, 0.3]
        default: 0.1

      batch_size:
        options: [32, 64, 128]
        default: 64

      epochs:
        range: [5, 30]
        default: 10

  - name: microsoft/MiniLM-L12-H384-uncased
    family: minilm
    provider: huggingface
    params_millions: 33
    flops_billions: 0.15
    input_type: text
    max_length: 512
    inference_ms_gpu: 3.5
    inference_ms_cpu: 18
    priority: 2

    description: |
      12-layer MiniLM with better accuracy than L6 variant.
      Good for tasks requiring deeper semantic understanding.
      Best for: Complex classification, multi-domain routing.

    pretrained_weights:
      - microsoft/MiniLM-L12-H384-uncased

    hyperparameters:
      optimizer:
        default: adamw
        options: [adamw]

      learning_rate:
        range: [1e-5, 2e-4]
        default: 2e-5

      weight_decay:
        range: [1e-4, 1e-1]
        default: 0.01

      dropout:
        range: [0.1, 0.2]
        default: 0.1

      batch_size:
        options: [16, 32, 64]
        default: 32

      epochs:
        range: [5, 20]
        default: 8

  # ========================================
  # High Accuracy Text Models (> 10ms latency)
  # ========================================

  - name: bert-base-uncased
    family: bert
    provider: huggingface
    params_millions: 110
    flops_billions: 1.35
    input_type: text
    max_length: 512
    inference_ms_gpu: 12
    inference_ms_cpu: 65
    priority: 3 # Use when accuracy is critical

    description: |
      Original BERT base model with 12 layers.
      Highest accuracy among fast models.
      Best for: Accuracy-critical tasks, complex semantic classification.

    pretrained_weights:
      - bert-base-uncased
      - bert-base-cased

    hyperparameters:
      optimizer:
        default: adamw
        options: [adamw]

      learning_rate:
        range: [1e-5, 1e-4]
        default: 2e-5

      weight_decay:
        range: [1e-4, 1e-1]
        default: 0.01

      dropout:
        range: [0.1, 0.2]
        default: 0.1

      batch_size:
        options: [8, 16, 32]
        default: 16

      epochs:
        range: [3, 10]
        default: 5

      warmup_ratio: 0.1
      lr_schedule: linear

# ========================================
# Text Model Recommendations
# ========================================

text_recommendations:
  ultra_low_latency:
    models:
      - prajjwal1/bert-tiny
      - sentence-transformers/all-MiniLM-L6-v2
    notes: "< 5ms GPU latency, suitable for real-time routing"

  balanced_latency_accuracy:
    models:
      - distilbert-base-uncased
      - microsoft/MiniLM-L12-H384-uncased
    notes: "5-10ms GPU latency with strong accuracy"

  maximum_accuracy:
    models:
      - bert-base-uncased
    notes: "When accuracy matters more than latency"

  taxonomy_mapping:
    models:
      - distilbert-base-uncased
      - sentence-transformers/all-MiniLM-L6-v2
    notes: "Recommended for Federated Taxonomy bridge classification"

# ========================================
# Text Hyperparameter Search Spaces
# ========================================

text_optuna_search_spaces:
  fast_text_search:
    # Quick search for DistilBERT/MiniLM
    trials: 20
    max_steps_per_trial: 500
    search_params:
      lr: [1e-5, 5e-4, log]
      weight_decay: [1e-4, 1e-1, log]
      dropout: [0.05, 0.3, uniform]
      batch_size: [16, 32, 64, categorical]
      warmup_ratio: [0.0, 0.2, uniform]

  multilabel_text_search:
    # Optimized for multi-label classification
    trials: 25
    max_steps_per_trial: 800
    search_params:
      lr: [5e-6, 2e-4, log]
      weight_decay: [1e-4, 1e-1, log]
      dropout: [0.05, 0.25, uniform]
      batch_size: [16, 32, 64, categorical]
      threshold: [0.3, 0.7, uniform]
      pos_weight_multiplier: [1.0, 5.0, uniform]

# ========================================
# Training Best Practices
# ========================================

best_practices:
  transfer_learning:
    - Always start with pretrained weights (ImageNet or task-specific)
    - Use lower learning rates for fine-tuning (1e-5 to 1e-4)
    - Freeze early layers for small datasets (<1K samples)
    - Gradually unfreeze layers if dataset is large

  regularization:
    - Use mixup/cutmix for data augmentation
    - Apply dropout to prevent overfitting
    - Use weight decay for all optimizers
    - Early stopping based on validation accuracy

  optimization:
    - AdamW for transformers (DiT, ViT)
    - SGD with momentum for CNNs (ResNet, MobileNet)
    - Adam/AdamW for balanced choice (EfficientNet)
    - Cosine learning rate schedule for most tasks
    - Warmup for transformer models

  data_handling:
    - Normalize inputs to [0, 1] then apply ImageNet stats
    - Use RandomResizedCrop during training
    - Resize to 224x224 for consistency (384x384 for EffNetV2)
    - Apply progressive resizing for longer training (start 160px → end 224px)

  evaluation:
    - Track accuracy, F1, per-class precision/recall
    - Monitor confusion matrix for class imbalances
    - Measure inference latency (p50, p95)
    - Use validation set for hyperparameter selection
    - Test on held-out set only once at the end
