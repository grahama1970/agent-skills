[project]
name = "ask-phart-renderer"
version = "0.1.0"
description = "PHART 1.5 git renderer for ask DAG charts (Python 3.14+)"
requires-python = ">=3.14"
dependencies = [
    "networkx>=3.3",
    "phart",
]

[project.scripts]
ask-phart-render = "phart_renderer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phart_renderer"]

[tool.uv.sources]
phart = { git = "https://github.com/scottvr/phart.git" }
