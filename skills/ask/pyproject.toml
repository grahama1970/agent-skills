[project]
name = "pi-skill-ask"
version = "0.1.0"
description = "Runtime package for the ask skill"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "json-repair>=0.30.0",
    "loguru>=0.7.2,<0.7.3",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "typer>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ask"]
