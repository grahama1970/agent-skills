  - Include degraded_features, safe_to_run_deep_review, artifact_root health, reviewer spec health, chain spec health, memory/dogpile/scillm/subagent-runner
    checks, and current runner identity.
  - Ensure /ask status can reconstruct recent run state from artifacts only, independent of process ownership.
  tests:
