version: 1
kind: orchestrate-plan
repo_root: /tmp/agent-skills-ask-oracle-review-workflows-20260427
metadata:
  title: Ask Portable Parity Protocol
  goal: Make /ask a portable oracle/review protocol across agent CLIs without cloning Pi-native session internals.
  plan_type: code
  created: '2026-04-27'
  primary_persona:
    name: Graham Anderson
    role: Developer/operator using /ask for cross-agent oracle, review, and synthesis workflows
    source: User parity request and /ask project knowledge
execution:
  max_concurrency: 3
  wave_barrier: true
  scheduling_policy: wave_then_dependency
capability_overlap:
- '/memory recall found existing /ask project knowledge: /ask is the human-facing memory/oracle/review control plane, not
  a general code-runner.'
- Existing /ask already has memory recall, dogpile hints, oracle synthesis, roundtable, parallel review, deep-review artifacts,
  doctor/status, reviewer specs, and saved chain specs; this plan EXTENDs those seams.
- Existing /subagent-runner owns Pi/Codex-style child execution; this plan creates runner adapter contracts and compilers,
  not a new native session runtime.
- Existing /create-context overlaps deterministic context-bundle construction; tasks must reuse that pattern where practical
  instead of inventing unrelated context assembly.
- Existing /review-plan and /test-lab cover plan validation and blind checks; final validation tasks explicitly call them.
- Existing /prompt-lab and prompt review bundles should be used for new prompt payloads; implementation must not bury portable
  protocol prompts only in inline strings.
questions_blockers:
- None
lanes:
- id: '0'
  label: 'Wave 0: Baseline and contracts'
- id: '1'
  label: 'Wave 1: Runner and runtime protocol'
- id: '2'
  label: 'Wave 2: Specs, chains, and enforcement'
- id: '3'
  label: 'Wave 3: Recovery and transparency'
- id: '4'
  label: 'Wave 4: Golden tests and docs'
- id: '5'
  label: 'Wave 5: Formal validation'
tasks:
- id: '1'
  title: Capture baseline ask health
  lane: '0'
  runner: local
  backend: ''
  mode: ''
  agent: general-purpose
  depends_on: []
  command: cd skills/ask && bash sanity.sh && ./run.sh doctor --json >/tmp/ask-doctor-baseline.json && ./run.sh status --runs
    --json >/tmp/ask-status-baseline.json
  implementation:
  - CALL existing /ask sanity, doctor, and status paths before changing portable parity code.
  - Record baseline behavior for health/status JSON so later tasks preserve compatibility.
  tests:
  - skills/ask/sanity.sh
  - skills/ask/run.sh doctor --json
  - skills/ask/run.sh status --runs --json
  definition_of_done:
    command: cd skills/ask && bash sanity.sh && python -m json.tool /tmp/ask-doctor-baseline.json >/dev/null && python -m
      json.tool /tmp/ask-status-baseline.json >/dev/null
    assertion: Baseline ask sanity exits 0 and doctor/status emit valid JSON.
  blind_tests:
  - skills/ask/sanity.sh
  gate: Baseline doctor/status/sanity are captured before implementation waves run.
- id: '2'
  title: Add runner adapter contract and aliases
  lane: '1'
  runner: code-runner
  backend: codex
  mode: iterative
  agent: general-purpose
  depends_on:
  - '1'
  read_context:
  - skills/ask/src/ask/ask_config.py
  - skills/ask/src/ask/oracle_adapters.py
  - skills/ask/src/ask/ask_oracle.py
  - skills/ask/docs/ASK_DEEP_REVIEW_CONTRACT.md
  allowlist:
  - skills/ask/src/ask/runner_adapters.py
  - skills/ask/docs/RUNNER_ADAPTERS.md
  - skills/ask/tests/test_runner_adapters.py
  implementation:
  - CREATE a versioned runner adapter contract for codex-cli, claude-code, gemini-cli, opencode, aider, pi, plain-shell, scillm-api,
    and openai-api.
  - Include command templates, capability flags, sandbox/write-policy class, model override support, reasoning override support,
    stdin/output-file behavior, and degradation notes.
  - Add model and reasoning alias normalization so chain compilation can target runner-specific syntax without prompt-level
    guessing.
  - Fail closed for unknown runners and for plain-shell LLM execution attempts.
  tests:
  - tests/test_runner_adapters.py
  - test-lab/run.sh verify-task ask-portable-parity-runner-adapters skills/ask/src/ask/runner_adapters.py --domain python
  definition_of_done:
    command: cd skills/ask && uv run --project . --group dev python -m pytest -q tests/test_runner_adapters.py
    assertion: All configured runners load, aliases normalize deterministically, unknown runners fail closed, and plain-shell
      refuses LLM execution.
  blind_tests:
  - test-lab/run.sh verify-task ask-portable-parity-runner-adapters skills/ask/src/ask/runner_adapters.py --domain python
  - skills/ask/sanity.sh
  gate: Runner registry rejects unknown runners and plain-shell live LLM execution while compiling known runner templates.
  skills:
  - ask
  - code-runner
  - test-lab
