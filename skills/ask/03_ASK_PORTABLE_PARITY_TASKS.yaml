      --json >/tmp/ask-doctor.json && python -m json.tool /tmp/ask-doctor.json >/dev/null
    assertion: Doctor JSON contains runner, capabilities, degraded_features, safe_to_run_deep_review, and dependency health
      without breaking status.
  blind_tests:
  - test-lab/run.sh verify-task ask-portable-parity-doctor skills/ask/src/ask/doctor.py --domain python
  - skills/ask/sanity.sh
  gate: Doctor JSON exposes runner capability matrix and degraded features for current environment.
  skills:
  - ask
  - code-runner
  - test-lab
