version: 1
kind: orchestrate-plan
repo_root: /home/graham/workspace/experiments/agent-skills/skills/ask
metadata:
  title: Ask Control Plane Competitiveness
  created: "2026-05-30"
  plan_type: code
  owner: ask
  primary_persona:
    name: Project agent using /ask
    role: Developer/operator choosing an external reasoning, review, oracle, or browser lane with proof artifacts
    source: /home/graham/workspace/experiments/agent-skills/skills/ask/SKILL.md
  goal: >
    Improve /ask from a useful oracle/review front door into a compelling agentic control plane
    against LangGraph, CrewAI, AutoGen, OpenAI Agents SDK, and custom orchestration consoles.
    The differentiator is not more worker execution; it is route choice, adapter discipline,
    evidence ledgers, verifier gates, and live oracle proof that explain why a lane was chosen
    and what artifacts prove the result.
  readiness_definition: >
    Competitive means /ask can show a deterministic route decision, call typed adapters through
    health-checked lanes, persist traceable request/status/events artifacts, validate review and
    oracle outputs, and run both fake-transport regression tests and explicit live-lane sanity
    checks. No lane may appear ready from a missing backend, stale browser tab, or absent artifact.
execution:
  max_concurrency: 1
  wave_barrier: true
  scheduling_policy: wave_then_dependency
capability_overlap:
  - >
    Existing /ask already owns memory-backed questions, oracle, roundtable, argue, parallel-review,
    deep-review, CAE/QRA review, browser oracles, WebGPT, and /scillm-backed model calls. Extend
    that control plane instead of creating a separate orchestration skill.
  - >
    Existing /orchestrate and /code-runner own implementation execution. This plan keeps /ask as
    the selector, composer, verifier, and artifact writer rather than turning it into a worker pool.
  - >
    Existing /scillm owns provider routing for direct model calls. /ask should consume /scillm
    through typed adapter contracts and surface model capability/failure information in its own
    request ledger.
  - >
    Existing /surf browser lanes, including WebGPT and Cursor Browser, are differentiators only
    when /ask proves the selected tab/view/project, request payload, returned artifacts, and
    failure mode. Browser-lane status must fail closed when that proof is absent.
questions_blockers:
  - None
known_runtime_gates:
  - >
    Live browser-lane validation requires authenticated local browser bridges and active tabs.
    Deterministic fake-transport tests can be implemented first; live readiness remains blocked
    until each lane produces a real request/status/events artifact bundle.
  - >
    Competitor analysis in this plan is based on the supplied critique and known public product
    categories. Before release positioning is published, refresh external comparisons with a
    bounded research pass and cite dated sources.
lanes:
  - id: "0"
    title: Baseline and competitive contract
  - id: "1"
    title: Route kernel and adapter contracts
  - id: "2"
    title: Health, tracing, and deterministic tests
  - id: "3"
    title: Verifier gates and live proof
  - id: "4"
    title: Documentation and release evidence
tasks:
