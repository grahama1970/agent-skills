    title: Capture critique-derived capability matrix
    lane: "0"
    runner: local
    backend: ""
    mode: ""
    depends_on: []
    command: >
      cd /home/graham/workspace/experiments/agent-skills/skills/ask &&
      ./run.sh doctor --json &&
      ./run.sh config doctor --profile release --json || true
    implementation:
      - "CREATE docs/competitiveness/control-plane-matrix.md."
      - "Compare /ask against LangGraph, CrewAI, AutoGen, OpenAI Agents SDK, and custom control planes by capability, not marketing claims."
      - "Classify each capability as present, partial, missing, or not-in-scope."
      - "Include the concrete /ask artifact or source file that proves every present/partial claim."
    tests:
      - "cd /home/graham/workspace/experiments/agent-skills/skills/ask && ./run.sh doctor --json"
    definition_of_done:
      command: >
        test -s /home/graham/workspace/experiments/agent-skills/skills/ask/docs/competitiveness/control-plane-matrix.md
      assertion: >
        Matrix exists and every competitive claim links to source, tests, or explicitly marked missing work.

