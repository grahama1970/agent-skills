[project]
name = "youtube-transcripts-skill"
version = "0.1.0"
description = "Extract transcripts from YouTube videos with three-tier fallback"
requires-python = ">=3.10,<3.13"
dependencies = [
    "typer",
    "youtube-transcript-api",
    "requests",
    "yt-dlp",
    "openai",
    "tenacity",
    "faster-whisper",
    "rich",
    "fastapi",
    "uvicorn",
    "numpy",
    "soundfile",
    "flashtext>=2.7",
]

[project.optional-dependencies]
audio-intensity = [
    "numpy",
    "soundfile",
]

[tool.uv.workspace]
members = [
    "intent-mapper",
]
