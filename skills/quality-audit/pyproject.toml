[project]
name = "quality-audit"
version = "0.1.0"
description = "Stratified quality sampling and statistical validation for LLM outputs"
requires-python = ">=3.10,<3.13"
dependencies = [
    "scipy>=1.11.0",
    "loguru>=0.7.0,<0.7.3",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]
