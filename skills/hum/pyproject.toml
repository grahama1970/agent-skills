[project]
name = "hum"
version = "0.1.0"
description = "Persona humming pipeline: vocal stem conversion and caching"
requires-python = ">=3.10,<3.13"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "soundfile>=0.12.0",
    "loguru>=0.7.0,<0.7.3",
]

[project.scripts]
hum = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
