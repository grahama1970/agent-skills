[project]
name = "hum"
version = "0.3.0"
description = "Persona humming pipeline: melody guide + Orpheus + Seed-VC"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "soundfile>=0.12.0",
    "loguru>=0.7.0,<0.7.3",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "librosa>=0.10.0",
    "scipy>=1.10.0",
    "pretty-midi>=0.2.10",
    "basic-pitch>=0.3.0",
    "pytest>=8.0.0",
    "setuptools<81",
    "pyarrow>=16.0.0",
    "music21>=9.1.0",
    "pymupdf>=1.24.0",
]

[project.scripts]
hum = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
