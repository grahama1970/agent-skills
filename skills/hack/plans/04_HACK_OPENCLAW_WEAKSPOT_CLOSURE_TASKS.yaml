version: 1
kind: orchestrate-plan
repo_root: /home/graham/workspace/experiments/agent-skills

metadata:
  title: "/hack OpenClaw Known-Weakspot Closure Plan"
  goal: "Fix and prove the known /hack weak spots before any fresh OpenClaw green claim: Dogpile citation provenance, successful-hack origin attribution, fresh mode coverage, battle evidence, container provenance, scoring/gate ledgers, fail-closed final reports, HTML visual proof, and patch-verification status."
  plan_type: code
  created: "2026-05-10"
  primary_persona:
    name: "Project agent"
    role: "The Codex/project agent responsible for proving /hack works against real OpenClaw artifacts, not synthetic or self-serving tests."
    source: "skills/hack/SKILL.md, /hack project knowledge, and OpenClaw closure artifacts"
  goal_closure:
    requested: true
    max_replans: 3
    close_only_when:
      - "The plan starts by fixing/validating every currently known weak spot before rerunning OpenClaw."
      - "Dogpile or seed evidence for every successful hack has exact origin attribution, or the report explicitly labels the hack as agent_generated_mutation."
      - "OpenClaw preflight captures target repo, commit, branch, Docker/runtime details, and target reachability."
      - "session-audit runs against real OpenClaw source or fails closed with a concrete artifact."
      - "chaos-campaign is validated as generation-zero exploration inside the evolve lifecycle or fails closed if the CLI entrypoint is absent."
      - "evolve-campaign runs a fresh multi-generation OpenClaw campaign with scoring, classification, gate reasons, and promotion tasks."
      - "battle runs against the real OpenClaw target or fails closed with a concrete incompatibility artifact."
      - "Final report artifacts exist as HACK_FINAL_REPORT.json, HACK_FINAL_REPORT.md, and HACK_FINAL_REPORT.html."
      - "The final report names successful hacks, hack groups, useful Dogpile/source/fuzzing evidence, mutation lineage, false-green pruning, patch status, and reviewer actions."
      - "HTML visual proof is rendered and inspected from a fresh screenshot marker before closure."
  no_self_serving_tests:
    - "No mocked OpenClaw service."
    - "No synthetic vulnerable app substituted for OpenClaw."
    - "No pass from HTTP 200 alone."
    - "No pass from unit tests alone."
    - "No invented Dogpile citation, hash, timestamp, CVSS, or scoring formula."
    - "No green if post-patch verification is missing; use blocked_patch_not_applied instead."

execution:
  max_concurrency: 1
  wave_barrier: true
  scheduling_policy: wave_then_dependency

capability_overlap:
  - "/memory recall found existing /hack project knowledge and the prior OpenClaw defect: live evolve artifacts existed, but report provenance and Dogpile citation quality were weak."
  - "Skill discovery: CALL /hack for session-audit, chaos-campaign, evolve-campaign, battle delegation, and final reports."
  - "Skill discovery: CALL /dogpile for citation-bearing seed evidence; do not replace it with informal research."
  - "Skill discovery: CALL /battle through /hack battle mode; distinguish ineffective battle output from a pass."
  - "Skill discovery: CALL /project-infographic and /best-practices-infographic for the final HTML/CSS/SVG report and visual assessment."
  - "Skill discovery: CALL /review-plan and /orchestrate for plan validation/execution; use local runner tasks, not /code-runner, because this closure tests /hack itself."
  - "Decision: EXTEND /hack only where closure exposes missing fail-closed contracts; do not create a parallel security framework."

questions_blockers: []

assumptions:
  - "OpenClaw source is available from the existing /hack session artifact unless a fresh checkout path is supplied."
  - "OpenClaw live gateway is authorized and expected at http://127.0.0.1:18789."
  - "If OpenClaw is unreachable, missing, or unauthorized, the correct result is a blocked artifact, not a fake report."

lanes:
  - id: "0"
    label: "Wave 0: Known weak spots first"
  - id: "1"
    label: "Wave 1: Fresh OpenClaw mode coverage"
  - id: "2"
    label: "Wave 2: Findings and report generation"
  - id: "3"
    label: "Wave 3: Closure proof"

tasks:
  - id: "0.1"
    title: "Write weakspot closure checklist"
    gate: "All known weak spots are explicit, executable closure gates before OpenClaw is rerun."
    lane: "0"
    runner: local
    depends_on: []
    cwd: /home/graham/workspace/experiments/agent-skills
    skills: [hack, memory]
    command: |-
      set -euo pipefail
      RUN_ROOT=/mnt/storage12tb/artifacts/agent-skills/hack/openclaw-weakspot-closure-$(date -u +%Y%m%dT%H%M%SZ)
      mkdir -p "$RUN_ROOT"
      python3 - <<'PY'
      import json, pathlib, time
      root = pathlib.Path("/mnt/storage12tb/artifacts/agent-skills/hack")
      run_root = sorted(root.glob("openclaw-weakspot-closure-*"))[-1]
      weakspots = [
        "dogpile_exact_citation_spans_missing",
        "successful_hack_origin_attribution_must_be_fail_closed",
        "fresh_current_code_openclaw_run_required",
        "session_audit_real_repo_mode_must_be_revalidated",
        "chaos_campaign_must_be_generation_zero_not_separate_semantics",
        "evolve_campaign_must_run_multi_generation_with_scoring_and_gates",
        "battle_mode_must_produce_real_artifacts_or_incompatibility_blocker",
        "container_commit_branch_image_digest_provenance_missing",
        "scoring_and_gate_reasons_need_ledger_extraction",
        "final_json_md_html_report_must_be_required",
        "html_report_requires_fresh_visual_proof",
        "patch_status_must_remain_blocked_until_patch_and_rerun_exist",
      ]
      data = {
        "status": "weakspots_declared",
        "created_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
        "run_root": str(run_root),
        "weakspots": weakspots,
        "close_only_when_all_have_evidence": True,
      }
      (run_root / "WEAKSPOT_CLOSURE_CHECKLIST.json").write_text(json.dumps(data, indent=2) + "\n")
      pathlib.Path("/tmp/hack-openclaw-weakspot-run-root.txt").write_text(str(run_root))
      print(json.dumps(data, indent=2))
      PY
    tests:
      - "test -f /tmp/hack-openclaw-weakspot-run-root.txt"
      - "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); data=json.loads((root/'WEAKSPOT_CLOSURE_CHECKLIST.json').read_text()); assert len(data['weakspots']) >= 12; assert data['close_only_when_all_have_evidence'] is True\nPY"
    definition_of_done:
      command: "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); data=json.loads((root/'WEAKSPOT_CLOSURE_CHECKLIST.json').read_text()); assert data['status']=='weakspots_declared'; print(root)\nPY"
      assertion: "The plan has a concrete weakspot ledger before executing any fresh OpenClaw mode."

  - id: "0.2"
    title: "Validate citation and origin report contract"
    gate: "A successful hack without exact origin attribution or explicit agent_generated_mutation is a report failure."
    lane: "0"
    runner: local
    depends_on: ["0.1"]
    cwd: /home/graham/workspace/experiments/agent-skills
    skills: [hack, dogpile]
    command: |-
      set -euo pipefail
      RUN_ROOT=$(cat /tmp/hack-openclaw-weakspot-run-root.txt)
      python3 - <<'PY'
      import json, pathlib, re
      run_root = pathlib.Path("/tmp/hack-openclaw-weakspot-run-root.txt").read_text().strip()
      root = pathlib.Path(run_root)
      contract = {
        "status": "required",
        "successful_hack_origin_fields": [
          "origin_type",
          "origin_label",
          "source_artifact",
          "source_location",
          "citation_text_or_agent_generated_mutation_reason",
        ],
        "allowed_origin_types": [
          "dogpile_citation",
          "validated_seed_lane",
          "scanner_finding",
          "source_code",
          "memory_project_knowledge",
          "greybox_fuzzing_evidence",
          "agent_generated_mutation",
        ],
        "fail_if_missing": True,
      }
      skill = pathlib.Path("skills/hack/SKILL.md").read_text()
      required_terms = ["citation", "agent_generated_mutation", "HACK_FINAL_REPORT.html"]
      missing = [term for term in required_terms if term not in skill]
      contract["skill_contract_terms_present"] = not missing
      contract["missing_terms"] = missing
      (root / "origin-citation-contract.json").write_text(json.dumps(contract, indent=2) + "\n")
      if missing:
          raise SystemExit(f"missing report contract terms: {missing}")
      print(json.dumps(contract, indent=2))
      PY
    tests:
      - "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); data=json.loads((pathlib.Path(root)/'origin-citation-contract.json').read_text()); assert data['fail_if_missing'] is True; assert data['skill_contract_terms_present'] is True\nPY"
    definition_of_done:
      command: "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); data=json.loads((pathlib.Path(root)/'origin-citation-contract.json').read_text()); assert 'agent_generated_mutation' in data['allowed_origin_types']; print('origin contract ready')\nPY"
      assertion: "Successful-hack origins are a hard report contract, not optional prose."

  - id: "0.3"
    title: "Preflight real OpenClaw provenance"
    gate: "Fresh run must capture repo, commit, branch, Docker/runtime details, and target health before modes run."
    lane: "0"
    runner: local
    depends_on: ["0.2"]
    cwd: /home/graham/workspace/experiments/agent-skills
    skills: [hack]
    command: |-
      set -euo pipefail
      RUN_ROOT=$(cat /tmp/hack-openclaw-weakspot-run-root.txt)
      SESSION=/mnt/storage12tb/artifacts/agent-skills/hack/session-20260505T211914Z-openclaw-openclaw
      REPO="$SESSION/target/repo"
      TARGET=http://127.0.0.1:18789
      test -d "$REPO"
      python3 - <<'PY'
      import json, pathlib, subprocess, urllib.request, time
      run_root = pathlib.Path("/tmp/hack-openclaw-weakspot-run-root.txt").read_text().strip()
      root = pathlib.Path(run_root)
      repo = pathlib.Path("/mnt/storage12tb/artifacts/agent-skills/hack/session-20260505T211914Z-openclaw-openclaw/target/repo")
      session = repo.parents[1]
      target = "http://127.0.0.1:18789"
      def cmd(args, cwd=None):
          try:
              return {"ok": True, "stdout": subprocess.check_output(args, cwd=cwd, text=True, stderr=subprocess.STDOUT).strip(), "error": None}
          except subprocess.CalledProcessError as exc:
              return {"ok": False, "stdout": (exc.output or "").strip(), "error": f"{type(exc).__name__}: exit={exc.returncode}"}
          except Exception as exc:
              return {"ok": False, "stdout": "", "error": f"{type(exc).__name__}: {exc}"}
      def read_log(name):
          path = session / "logs" / name
          if not path.exists():
              return ""
          text = path.read_text(errors="replace")
          marker = "## stdout"
          if marker in text:
              after = text.split(marker, 1)[1]
              return after.split("## stderr", 1)[0].strip()
          return text.strip()
      def git_field(args, fallback_log):
          result = cmd(args, cwd=repo)
          if result["ok"] and result["stdout"]:
              return {"value": result["stdout"], "source": "git", "error": None}
          fallback = read_log(fallback_log)
          if fallback:
              return {"value": fallback, "source": f"session-log:{fallback_log}", "error": result["error"]}
          return {"value": None, "source": "missing", "error": result["error"]}
      health = {}
      for path in ["/", "/healthz", "/readyz"]:
          try:
              with urllib.request.urlopen(target + path, timeout=5) as res:
                  health[path] = {"status": res.status, "content_type": res.headers.get("content-type", ""), "body_prefix": res.read(256).decode("utf-8", "replace")}
          except Exception as exc:
              health[path] = {"error": type(exc).__name__, "message": str(exc)}
      images = cmd(["docker", "images", "--digests", "--format", "{{.Repository}}:{{.Tag}} {{.Digest}} {{.ID}}"])
      docker_version = cmd(["docker", "version", "--format", "{{.Server.Version}}"])
      commit = git_field(["git", "rev-parse", "HEAD"], "target-head.log")
      branch = git_field(["git", "branch", "--show-current"], "target-branch.log")
      origin = git_field(["git", "remote", "get-url", "origin"], "target-origin.log")
      digest_lines = images["stdout"].splitlines()[:100] if images["ok"] else []
      docker_digest_captured = any(
          line.startswith("hack-session-scanner:")
          and len(line.split()) >= 2
          and line.split()[1].startswith("sha256:")
          for line in digest_lines
      )
      provenance_complete = all([commit["value"], branch["value"], origin["value"], docker_version["ok"], docker_digest_captured])
      data = {
          "status": "ready" if health.get("/healthz", {}).get("status") == 200 and health.get("/readyz", {}).get("status") == 200 else "blocked_target_unreachable",
          "created_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          "target": target,
          "repo": str(repo),
          "origin": origin["value"],
          "origin_source": origin["source"],
          "commit": commit["value"],
          "commit_source": commit["source"],
          "branch": branch["value"],
          "branch_source": branch["source"],
          "git_errors": {k: v["error"] for k, v in {"origin": origin, "commit": commit, "branch": branch}.items() if v["error"]},
          "docker_version": docker_version["stdout"] if docker_version["ok"] else None,
          "docker_error": docker_version["error"],
          "docker_images_digest_listing": digest_lines,
          "docker_image_digest_captured": docker_digest_captured,
          "provenance_complete": provenance_complete,
          "health": health,
      }
      (root / "OPENCLAW_PREFLIGHT.json").write_text(json.dumps(data, indent=2) + "\n")
      if data["status"] != "ready":
          raise SystemExit(json.dumps(data, indent=2))
      if not data["commit"] or not data["branch"] or not data["origin"]:
          raise SystemExit(json.dumps(data, indent=2))
      print(json.dumps(data, indent=2))
      PY
    tests:
      - "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); d=json.loads((pathlib.Path(root)/'OPENCLAW_PREFLIGHT.json').read_text()); assert d['status']=='ready'; assert d['commit'] and not str(d['commit']).startswith('ERROR:'); assert d['branch'] and not str(d['branch']).startswith('ERROR:'); assert d['origin']; assert d['docker_version']; assert d['health']['/healthz']['status']==200\nPY"
    definition_of_done:
      command: "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); d=json.loads((pathlib.Path(root)/'OPENCLAW_PREFLIGHT.json').read_text()); assert d['repo']; assert d['commit']; assert d['branch'] is not None; assert d['commit_source'] in ('git','session-log:target-head.log'); print(d['commit'])\nPY"
      assertion: "OpenClaw provenance is captured before security mode execution."

  - id: "1.1"
    title: "Run fresh session-audit on OpenClaw"
    gate: "session-audit proves current scanner/report behavior on real OpenClaw source or emits a blocker."
    lane: "1"
    runner: local
    depends_on: ["0.3"]
    cwd: /home/graham/workspace/experiments/agent-skills
    skills: [hack]
    command: |-
      set -euo pipefail
      RUN_ROOT=$(cat /tmp/hack-openclaw-weakspot-run-root.txt)
      REPO=$(python3 - <<'PY'
      import json, pathlib
      root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip()
      print(json.loads((pathlib.Path(root)/'OPENCLAW_PREFLIGHT.json').read_text())['repo'])
      PY
      )
      ./skills/hack/run.sh session-audit "$REPO" \
        --session-root "$RUN_ROOT" \
        --target-url http://127.0.0.1:18789 \
        --external-target \
        --probe-exploits || true
      python3 - <<'PY'
      import json, pathlib
      root=pathlib.Path(pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip())
      sessions=sorted(root.glob("session-*"))
      data={"status":"blocked_missing_session_audit_artifacts","sessions":[str(p) for p in sessions]}
      if sessions:
          latest=sessions[-1]
          reports=latest/"reports"
          data.update({
              "status": "ran",
              "session_dir": str(latest),
              "has_hack_report": (reports/"HACK_REPORT.md").exists(),
              "has_semgrep": (reports/"semgrep.json").exists(),
              "has_launch_plan": (reports/"target-launch-plan.json").exists(),
          })
      (root/"session-audit-assessment.json").write_text(json.dumps(data, indent=2)+"\n")
      assert data["status"] == "ran", data
      assert data["has_hack_report"], data
      print(json.dumps(data, indent=2))
      PY
    tests:
      - "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); d=json.loads((pathlib.Path(root)/'session-audit-assessment.json').read_text()); assert d['status']=='ran'; assert d['has_hack_report']\nPY"
    definition_of_done:
      command: "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); d=json.loads((pathlib.Path(root)/'session-audit-assessment.json').read_text()); print(d['session_dir'])\nPY"
      assertion: "session-audit produced real OpenClaw artifacts in the closure run root."

  - id: "1.2"
    title: "Acquire citation-bearing Dogpile seed"
    gate: "Dogpile evidence must include exact source artifacts/locations or the report must mark successful hacks as agent-generated mutations."
    lane: "1"
    runner: local
    depends_on: ["1.1"]
    cwd: /home/graham/workspace/experiments/agent-skills
    skills: [dogpile, hack]
    command: |-
      set -euo pipefail
      RUN_ROOT=$(cat /tmp/hack-openclaw-weakspot-run-root.txt)
      SESSION_ASSESS="$RUN_ROOT/session-audit-assessment.json"
      python3 - <<'PY'
      import json, pathlib, time
      root=pathlib.Path(pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip())
      session=json.loads((root/"session-audit-assessment.json").read_text())
      seed={
          "status":"citation_seed_contract_created",
          "created_at":time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          "target_url":"http://127.0.0.1:18789",
          "required_dogpile_question":"Which OpenClaw exploit hypotheses should seed /hack evolve-campaign, with exact citations to Dogpile report text, scanner artifacts, or source files for each lane?",
          "source_artifacts":[
              session.get("session_dir",""),
              str(root/"OPENCLAW_PREFLIGHT.json"),
              str(root/"origin-citation-contract.json")
          ],
          "minimum_lane_citation_fields":["lane","origin_type","source_artifact","source_location","citation_text"],
          "fallback_if_absent":"agent_generated_mutation",
      }
      (root/"dogpile-citation-seed-contract.json").write_text(json.dumps(seed, indent=2)+"\n")
      print(json.dumps(seed, indent=2))
      PY
      ./skills/dogpile/run.sh "OpenClaw /hack seed evidence with exact citations for WebSocket control routes, auth/session, API protocol, filesystem/path, child-process/tool, parser/dependency, and stateful workflow exploit lanes. Cite exact source artifacts or Dogpile report text for each lane; if no citation exists, say uncited." > "$RUN_ROOT/dogpile-openclaw-citation-run.txt" || true
      python3 - <<'PY'
      import json, pathlib
      root=pathlib.Path(pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip())
      text=(root/"dogpile-openclaw-citation-run.txt").read_text(errors="replace") if (root/"dogpile-openclaw-citation-run.txt").exists() else ""
      assessment={
          "status":"needs_exact_citation_extraction" if "uncited" in text.lower() or len(text.strip()) < 200 else "dogpile_output_available",
          "output_path":str(root/"dogpile-openclaw-citation-run.txt"),
          "output_chars":len(text),
          "contains_uncited": "uncited" in text.lower(),
      }
      (root/"dogpile-citation-assessment.json").write_text(json.dumps(assessment, indent=2)+"\n")
      print(json.dumps(assessment, indent=2))
      PY
    tests:
      - "test -f $(cat /tmp/hack-openclaw-weakspot-run-root.txt)/dogpile-citation-seed-contract.json"
      - "test -f $(cat /tmp/hack-openclaw-weakspot-run-root.txt)/dogpile-citation-assessment.json"
    definition_of_done:
      command: "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); d=json.loads((pathlib.Path(root)/'dogpile-citation-assessment.json').read_text()); assert d['output_path']; print(d['status'])\nPY"
      assertion: "Dogpile citation weakness is explicitly tested and carried into final report generation."

  - id: "1.3"
    title: "Run fresh chaos and evolve campaigns"
    gate: "OpenClaw chaos and evolve both produce real artifacts; evolve must show multi-generation scoring and gates."
    lane: "1"
    runner: local
    depends_on: ["1.2"]
    cwd: /home/graham/workspace/experiments/agent-skills
    skills: [hack]
    command: |-
      set -euo pipefail
      RUN_ROOT=$(cat /tmp/hack-openclaw-weakspot-run-root.txt)
      SEED_ROOT=/mnt/storage12tb/artifacts/agent-skills/hack/openclaw-e2e-20260509T174851Z
      SCANNER=$(python3 - <<'PY'
      import json, pathlib
      root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip()
      d=json.loads((pathlib.Path(root)/'session-audit-assessment.json').read_text())
      print(str(pathlib.Path(d['session_dir'])/'reports'/'semgrep.json'))
      PY
      )
      ./skills/hack/run.sh validate-seed "$SEED_ROOT/openclaw-evolution-seed.json" --verify-paths --result-output "$RUN_ROOT/openclaw-seed-validation.json"
      ./skills/hack/run.sh chaos-campaign http://127.0.0.1:18789 --output-root "$RUN_ROOT" --duration-minutes 1 --max-attempts 64 --seed 260610 --scanner-findings "$SCANNER" --dogpile-report "$RUN_ROOT/dogpile-openclaw-citation-run.txt" || true
      ./skills/hack/run.sh evolve-campaign http://127.0.0.1:18789 --output-root "$RUN_ROOT" --duration-minutes 10 --max-generations 4 --max-attempts 128 --population-size 24 --seed 260611 --seed-json "$SEED_ROOT/openclaw-evolution-seed.json" --seed-validation "$RUN_ROOT/openclaw-seed-validation.json" --scanner-findings "$SCANNER" --dogpile-report "$RUN_ROOT/dogpile-openclaw-citation-run.txt"
      python3 - <<'PY'
      import json, pathlib, collections
      root=pathlib.Path(pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip())
      chaos=sorted(root.glob("chaos-campaign-*"))
      evolve=sorted(root.glob("evolve-campaign-*-127.0.0.1-18789"))
      assert chaos, "missing chaos artifacts"
      assert evolve, "missing evolve artifacts"
      ev=evolve[-1]
      attempts=[json.loads(line) for line in (ev/"attempts.jsonl").read_text().splitlines() if line.strip()]
      anomalies=[json.loads(line) for line in (ev/"anomalies.jsonl").read_text().splitlines() if line.strip()] if (ev/"anomalies.jsonl").exists() else []
      summary=json.loads((ev/"summary.json").read_text())
      generations=sorted(ev.glob("generation-*.json"))
      classes=collections.Counter(a.get("classification","unknown") for a in attempts)
      data={
          "chaos_dir":str(chaos[-1]),
          "evolve_dir":str(ev),
          "attempt_count":len(attempts),
          "anomaly_count":len(anomalies),
          "generation_count":len(generations),
          "classifications":dict(classes),
          "summary":summary,
      }
      (root/"fresh-campaign-assessment.json").write_text(json.dumps(data, indent=2)+"\n")
      assert data["generation_count"] >= 4, data
      assert data["attempt_count"] >= 48, data
      print(json.dumps(data, indent=2))
      PY
    tests:
