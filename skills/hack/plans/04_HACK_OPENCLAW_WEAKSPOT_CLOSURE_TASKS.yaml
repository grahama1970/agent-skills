  - id: "1.4"
    title: "Run battle mode against OpenClaw"
    gate: "battle must create real mode evidence or a concrete incompatibility blocker; zero findings is not automatically success."
    lane: "1"
    runner: local
    depends_on: ["0.3"]
    cwd: /home/graham/workspace/experiments/agent-skills
    skills: [hack, battle]
    command: |-
      set -euo pipefail
      RUN_ROOT=$(cat /tmp/hack-openclaw-weakspot-run-root.txt)
      REPO=$(python3 - <<'PY'
      import json, pathlib
      root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip()
      print(json.loads((pathlib.Path(root)/'OPENCLAW_PREFLIGHT.json').read_text())['repo'])
      PY
      )
      START_TS=$(date +%s)
      echo "$START_TS" > "$RUN_ROOT/battle-start-epoch.txt"
      set +e
      ./skills/hack/run.sh battle "$REPO" --rounds 5 > "$RUN_ROOT/battle-command.log" 2>&1
      BATTLE_EXIT=$?
      set -e
      echo "$BATTLE_EXIT" > "$RUN_ROOT/battle-exit-code.txt"
      python3 - <<'PY'
      import json, pathlib, os, re
      root=pathlib.Path(pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip())
      start=int((root/"battle-start-epoch.txt").read_text().strip())
      log_path=root/"battle-command.log"
      exit_code=int((root/"battle-exit-code.txt").read_text().strip())
      assert log_path.exists(), "battle-command.log was not created"
      log=log_path.read_text(errors="replace")
      candidates=list(pathlib.Path("skills/battle/battles").glob("*.json")) + list(pathlib.Path("skills/battle/reports").glob("*.md"))
      fresh=[p for p in candidates if p.exists() and int(p.stat().st_mtime) >= start]
      limitations=[]
      lower=log.lower()
      if "memory" in lower and ("unavailable" in lower or "not available" in lower or "failed" in lower or "500" in lower):
          limitations.append("memory_skill_unavailable")
      if "dogpile" in lower and ("unavailable" in lower or "not available" in lower or "failed" in lower or "not found" in lower):
          limitations.append("dogpile_skill_unavailable")
      if "null production" in lower:
          limitations.append("null_production_no_findings")
      if "0 findings" in lower or "findings: 0" in lower:
          limitations.append("zero_findings_not_success")
      if exit_code != 0:
          limitations.append(f"battle_exit_code_{exit_code}")
      if fresh and limitations:
          status="battle_ran_with_limitations"
      elif fresh:
          status="battle_ran_with_fresh_artifacts"
      elif exit_code == 0:
          status="battle_ran_no_fresh_artifacts_not_success"
      else:
          status="battle_blocked_no_fresh_artifacts"
      data={
          "status":status,
          "exit_code": exit_code,
          "command_log": str(log_path),
          "fresh_battle_artifacts":[str(p) for p in fresh[:200]],
          "battle_files":[str(log_path), *[str(p) for p in fresh[:200]]],
          "limitations": limitations,
          "log_excerpt": log[-4000:],
          "zero_finding_is_not_success": True,
      }
      (root/"battle-mode-assessment.json").write_text(json.dumps(data, indent=2)+"\n")
      assert data["command_log"], data
      assert data["status"] != "ran_with_artifacts", data
      print(json.dumps(data, indent=2))
      PY
    tests:
      - "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); d=json.loads((pathlib.Path(root)/'battle-mode-assessment.json').read_text()); assert d['command_log']; assert 'fresh_battle_artifacts' in d; assert d['zero_finding_is_not_success'] is True; assert d['status'] != 'ran_with_artifacts'\nPY"
    definition_of_done:
      command: "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); d=json.loads((pathlib.Path(root)/'battle-mode-assessment.json').read_text()); print(d['status'])\nPY"
