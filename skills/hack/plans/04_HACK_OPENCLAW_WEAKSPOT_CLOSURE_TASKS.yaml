  - id: "3.1"
    title: "Write final closure verdict"
    gate: "Closure verdict is allowed only after weakspot, mode, report, and visual proof gates are evaluated."
    lane: "3"
    runner: local
    depends_on: ["2.2"]
    cwd: /home/graham/workspace/experiments/agent-skills
    skills: [hack, memory]
    command: |-
      set -euo pipefail
      RUN_ROOT=$(cat /tmp/hack-openclaw-weakspot-run-root.txt)
      python3 - <<'PY'
      import json, pathlib, time
      root=pathlib.Path(pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip())
      required=[
           "WEAKSPOT_CLOSURE_CHECKLIST.json",
           "origin-citation-contract.json",
           "OPENCLAW_PREFLIGHT.json",
          "session-audit-assessment.json",
          "dogpile-citation-assessment.json",
          "fresh-campaign-assessment.json",
          "battle-mode-assessment.json",
          "final-report-assessment.json",
           "ui-verification-marker.json",
       ]
       missing=[name for name in required if not (root/name).exists()]
       preflight=json.loads((root/"OPENCLAW_PREFLIGHT.json").read_text()) if (root/"OPENCLAW_PREFLIGHT.json").exists() else {}
       repro=json.loads((root/"focused-repro-assessment.json").read_text()) if (root/"focused-repro-assessment.json").exists() else {}
       post=json.loads((root/"post-patch-verification.json").read_text()) if (root/"post-patch-verification.json").exists() else {"status":"blocked_patch_not_applied","pass":False}
       proof_candidate_reproduced = repro.get("pass") is True
       verified_fixed = post.get("pass") is True
       provenance_complete = preflight.get("provenance_complete") is True
       if missing:
           status="halted_missing_required_artifacts"
       elif proof_candidate_reproduced and not verified_fixed:
           status="proof_candidate_reproduced_patch_pending"
       elif verified_fixed:
           status="verified_fixed"
       else:
           status="blocked_no_reproducible_proof"
       final={
           "status":status,
           "created_at":time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
           "run_root":str(root),
           "missing":missing,
           "proof_candidate_reproduced": proof_candidate_reproduced,
           "patch_pending": not verified_fixed,
           "verified_fixed": verified_fixed,
           "verification_status": post.get("status", "blocked_patch_not_applied"),
           "provenance_complete": provenance_complete,
           "provenance_defects": [] if provenance_complete else ["target commit/branch/origin fallback or Docker image digest incomplete"],
           "patch_status":"patch_pending_until_post_patch_verification_exists",
       }
       if (root/"post-patch-verification.json").exists():
           final["patch_status"]="post_patch_verification_present"
       (root/"CLOSURE_VERDICT.json").write_text(json.dumps(final, indent=2)+"\n")
       assert not missing, final
       assert final["status"] != "closed_with_patch_pending_allowed", final
       print(json.dumps(final, indent=2))
       PY
      python3 skills/hack/scripts/generate_final_report.py "$RUN_ROOT"
      python3 skills/hack/scripts/generate_final_infographic.py "$RUN_ROOT" --output "$RUN_ROOT/HACK_FINAL_REPORT.html"
