      - "test -f $(cat /tmp/hack-openclaw-weakspot-run-root.txt)/CLOSURE_VERDICT.json"
      - "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); d=json.loads((pathlib.Path(root)/'CLOSURE_VERDICT.json').read_text()); assert 'green_allowed' not in d; assert d['verified_fixed'] is False; assert d['patch_status']; print(d['status'])\nPY"
    definition_of_done:
      command: "python3 - <<'PY'\nimport json, pathlib; root=pathlib.Path('/tmp/hack-openclaw-weakspot-run-root.txt').read_text().strip(); d=json.loads((pathlib.Path(root)/'CLOSURE_VERDICT.json').read_text()); assert d['proof_candidate_reproduced'] is True; assert d['verified_fixed'] is False; print(root)\nPY"
      assertion: "The closure result is artifact-backed and distinguishes /hack proof/report closure from post-patch verification."

