[project]
name = "browser-oracle"
version = "0.1.0"
description = "Persistent browser-oracle tab bindings and directory walk-up registry"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loguru>=0.7.0,<0.7.3",
    "pyyaml>=6.0",
    "typer>=0.12.0",
]

[project.scripts]
browser-oracle = "browser_oracle.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/browser_oracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
