# ─────────────────────────────────────────────────────────────────────────────
# Monitoring Settings
# ─────────────────────────────────────────────────────────────────────────────
settings:
  transcript_dir: "/home/graham/workspace/experiments/pi-mono/run/youtube-transcripts"
  state_dir: "~/.pi/monitor-personas"

  # Nightly schedule (registered with /scheduler)
  schedule:
    check: "0 2 * * *"      # 2 AM - Check for new content
    ingest: "0 3 * * *"     # 3 AM - Ingest new content
    learn: "0 4 * * *"      # 4 AM - Learn to memory with taxonomy

  # Batch ingestion settings
  batch:
    delay_min: 3
    delay_max: 10
    max_restarts: 20
    hung_timeout: 900

  # Integration paths (updated to .pi/skills)
  integrations:
    taxonomy: ".pi/skills/taxonomy"
    memory: ".pi/skills/memory"
    scheduler: ".pi/skills/scheduler"
    task_monitor: ".pi/skills/task-monitor"
    persona_definitions: "/home/graham/workspace/experiments/memory/persona/docs"
