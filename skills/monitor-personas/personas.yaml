# Monitor-Personas Configuration
# Defines ALL persona sources to monitor for new content
#
# This file is the SINGLE SOURCE OF TRUTH for persona monitoring.
# Add new personas here to include them in nightly monitoring.
#
# Schema:
#   id: unique identifier
#   name: display name
#   priority: HIGH | MEDIUM | LOW
#   scope: memory scope for learning
#   pen_name: publication pseudonym (required for real-person personas that publish)
#   pen_affiliation: fictional org for pen name (obscures real affiliation)
#   fictional: true | false (default: false)
#     - true: No content sources to monitor (character definition only)
#     - false: Has real content sources (YouTube, RSS, etc.)
#   sources: list of content sources to monitor
#   taxonomy_hints: bridge tags for classification
#   persona_definition: path to persona definition file (for fictional)
#   lore_sources: IDs of personas that provide lore for this fictional persona
#   notes: description

# ─────────────────────────────────────────────────────────────────────────────
# Shared Library Configuration
# Content fetched ONCE to shared storage, then each relevant persona creates
# QRAs from their own perspective. "Ask a colleague" = recall against their scope.
# ─────────────────────────────────────────────────────────────────────────────
shared_library:
  path: "/mnt/storage12tb/media/personas/library"
  subdirs:
    transcripts: "transcripts/"       # YouTube/conference talk transcripts
    standards: "standards/"           # NIST, MIL-STD, MITRE documents
    papers: "papers/"                 # arXiv, conference proceedings
    books: "books/"                   # Engineering textbooks, references
    feeds: "feeds/"                   # RSS/blog content

  # Relevance matrix: which personas create QRAs from which content categories
  # Only RELEVANT personas consume specific documents — Margaret doesn't need Paul's OT content
  relevance:
    # NIST security frameworks → compliance + V&V personas
    nist_security: [brandon_bailey, margaret_chen, jennifer_cheung, embry]
    # MIL-STDs → safety + plant floor personas
    mil_std: [margaret_chen, noah_evans, paul_martinez]
    # MITRE ATT&CK/D3FEND → threat + compliance personas
    mitre: [brandon_bailey, jennifer_cheung, kevin_mitnick]
    # Formal methods / theorem proving → formal verification personas
    formal_methods: [noah_evans, rob_armstrong]
    # ICS/OT/SCADA security → plant floor + threat personas
    ics_ot: [paul_martinez, brandon_bailey]
    # DO-178C / airborne certification → V&V personas
    certification: [margaret_chen, rob_armstrong]
    # Space cybersecurity → SPARTA core team
    space_cyber: [brandon_bailey, embry, jennifer_cheung]
    # Manufacturing / calibration / testing → plant floor
    manufacturing: [paul_martinez]
    # System safety (STAMP/STPA/FTA) → safety personas
    system_safety: [noah_evans, margaret_chen]

