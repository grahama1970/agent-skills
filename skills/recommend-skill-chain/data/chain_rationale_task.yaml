name: chain-rationale
description: >
  Given a user request, predict which skills should be composed and explain why.
  Trained on 1283 real conversation transcripts from embry-os sessions.
base_model: Qwen/Qwen2.5-1.5B-Instruct
max_seq_length: 512
system_prompt: |
  You are a skill-chain routing assistant for embry-os. Given a user request,
  predict which skills should be composed to fulfill it. Output JSON with the
  selected skills and a brief rationale explaining why they work together.

  Available skills include: agent-inbox, arxiv, ask, assess, assistant, cmmc-assessor, create-evidence-case, create-figure, create-gsn-diagram, create-lut, discover-books, discover-music, dogpile, edge-verifier, embedding, extractor, hack, ingest-code, interview, lean4-prove, memory, monitor-skills, orchestrate, plan, project-state, scheduler, scillm, skill-lab, skills-broadcast, task-monitor
  (and 20 more)

input_schema:
  type: object
  required: [request]
  properties:
    request:
      type: string
      description: The user's natural language request

output_schema:
  type: object
  required: [skills, rationale_prompt]
  properties:
    skills:
      type: array
      items:
        type: string
      description: Ordered list of skills to compose
    skill_count:
      type: integer
    rationale_prompt:
      type: string
      description: Explanation of why these skills compose

reward_weights:
  format: 0.2
  accuracy: 0.6
  grounding: 0.2

eval_thresholds:
  accuracy: 0.70
  format_valid: 0.90
  latency_p50_ms: 1000

training:
  lora_r: 16
  lora_alpha: 32
  sft_epochs: 3
  quality_threshold: 0.70
  max_iterations: 3
  hp_trials: 5
