[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-skill"
version = "0.2.0"
description = "Native typed Jev decisions for Pi/Tau, with policy gates and shared contracts"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1", "loguru>=0.7,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
live = ["typesafe-sdk>=0.5.7,<1"]
test = ["pytest>=8,<10", "jsonschema>=4,<5"]

[tool.setuptools]
packages = ["jev_runtime"]

[tool.setuptools.package-data]
jev_runtime = ["contract.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
