[project]
name = "surf"
version = "0.1.0"
description = "Unified browser automation for AI agents via CDP"
requires-python = ">=3.11,<3.13"

dependencies = [
    "websocket-client>=1.0.0",
    "requests>=2.28.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
