[project]
name = "voice-segment-selector"
version = "0.1.0"
description = "Select clean gender-bucketed voice segments with transcripts for TTS training"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "librosa>=0.10",
  "soundfile>=0.12",
  "numpy>=1.26",
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
classify = ["transformers>=4.40", "torch>=2.2", "torchaudio>=2.2"]
review = ["fastapi>=0.110", "uvicorn>=0.27", "pillow>=10.0"]
tag = ["httpx>=0.27"]
align = ["whisperx>=3.1", "pyannote.audio>=3.1", "torch>=2.2", "torchaudio>=2.2"]
analyze = ["speechbrain>=1.0", "torch>=2.2", "torchaudio>=2.2"]
orpheus = ["datasets>=2.19,<5", "soundfile>=0.12", "pyarrow>=15", "torchcodec>=0.7.0"]
all = ["httpx>=0.27", "whisperx>=3.1", "pyannote.audio>=3.1", "speechbrain>=1.0", "faster-whisper>=1.0", "transformers>=4.40", "torch>=2.2", "torchaudio>=2.2", "fastapi>=0.110", "uvicorn>=0.27", "pillow>=10.0", "datasets>=2.19,<5", "soundfile>=0.12", "torchcodec>=0.7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
