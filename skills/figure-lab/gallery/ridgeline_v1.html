<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure Lab</title>
<style>
        body {
            background: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .canvas-header {
            padding: 16px 24px 8px;
            flex-shrink: 0;
        }
        .canvas-title {
            font-size: 24px;
            font-weight: 700;
        }
        .canvas-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 24px 24px;
            overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #chart { width: 100%; height: 100%; }
        </style>
</head>
<body>

<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = [{"label": "A", "value": 42}, {"label": "B", "value": 28}, {"label": "C", "value": 65}, {"label": "D", "value": 17}, {"label": "E", "value": 53}];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 24, bottom: 40, left: 120};

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`);

// Group by label/group
const groups = d3.group(data, d => d.label || d.group || 'all');
const groupNames = [...groups.keys()];
const overlap = 0.7;

const x = d3.scaleLinear()
  .domain(d3.extent(data, d => d.value || d.x || 0))
  .range([margin.left, width - margin.right]);

const y = d3.scaleBand()
  .domain(groupNames)
  .range([margin.top, height - margin.bottom])
  .padding(0);

const colors = d3.scaleOrdinal(d3.schemeTableau10);

groupNames.forEach((name, gi) => {
  const vals = [...groups.get(name)].map(d => d.value || d.x || 0).sort(d3.ascending);

  // Simple kernel density estimation
  const kde = d3.scaleLinear().domain(x.domain()).range([0, 100]);
  const bins = d3.bin().domain(x.domain()).thresholds(30)(vals);
  const maxCount = d3.max(bins, b => b.length) || 1;

  const areaGen = d3.area()
    .x(b => x((b.x0 + b.x1) / 2))
    .y0(y(name) + y.bandwidth())
    .y1(b => y(name) + y.bandwidth() - (b.length / maxCount) * y.bandwidth() * (1 + overlap))
    .curve(d3.curveBasis);

  svg.append('path')
    .datum(bins)
    .attr('fill', colors(gi))
    .attr('fill-opacity', 0.6)
    .attr('stroke', colors(gi))
    .attr('stroke-width', 1.5)
    .attr('d', areaGen);
});

svg.append('g').attr('transform', `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).tickSizeOuter(0))
  .selectAll('text').attr('font-size', '18px');

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).ticks(8))
  .selectAll('text').attr('font-size', '18px');

</script>
</body>
</html>
