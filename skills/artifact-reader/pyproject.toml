[project]
name = "artifact-reader-skill"
version = "0.1.0"
description = "Render and locally serve mobile-friendly artifact readers"
requires-python = ">=3.11"
dependencies = [
  "bleach>=6.2.0,<7",
  "loguru>=0.7.0,<1",
  "markdown-it-py>=3.0.0,<5",
  "typer>=0.12.0,<1",
]

[dependency-groups]
dev = ["ruff>=0.12.0,<1"]

[tool.uv]
package = false
