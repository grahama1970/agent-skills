[project]
name = "extract-html"
version = "0.1.0"
description = "Schematron3B: HTML to JSON extraction skill"
requires-python = ">=3.11,<3.13"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "loguru>=0.7.2,<0.7.3",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.2",
  "trafilatura>=1.12.2",
  "jsonschema>=4.23.0",
  "pandas>=2.2.2",
  "pillow>=10.4.0",
]

[tool.setuptools]
packages = ["extract_html"]
