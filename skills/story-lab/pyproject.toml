[project]
name = "story-lab"
version = "0.1.0"
description = "Self-improving creative writing convergence loop for Horus persona"
requires-python = ">=3.10,<3.13"
dependencies = [
    "typer>=0.9.0",
    "loguru>=0.7.0,<0.7.3",
    "httpx>=0.28.0",
]
# NOTE: story-lab has minimal deps. All generation/critique/LLM work is done
# via subprocess calls to existing skills (create-story, review-story, memory).
# httpx is available for future WebSocket progress events.

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["converge.py"]
