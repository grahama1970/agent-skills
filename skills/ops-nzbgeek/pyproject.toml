[project]
name = "ops-nzbgeek"
version = "0.1.0"
description = "General-purpose NZBGeek search and SABnzbd download management"
requires-python = ">=3.10,<3.13"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ops_nzbgeek"]
