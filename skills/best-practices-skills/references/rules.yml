# Machine-parseable skill validation rules
# Used by /skills-ci and /skill-lab for automated validation
# Version: 1.0

structure:
  required_files:
    - SKILL.md
  optional_files:
    - run.sh
    - sanity.sh
    - references/
    - scripts/
    - assets/
  forbidden_files:
    - README.md
    - CHANGELOG.md
  max_skill_md_lines: 500

frontmatter:
  required_fields:
    - name
    - description
    - provides
    - composes
  optional_fields:
    - metadata
    - triggers
    - allowed-tools
  field_types:
    name: string
    description: string
    provides: list[string]
    composes: list[string]
    metadata: mapping
    triggers: list[string]

  rules:
    - id: FM001
      check: "name matches directory name"
      severity: error
    - id: FM002
      check: "description contains trigger phrases"
      severity: warning
    - id: FM003
      check: "provides is non-empty list"
      severity: error
    - id: FM004
      check: "composes is list (may be empty)"
      severity: error
    - id: FM005
      check: "all composes entries reference existing skills"
      severity: warning
    - id: FM006
      check: "frontmatter uses standalone --- delimiter lines at start and end"
      severity: error

composition:
  rules:
    - id: COMP001
      check: "skills listed in composes: exist in .pi/skills/"
      severity: warning
      description: "Dangling composition reference"
    - id: COMP002
      check: "no circular composition chains"
      severity: error
      description: "Skill A composes B which composes A"
    - id: COMP003
      check: "provides values use standardized vocabulary"
      severity: warning
      description: "Use values from references/capability_vocabulary.yml"
    - id: COMP004
      check: "delegated skills are invoked, not reimplemented"
      severity: error
      description: "If composes: [memory], must call memory, not reimplement it"

storage:
  rules:
    - id: STOR001
      check: "no non-symlinked dirs > 100MB"
      severity: error
      description: "Heavy artifacts must live on /mnt/storage12tb"
    - id: STOR002
      check: "excluded dirs are symlinks or absent"
      severity: warning
      excluded_dirs:
        - .venv
        - node_modules
        - __pycache__
        - models
        - outputs
        - logs
        - data
        - weights
        - checkpoints
        - artifacts
        - sessions
        - datasets

content:
  rules:
    - id: CONT001
      check: "no fenced frontmatter (--- not inside ```)"
      severity: error
    - id: CONT002
      check: "SKILL.md under max_skill_md_lines"
      severity: warning
    - id: CONT003
      check: "no hardcoded paths outside of references/"
      severity: warning
    - id: CONT004
      check: "run.sh exists if skill has executable operations"
      severity: warning
    - id: CONT005
      check: "sanity.sh exists if run.sh exists"
      severity: warning

integration:
  rules:
    - id: INT001
      check: "ALL skills integrate with task-monitor (start-session, add-accomplishment, end-session). No exceptions."
      severity: error
    - id: INT002
      check: "LLM validation uses self-correction loop"
      severity: warning
    - id: INT003
      check: "unrecoverable failures trigger /interview"
      severity: info
    - id: INT004
      check: ".py files that call os.getenv() load dotenv"
      severity: error

# Binding affinity classification (chemistry model)
binding:
  # Noble gases: self-contained, don't compose
  noble:
    - ops-workstation
    - ops-docker
    - ops-streamdeck

  # Catalysts: enable creation without being consumed
  catalysts:
    - prompt-lab
    - gpt-lab
    - classifier-lab
    - skill-lab

  # Universal solvents: compose with almost everything
  solvents:
    - memory
    - scillm
    - task-monitor

  # Reactive pairs: commonly co-composed
  affinities:
    - [extractor, review-pdf]
    - [memory, taxonomy]
    - [hack, battle]
    - [anvil, battle]
    - [dogpile, memory]
    - [brave-search, dogpile]
    - [plan, orchestrate]
    - [skills-ci, best-practices-skills]
    - [create-gpt, classifier-lab]
