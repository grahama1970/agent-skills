# Composition Manifest Schema
# Generated by /skill-lab when planning a new composite skill
# Describes the "reaction" needed to create a new skill from existing ones
#
# Biology parallel: This is the genome of the new organism
# Chemistry parallel: This is the reaction equation
# Graph parallel: This is the multi-hop path through the capability graph

schema_version: "1.0"

# Example manifest for a hypothetical "learn-arxiv" skill:
example:
  name: learn-arxiv
  description: "Continuous arxiv paper ingestion and learning"
  task: "Monitor arxiv for new papers in specified topics, extract content, generate QRA pairs, store to memory"

  # The reaction equation: what we have + what we need to create
  composition:
    # HAVE: existing skills to delegate to (bonds)
    have:
      - skill: arxiv
        role: "Search and discover papers"
        provides: [arxiv-search]
        bond_type: "delegate via run.sh search"

      - skill: fetcher
        role: "Download paper PDFs"
        provides: [web-fetch]
        bond_type: "delegate via run.sh fetch"

      - skill: doc2qra
        role: "Extract QRA pairs from papers"
        provides: [document-ingestion]
        bond_type: "delegate via run.sh --file"

      - skill: memory
        role: "Store QRA pairs and recall prior research"
        provides: [memory-recall, memory-learn]
        bond_type: "delegate via run.sh recall/learn"

      - skill: taxonomy
        role: "Tag papers with federated taxonomy"
        provides: [taxonomy-tagging]
        bond_type: "delegate via run.sh extract"

      - skill: scheduler
        role: "Run on nightly schedule"
        provides: [scheduling]
        bond_type: "register cron job"

    # CREATE: missing capabilities that labs must craft
    create:
      - capability: "topic-filter"
        description: "Filter arxiv results by relevance to user's research interests"
        lab: prompt-lab
        craft_method: "Iterate prompt for topic relevance scoring"
        inputs: [paper_abstract, user_topics]
        outputs: [relevance_score, topic_tags]

      - capability: "dedup-checker"
        description: "Check if paper already ingested via memory recall"
        lab: null  # Simple code, no lab needed
        craft_method: "Direct implementation"
        inputs: [paper_id, paper_title]
        outputs: [is_duplicate]

    # The thin orchestrator wiring (the new skill's run.sh logic)
    orchestrator:
      steps:
        - name: recall-prior
          skill: memory
          args: "recall --q '{topic}'"
        - name: search-papers
          skill: arxiv
          args: "search '{topic}' --max-results 20"
        - name: filter-relevant
          capability: topic-filter  # created by prompt-lab
        - name: dedup-check
          capability: dedup-checker
        - name: fetch-papers
          skill: fetcher
          args: "fetch {paper_url}"
          loop: true
        - name: extract-qra
          skill: doc2qra
          args: "--file {pdf_path} --scope research"
          loop: true
        - name: tag-taxonomy
          skill: taxonomy
          args: "extract --text '{abstract}'"
          loop: true
        - name: learn-to-memory
          skill: memory
          args: "learn --problem '{question}' --solution '{answer}'"
          loop: true

  # Validation requirements
  validation:
    skills_ci: true          # Must pass /skills-ci
    security_scan: true      # Must pass /hack audit
    battle_compete: false    # No competition needed (single candidate)
    anvil_harden: false      # No hardening needed
    sanity_test: true        # Must have sanity.sh

  # Graph registration (for multi-hop traversal)
  graph:
    collection: skill_registry
    edges:
      - from: learn-arxiv
        to: arxiv
        type: composes
      - from: learn-arxiv
        to: memory
        type: composes
      - from: learn-arxiv
        to: doc2qra
        type: composes
      - from: learn-arxiv
        to: taxonomy
        type: composes
