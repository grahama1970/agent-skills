[project]
name = "pi-skill-best-practices-skills"
version = "0.1.0"
description = "Runtime package for the best-practices-skills skill"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loguru>=0.7.0,<0.7.3",
    "pyyaml",
    "ruamel.yaml",
    "typer>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["scripts"]
