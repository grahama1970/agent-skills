[project]
name = "pi-skill-best-practices-skills"
version = "0.1.0"
description = "Runtime package for the best-practices-skills skill"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.24.0",
    "loguru>=0.7.0,<0.7.3",
    "pydantic>=2.0",
    "pyyaml",
    "ruamel.yaml",
    "typer>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Scripts-only skill: there is no importable package for hatchling to build,
# so uv must manage the environment without installing the project itself.
[tool.uv]
package = false
