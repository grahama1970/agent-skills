name: agent-debugger

on:
  pull_request:
    paths:
      - 'skills/agent-debugger/**'
      - 'vscode-extensions/agent-debugger-bridge/**'
      - '.github/workflows/agent-debugger.yml'
  workflow_dispatch:

jobs:
  skill-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install skill dependencies
        run: python -m pip install typer==0.12.5 debugpy==1.8.16
      - name: Run agent-debugger skill sanity
        run: bash skills/agent-debugger/sanity.sh

  vscode-extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install extension dependencies
        working-directory: vscode-extensions/agent-debugger-bridge
        run: npm install
      - name: Compile extension
        working-directory: vscode-extensions/agent-debugger-bridge
        run: npm run compile
      - name: Run VS Code extension-host e2e tests
        working-directory: vscode-extensions/agent-debugger-bridge
        run: xvfb-run -a npm test
