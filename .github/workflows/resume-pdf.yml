name: Resume PDF

# Supersede in-flight runs so rapid pushes don't queue a backlog on the shared
# runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "RESUME.md"
      - "docs/resume/resume.css"
      - "docs/resume/fonts/**"
      - "scripts/build_markdown_pdf.py"
      - ".github/workflows/resume-pdf.yml"
  pull_request:
    branches: [main]
    paths:
      - "RESUME.md"
      - "docs/resume/resume.css"
      - "docs/resume/fonts/**"
      - "scripts/build_markdown_pdf.py"
      - ".github/workflows/resume-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-resume-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check resume source
        id: resume_source
        run: |
          if [[ -f RESUME.md ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "RESUME.md is not present; skipping PDF build"
          fi

      - name: Build resume PDF
        if: steps.resume_source.outputs.present == 'true'
        run: |
          css_args=()
          # The resume sheet is a complete stylesheet, so it replaces the
          # script's generic default rather than layering on top of it.
          if [[ -f docs/resume/resume.css ]]; then
            css_args=(--css docs/resume/resume.css --no-default-css)
          fi
          if [[ -d docs/resume/fonts ]]; then
            css_args+=(--font-dir docs/resume/fonts)
          fi
          # The attachable PDF is the two-page cut; DEEPER DETAIL renders only on
          # grahama.co/resume, from this same source, so the two cannot drift.
          if grep -q '^## DEEPER DETAIL' RESUME.md; then
            css_args+=(--omit-section "DEEPER DETAIL")
          fi
          uv run --with markdown-pdf==1.13.2 python scripts/build_markdown_pdf.py \
            RESUME.md \
            docs/resume/graham-anderson-resume.pdf \
            --title "Graham Anderson Resume" \
            --author "Graham Anderson" \
            "${css_args[@]}"

      - name: Build resume DOCX
        if: steps.resume_source.outputs.present == 'true'
        run: |
          docx_args=()
          if grep -q '^## DEEPER DETAIL' RESUME.md; then
            docx_args=(--omit-section "DEEPER DETAIL")
          fi
          uv run --with python-docx python scripts/build_resume_docx.py \
            RESUME.md docs/resume/graham-anderson-resume.docx "${docx_args[@]}"

      - name: Verify generated PDF
        if: steps.resume_source.outputs.present == 'true'
        run: |
          test -s docs/resume/graham-anderson-resume.pdf
          python - <<'PY'
          from pathlib import Path
          pdf = Path("docs/resume/graham-anderson-resume.pdf")
          data = pdf.read_bytes()
          if not data.startswith(b"%PDF"):
              raise SystemExit("generated resume is not a PDF")
          if len(data) < 1000:
              raise SystemExit("generated resume PDF is unexpectedly small")
          PY

      - name: Commit generated PDF on main
        if: steps.resume_source.outputs.present == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add docs/resume/graham-anderson-resume.pdf docs/resume/graham-anderson-resume.docx
          if git diff --cached --quiet; then
            echo "Resume PDF already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # No [skip ci]: site-deploy watches docs/resume/**, and grahama.co/resume
          # serves this exact file. Skipping CI here would deploy the site from the
          # RESUME.md commit — new page text, previous PDF. This workflow does not
          # trigger on the generated PDF path, so the commit cannot re-trigger it.
          git commit -m "Build resume PDF"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: steps.resume_source.outputs.present == 'true'
        with:
          name: graham-anderson-resume-pdf
          path: docs/resume/graham-anderson-resume.pdf
