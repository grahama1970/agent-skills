name: watch-deterministic

on:
  pull_request:
    paths:
      - "skills/watch/ui/**"
      - ".github/workflows/watch-deterministic.yml"
  push:
    branches: ["main"]
    paths:
      - "skills/watch/ui/**"
      - ".github/workflows/watch-deterministic.yml"

jobs:
  watch-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/watch/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/watch/ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
