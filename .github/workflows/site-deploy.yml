name: site-deploy

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: site }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: python3 scripts/verify-data-qid.py
      - run: npm ci
      - run: npm run build
        env:
          # Project-pages prefix; remove when a custom domain (CNAME) is attached.
          NEXT_PUBLIC_BASE_PATH: /agent-skills
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
