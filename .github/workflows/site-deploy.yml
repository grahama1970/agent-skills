name: site-deploy

on:
  push:
    branches: [main]
    # README / skills / agents feed the generated surfaces, so a change there
    # must rebuild the site too — otherwise the public counts silently lag HEAD.
    paths:
      - 'site/**'
      - 'README.md'
      # RESUME.md feeds /resume, and docs/resume/** carries the PDF that page
      # offers for download — without these the resume surface silently lags.
      - 'RESUME.md'
      - 'docs/resume/**'
      - 'skills/**'
      - 'agents/**'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: site }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Build the resume PDF here rather than trusting the committed artifact.
      # resume-pdf.yml commits its rebuild with GITHUB_TOKEN, and GitHub does not
      # let a GITHUB_TOKEN push trigger another workflow — so this deploy would
      # otherwise serve whatever PDF happened to be committed, which is how a
      # stale two-page file reached /resume.pdf once already.
      - name: Build resume PDF from RESUME.md at this commit
        working-directory: .
        run: |
          args=(--css docs/resume/resume.css --no-default-css --font-dir docs/resume/fonts)
          if grep -q '^## DEEPER DETAIL' RESUME.md; then
            args+=(--omit-section "DEEPER DETAIL")
          fi
          uv run --with markdown-pdf==1.13.2 python scripts/build_markdown_pdf.py \
            RESUME.md docs/resume/graham-anderson-resume.pdf \
            --title "Graham Anderson Resume" --author "Graham Anderson" "${args[@]}"
          docx_args=()
          if grep -q '^## DEEPER DETAIL' RESUME.md; then
            docx_args=(--omit-section "DEEPER DETAIL")
          fi
          uv run --with python-docx python scripts/build_resume_docx.py \
            RESUME.md docs/resume/graham-anderson-resume.docx "${docx_args[@]}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Regenerate every generated surface at THIS commit, then fail closed if
      # any surface (or README/content counts) disagrees — so the deployed site
      # always represents one coherent source state, not a mix of epochs.
      - run: |
          # Dependency order (catalog reads inventory/visibility/research-map;
          # graph reads visibility/research-map). Generate upstream first so no
          # output ever stamps HEAD while consuming a stale dependency.
          python3 scripts/gen_inventory.py
          python3 scripts/gen_visibility.py
          python3 scripts/gen_research_map.py
          # competence matrix reads inventory + research-map + content.
          python3 scripts/gen_competence.py
          python3 scripts/gen_catalog.py
          python3 scripts/gen_graph.py
          # No site-file inputs (reads RESUME.md + the committed PDF), so order
          # before artifacts only matters because artifacts captures a fail-closed
          # audit over every generated surface.
          python3 scripts/gen_resume.py
          python3 scripts/gen_artifacts.py
      - name: Refresh Calendly public metadata
        run: python3 scripts/gen_calendly.py
        env:
          CALENDLY_PAT: ${{ secrets.CALENDLY_PAT }}
      - run: python3 scripts/gen_build_manifest.py
      - run: python3 scripts/verify-data-qid.py
      - run: python3 scripts/copy_audit.py
      - run: npm ci
      - run: node scripts/search_fixture.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
