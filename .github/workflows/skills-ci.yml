name: Skills CI

# Supersede in-flight runs so rapid pushes don't queue a backlog that starves
# the shared runner pool (and delays site-deploy behind it).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths: ['skills/**', '.github/workflows/skills-ci.yml']
  pull_request:
    branches: [main]
    paths: ['skills/**', '.github/workflows/skills-ci.yml']
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

jobs:
  plan-review-orchestrate-pipeline:
    name: Plan/review/orchestrate pipeline gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run plan contract tests
        working-directory: skills/plan
        run: |
          env -u VIRTUAL_ENV ./sanity.sh
          env -u VIRTUAL_ENV uv run --project . python tests/test_code_runner_contract_validation.py

      - name: Run review-plan contract tests
        working-directory: skills/review-plan
        run: |
          env -u VIRTUAL_ENV ./sanity.sh
          env -u VIRTUAL_ENV uv run --project . python tests/test_code_runner_contract_fail_closed.py

      - name: Run orchestrate pipeline tests
        working-directory: skills/orchestrate
        run: |
          set +e
          env -u VIRTUAL_ENV uv run --project . --with pytest python -m pytest -q tests/test_code_runner_context_boundary.py
          status_1=$?
          env -u VIRTUAL_ENV bash tests/test_orchestrate.sh
          status_2=$?
          git worktree list --porcelain > /tmp/orchestrate-pipeline-worktrees.txt || true
          find /tmp \( -name 'status.json' -o -name '*.result.json' -o -name '*.events.jsonl' -o -name '*.spec.json' -o -name '*.log' \) -print > /tmp/orchestrate-pipeline-artifacts.txt || true
          tar -czf /tmp/orchestrate-pipeline-diagnostics.tgz -T /tmp/orchestrate-pipeline-artifacts.txt || true
          if [[ "$status_1" != "0" || "$status_2" != "0" ]]; then
            exit 1
          fi

      - name: Upload pipeline diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plan-review-orchestrate-pipeline-diagnostics
          path: |
            /tmp/orchestrate-pipeline-worktrees.txt
            /tmp/orchestrate-pipeline-artifacts.txt
            /tmp/orchestrate-pipeline-diagnostics.tgz

  plan-review-orchestrate-complete-task-soak:
    name: Plan/review/orchestrate complete-task soak
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run complete-task source commit/revert E2E
        working-directory: skills/orchestrate
        run: |
          set +e
          env -u VIRTUAL_ENV bash tests/run_plan_review_orchestrate_code_runner_mock_e2e.sh
          status=$?
          git worktree list --porcelain > /tmp/complete-task-soak-worktrees.txt || true
          find /tmp \( -name 'status.json' -o -name '*.result.json' -o -name '*.events.jsonl' -o -name '*.spec.json' -o -name '*.log' \) -print > /tmp/complete-task-soak-artifacts.txt || true
          tar -czf /tmp/complete-task-soak-diagnostics.tgz -T /tmp/complete-task-soak-artifacts.txt || true
          exit $status

      - name: Upload complete-task diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plan-review-orchestrate-complete-task-diagnostics
          path: |
            /tmp/complete-task-soak-worktrees.txt
            /tmp/complete-task-soak-artifacts.txt
            /tmp/complete-task-soak-diagnostics.tgz

  orchestrate-live-scillm-smoke:
    name: Orchestrate live scillm smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run live scillm smoke
        working-directory: skills/orchestrate
        run: |
          env -u VIRTUAL_ENV bash tests/run_orchestrate_scillm_live_smoke.sh

  external-project-adoption-smoke:
    name: External project adoption smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run external project adoption smoke
        working-directory: skills/orchestrate
        run: |
          set +e
          env -u VIRTUAL_ENV bash tests/run_external_project_adoption_smoke.sh
          status=$?
          git worktree list --porcelain > /tmp/external-adoption-worktrees.txt || true
          find /tmp \( -name 'status.json' -o -name '*.result.json' -o -name '*.events.jsonl' -o -name '*.spec.json' -o -name '*.log' \) -print > /tmp/external-adoption-artifacts.txt || true
          tar -czf /tmp/external-adoption-diagnostics.tgz -T /tmp/external-adoption-artifacts.txt || true
          exit $status

      - name: Upload adoption diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: external-project-adoption-diagnostics
          path: |
            /tmp/external-adoption-worktrees.txt
            /tmp/external-adoption-artifacts.txt
            /tmp/external-adoption-diagnostics.tgz

  code-runner-adversarial:
    name: Code-runner adversarial gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run code-runner adversarial tests
        working-directory: skills/code-runner
        run: |
          env -u VIRTUAL_ENV PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD/src" uv run --project . python -m compileall -q src tests/adversarial
          env -u VIRTUAL_ENV PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD/src" uv run --project . --with pytest python -m pytest -q tests/adversarial -m "not soak"

  code-runner-soak:
    name: Code-runner soak gate
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run code-runner soak tests
        working-directory: skills/code-runner
        run: |
          set +e
          env -u VIRTUAL_ENV PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD/src" uv run --project . --with pytest python -m pytest -q tests/adversarial -m soak
          status=$?
          git worktree list --porcelain > /tmp/code-runner-worktrees.txt || true
          find /tmp -path '*soak-*' \( -name '*.result.json' -o -name '*.status.json' -o -name '*.events.jsonl' -o -name '*.verifier.log' \) -print > /tmp/code-runner-soak-artifacts.txt || true
          exit $status

      - name: Upload soak diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: code-runner-soak-diagnostics
          path: |
            /tmp/code-runner-worktrees.txt
            /tmp/code-runner-soak-artifacts.txt

  lint-skills:
    name: Lint skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check skill structure
        run: |
          FAIL=0
          WARN=0
          TOTAL=0
          MISSING_SKILL_MD=""
          MISSING_RUN_SH=""
          MISSING_SANITY_SH=""
          PARSE_ERRORS=""

          for dir in skills/*/; do
            skill=$(basename "$dir")

            # Skip system/hidden dirs
            [[ "$skill" == .* ]] && continue
            [[ "$skill" == __pycache__ ]] && continue
            case "$skill" in
              _shared|common|consume_common|create-claude|sanity|subagent-service|webgpt-engagement)
                continue
                ;;
            esac

            TOTAL=$((TOTAL + 1))

            # Required: SKILL.md
            if [[ ! -f "$dir/SKILL.md" ]]; then
              MISSING_SKILL_MD="$MISSING_SKILL_MD  - $skill\n"
              FAIL=$((FAIL + 1))
            fi

            # Recommended: run.sh
            if [[ ! -f "$dir/run.sh" ]]; then
              MISSING_RUN_SH="$MISSING_RUN_SH  - $skill\n"
              WARN=$((WARN + 1))
            fi

            # Recommended: sanity.sh
            if [[ ! -f "$dir/sanity.sh" ]]; then
              MISSING_SANITY_SH="$MISSING_SANITY_SH  - $skill\n"
              WARN=$((WARN + 1))
            fi

            # Validate shell scripts parse (syntax only)
            for sh in "$dir"/*.sh; do
              [[ -f "$sh" ]] || continue
              if ! bash -n "$sh" 2>/dev/null; then
                PARSE_ERRORS="$PARSE_ERRORS  - $sh\n"
                FAIL=$((FAIL + 1))
              fi
            done
          done

          echo "=== Skills CI Report ==="
          echo "Total skills: $TOTAL"
          echo ""

          if [[ -n "$MISSING_SKILL_MD" ]]; then
            echo "FAIL: Missing SKILL.md:"
            echo -e "$MISSING_SKILL_MD"
          fi

          if [[ -n "$PARSE_ERRORS" ]]; then
            echo "FAIL: Shell script parse errors:"
            echo -e "$PARSE_ERRORS"
          fi

          if [[ -n "$MISSING_RUN_SH" ]]; then
            echo "WARN: Missing run.sh:"
            echo -e "$MISSING_RUN_SH"
          fi

          if [[ -n "$MISSING_SANITY_SH" ]]; then
            echo "WARN: Missing sanity.sh:"
            echo -e "$MISSING_SANITY_SH"
          fi

          if [[ $FAIL -gt 0 ]]; then
            echo "FAILED: $FAIL error(s) found"
            exit 1
          fi

          echo "PASSED: All $TOTAL skills have valid structure"

      - name: Check for secrets in skills
        run: |
          FAIL=0
          # Scan for common secret patterns in tracked files
          if git ls-files skills/ | xargs grep -lEn \
            '(APIKEY|API_KEY|SECRET|PASSWORD|TOKEN)\s*=\s*["\x27][^"\x27]{8,}' \
            2>/dev/null; then
            echo "FAIL: Potential secrets found in skill files"
            FAIL=1
          fi

          if git ls-files skills/ | xargs grep -lEn \
            'sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|glpat-[a-zA-Z0-9]{20}' \
            2>/dev/null; then
            echo "FAIL: API tokens found in skill files"
            FAIL=1
          fi

          if [[ $FAIL -gt 0 ]]; then
            exit 1
          fi
          echo "PASSED: No secrets detected"
