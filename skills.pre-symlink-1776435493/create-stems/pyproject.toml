[project]
name = "create-stems"
version = "0.1.0"
description = "Audio stem separation using Demucs Python API + optional UVR"
requires-python = ">=3.10,<3.13"
dependencies = [
    "demucs>=4.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "typer>=0.9.0",
    "loguru>=0.7.0,<0.7.3",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "torchcodec>=0.10.0",
]

[project.optional-dependencies]
uvr = [
    "audio-separator>=0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["cli.py"]
