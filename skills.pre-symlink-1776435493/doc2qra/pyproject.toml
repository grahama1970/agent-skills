[project]
name = "doc2qra"
version = "1.0.0"
description = "Convert documents (PDF, URL, text) into QRA pairs with summaries for memory."
readme = "SKILL.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0,<0.7.3",
    "nltk",
    "pymupdf",
    "pymupdf4llm",
    "python-dotenv>=1.0.0",
    "pyyaml",
    "rapidfuzz>=3.0.0",
    "rich>=13.0.0",
    "scillm @ git+https://github.com/grahama1970/scillm.git",
    "tqdm>=4.66.0",
    "typer>=0.9.0",
]

[tool.uv]
# Optional dependencies that improve capabilities but aren't strictly required
# (Making them required ensures consistent behavior for the skill)
dev-dependencies = [
    "pymupdf>=1.23.0",
    "pymupdf4llm>=0.0.1",
]
