[project]
name = "lean4-prove"
version = "0.1.0"
description = "Retrieval-augmented Lean4 proof generation with 94k+ exemplars"
requires-python = ">=3.11,<3.13"

dependencies = [
    "datasets>=2.14.0",
    "fastapi",
    "httpx>=0.27.0",
    "lean-interact>=0.11.1",
    "loguru>=0.7,<0.7.3",
    "peft",
    "pydantic>=2.0",
    "python-arango>=7.0.0",
    "python-dotenv>=1.2.1",
    "transformers",
    "trl",
    "typer>=0.9.0",
    "wandb>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
