[project]
name = "debug-pdf"
version = "0.1.0"
description = "Automated PDF failure analysis and fixture generation"
dependencies = [
    "duckdb",
    "httpx>=0.25.0",
    "loguru>=0.7.0,<0.7.3",
    "pymupdf>=1.23.0",
    "pymupdf4llm",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
]

[dependency-groups]
test = ["pytest>=7.0"]

[project.scripts]
debug-pdf = "debug_pdf:main"
