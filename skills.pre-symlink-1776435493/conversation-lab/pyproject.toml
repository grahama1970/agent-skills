[project]
name = "conversation-lab"
version = "1.0.0"
description = "Self-improving conversation convergence loop for SPARTA stress tests"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "loguru>=0.7.0,<0.7.3",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "PySide6>=6.6.0",
]

[project.scripts]
conversation-lab = "conversation_lab:app"

[tool.uv]
dev-dependencies = ["pytest>=7.0.0"]
