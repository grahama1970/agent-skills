[project]
name = "create-score"
version = "0.1.0"
description = "Scene music generation via ACE-Step Docker with HMT integration"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiofiles",
    "fastapi",
    "httpx>=0.27.0",
    "loguru>=0.7.2,<0.7.3",
    "numpy",
    "pydantic>=2.7.0",
    "soundfile",
    "torch",
    "typer>=0.12.0",
    "uvicorn",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
