[project]
name = "gpt-lab"
version = "0.1.0"
description = "Benchmark and compare small GPTs for task-specific inference"
readme = "SKILL.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "evaluate",
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "llama-cpp-python>=0.3.0",
    "loguru>=0.7.0,<0.7.3",
    "peft>=0.13.0",
    "pydantic>=2.0.0",
    "PySide6>=6.6.0",
    "pyyaml>=6.0.0",
    "rapidfuzz>=3.14.3",
    "rich>=13.7.0",
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "typer>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
