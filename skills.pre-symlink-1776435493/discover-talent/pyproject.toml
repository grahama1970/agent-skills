[project]
name = "discover-talent"
version = "0.1.0"
description = "Discover actors and reference talent via TMDB API with taxonomy integration"
requires-python = ">=3.10,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
]
