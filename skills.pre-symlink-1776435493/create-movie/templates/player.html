<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horus Dream</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
      }

      #player-container {
        width: 100%;
        height: 100%;
        position: relative;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .overlay {
        position: absolute;
        bottom: 50px;
        left: 0;
        width: 100%;
        text-align: center;
        opacity: 0;
        transition: opacity 0.5s;
        pointer-events: none;
      }

      #player-container:hover .overlay {
        opacity: 1;
      }

      h1 {
        color: rgba(255, 255, 255, 0.7);
        font-size: 1.2rem;
        letter-spacing: 5px;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      .scanline {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.2)
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div class="scanline"></div>

    <div id="player-container">
      <video id="dream-video" controls autoplay loop>
        <source src="dream_movie.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>

      <div class="overlay">
        <h1>Subconscious Sequence</h1>
      </div>
    </div>

    <script>
      const video = document.getElementById("dream-video");

      // Attempt audio unmute interaction
      document.body.addEventListener("click", () => {
        video.muted = false;
        video.play();
      });
    </script>
  </body>
</html>
