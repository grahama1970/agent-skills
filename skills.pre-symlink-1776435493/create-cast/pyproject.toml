[project]
name = "create-cast"
version = "0.1.0"
description = "Multi-round character casting orchestrator for Horus movie pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
]
