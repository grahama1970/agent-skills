[project]
name = "pi-skill-review-pdf"
version = "0.1.0"
description = "Runtime package for the review-pdf skill"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "joblib>=1.3.0",
    "loguru>=0.7.2,<0.7.3",
    "pymupdf>=1.26.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.4.0",
    "typer>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["verify"]
