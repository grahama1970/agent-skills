[project]
name = "ops-runpod-skill"
version = "1.0.0"
description = "Provision, manage, and terminate RunPod GPU instances for LLM training"
readme = "SKILL.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2,<0.7.3",
    "paramiko>=3.5.1",
    "pydantic>=2.10.4",
    "python-dotenv>=1.0.1",
    "rich>=13.9.4",
    "runpod>=1.7.0",
    "typer>=0.16.0",
]

[project.optional-dependencies]
runpod = [
    "runpod_ops @ git+https://github.com/grahama1970/runpod_ops.git",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
runpod_ops = { git = "https://github.com/grahama1970/runpod_ops.git" }
