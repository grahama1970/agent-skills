[project]
name = "pi-skill-skill-lab"
version = "0.1.0"
description = "Runtime package for the skill-lab skill"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.24.0",
    "llama-cpp-python",
    "numpy",
    "pyyaml>=6.0", "typer>=0.9.0", "loguru>=0.7.0,<0.7.3",
    "scikit-learn",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
