# /treesitter skill policy — enforced by .claude/hooks/skill_policy.py
# Anti-patterns from SKILL.md: regex symbol extraction, missing --language, missing --json

name: treesitter
slash_command: /treesitter

required_reads:
  - .pi/skills/treesitter/SKILL.md

forbidden_use:
  any_of:
    # WRONG: Using regex to extract functions/classes instead of tree-sitter
    - pattern: "re\\.findall.*def |re\\.findall.*class |re\\.findall.*function |grep.*\"def \"|grep.*\"class \""
      reason: "Use treesitter skill for symbol extraction, not regex. Regex misses nested symbols, decorators, and edge cases."

    # WRONG: Parsing code snippets without specifying --language (Common Mistakes #1)
    - shell_contains: "run.sh parse --code"
      reason: "Always specify --language for code snippets. Language auto-detection may fail on snippets."

    # WRONG: Using ast module for Python symbol extraction when treesitter handles all languages
    - import: "ast"
      reason: "Use treesitter skill for symbol extraction instead of Python ast module. Treesitter supports all languages uniformly."
