[project]
name = "create-figure"
version = "0.1.0"
description = "Generate publication-quality figures from code analysis"
requires-python = ">=3.10,<3.13"
dependencies = [
    "control",
    "loguru>=0.7.0,<0.7.3",
    "matplotlib>=3.7.0",
    "networkx>=3.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "scikit-learn",
    "scipy>=1.11.0",
    "seaborn>=0.13.0",
    "squarify",
    "typer>=0.9.0",
    "umap-learn",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.7.0"]
control = ["control>=0.9.0"]
hierarchy = ["squarify>=0.4.0"]
ml = ["scikit-learn>=1.3.0", "umap-learn>=0.5.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
create-figure = "fixture_graph:app"
