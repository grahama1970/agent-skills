<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Plot</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Box Plot</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

function randn() { return Math.sqrt(-2 * Math.log(Math.random())) * Math.cos(2 * Math.PI * Math.random()); }
const groups = window.__INJECTED_DATA__ || ["Batch A", "Batch B", "Batch C", "Batch D"];
const rawData = {};
groups.forEach((g, i) => {
  rawData[g] = Array.from({length: 50}, () => 60 + i * 10 + randn() * (8 + i * 2));
});

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 24, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

const allValues = Object.values(rawData).flat();
const y = d3.scaleLinear().domain(d3.extent(allValues)).nice().range([height - margin.bottom, margin.top]);
const x = d3.scaleBand().domain(groups).range([margin.left, width - margin.right]).padding(0.4);

groups.forEach((g, gi) => {
  const vals = rawData[g].sort(d3.ascending);
  const q1 = d3.quantile(vals, 0.25);
  const median = d3.quantile(vals, 0.5);
  const q3 = d3.quantile(vals, 0.75);
  const iqr = q3 - q1;
  const lo = Math.max(d3.min(vals), q1 - 1.5 * iqr);
  const hi = Math.min(d3.max(vals), q3 + 1.5 * iqr);
  const center = x(g) + x.bandwidth() / 2;
  const bw = x.bandwidth();

  // Whisker
  svg.append('line').attr('x1', center).attr('x2', center).attr('y1', y(lo)).attr('y2', y(hi))
    .attr('stroke', '#1e293b').attr('stroke-width', 1.5);
  // Caps
  svg.append('line').attr('x1', center - bw * 0.2).attr('x2', center + bw * 0.2).attr('y1', y(lo)).attr('y2', y(lo)).attr('stroke', '#1e293b').attr('stroke-width', 1.5);
  svg.append('line').attr('x1', center - bw * 0.2).attr('x2', center + bw * 0.2).attr('y1', y(hi)).attr('y2', y(hi)).attr('stroke', '#1e293b').attr('stroke-width', 1.5);
  // Box
  svg.append('rect')
    .attr('data-label', g)
    .attr('x', x(g)).attr('width', bw)
    .attr('y', y(q3)).attr('height', y(q1) - y(q3))
    .attr('fill', colors(gi)).attr('opacity', 0.7)
    .attr('stroke', colors(gi)).attr('stroke-width', 1.5).attr('rx', 4);
  // Median
  svg.append('line').attr('x1', x(g)).attr('x2', x(g) + bw).attr('y1', y(median)).attr('y2', y(median))
    .attr('stroke', '#1e293b').attr('stroke-width', 2.5);

  // Outliers
  vals.filter(v => v < lo || v > hi).forEach(v => {
    svg.append('circle').attr('cx', center).attr('cy', y(v)).attr('r', 4)
      .attr('fill', 'none').attr('stroke', colors(gi)).attr('stroke-width', 1.5);
  });
});

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).tickSizeOuter(0)).selectAll('text').attr('font-size', '18px');
svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(6)).selectAll('text').attr('font-size', '18px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);
</script>
</body>
</html>
