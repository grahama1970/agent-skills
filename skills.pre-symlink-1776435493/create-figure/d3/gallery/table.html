<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quality Metrics</title>
<style>
  body {
    background: #111;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .canvas-header {
    padding: 24px 32px 12px;
    flex-shrink: 0;
  }
  .canvas-title {
    font-size: 28px;
    font-weight: 700;
  }
  .canvas-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 32px 32px;
    overflow: hidden;
    animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #chart { width: 100%; height: 100%; }
  /* Override D3 axis/tick colors for dark theme */
  .domain, .tick line { stroke: #475569 !important; }
  .tick text { fill: #e2e8f0 !important; }
  text { fill: #e2e8f0; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Quality Metrics</div></div>
<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [{"label": "Content Coverage", "value": "0.94", "grade": "A"}, {"label": "Table Fidelity", "value": "0.88", "grade": "B+"}, {"label": "Section Alignment", "value": "0.96", "grade": "A+"}, {"label": "Data Quality", "value": "0.91", "grade": "A"}];
const container = document.getElementById('chart');

const table = document.createElement('table');
table.style.cssText = 'width:80%;margin:40px auto;border-collapse:collapse;font-size:18px;color:#e2e8f0';

// Header
const keys = Object.keys(data[0]);
const thead = table.createTHead();
const hrow = thead.insertRow();
keys.forEach(k => {
  const th = document.createElement('th');
  th.textContent = k.charAt(0).toUpperCase() + k.slice(1);
  th.style.cssText = 'padding:12px 20px;text-align:left;border-bottom:2px solid #334155;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:14px;color:#94a3b8';
  hrow.appendChild(th);
});

// Rows
const tbody = table.createTBody();
data.forEach((d, i) => {
  const row = tbody.insertRow();
  row.style.cssText = `opacity:0;animation:fadeRow 400ms ${i * 100}ms ease forwards`;
  keys.forEach(k => {
    const td = row.insertCell();
    td.textContent = d[k];
    td.style.cssText = 'padding:12px 20px;border-bottom:1px solid #1e293b';
  });
});

// Animation keyframes
const style = document.createElement('style');
style.textContent = '@keyframes fadeRow { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }';
document.head.appendChild(style);

container.appendChild(table);

</script>
</body>
</html>
