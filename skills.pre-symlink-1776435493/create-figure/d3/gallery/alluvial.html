<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alluvial Diagram</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Alluvial Diagram</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import {sankey as d3Sankey, sankeyLinkHorizontal} from "https://cdn.jsdelivr.net/npm/d3-sankey@0.12/+esm";

// Multi-stage flow: Source → Process → Output
const nodes = window.__INJECTED_DATA__ ? [...new Set(window.__INJECTED_DATA__.flatMap(d => [d.source || d.from, d.target || d.to]))] : [
  {name: "PDF"}, {name: "Web"}, {name: "YouTube"}, {name: "Book"},
  {name: "Extractor"}, {name: "Transcriber"}, {name: "Fetcher"},
  {name: "QRAs"}, {name: "Embeddings"}, {name: "Memory"}, {name: "Training"}
];
const links = window.__INJECTED_DATA__ ? window.__INJECTED_DATA__.map(d => ({source: d.source || d.from, target: d.target || d.to, value: d.value || 1})) : [
  {source: 0, target: 4, value: 40}, {source: 1, target: 6, value: 25},
  {source: 2, target: 5, value: 20}, {source: 3, target: 4, value: 15},
  {source: 4, target: 7, value: 35}, {source: 4, target: 8, value: 20},
  {source: 5, target: 7, value: 15}, {source: 5, target: 8, value: 5},
  {source: 6, target: 7, value: 20}, {source: 6, target: 8, value: 5},
  {source: 7, target: 9, value: 50}, {source: 7, target: 10, value: 20},
  {source: 8, target: 9, value: 25}, {source: 8, target: 10, value: 5}
];

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 10, right: 10, bottom: 10, left: 10};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

const sankeyGen = d3Sankey()
  .nodeId(d => d.index)
  .nodeWidth(20)
  .nodePadding(16)
  .extent([[margin.left, margin.top], [width - margin.right, height - margin.bottom]]);

const {nodes: sNodes, links: sLinks} = sankeyGen({
  nodes: nodes.map((d, i) => ({...d, index: i})),
  links: links.map(d => ({...d}))
});

// Links with gradient
const defs = svg.append('defs');
sLinks.forEach((link, i) => {
  const grad = defs.append('linearGradient').attr('id', `lg-${i}`)
    .attr('gradientUnits', 'userSpaceOnUse')
    .attr('x1', link.source.x1).attr('x2', link.target.x0);
  grad.append('stop').attr('offset', '0%').attr('stop-color', colors(link.source.index));
  grad.append('stop').attr('offset', '100%').attr('stop-color', colors(link.target.index));
});

svg.selectAll('path.link').data(sLinks).join('path')
  .attr('class', 'link')
  .attr('d', sankeyLinkHorizontal())
  .attr('fill', 'none')
  .attr('stroke', (d, i) => `url(#lg-${i})`)
  .attr('stroke-width', d => Math.max(1, d.width))
  .attr('stroke-opacity', 0.5);

// Nodes
svg.selectAll('rect.node').data(sNodes).join('rect')
  .attr('class', 'node')
  .attr('data-label', d => d.name)
  .attr('x', d => d.x0).attr('y', d => d.y0)
  .attr('width', d => d.x1 - d.x0).attr('height', d => d.y1 - d.y0)
  .attr('fill', d => colors(d.index)).attr('rx', 3);

// Labels
svg.selectAll('text').data(sNodes).join('text')
  .attr('x', d => d.x0 < width / 2 ? d.x1 + 8 : d.x0 - 8)
  .attr('y', d => (d.y0 + d.y1) / 2)
  .attr('dy', '0.35em')
  .attr('text-anchor', d => d.x0 < width / 2 ? 'start' : 'end')
  .attr('font-size', '14px').attr('fill', '#1e293b')
  .text(d => d.name);
</script>
</body>
</html>
