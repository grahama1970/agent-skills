<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confusion Matrix</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Confusion Matrix</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// Data injection: accept [{actual, predicted, value}] or use sample
const __raw = window.__INJECTED_DATA__;
let labels, matrix;
if (__raw && __raw.length > 0 && __raw[0].actual !== undefined) {
  const rowSet = [...new Set(__raw.map(d => d.actual || d.row))];
  const colSet = [...new Set(__raw.map(d => d.predicted || d.col))];
  labels = rowSet.length >= colSet.length ? rowSet : colSet;
  matrix = labels.map(r => labels.map(c => {
    const cell = __raw.find(d => (d.actual || d.row) === r && (d.predicted || d.col) === c);
    return cell ? cell.value || cell.count || 0 : 0;
  }));
} else {
  labels = ["Cat", "Dog", "Bird", "Fish"];
  matrix = [
  [42, 3, 2, 1],
  [5, 38, 1, 0],
  [1, 2, 35, 4],
  [0, 1, 3, 41],
  ];
}

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const size = Math.min(width, height);
const margin = {top: 60, right: 40, bottom: 80, left: 80};
const cellSize = (size - margin.top - margin.bottom) / labels.length;

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const offsetX = (width - size) / 2;
const offsetY = (height - size) / 2;
const g = svg.append('g').attr('transform', `translate(${offsetX},${offsetY})`);

const maxVal = d3.max(matrix.flat());
const color = d3.scaleSequential(d3.interpolateBlues).domain([0, maxVal]);

// Cells
const cells = [];
labels.forEach((actual, i) => {
  labels.forEach((predicted, j) => {
    cells.push({actual, predicted, value: matrix[i][j], row: i, col: j});
  });
});

g.selectAll('rect.cell').data(cells).join('rect')
  .attr('class', 'cell')
  .attr('data-label', d => `${d.actual}-${d.predicted}`)
  .attr('x', d => margin.left + d.col * cellSize)
  .attr('y', d => margin.top + d.row * cellSize)
  .attr('width', cellSize - 2)
  .attr('height', cellSize - 2)
  .attr('fill', d => color(d.value))
  .attr('rx', 4);

// Value labels
g.selectAll('text.val').data(cells).join('text')
  .attr('class', 'val')
  .attr('x', d => margin.left + d.col * cellSize + cellSize / 2 - 1)
  .attr('y', d => margin.top + d.row * cellSize + cellSize / 2)
  .attr('text-anchor', 'middle').attr('dominant-baseline', 'central')
  .attr('font-size', '16px').attr('font-weight', 600)
  .attr('fill', d => d.value > maxVal * 0.6 ? '#fff' : '#1e293b')
  .text(d => d.value);

// Column headers (Predicted)
g.selectAll('text.col-header').data(labels).join('text')
  .attr('class', 'col-header')
  .attr('x', (d, i) => margin.left + i * cellSize + cellSize / 2)
  .attr('y', margin.top - 12)
  .attr('text-anchor', 'middle').attr('font-size', '14px').attr('fill', '#1e293b').attr('font-weight', 500)
  .text(d => d);

// Row headers (Actual)
g.selectAll('text.row-header').data(labels).join('text')
  .attr('class', 'row-header')
  .attr('x', margin.left - 12)
  .attr('y', (d, i) => margin.top + i * cellSize + cellSize / 2)
  .attr('text-anchor', 'end').attr('dominant-baseline', 'central')
  .attr('font-size', '14px').attr('fill', '#1e293b').attr('font-weight', 500)
  .text(d => d);

// Axis labels
g.append('text').attr('x', margin.left + (labels.length * cellSize) / 2).attr('y', margin.top - 36)
  .attr('text-anchor', 'middle').attr('font-size', '14px').attr('fill', '#64748b').attr('font-weight', 600)
  .text('Predicted');
g.append('text').attr('transform', 'rotate(-90)')
  .attr('x', -(margin.top + (labels.length * cellSize) / 2)).attr('y', margin.left - 50)
  .attr('text-anchor', 'middle').attr('font-size', '14px').attr('fill', '#64748b').attr('font-weight', 600)
  .text('Actual');

// Diagonal highlight
labels.forEach((_, i) => {
  g.append('rect')
    .attr('x', margin.left + i * cellSize - 1).attr('y', margin.top + i * cellSize - 1)
    .attr('width', cellSize).attr('height', cellSize)
    .attr('fill', 'none').attr('stroke', '#22c55e').attr('stroke-width', 2).attr('rx', 4);
});
</script>
</body>
</html>
