<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunburst</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Sunburst</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || {
  name: "Embry OS", children: [
    {name: "Create", children: [
      {name: "figure", value: 800}, {name: "music", value: 400},
      {name: "story", value: 350}, {name: "movie", value: 600},
      {name: "persona", value: 250}
    ]},
    {name: "Monitor", children: [
      {name: "skills", value: 500}, {name: "memory", value: 300},
      {name: "sparta", value: 280}, {name: "drift", value: 200}
    ]},
    {name: "Learn", children: [
      {name: "datalake", value: 350}, {name: "extractor", value: 550},
      {name: "voice", value: 300}, {name: "artist", value: 200}
    ]},
    {name: "Ops", children: [
      {name: "claude", value: 450}, {name: "chutes", value: 200},
      {name: "runpod", value: 180}
    ]}
  ]
};

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const radius = Math.min(width, height) / 2 - 10;

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`)
  .append('g').attr('transform', `translate(${width/2},${height/2})`);

const colors = d3.scaleOrdinal(d3.schemeTableau10);

const root = d3.hierarchy(data).sum(d => d.value).sort((a, b) => b.value - a.value);
d3.partition().size([2 * Math.PI, radius])(root);

const arc = d3.arc()
  .startAngle(d => d.x0).endAngle(d => d.x1)
  .innerRadius(d => d.y0).outerRadius(d => d.y1 - 1)
  .padAngle(0.01).padRadius(radius / 2);

svg.selectAll('path').data(root.descendants().filter(d => d.depth)).join('path')
  .attr('data-label', d => d.data.name)
  .attr('d', arc)
  .attr('fill', d => { let p = d; while (p.depth > 1) p = p.parent; return colors(p.data.name); })
  .attr('fill-opacity', d => 1 - d.depth * 0.15)
  .attr('stroke', '#fff').attr('stroke-width', 1);

// Labels for segments large enough
svg.selectAll('text').data(root.descendants().filter(d => d.depth && (d.x1 - d.x0) > 0.12)).join('text')
  .attr('transform', d => {
    const angle = (d.x0 + d.x1) / 2 * 180 / Math.PI;
    const r = (d.y0 + d.y1) / 2;
    return `rotate(${angle - 90}) translate(${r},0) rotate(${angle < 180 ? 0 : 180})`;
  })
  .attr('dy', '0.35em').attr('text-anchor', 'middle')
  .attr('font-size', d => d.depth === 1 ? '13px' : '11px')
  .attr('fill', '#1e293b')
  .text(d => d.data.name);
</script>
</body>
</html>
