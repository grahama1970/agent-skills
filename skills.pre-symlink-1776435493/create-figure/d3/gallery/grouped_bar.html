<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grouped Bar Chart</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Grouped Bar Chart</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [
  {"category": "Q1", "Revenue": 120, "Expenses": 80, "Profit": 40},
  {"category": "Q2", "Revenue": 150, "Expenses": 95, "Profit": 55},
  {"category": "Q3", "Revenue": 135, "Expenses": 88, "Profit": 47},
  {"category": "Q4", "Revenue": 170, "Expenses": 105, "Profit": 65}
];
const keys = ["Revenue", "Expenses", "Profit"];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 120, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);

const x0 = d3.scaleBand().domain(data.map(d => d.category)).range([margin.left, width - margin.right]).padding(0.2);
const x1 = d3.scaleBand().domain(keys).range([0, x0.bandwidth()]).padding(0.05);
const y = d3.scaleLinear().domain([0, d3.max(data, d => d3.max(keys, k => d[k]))]).nice().range([height - margin.bottom, margin.top]);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

svg.selectAll('g.group').data(data).join('g')
  .attr('class', 'group').attr('transform', d => `translate(${x0(d.category)},0)`)
  .selectAll('rect').data(d => keys.map(k => ({key: k, value: d[k]}))).join('rect')
  .attr('data-label', d => d.key)
  .attr('x', d => x1(d.key)).attr('width', x1.bandwidth())
  .attr('y', height - margin.bottom).attr('height', 0).attr('rx', 3)
  .attr('fill', d => colors(d.key))
  .transition().duration(800).ease(d3.easeCubicOut)
  .attr('y', d => y(d.value)).attr('height', d => height - margin.bottom - y(d.value));

const legend = svg.append('g').attr('transform', `translate(${width - margin.right + 16}, ${margin.top})`);
keys.forEach((key, i) => {
  const g = legend.append('g').attr('transform', `translate(0, ${i * 24})`);
  g.append('rect').attr('width', 16).attr('height', 16).attr('fill', colors(key)).attr('rx', 3);
  g.append('text').attr('x', 22).attr('y', 13).text(key).attr('font-size', '14px');
});

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x0).tickSizeOuter(0)).selectAll('text').attr('font-size', '18px');
svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5)).selectAll('text').attr('font-size', '18px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);
</script>
</body>
</html>
