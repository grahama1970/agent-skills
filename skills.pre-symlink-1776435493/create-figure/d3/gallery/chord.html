<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chord Diagram</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Chord Diagram</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const names = ["Memory", "Extractor", "Analytics", "SPARTA", "Dashboard"];
const matrix = window.__INJECTED_DATA__ || [
  [0, 25, 10, 15, 5],
  [25, 0, 20, 30, 8],
  [10, 20, 0, 12, 18],
  [15, 30, 12, 0, 22],
  [5, 8, 18, 22, 0]
];

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const outerRadius = Math.min(width, height) / 2 - 40;
const innerRadius = outerRadius - 30;

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`)
  .append('g').attr('transform', `translate(${width/2},${height/2})`);

const colors = d3.scaleOrdinal(d3.schemeTableau10);

const chord = d3.chord().padAngle(0.05).sortSubgroups(d3.descending);
const chords = chord(matrix);

const arc = d3.arc().innerRadius(innerRadius).outerRadius(outerRadius);
const ribbon = d3.ribbon().radius(innerRadius);

// Arcs
svg.selectAll('path.arc').data(chords.groups).join('path')
  .attr('class', 'arc')
  .attr('data-label', d => names[d.index])
  .attr('d', arc)
  .attr('fill', d => colors(d.index))
  .attr('stroke', '#fff').attr('stroke-width', 1.5);

// Ribbons
svg.selectAll('path.ribbon').data(chords).join('path')
  .attr('class', 'ribbon')
  .attr('d', ribbon)
  .attr('fill', d => colors(d.source.index))
  .attr('fill-opacity', 0.6)
  .attr('stroke', '#fff').attr('stroke-width', 0.5);

// Labels
svg.selectAll('text').data(chords.groups).join('text')
  .each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
  .attr('dy', '0.35em')
  .attr('transform', d => `rotate(${(d.angle * 180 / Math.PI - 90)}) translate(${outerRadius + 12}) ${d.angle > Math.PI ? 'rotate(180)' : ''}`)
  .attr('text-anchor', d => d.angle > Math.PI ? 'end' : null)
  .attr('font-size', '14px').attr('fill', '#1e293b')
  .text(d => names[d.index]);
</script>
</body>
</html>
