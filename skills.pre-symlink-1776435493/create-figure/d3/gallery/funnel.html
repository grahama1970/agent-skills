<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Processing Funnel</title>
<style>
  body {
    background: #111;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .canvas-header {
    padding: 24px 32px 12px;
    flex-shrink: 0;
  }
  .canvas-title {
    font-size: 28px;
    font-weight: 700;
  }
  .canvas-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 32px 32px;
    overflow: hidden;
    animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #chart { width: 100%; height: 100%; }
  /* Override D3 axis/tick colors for dark theme */
  .domain, .tick line { stroke: #475569 !important; }
  .tick text { fill: #e2e8f0 !important; }
  text { fill: #e2e8f0; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Processing Funnel</div></div>
<div class="canvas-body">
<div id="chart"></div>
</div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || [{"label": "Corpus", "value": 12117}, {"label": "Extracted", "value": 9800}, {"label": "Scored", "value": 8200}, {"label": "Passed", "value": 7400}, {"label": "Ingested", "value": 6900}];
const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 40, right: 24, bottom: 40, left: 24};

const svg = d3.select('#chart').append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`);

const maxVal = d3.max(data, d => d.value || d.y || 0);
const stepH = (height - margin.top - margin.bottom) / data.length;
const centerX = width / 2;
const colors = d3.scaleOrdinal(d3.schemeTableau10);

data.forEach((d, i) => {
  const val = d.value || d.y || 0;
  const barW = (val / maxVal) * (width - margin.left - margin.right - 100);
  const yPos = margin.top + i * stepH;

  svg.append('rect')
    .attr('x', centerX - barW / 2)
    .attr('y', yPos + 2)
    .attr('width', barW)
    .attr('height', stepH - 4)
    .attr('rx', 6)
    .attr('fill', colors(i))
    .attr('opacity', 0.8);

  svg.append('text')
    .attr('x', centerX)
    .attr('y', yPos + stepH / 2)
    .attr('text-anchor', 'middle')
    .attr('dominant-baseline', 'central')
    .attr('font-size', '18px')
    .attr('font-weight', '600')
    .attr('fill', 'white')
    .text(`${d.label || d.name}: ${val}`);
});

</script>
</body>
</html>
