<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icicle Chart</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Icicle Chart</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

const data = window.__INJECTED_DATA__ || {
  name: "Skills", children: [
    {name: "Create", children: [
      {name: "figure", value: 800}, {name: "music", value: 400},
      {name: "story", value: 350}, {name: "movie", value: 600}
    ]},
    {name: "Monitor", children: [
      {name: "skills", value: 500}, {name: "memory", value: 300},
      {name: "sparta", value: 280}
    ]},
    {name: "Ops", children: [
      {name: "claude", value: 450}, {name: "chutes", value: 200},
      {name: "runpod", value: 180}
    ]},
    {name: "Learn", children: [
      {name: "datalake", value: 350}, {name: "extractor", value: 550}
    ]}
  ]
};

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

const root = d3.hierarchy(data).sum(d => d.value).sort((a, b) => b.value - a.value);
d3.partition().size([width, height]).padding(2)(root);

const cell = svg.selectAll('g').data(root.descendants()).join('g')
  .attr('transform', d => `translate(${d.x0},${d.y0})`);

cell.append('rect')
  .attr('data-label', d => d.data.name)
  .attr('width', d => d.x1 - d.x0).attr('height', d => d.y1 - d.y0)
  .attr('fill', d => { let p = d; while (p.depth > 1) p = p.parent; return d.depth === 0 ? '#94a3b8' : colors(p.data.name); })
  .attr('fill-opacity', d => 1 - d.depth * 0.15)
  .attr('stroke', '#fff').attr('stroke-width', 1).attr('rx', 2);

cell.filter(d => (d.x1 - d.x0) > 40).append('text')
  .attr('x', 6).attr('y', 18)
  .attr('font-size', d => d.depth === 0 ? '16px' : d.depth === 1 ? '14px' : '12px')
  .attr('font-weight', d => d.depth <= 1 ? 600 : 400)
  .attr('fill', '#1e293b')
  .text(d => d.data.name);

cell.filter(d => (d.x1 - d.x0) > 50 && !d.children).append('text')
  .attr('x', 6).attr('y', 34)
  .attr('font-size', '11px').attr('fill', '#64748b')
  .text(d => d.value);
</script>
</body>
</html>
