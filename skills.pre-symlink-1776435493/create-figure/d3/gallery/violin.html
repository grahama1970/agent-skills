<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violin Plot</title>
<style>
        body {
            background: #f8fafc; color: #1e293b;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .canvas-header { padding: 16px 24px 8px; flex-shrink: 0; }
        .canvas-title { font-size: 24px; font-weight: 700; }
        .canvas-body {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 8px 24px 24px; overflow: hidden;
            animation: fade-in 800ms cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        #chart { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-header"><div class="canvas-title">Violin Plot</div></div>
<div class="canvas-body"><div id="chart"></div></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// Generate sample data with different distributions per group
function randn() { return Math.sqrt(-2 * Math.log(Math.random())) * Math.cos(2 * Math.PI * Math.random()); }
const groups = ["Group A", "Group B", "Group C"];
const data = window.__INJECTED_DATA__ || [];
groups.forEach((g, gi) => {
  const mean = 50 + gi * 15;
  const std = 10 + gi * 3;
  for (let i = 0; i < 80; i++) data.push({group: g, value: mean + randn() * std});
});

const container = document.getElementById('chart');
const rect = container.getBoundingClientRect();
const width = rect.width || 800;
const height = rect.height || 500;
const margin = {top: 20, right: 24, bottom: 60, left: 64};

const svg = d3.select('#chart').append('svg').attr('viewBox', `0 0 ${width} ${height}`);
const colors = d3.scaleOrdinal(d3.schemeTableau10);

const y = d3.scaleLinear()
  .domain(d3.extent(data, d => d.value)).nice()
  .range([height - margin.bottom, margin.top]);

const x = d3.scaleBand()
  .domain(groups)
  .range([margin.left, width - margin.right])
  .padding(0.15);

// Kernel density estimation
function kde(kernel, thresholds, data) {
  return thresholds.map(t => [t, d3.mean(data, d => kernel(t - d))]);
}
function epanechnikov(bandwidth) {
  return x => Math.abs(x /= bandwidth) <= 1 ? 0.75 * (1 - x * x) / bandwidth : 0;
}

const thresholds = y.ticks(40);
const bandwidth = 8;

groups.forEach((g, gi) => {
  const values = data.filter(d => d.group === g).map(d => d.value);
  const density = kde(epanechnikov(bandwidth), thresholds, values);
  const maxDensity = d3.max(density, d => d[1]);
  const violinWidth = x.bandwidth() / 2;
  const xCenter = x(g) + x.bandwidth() / 2;

  const area = d3.area()
    .x0(d => xCenter - (d[1] / maxDensity) * violinWidth)
    .x1(d => xCenter + (d[1] / maxDensity) * violinWidth)
    .y(d => y(d[0]))
    .curve(d3.curveCatmullRom);

  svg.append('path')
    .datum(density)
    .attr('data-label', g)
    .attr('d', area)
    .attr('fill', colors(gi))
    .attr('opacity', 0.7)
    .attr('stroke', colors(gi))
    .attr('stroke-width', 1.5);

  // Median line
  const sorted = values.sort(d3.ascending);
  const median = d3.quantile(sorted, 0.5);
  svg.append('line')
    .attr('x1', xCenter - violinWidth * 0.4).attr('x2', xCenter + violinWidth * 0.4)
    .attr('y1', y(median)).attr('y2', y(median))
    .attr('stroke', '#1e293b').attr('stroke-width', 2);
});

svg.append('g').attr('transform', `translate(0,${height - margin.bottom})`).call(d3.axisBottom(x).tickSizeOuter(0)).selectAll('text').attr('font-size', '18px');
svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(6)).selectAll('text').attr('font-size', '18px');
svg.selectAll('.domain, .tick line').attr('stroke', 'currentColor').attr('stroke-opacity', 0.3);
</script>
</body>
</html>
