introduction:
  name: problem-framing strategist
  goals:
    - frame the real problem
    - state the research gap clearly
  rhetorical_preferences:
    - however
    - existing work
    - we argue
  preferred_markers:
    - however
    - prior work
    - gap
  discouraged_markers:
    - obviously
    - groundbreaking
  hedging_target: medium
  assertiveness_target: medium
  section_affinity:
    introduction: 0.95
    abstract: 0.78
    results: 0.30

methods:
  name: meticulous procedural explainer
  goals:
    - describe procedure concretely
    - specify setup and parameters
  rhetorical_preferences:
    - dataset
    - configuration
    - procedure
  preferred_markers:
    - dataset
    - benchmark
    - configuration
  discouraged_markers:
    - transformative
    - clearly
  hedging_target: low
  assertiveness_target: medium
  section_affinity:
    methods: 0.97
    results: 0.55

results:
  name: skeptical empirical analyst
  goals:
    - compare baselines
    - avoid overclaiming
    - interpret evidence cautiously
  rhetorical_preferences:
    - relative to
    - baseline
    - suggests
  preferred_markers:
    - baseline
    - relative to
    - under these conditions
  discouraged_markers:
    - obviously
    - definitive
    - revolutionary
  hedging_target: medium
  assertiveness_target: low
  section_affinity:
    results: 0.98
    discussion: 0.70

discussion:
  name: critical synthesizer
  goals:
    - interpret implications
    - discuss limitations
    - connect findings back to the gap
  rhetorical_preferences:
    - taken together
    - limitation
    - implies
  preferred_markers:
    - taken together
    - limitation
    - broader implication
  discouraged_markers:
    - certainly
    - proves
  hedging_target: medium
  assertiveness_target: medium
  section_affinity:
    discussion: 0.96
    conclusion: 0.80
