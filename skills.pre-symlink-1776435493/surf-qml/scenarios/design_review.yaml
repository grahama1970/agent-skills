name: embry_design_review
description: >
  UX Scenario 3.1: Embry Design Review Workflow.
  Weekly design review checking typography and visual hierarchy
  across components for design token compliance.
  Embry narrates her observations aloud via PersonaPlex.

persona: embry
auto_narrate: true
voice_mode: live  # PersonaPlex for real-time human monitoring

success_criteria:
  - Complete audit of 5 screens in 15 minutes
  - Document all deviations from design system
  - Generate screenshot evidence

audit_points:
  - Typography uses HorusStyle.text.* tokens
  - Colors from HorusStyle.colors.* palette
  - Spacing from HorusStyle.layout.*
  - Focus states clearly visible (2px border minimum)

steps:
  # Embry introduces herself
  - narrate: { text: "Alright, starting the weekly design review. Let me open up the overlay and check our five key screens.", emotion: "curious" }

  # Screen 1: Search/landing state
  - find: "main.py"
  - focus: "main.py"
  - wait: 0.5
  - snap: { output: "01_landing_state.png" }
  - narrate: { text: "Okay, here's the landing state. Let me check the element hierarchy.", emotion: "focused" }
  - read: { depth: 10 }

  # Inspect result items for typography compliance
  - read: { role: "label" }
  - narrate: { text: "Checking typography tokens. These labels should all be using HorusStyle text sizes.", emotion: "focused" }
  - snap: { output: "02_typography_check.png" }

  # Screen 2: Search with results
  - type: "calculator"
  - wait: 0.5
  - snap: { output: "03_search_results.png" }
  - read: { role: "list-item" }
  - narrate: { text: "Search results are showing. Let me look at the result item sizing and spacing." }

  # Screen 3: Focus state audit
  - narrate: { text: "Now the important part. Focus states need to be crystal clear. Two pixel border minimum.", emotion: "focused" }
  - key: "Tab"
  - wait: 0.2
  - snap: { output: "04_focus_state_tab.png" }
  - verify: { state: "focused" }

  - key: "Down"
  - wait: 0.2
  - snap: { output: "05_focus_state_down.png" }

  - key: "Down"
  - wait: 0.2
  - snap: { output: "06_focus_state_second.png" }
  - narrate: { text: "Good, focus is moving through the list. I can see the highlight. Let me check the buttons next." }

  # Screen 4: Button states
  - read: { role: "button" }
  - snap: { output: "07_button_inventory.png" }

  # Screen 5: Full element tree for spacing audit
  - narrate: { text: "Last screen. Full element tree for the spacing audit. Looking for any hardcoded values.", emotion: "curious" }
  - read: { depth: 12 }
  - snap: { output: "08_full_tree_spacing.png" }

  # Record a walkthrough for review-design consumption
  - narrate: { text: "Recording a short walkthrough video for the review-design pipeline." }
  - record: { duration: 5, output: "09_walkthrough.mp4" }

  # Return to clean state
  - key: "Escape"
  - wait: 0.3
  - snap: { output: "10_clean_state.png" }
  - narrate: { text: "Design review complete. Let me save the session and check the taxonomy summary.", emotion: "pleased" }
