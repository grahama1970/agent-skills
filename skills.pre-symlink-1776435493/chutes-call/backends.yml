# Backend configuration for chutes-call gateway
# Order determines fallback priority: chutes → openrouter → gemini-flash

backends:
  chutes:
    name: Chutes.ai
    priority: 1
    api_base: https://llm.chutes.ai/v1
    env_key: CHUTES_API_TOKEN
    env_key_alt: CHUTES_API_KEY
    default_model: deepseek-ai/DeepSeek-V3
    model_patterns:
      - "deepseek-*"
      - "meta-llama/*"
      - "Qwen/*"
    max_concurrent: 5
    cost_per_million_in: 0.50
    cost_per_million_out: 1.40

  openrouter:
    name: OpenRouter
    priority: 2
    api_base: https://openrouter.ai/api/v1
    env_key: OPENROUTER_API_KEY
    default_model: deepseek/deepseek-chat-v3-0324
    model_patterns:
      - "deepseek/*"
      - "meta-llama/*"
      - "qwen/*"
    max_concurrent: 10
    cost_per_million_in: 0.50
    cost_per_million_out: 1.40

  gemini-flash:
    name: Google Gemini Flash
    priority: 3
    api_base: https://generativelanguage.googleapis.com/v1beta/openai
    env_key: GEMINI_API_KEY
    default_model: gemini-2.0-flash
    model_patterns:
      - "gemini-*"
    max_concurrent: 15
    cost_per_million_in: 0.10
    cost_per_million_out: 0.40
