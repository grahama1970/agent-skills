# /chutes-call skill policy — enforced by .claude/hooks/skill_policy.py
# Agents call Chutes API directly, bypassing the 5-slot semaphore gateway.
# This causes ~50% failure rate from concurrent connection limit violations.

name: chutes-call
slash_command: /chutes-call

required_reads:
  - .pi/skills/chutes-call/SKILL.md

forbidden_use:
  any_of:
    # Direct Chutes API calls — must go through gateway at :8630
    - pattern: "api\\.chutes\\.ai|chutes\\.ai/api"
      reason: "Don't call Chutes API directly. Use the gateway at localhost:8630 which enforces the 5-concurrent-connection semaphore."
    - pattern: "CHUTES_API_KEY.*httpx|CHUTES_API_KEY.*requests|CHUTES_API_KEY.*curl"
      reason: "Don't use CHUTES_API_KEY directly. The gateway at localhost:8630 manages credentials."

    # Direct provider SDK imports (gateway handles all backends)
    - import: openai
      reason: "Don't import openai SDK for Chutes calls. Use the gateway at localhost:8630/chat."

    # Bespoke retry logic (gateway has tenacious mode + circuit breaker)
    - pattern: "tenacity.*chutes|retry.*chutes|backoff.*chutes"
      reason: "Don't implement retry logic for Chutes. Use tenacious=true on the gateway at localhost:8630."

    # Direct curl to Chutes (bypasses semaphore)
    - shell_contains: "curl.*chutes.ai"
      reason: "Don't curl Chutes API directly. Use curl http://localhost:8630/chat instead."
    - shell_contains: "curl.*api.chutes"
      reason: "Don't curl Chutes API directly. Use curl http://localhost:8630/chat instead."
