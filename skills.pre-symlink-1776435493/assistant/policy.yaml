# /assistant skill policy — enforced by .claude/hooks/skill_policy.py
# Anti-patterns from SKILL.md: bypassing cascade, hand-crafted prompts, skipping shadow

name: assistant
slash_command: /assistant

required_reads:
  - .pi/skills/assistant/SKILL.md

forbidden_use:
  any_of:
    # WRONG: Calling scillm directly bypassing the 4-tier cascade (Tier bypass)
    - pattern: "localhost:4001.*/v1/chat.*(?:qra-assessor|bridge-tagger|topic-classifier|stress-test)"
      reason: "Do not call scillm directly for assistant tasks. Use /assistant which routes through the 4-tier cascade (heuristic -> classifier -> GPT -> scillm)."

    # WRONG: Hand-crafting system prompts in Python strings (Common Mistakes #1)
    - pattern: "SYSTEM_PROMPT\\s*=|system_prompt\\s*=\\s*[\"']You are"
      reason: "All system prompts must be iterated through /prompt-lab before being baked into training data. Never hand-craft system prompts in Python strings."

    # WRONG: Training with insufficient data (Common Mistakes #2)
    - shell_contains: "factory train-gpt"
      reason: "Check sample counts with 'run.sh status' before training. Need >= 200 samples per class. Stay at Tier 2 and harvest more teacher labels first if insufficient."

    # WRONG: Promoting untested models without shadow comparison (Common Mistakes #3)
    - shell_contains: "factory promote"
      reason: "Use 'factory auto-improve' instead of direct promote. Auto-improve reads shadow agreement rate and decides whether to promote."
