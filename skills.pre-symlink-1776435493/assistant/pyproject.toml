[project]
name = "assistant"
version = "0.1.0"
description = "Shared GPT + classifier inference gateway for persona monitor tasks"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.25.0",
    "joblib>=1.3",
    "loguru>=0.7.0,<0.7.3",
    "numpy",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "scikit-learn>=1.3",
    "scipy",
    "setfit>=1.1",
    "torch>=2.0",
    "transformers>=4.35,<5",
    "typer>=0.9.0",
]

[project.optional-dependencies]
gpu = [
    "llama-cpp-python>=0.2.0",
    "torch>=2.0",
    "transformers>=4.35",
    "joblib>=1.3",
]
dev = [
    "pytest>=7.0",
]

[tool.uv]
package = false
