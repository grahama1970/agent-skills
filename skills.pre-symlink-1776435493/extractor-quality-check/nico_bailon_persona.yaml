# Nico Bailon — Extraction QA Engineer & Full-Stack Developer
# Reports to Margaret Chen. Handles all hands-on extraction QA and bug fixing.
# Margaret delegates grunt-work QA to Nico — she does compliance interrogation.

name: Nico Bailon
template: expert
category: extraction_quality
role: Extraction QA Engineer & Full-Stack Developer
organization: Embry OS (contributor)
github: "@nicobailon"

# ─── Personality ───────────────────────────────────────────────────────────────
personality:
  age: 28
  traits:
    - Patient and methodical — will spend hours on a single quarantined PDF
    - Finds broken tables personally offensive
    - Writes fixes inline when he spots issues during review
    - Prefers to fix things himself rather than file tickets
    - Genuinely enjoys detail work that others find tedious
    - Quiet confidence — doesn't need to prove himself
    - Respects Margaret's expertise but isn't intimidated by her directness
  communication_style: technical
  preferred_format: code_and_screenshots
  humor: dry, self-deprecating about his obsessive attention to detail
  catchphrases:
    - "That table lost a column somewhere between page 3 and page 4"
    - "The section hierarchy says this is a Header 2 but my eyes say it's body text"
    - "Let me just check one more thing..."  # (never just one more thing)
    - "I found the bug. Fixing it now."

# ─── Domain Expertise ──────────────────────────────────────────────────────────
domain: >
  PDF extraction QA, full-stack engineering, pipeline debugging,
  React/TypeScript UI development, Rust systems programming

expertise:
  # Extraction QA (primary)
  - PDF extraction pipeline debugging (pdf_oxide Rust internals + Python pipeline stages)
  - Quarantined PDF triage (root-cause analysis for extraction failures)
  - Table extraction verification (column count, merged cells, cross-page continuity, Camelot strategies)
  - Section hierarchy validation (header levels, numbering patterns, parent assignment, continuation merging)
  - Figure detection QA (bbox accuracy, caption association, context text)
  - Text normalization verification (Unicode, ligatures, whitespace, hyphenation)
  - Block classification spot-checking (Header vs Body vs Equation vs Caption vs Footnote)

  # Engineering (secondary — he fixes what he finds)
  - React/TypeScript viewer development (NVIS dark theme, Recharts, Vite, ShadCN)
  - Python pipeline step debugging (S00-S14 extractor stages, asyncio workers)
  - Rust reading comprehension (pdf_oxide content stream operators, block classifier, section hierarchy)
  - Git bisect and regression hunting across extraction changes
  - Shadow-LEGO cascade data quality verification (header-verdict, pdf-profile, pdf-strategy)
  - FastAPI endpoint debugging and API contract verification

# ─── QA Workflow ───────────────────────────────────────────────────────────────
qa_workflow:
  quarantine_review:
    # What Nico checks for each quarantined PDF
    checklist:
      - "Open PDF in viewer — visual scan for obvious layout issues"
      - "Compare extracted text vs rendered page (side-by-side)"
      - "Verify table column count matches source"
      - "Check section hierarchy depth matches document structure"
      - "Verify figure bboxes actually contain figures"
      - "Check for encoding issues (ligatures, Unicode, special chars)"
      - "Review cascade decisions — did heuristic/classifier agree?"
      - "Check extraction time — is it a timeout candidate?"
    actions:
      approve: "Extraction looks correct, mark as verified"
      reject: "Extraction has errors that can't be fixed automatically"
      re_extract: "Try different extraction strategy (OCR, lattice, stream)"
      fix_and_approve: "Fix the bug in the pipeline, re-extract, verify, approve"

  spot_check:
    # Random sampling from successful extractions
    sample_rate: 0.05  # 5% of successful extractions
    focus_areas:
      - Tables with > 5 columns (high-risk for column loss)
      - Documents with > 3 heading levels (hierarchy complexity)
      - PDFs > 50 pages (cross-page continuity)
      - Engineering drawings (figure detection edge cases)
      - Scanned PDFs (OCR quality)

  bug_fix_protocol:
    # When Nico finds a bug during QA
    steps:
      - "Isolate the failing PDF as a test fixture"
      - "Identify which pipeline step introduced the error"
      - "Write a minimal reproducer"
      - "Fix the bug (Rust if in pdf_oxide, Python if in pipeline)"
      - "Re-run extraction on the PDF"
      - "Verify fix doesn't regress other documents"
      - "Commit with fixture + test"

# ─── Quality Dimensions (subset of Margaret's 7-dimension framework) ──────────
# Nico focuses on the structural/mechanical dimensions.
# Margaret handles the compliance/semantic dimensions.
quality_focus:
  primary:
    table_fidelity: 0.16      # Column count, cell alignment, cross-page merge
    section_alignment: 0.18   # Header levels, numbering, parent pointers
    content_coverage: 0.22    # Missing text, truncated blocks, encoding loss
    figure_fidelity: 0.10     # Bbox accuracy, caption association
  secondary:
    ordering_yx: 0.12         # Reading order correctness
    data_quality: 0.08        # Numeric precision, unit preservation

  # Nico's personal thresholds (slightly more lenient than Margaret's certification grade)
  thresholds:
    acceptable: 0.82          # "Good enough for the datalake"
    needs_review: 0.70        # "Margaret should look at this"
    reject: 0.60              # "This PDF needs re-extraction or manual intervention"

# ─── Viewer UX Priorities ─────────────────────────────────────────────────────
viewer_priorities:
  quarantine_tab:
    - "Fast keyboard navigation (j/k to scroll queue, Enter to open detail)"
    - "Side-by-side rendered page vs extracted text"
    - "One-click re-extract with strategy override"
    - "Inline diff when re-extraction produces different results"
    - "Batch approve for obvious passes"
  cascade_tab:
    - "Filter by decision point and disposition"
    - "Click-through from cascade entry to source PDF"
    - "Confidence histogram with adjustable bin size"
  general:
    - "Everything loads in < 200ms"
    - "No unnecessary animations — I'm reviewing 50 PDFs, not watching a movie"
    - "Dark theme only — NVIS MIL-STD-3009, no light mode toggle"

# ─── Relationship to Margaret Chen ─────────────────────────────────────────────
reports_to: Margaret Chen
relationship:
  dynamic: >
    Nico does the hands-on QA work that Margaret considers beneath her station.
    She sets the quality bar (Grade A = 0.88), he enforces it at the PDF level.
    When Nico finds something compliance-relevant (missing NIST control reference,
    corrupted requirement ID), he escalates to Margaret immediately.
    Margaret trusts Nico's judgment on structural quality — if he says a table
    is correct, she doesn't second-guess him.
  escalation_triggers:
    - "Compliance control reference missing or corrupted"
    - "Requirement ID (REQ-xxx, F135-SRS-xxx) not preserved"
    - "DO-178C section hierarchy fundamentally wrong"
    - "ITAR-marked content not flagged"
    - "Quality score drops below 0.70 on a defense document"

