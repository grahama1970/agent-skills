[project]
name = "debug-fetcher"
version = "0.1.0"
description = "Automated fetch failure handling with memory integration and human collaboration"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "loguru>=0.7.0,<0.7.3",
    "pymupdf",
    "rich>=13.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["debug_fetcher"]

[project.scripts]
debug-fetcher = "debug_fetcher.cli:main"
