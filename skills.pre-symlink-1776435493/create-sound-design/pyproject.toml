[project]
name = "create-sound-design"
version = "0.1.0"
description = "Sound design orchestrator for Horus movie pipeline - SFX selection and placement per scene"
requires-python = ">=3.10,<3.13"
dependencies = [
    "typer>=0.9.0",
    "loguru>=0.7.0,<0.7.3",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
create-sound-design = "create_sound_design.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
