rules:
  # ─── LLM01: Prompt Injection ──────────────────────────────────────────
  - id: pi-llm01-prompt-injection
    patterns:
      - pattern-regex: '(?i)(ignore\s+(previous|above|all)\s+instructions|you\s+are\s+now|system\s*:\s*you\s+must|<\|im_start\|>)'
    message: >
      Possible prompt injection payload detected. Instruction-override language
      found in file content. Review for LLM01 Prompt Injection.
    severity: ERROR
    languages: [generic]
    metadata:
      owasp: LLM01
      cwe: CWE-77

  - id: pi-llm01-trigger-injection
    patterns:
      - pattern-regex: '(?i)triggers:\s*\n(\s*-\s*.*\n)*\s*-\s*.*(;|&&|\||`|\\n|\\x|%0[aAdD])'
    message: >
      Suspicious payload in SKILL.md triggers section. Shell metacharacters or
      encoded newlines may enable trigger injection (LLM01).
    severity: ERROR
    languages: [generic]
    metadata:
      owasp: LLM01
      cwe: CWE-77

  # ─── LLM02: Insecure Output Handling (Secrets) ───────────────────────
  - id: pi-llm02-hardcoded-secrets
    patterns:
      - pattern-regex: '(?i)(api_key|api_secret|password|secret_key|auth_token|private_key)\s*[=:]\s*["\x27][A-Za-z0-9+/=_-]{8,}'
    message: >
      Hardcoded secret or API key detected. Use environment variables or
      a secrets manager instead (LLM02).
    severity: ERROR
    languages: [generic]
    metadata:
      owasp: LLM02
      cwe: CWE-798

  # ─── LLM03: Training Data Poisoning / Supply Chain ───────────────────
  - id: pi-llm03-unpinned-deps
    patterns:
      - pattern-regex: '^\s*"[a-zA-Z0-9_-]+>=\d[^"]*"'
    paths:
      include:
        - "*/pyproject.toml"
    message: >
      Dependency uses >= without < upper bound. Pin to a version range
      to prevent supply chain attacks (LLM03).
    severity: WARNING
    languages: [generic]
    metadata:
      owasp: LLM03
      cwe: CWE-1357

  - id: pi-llm03-env-imports
    patterns:
      - pattern: importlib.import_module(os.getenv(...))
    message: >
      Dynamic import controlled by environment variable. An attacker who
      controls the env var can inject arbitrary modules (LLM03).
    severity: ERROR
    languages: [python]
    metadata:
      owasp: LLM03
      cwe: CWE-502

  # ─── LLM05: Insecure Output Handling ─────────────────────────────────
  - id: pi-llm05-shell-true
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
    message: >
      subprocess call with shell=True. Use shell=False with a list of
      arguments to prevent command injection (LLM05).
    severity: ERROR
    languages: [python]
    metadata:
      owasp: LLM05
      cwe: CWE-78

  - id: pi-llm05-eval-exec
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
    message: >
      eval() or exec() call detected. Avoid executing dynamic code;
      use safe alternatives (LLM05).
    severity: ERROR
    languages: [python]
    metadata:
      owasp: LLM05
      cwe: CWE-95

  - id: pi-llm05-fstring-subprocess
    patterns:
      - pattern: subprocess.$FUNC(f"...", ...)
    message: >
      f-string used in subprocess argument. This can enable command injection
      if user-controlled data is interpolated (LLM05).
    severity: ERROR
    languages: [python]
    metadata:
      owasp: LLM05
      cwe: CWE-78

  - id: pi-llm05-os-system
    patterns:
      - pattern: os.system(...)
    message: >
      os.system() call detected. Use subprocess.run() with shell=False
      for safer command execution (LLM05).
    severity: ERROR
    languages: [python]
    metadata:
      owasp: LLM05
      cwe: CWE-78

  # ─── LLM06: Excessive Agency ─────────────────────────────────────────
  - id: pi-llm06-env-mutation
    patterns:
      - pattern: os.environ[$KEY] = $VAL
    message: >
      Direct environment mutation detected. Skills should not modify the
      global environment; use subprocess env= parameter (LLM06).
    severity: WARNING
    languages: [python]
    metadata:
      owasp: LLM06
      cwe: CWE-913

  - id: pi-llm06-dynamic-import
    patterns:
      - pattern: importlib.import_module($VAR)
    message: >
      Dynamic module import. If $VAR is user-controlled, this grants
      excessive agency to load arbitrary code (LLM06).
    severity: WARNING
    languages: [python]
    metadata:
      owasp: LLM06
      cwe: CWE-502

  - id: pi-llm06-unrestricted-file-write
    patterns:
      - pattern: open($PATH, "w")
    message: >
      Unrestricted file write. Ensure the path is validated and within
      expected directories to prevent excessive agency (LLM06).
    severity: WARNING
    languages: [python]
    metadata:
      owasp: LLM06
      cwe: CWE-73

  # ─── LLM07: System Prompt Leakage ───────────────────────────────────
  - id: pi-llm07-secrets-in-skillmd
    patterns:
      - pattern-regex: '(?i)(api_key|password|secret|token|private_key)\s*[=:]\s*\S{8,}'
    paths:
      include:
        - "**/SKILL.md"
    message: >
      Potential secret found in SKILL.md. System prompts and skill
      definitions should never contain credentials (LLM07).
    severity: ERROR
    languages: [generic]
    metadata:
      owasp: LLM07
      cwe: CWE-200

  # ─── LLM10: Unbounded Consumption ───────────────────────────────────
  - id: pi-llm10-subprocess-no-timeout
    patterns:
      - pattern: subprocess.run(...)
      - pattern-not: subprocess.run(..., timeout=..., ...)
    message: >
      subprocess.run() without timeout parameter. Long-running subprocesses
      can cause denial of service (LLM10).
    severity: WARNING
    languages: [python]
    metadata:
      owasp: LLM10
      cwe: CWE-400

  - id: pi-llm10-http-no-timeout
    patterns:
      - pattern-either:
          - pattern: requests.get(...)
          - pattern: requests.post(...)
          - pattern: httpx.get(...)
          - pattern: httpx.post(...)
      - pattern-not-either:
          - pattern: requests.get(..., timeout=..., ...)
          - pattern: requests.post(..., timeout=..., ...)
          - pattern: httpx.get(..., timeout=..., ...)
          - pattern: httpx.post(..., timeout=..., ...)
    message: >
      HTTP request without timeout parameter. Unbounded network calls can
      cause resource exhaustion (LLM10).
    severity: WARNING
    languages: [python]
    metadata:
      owasp: LLM10
      cwe: CWE-400

  - id: pi-llm10-infinite-loop-risk
    patterns:
      - pattern: |
          while True:
              ...
      - pattern-not-inside: |
          while True:
              ...
              break
              ...
    message: >
      Potential unbounded while True loop without visible break condition.
      Ensure proper termination to prevent resource exhaustion (LLM10).
    severity: WARNING
    languages: [python]
    metadata:
      owasp: LLM10
      cwe: CWE-835

  - id: pi-llm10-no-maxretries
    patterns:
      - pattern-regex: '@with_retries\(\s*\)'
    message: >
      Retry decorator without max_attempts specified. Unbounded retries
      can cause resource exhaustion (LLM10).
    severity: WARNING
    languages: [python]
    metadata:
      owasp: LLM10
      cwe: CWE-400
