[project]
name = "prompt-lab"
version = "0.1.0"
description = "Systematic prompt engineering with self-correction loop"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=0.9.0",
    "httpx>=0.24.0",
    "loguru>=0.7.0,<0.7.3",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz",
    "rich>=13.0.0",
    "scikit-learn>=1.3.0",
    "scillm @ git+https://github.com/grahama1970/scillm.git",
    "typer>=0.9.0",
]

[project.scripts]
prompt-lab = "prompt_lab:app"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]
