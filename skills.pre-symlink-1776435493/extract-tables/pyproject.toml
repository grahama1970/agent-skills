[project]
name = "extract-tables"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic",
    "httpx>=0.24",
    "camelot-py[cv]",
    "joblib",
    "loguru>=0.7.0,<0.7.3",
    "numpy",
    "opencv-python",
    "pdfminer.six",
    "Pillow",
    "polars",
    "scikit-learn",
    "typer>=0.9",
]

[dependency-groups]
test = ["pytest>=7.0"]

[tool.maturin]
module-name = "extract_tables_rs"
