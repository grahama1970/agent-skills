[project]
name = "agent-inbox"
version = "0.1.0"
description = "File-based inter-agent messaging for cross-project communication"
requires-python = ">=3.11,<3.13"

dependencies = [
    "google-auth",
    "httpx>=0.24.0",
    "loguru>=0.7.0,<0.7.3",
    "rich>=13.0.0",
    "textual>=0.40.0",
    "typer>=0.9.0",
]
