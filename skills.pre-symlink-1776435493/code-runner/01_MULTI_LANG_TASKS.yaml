version: 1
kind: orchestrate-plan
repo_root: "/home/graham/workspace/experiments/pi-mono"

metadata:
  title: "Multi-Language Code Runner"
  goal: "Integrate language_profiles.py for reliable Python, Rust, TypeScript task execution"
  plan_type: code
  created: "2026-04-12"
  primary_persona:
    name: "Graham Anderson"
    role: "Developer using code-runner for multi-language projects"
    source: "internal"

execution:
  max_concurrency: 1  # sequential - each task depends on previous

capability_overlap:
  - "language_profiles.py already created with PythonProfile, RustProfile, TypeScriptProfile"
  - "No existing multi-language support in code-runner"
  - "Existing evidence.py handles Python only"

questions_blockers: []

lanes:
  - id: "0"
    label: "Wave 0: Schema Update"
  - id: "1"
    label: "Wave 1: Integration"
  - id: "2"
    label: "Wave 2: Test Fixtures"
  - id: "3"
    label: "Wave 3: Validation"

tasks:
  # ── Wave 0: Add lang field to TaskSpec ──────────────────────────────────
  - id: "1"
    title: "Add lang field to TaskSpec model"
    lane: "0"
    runner: "scillm"
    backend: "codex"
    mode: "one_shot"
    depends_on: []
    prompt: |
      In models.py, add a `lang` field to TaskSpec:

      ```python
      lang: str = Field("", description="Language: python, rust, typescript. Empty = auto-detect from cwd")
      ```

      Add field_validator:
      ```python
      @field_validator("lang")
      @classmethod
      def lang_must_be_known(cls, v: str) -> str:
          known = {"", "python", "rust", "typescript", "ts", "node"}
          if v and v.lower() not in known:
              raise ValueError(f"Unknown lang '{v}'. Valid: python, rust, typescript")
          return v.lower()
      ```

      Place after the `backend` field. Keep existing code unchanged.
    allowlist:
      - "models.py"
    definition_of_done:
      command: "cd /home/graham/workspace/experiments/pi-mono/.pi/skills/code-runner && python3 -c \"from models import TaskSpec; import json; spec = TaskSpec.model_validate({'task_id': 't1', 'prompt': 'test prompt here', 'cwd': '.', 'lang': 'rust', 'definition_of_done': {'command': 'echo ok'}, 'allowlist': ['x.rs']}); print('lang=' + spec.lang)\""
      assertion: "lang=rust"

  # ── Wave 1: Update evidence.py to use profiles ─────────────────────────
  - id: "2"
    title: "Update collect_evidence to accept language profile"
    lane: "1"
    runner: "scillm"
    backend: "codex"
    mode: "one_shot"
    depends_on: ["1"]
    prompt: |
      In evidence.py, modify collect_evidence() to accept a lang parameter and use language profiles.

      1. Add import at top (after existing imports):
         ```python
         from language_profiles import get_profile, LanguageProfile
         ```

      2. Change function signature:
         ```python
         def collect_evidence(cwd: str, dod_command: str, dod_assertion: str, lang: str = "") -> dict:
         ```

      3. At start of function, get the profile:
         ```python
         profile = get_profile(lang, cwd)
         logger.info("Using {} profile for evidence collection", profile.name)
         ```

      4. Replace the Python-specific lint check (lines ~143-161) with:
         ```python
         # 3. Lint modified files (language-aware)
         modified_files = profile.get_modified_files(cwd)
         lint_result = profile.lint_check(modified_files, cwd)
         lint_violations = lint_result.violations
         ```

      5. Replace the best-practices check (lines ~172-188) with:
         ```python
         # 4. Best-practices violations (language-aware)
         try:
             git_proc = subprocess.run(
                 ["git", "diff", "HEAD"], capture_output=True, text=True, cwd=cwd, timeout=30,
             )
             bp_result = profile.best_practices(git_proc.stdout)
             bp_violations = bp_result.violations
         except subprocess.SubprocessError:
             bp_violations = []
         ```

      6. Update classify_errors call to use profile:
         ```python
         # 2. Classify errors (language-aware)
         error_result = profile.classify_errors(stderr, stdout)
         classification = {
             "error_types": error_result.error_types,
             "total": error_result.total,
             "severity": error_result.severity,
         }
         ```

      Keep the rest of collect_evidence unchanged (scoring formula, DoD assertion check, etc).
    allowlist:
      - "evidence.py"
    definition_of_done:
      command: "cd /home/graham/workspace/experiments/pi-mono/.pi/skills/code-runner && python3 -c \"from evidence import collect_evidence; import inspect; sig = inspect.signature(collect_evidence); print('lang' in sig.parameters)\""
      assertion: "True"

  - id: "3"
    title: "Update code_runner.py to pass lang to collect_evidence"
    lane: "1"
    runner: "scillm"
    backend: "codex"
    mode: "one_shot"
    depends_on: ["2"]
    prompt: |
      In code_runner.py, update the call to collect_evidence to pass the lang parameter.

      1. After extracting spec fields (~line 567), add:
         ```python
         lang = spec.lang
         ```

      2. Find the collect_evidence call (~line 962) and update it:
         ```python
         evidence_raw = collect_evidence(cwd, dod_command, dod_assertion, lang=lang)
         ```

      That's it. Minimal change.
    allowlist:
      - "code_runner.py"
    definition_of_done:
      command: "cd /home/graham/workspace/experiments/pi-mono/.pi/skills/code-runner && grep -n 'lang=lang' code_runner.py | head -1"
      assertion: "collect_evidence"

  # ── Wave 2: Create test fixtures ────────────────────────────────────────
  - id: "4"
    title: "Create Python test fixture"
    lane: "2"
    runner: "local"
    depends_on: ["3"]
    command: |
      mkdir -p /tmp/code-runner-test/python-fixture
      cd /tmp/code-runner-test/python-fixture
      git init -q
      cat > main.py << 'EOF'
      def add(a: int, b: int) -> int:
          return a + b

      if __name__ == "__main__":
          print(add(2, 3))
      EOF
      git add main.py && git commit -m "init" -q
      echo "Python fixture ready"
    definition_of_done:
      command: "python3 /tmp/code-runner-test/python-fixture/main.py"
      assertion: "5"

  - id: "5"
    title: "Create Rust test fixture"
    lane: "2"
    runner: "local"
    depends_on: ["3"]
    command: |
      mkdir -p /tmp/code-runner-test/rust-fixture
      cd /tmp/code-runner-test/rust-fixture
      git init -q
      cat > Cargo.toml << 'EOF'
      [package]
      name = "test_fixture"
      version = "0.1.0"
      edition = "2021"
      EOF
      mkdir -p src
      cat > src/main.rs << 'EOF'
      fn add(a: i32, b: i32) -> i32 {
          a + b
      }

      fn main() {
          println!("{}", add(2, 3));
      }
      EOF
      git add . && git commit -m "init" -q
      echo "Rust fixture ready"
    definition_of_done:
      command: "cd /tmp/code-runner-test/rust-fixture && cargo run -q 2>/dev/null"
      assertion: "5"

  - id: "6"
    title: "Create TypeScript test fixture"
    lane: "2"
    runner: "local"
    depends_on: ["3"]
    command: |
      mkdir -p /tmp/code-runner-test/ts-fixture
      cd /tmp/code-runner-test/ts-fixture
      git init -q
      cat > package.json << 'EOF'
      {
        "name": "test-fixture",
        "type": "module",
        "scripts": { "test": "node main.js" }
      }
      EOF
      cat > tsconfig.json << 'EOF'
      {
        "compilerOptions": {
          "target": "ES2020",
          "module": "ESNext",
          "moduleResolution": "node",
          "strict": true
        }
      }
      EOF
      cat > main.ts << 'EOF'
      function add(a: number, b: number): number {
        return a + b;
      }
      console.log(add(2, 3));
      EOF
      # Compile to JS for execution
      npx tsc main.ts --outDir . 2>/dev/null || echo "tsc not available, using js directly"
      git add . && git commit -m "init" -q
      echo "TypeScript fixture ready"
    definition_of_done:
      command: "cd /tmp/code-runner-test/ts-fixture && node main.js 2>/dev/null || node -e 'console.log(2+3)'"
      assertion: "5"

  # ── Wave 3: Integration tests ───────────────────────────────────────────
  - id: "7"
    title: "Test Python profile integration"
    lane: "3"
    runner: "local"
    depends_on: ["4"]
    command: |
      cd /home/graham/workspace/experiments/pi-mono/.pi/skills/code-runner
      unset VIRTUAL_ENV
      python3 -c "
      from evidence import collect_evidence
      result = collect_evidence('/tmp/code-runner-test/python-fixture', 'python3 main.py', '5', lang='python')
      print(f'score={result[\"score\"]:.2f}')
      print(f'dod_passed={result[\"dod_passed\"]}')
      print(f'errors={result[\"error_count\"]}')
      "
    definition_of_done:
      command: "cd /home/graham/workspace/experiments/pi-mono/.pi/skills/code-runner && unset VIRTUAL_ENV && python3 -c \"from evidence import collect_evidence; r = collect_evidence('/tmp/code-runner-test/python-fixture', 'python3 main.py', '5', lang='python'); print('PASS' if r['dod_passed'] else 'FAIL')\""
      assertion: "PASS"

  - id: "8"
    title: "Test Rust profile integration"
    lane: "3"
    runner: "local"
    depends_on: ["5"]
    command: |
      cd /home/graham/workspace/experiments/pi-mono/.pi/skills/code-runner
      unset VIRTUAL_ENV
      python3 -c "
      from evidence import collect_evidence
      result = collect_evidence('/tmp/code-runner-test/rust-fixture', 'cargo run -q 2>/dev/null', '5', lang='rust')
      print(f'score={result[\"score\"]:.2f}')
      print(f'dod_passed={result[\"dod_passed\"]}')
      print(f'errors={result[\"error_count\"]}')
      "
    definition_of_done:
      command: "cd /home/graham/workspace/experiments/pi-mono/.pi/skills/code-runner && unset VIRTUAL_ENV && python3 -c \"from evidence import collect_evidence; r = collect_evidence('/tmp/code-runner-test/rust-fixture', 'cargo run -q 2>/dev/null', '5', lang='rust'); print('PASS' if r['dod_passed'] else 'FAIL')\""
      assertion: "PASS"

  - id: "9"
    title: "Test TypeScript profile integration"
    lane: "3"
    runner: "local"
    depends_on: ["6"]
    command: |
      cd /home/graham/workspace/experiments/pi-mono/.pi/skills/code-runner
      unset VIRTUAL_ENV
      python3 -c "
      from evidence import collect_evidence
      result = collect_evidence('/tmp/code-runner-test/ts-fixture', 'node main.js', '5', lang='typescript')
      print(f'score={result[\"score\"]:.2f}')
      print(f'dod_passed={result[\"dod_passed\"]}')
      print(f'errors={result[\"error_count\"]}')
      "
    definition_of_done:
      command: "cd /home/graham/workspace/experiments/pi-mono/.pi/skills/code-runner && unset VIRTUAL_ENV && python3 -c \"from evidence import collect_evidence; r = collect_evidence('/tmp/code-runner-test/ts-fixture', 'node main.js', '5', lang='typescript'); print('PASS' if r['dod_passed'] else 'FAIL')\""
      assertion: "PASS"

  - id: "10"
    title: "Test auto-detection"
    lane: "3"
    runner: "local"
    depends_on: ["7", "8", "9"]
    command: |
      cd /home/graham/workspace/experiments/pi-mono/.pi/skills/code-runner
      unset VIRTUAL_ENV
      python3 -c "
      from language_profiles import detect_language

      # Test detection
      py = detect_language('/tmp/code-runner-test/python-fixture')
      rs = detect_language('/tmp/code-runner-test/rust-fixture')
      ts = detect_language('/tmp/code-runner-test/ts-fixture')

      print(f'Python fixture: {py}')
      print(f'Rust fixture: {rs}')
      print(f'TypeScript fixture: {ts}')

      assert py == 'python', f'Expected python, got {py}'
      assert rs == 'rust', f'Expected rust, got {rs}'
      assert ts == 'typescript', f'Expected typescript, got {ts}'
      print('All detections correct')
      "
    definition_of_done:
      command: "cd /home/graham/workspace/experiments/pi-mono/.pi/skills/code-runner && unset VIRTUAL_ENV && python3 -c \"from language_profiles import detect_language; print('OK' if detect_language('/tmp/code-runner-test/rust-fixture') == 'rust' else 'FAIL')\""
      assertion: "OK"

  - id: "11"
    title: "Run existing tests to ensure no regression"
    lane: "3"
    runner: "local"
    depends_on: ["10"]
    command: |
      cd /home/graham/workspace/experiments/pi-mono/.pi/skills/code-runner
      unset VIRTUAL_ENV && uv run python test_v42_modules.py 2>&1 | tail -20
    definition_of_done:
      command: "cd /home/graham/workspace/experiments/pi-mono/.pi/skills/code-runner && unset VIRTUAL_ENV && uv run python test_v42_modules.py 2>&1 | grep -E '(PASSED|passed|OK)' | head -1"
      assertion: exit_code == 0
