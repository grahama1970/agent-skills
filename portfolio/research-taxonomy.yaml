portfolio_umbrella:
  id: evidence-bearing-ai-systems
  title: Evidence-Bearing AI Systems
  thesis: Build AI systems whose claims, actions, memories, and generated artifacts
    carry inspectable lineage—and whose authority remains bounded.
source_scope:
  repository_activity_window:
    start: '2026-07-07'
    end: '2026-08-07'
  agent_skills_inventory_commit: 5cc00692d
  agent_skills_inventory_as_of: '2026-08-06'
