families:
- id: autonomous-systems
  title: Autonomous Systems Foundations
  label: 'family: autonomous-systems'
  color: 0969DA
  thesis: Control planes, memory, and model infrastructure for bounded, inspectable
    agent work.
- id: evidence-assurance
  title: Evidence & Assurance Systems
  label: 'family: evidence-assurance'
  color: 8250DF
  thesis: Acquisition, analysis, attack/defense, governance, and proof systems that
    preserve source and authority boundaries.
- id: human-centered-ai
  title: Human-Centered & Generative AI
  label: 'family: human-centered-ai'
  color: BF3989
  thesis: Voice, persona, multimodal interaction, and creative generation with measurable
    lineage and human review.
areas:
- id: agent-systems
  short_slug: agent-systems
  title: Agent Systems & Orchestration
  family: autonomous-systems
  label: 'area: agent-systems'
  topic: ra-agent-systems
  color: 1F6FEB
  core_question: How can untrusted agents and tools be coordinated without losing
    the human goal, execution state, stop conditions, or replayability?
  includes:
  - DAG and loop runtimes
  - bounded subagents
  - browser transport
  - handoffs
  - scheduling
  - goal preservation
  - human approval gates
  boundary: Owns coordination and admissibility—not model-provider semantics or domain
    decision authority.
  examples:
  - tau
  - agent-skills
  - surf
  - ask
- id: memory-knowledge
  short_slug: memory
  title: Memory & Knowledge Systems
  family: autonomous-systems
  label: 'area: memory'
  topic: ra-memory
  color: 8957E5
  core_question: How can agents recall durable, scoped, provenance-linked knowledge
    without mistaking retrieval relevance for truth or authority?
  includes:
  - graph memory
  - vector and lexical retrieval
  - intent routing
  - episodic memory
  - project state
  - knowledge lifecycle
  boundary: Owns retrieval, routing, and memory state; relevance does not itself establish
    claim support.
  examples:
  - graph-memory-operator
  - memory
  - episodic-archiver
- id: extraction-document-intelligence
  short_slug: extraction
  title: Extraction & Document Intelligence
  family: evidence-assurance
  label: 'area: extraction'
  topic: ra-extraction
  color: 2DA44E
  core_question: How can heterogeneous files and unstable sources become structurally
    faithful, hash-bound artifacts with truthful terminal outcomes?
  includes:
  - source acquisition
  - PDF parsing
  - OCR
  - layout and table analysis
  - document normalization
  - route selection
  boundary: Owns acquisition and structural extraction—not the final semantic conclusion
    or approval.
  examples:
  - fetcher
  - pdf_oxide
  - extractor
- id: research-intelligence
  short_slug: research-intelligence
  title: Research Intelligence & Evidence Synthesis
  family: evidence-assurance
  label: 'area: research-intelligence'
  topic: ra-research-intelligence
  color: 1B7C83
  core_question: How can multi-source discovery and synthesis expose citations, coverage,
    uncertainty, and failed or degraded sources?
  includes:
  - web, code, paper, feed, and video discovery
  - source comparison
  - grounded synthesis
  - coverage reporting
  boundary: Research output is evidence and design input—not runtime proof, compliance
    credit, or execution success.
  examples:
  - dogpile
  - brave-search
  - arxiv
  - github-search
- id: security-adaptive-defense
  short_slug: security-hacking
  title: Security, Hacking & Adaptive Defense
  family: evidence-assurance
  label: 'area: security-hacking'
  topic: ra-security-hacking
  color: CF222E
  core_question: How can authorized attacks and defenses co-evolve in isolation and
    be selected by deterministic runtime evidence?
  includes:
  - authorized hacking
  - red/blue competition
  - adaptive lineage
  - exploit and patch replay
  - sandboxed targets
  boundary: Only authorized, isolated targets; runtime/Judge evidence outranks LLM
    plausibility.
  examples:
  - battle
  - hack
  - thunderdome
  - anvil
- id: governance-compliance
  short_slug: compliance-assurance
  title: Compliance, Governance & Assurance
  family: evidence-assurance
  label: 'area: compliance-assurance'
  topic: ra-compliance-assurance
  color: BF8700
  core_question: How can controls, requirements, mappings, evidence, and review state
    remain distinct until an authorized human signs off?
  includes:
  - compliance frameworks
  - evidence and assurance cases
  - OSCAL
  - policy gates
  - control mappings
  - human review
  boundary: Models may navigate and explain; people and governed authorities decide.
  examples:
  - sparta
  - sparta-public
  - create-evidence-case
  - cmmc-assessor
- id: verification-formal-methods
  short_slug: verification
  title: Verification, Evaluation & Formal Methods
  family: evidence-assurance
  label: 'area: verification'
  topic: ra-verification
  color: 0550AE
  core_question: How can claims, code, prompts, models, and workflows be tested against
    executable, reproducible, adversarial, negative, or formal gates?
  includes:
  - agentic evals
  - formal proof
  - debugging
  - benchmarks
  - regression
  - readiness scoring
  - negative controls
  boundary: A proof establishes only its declared gate and conditions; it must carry
    explicit non-claims.
  examples:
  - agentic-evals
  - lean4-prove
  - debugger
  - quality-audit
- id: model-systems-learning
  short_slug: model-systems
  title: Model Infrastructure & Learning
  family: autonomous-systems
  label: 'area: model-systems'
  topic: ra-model-systems
  color: 218BFF
  core_question: How can heterogeneous models and providers be routed, retried, benchmarked,
    trained, and exposed through stable typed interfaces?
  includes:
  - model gateways
  - provider routing
  - inference
  - training
  - prompt systems
  - capability and readiness probes
  boundary: Owns model capability and transport—not workflow admissibility, factual
    authority, or human-facing final claims.
  examples:
  - scillm
  - prompt-lab
  - benchmark-models
- id: multimodal-persona-interaction
  short_slug: voice-persona
  title: Multimodal, Voice & Persona Systems
  family: human-centered-ai
  label: 'area: voice-persona'
  topic: ra-voice-persona
  color: D15704
  core_question: How can speech, video, affect, persona continuity, and real-time
    interaction be measurable, interruptible, and provenance-linked?
  includes:
  - speech ingress and egress
  - wake/listen loops
  - video memory
  - persona continuity
  - affect and delivery
  - interaction UX
  boundary: Sensors and renderers do not own answer meaning, durable identity, memory
    promotion, or authority.
  examples:
  - RealtimeSTT
  - chatterbox
  - persona-dream
  - watch
- id: creative-media-design
  short_slug: creative-media
  title: Generative Media & Creative Systems
  family: human-centered-ai
  label: 'area: creative-media'
  topic: ra-creative-media
  color: A371F7
  core_question: How can image, video, music, story, and design generation become
    reproducible, reviewable creative workflows rather than one-off prompts?
  includes:
  - image and movie generation
  - music and sound
  - story and storyboard
  - design systems
  - creative review and iteration
  boundary: Generated media is a creative artifact, not evidence of an external factual
    claim; provenance and human review remain explicit.
  examples:
  - create-image
  - create-movie
  - create-music
  - pitchdeck
governance:
